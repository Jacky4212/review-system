    "termsHTML": "<div class=\"special-section\"><h3>📖 名词解释</h3>\n<div class=\"term-item\"><span class=\"term-name\">E-mail</span>：wangji9073@163.com</div>\n<div class=\"term-item\"><span class=\"term-name\">Tel</span>：18845594060</div>\n<div class=\"term-item\"><span class=\"term-name\">三个“不”</span>：不交头接耳，不随意走动，不接打电话；</div>\n<div class=\"term-item\"><span class=\"term-name\">三个“一”</span>：一个本；一个笔；一个计算器；</div>\n<div class=\"term-item\"><span class=\"term-name\">核能</span>：安全、清洁、高效能源</div>\n<div class=\"term-item\"><span class=\"term-name\">用到的主要工艺</span>：（共）沉淀、溶剂萃取、色谱、电化学、同位素交换等；</div>\n<div class=\"term-item\">她在发现了钋和镭元素后才将这一现象称为放射性(radioactivity)。</div>\n<div class=\"term-item\">1934年，小居里夫妇用钋的α粒子轰击铝，即27Al（α，n）30P反应，并利用化学原理及方法活得放射性P-30，发明了人工放射性。</div>\n<div class=\"term-item\"><span class=\"term-name\">温馨提示</span>：此视频框在点击“上传手机课件”时会进行转换，用手机进行观看时则会变为可点击的视频。此视频框可被拖动移位和修改大小</div>\n<div class=\"term-item\"><span class=\"term-name\">优点</span>：使研究方法的灵敏度大大提高；通过对放射性的原子跟踪，可对整个化学过程及其每个阶段进行研究和观察。</div>\n<div class=\"term-item\"><span class=\"term-name\">弊端</span>：射线可能对工作人员产生辐射损伤；放射性物质还会对所研究的体系产生一系列的物理化学效应—辐射化学效应。</div>\n<div class=\"term-item\">具有相同的质子数Z、相同的中子数N、处于相同的能态且寿命可测的一类原子称为核素。</div>\n<div class=\"term-item\"><span class=\"term-name\">同中子异位素</span>：中子数相同、质子数不同的核素。</div>\n<div class=\"term-item\"><span class=\"term-name\">同质异位素</span>：质量数相同、质子数不同的核素</div>\n<div class=\"term-item\"><span class=\"term-name\">同质异能素</span>：处于不同的能量状态且其寿命可以用仪器测量的同一种原子核。</div>\n<div class=\"term-item\"><span class=\"term-name\">1. α衰变</span>：本质是释放高速运动的氦原子流</div>\n<div class=\"term-item\"><span class=\"term-name\">2. β衰变</span>：本质是释放高速运动的电子流</div>\n<div class=\"term-item\"><span class=\"term-name\">亚稳态</span>：激发态的寿命长到可以被检测出来。</div>\n<div class=\"term-item\"><span class=\"term-name\">内转换电子（e-）</span>：发射的单能电子</div>\n<div class=\"term-item\"><span class=\"term-name\">内转换系数（转换数，α）</span>：两个能态之间的同一跃迁的内电子的概率We与发射γ量子的概率Wγ的商值。</div>\n<div class=\"term-item\"><span class=\"term-name\">局部内转换系数</span>：与原子壳层K、L……上的电子相互作用</div>\n<div class=\"term-item\"><span class=\"term-name\">K俘获过程的另一种伴随粒子是俄歇电子</span>：当一个L层电子跳到K层来填充空位时，可以不发射X射线，而把能量交给另一个L电子，于是这个L电子就会克服结合能而飞出。这种电子叫俄歇电子。</div>\n<div class=\"term-item\"><span class=\"term-name\">只有少量的核素的主要衰变形式是自发裂变，例</span>：Cm、Cf、Fm。</div>\n<div class=\"term-item\"><span class=\"term-name\">五个内容</span>：基础放射化学、放射性元素化学、核化学、放射分析化学、应用放射化学</div>\n<div class=\"term-item\"><span class=\"term-name\">四个特点</span>：放低姿态、不服（辐）就干</div>\n<div class=\"term-item\"><span class=\"term-name\">放射性</span>：原子核自发地放射出各种射线的现象。</div>\n<div class=\"term-item\"><span class=\"term-name\">各种离子</span>： α、β、p、14C</div>\n<div class=\"term-item\"><span class=\"term-name\">放射性核素（不稳定核素）</span>：能自发地放射各种射线的核素。</div>\n<div class=\"term-item\"><span class=\"term-name\">衰变常数</span>：原子核的放射性衰变或同质异能跃迁的概率</div>\n<div class=\"term-item\"><span class=\"term-name\">注意</span>：半衰期是每种放射性核素的特征参数，仅由原子核的内部特性决定，几乎与核素所处的化学和物理状态、外界条件（温度、压力和外加磁场等）无关。</div>\n<div class=\"term-item\">1Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有1Bq的活度。</div>\n<div class=\"term-item\"><span class=\"term-name\">平均寿命τ</span>：在τ时间里，放射性活度下降到1/e。</div>\n<div class=\"term-item\"><span class=\"term-name\">比放射活度（简称比活度，符号S ，单位</span>：Bq /g）：</div>\n<div class=\"term-item\"><span class=\"term-name\">通常情况下</span>：m  》mA</div>\n<div class=\"term-item\"><span class=\"term-name\">1 g任何放射性核素</span>：S0=K/MT1/2（Bq/g）</div>\n<div class=\"term-item\">放射性浓度c是指单位体积某放射性活度。</div>\n<div class=\"term-item\"><span class=\"term-name\">单位</span>：Bq/mL 或Bq/L。</div>\n<div class=\"term-item\"><span class=\"term-name\">氚单位TU</span>：表示每1018个氢原子中有一个氚原子。</div>\n<div class=\"term-item\"><span class=\"term-name\">重量百分比浓度</span>：100 g溶液中所含溶质的克数（W/W）。</div>\n<div class=\"term-item\"><span class=\"term-name\">重量体积百分比</span>：100 mL溶液中所含溶质的克数（W/V）。</div>\n<div class=\"term-item\"><span class=\"term-name\">体积百分浓度</span>：100 mL溶液中所含原装液体试剂的毫升数。</div>\n<div class=\"term-item\"><span class=\"term-name\">当量浓度（N）</span>：表示1升溶液中所含溶质的克当量数。</div>\n<div class=\"term-item\"><span class=\"term-name\">摩尔浓度（M）</span>：表示1升溶液中所含溶质的摩尔数。</div>\n<div class=\"term-item\"><span class=\"term-name\">脉冲率</span>：每秒（s-1或cps）,每分（min-1或cpm）</div>\n<div class=\"term-item\"><span class=\"term-name\">例1</span>：在1g天然钾中每分钟衰变多少个40K的原子？已知40K的丰度为：1.18×10－2 %，钾的平均原子量为39.1， 40K 的半衰期为1.28×109a。</div>\n<div class=\"term-item\"><span class=\"term-name\">例2</span>：1Bq的不同的放射性核素各有多重？多大质量的放射性核素的放射性活度为1Bq？</div>\n<div class=\"term-item\"><span class=\"term-name\">放射性平衡</span>：母子体放射性活度之比恒定的状态</div>\n<div class=\"term-item\"><span class=\"term-name\">拓展</span>：我们可以求出最大值时刻的时间么？</div>\n<div class=\"term-item\"><span class=\"term-name\">例1</span>：从1t含有 40％U3O8的沥青铀矿中能分离多少克226Ra？ 238U 的半衰期为4.15×109 a , 226Ra 的半衰期为1602 a。</div>\n<div class=\"term-item\"><span class=\"term-name\">例2</span>：95Zr(T1/2=65.5d)经衰变到 95Nb（T1/2=35d），后者衰变为稳定的95Mo。从t=0时分离纯算起，什么时候95Nb的放射性活度达到最大？总放射性活度是多大？</div>\n<div class=\"term-item\"><span class=\"term-name\">核衰变</span>：不稳定原子核自发地放出粒子或电磁辐射变成另一种原子核的过程。</div>\n<div class=\"term-item\"><span class=\"term-name\">目的</span>：了解射线的性质，提供核结构信息，研制核辐射探测器，防护辐射危害以及开拓各种辐射应用的需要。</div>\n<div class=\"term-item\"><span class=\"term-name\">射程</span>：直接引起电离的辐射能量的特征量度。</div>\n<div class=\"term-item\"><span class=\"term-name\">半厚度</span>：间接引起引起电离的辐射能量的特征量度。</div>\n<div class=\"term-item\"><span class=\"term-name\">常用单位</span>：g/cm2或mg/cm2</div>\n<div class=\"term-item\"><span class=\"term-name\">韧致辐射</span>：高能量电子在原子核电厂内慢化时放出一种连续的X射线。      强度正比于吸收物原子序数及电子能量。</div>\n<div class=\"term-item\"><span class=\"term-name\">外韧致辐射</span>：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</div>\n<div class=\"term-item\"><span class=\"term-name\">内韧致辐射</span>：电子俘获放出韧致辐射，在慢化生成的衰变核本身附近。</div>\n<div class=\"term-item\"><span class=\"term-name\">半厚度</span>：使辐射强度降低一半的吸收厚度。表征γ辐射的穿透能力。</div>\n<div class=\"term-item\"><span class=\"term-name\">γ辐射吸收三种效应</span>：光电效应、康普顿效应、电子对形成效应。</div>\n<div class=\"term-item\"><span class=\"term-name\">光电效应</span>：γ光子在一次碰撞中把全部能量给予一个壳层电子，放出的光电子能量等于γ光子能量减去电子的结合能。</div>\n<div class=\"term-item\"><span class=\"term-name\">康普顿效应</span>：γ光子把部分能量给予一个壳层电子， γ量子本身发生散射。</div>\n<div class=\"term-item\"><span class=\"term-name\">电子对形成效应</span>：一个γ光子在原子核电场内成负电子—正电子对。</div>\n<div class=\"term-item\">不同种分子、原子间进行交换，形成了新的分子种类，即形成了新的化学物质。除此之外，还存在如下的一些运动形态。</div>\n<div class=\"term-item\">131I-127I之间的交换，127I为稳定的同位素，131I为放射性原子，即为标记原子。</div>\n<div class=\"term-item\">由于同位素质量不同而引起的同位素在物理和化学性质上的差别称为同位素效应。</div>\n<div class=\"term-item\">分子的空间形状--即对称性</div>\n<div class=\"term-item\">转动情况--即分子的转动惯量；</div>\n<div class=\"term-item\">振动情况--即分子热运动情况，用温度表达；</div>\n<div class=\"term-item\">其它如结构稳定状况--即分子最低能级状态等等。</div>\n<div class=\"term-item\"><span class=\"term-name\">ΔU</span>：反应前后分子最低能级的差值</div>\n<div class=\"term-item\">由于同位素彼此间化学性质相同，所以，除氢以外，所有的同位素交换反应的热效应几乎等于零，即Q=0。</div>\n<div class=\"term-item\">除氢之外，同位素交换反应的平衡常数K交换极近似等于1，且与温度无关。所以，一般情况下，同位素效应可忽略，即K≈1。K近似不变的，当然与温度也无关。</div>\n<div class=\"term-item\">因为平衡常数K交换＝1，所以同位素交换反应的正反应和逆反应的速度常数相等，即k正＝k逆。</div>\n<div class=\"term-item\"><span class=\"term-name\">t→∞</span>：          x∞                                     y∞                          体系平衡</div>\n<div class=\"term-item\"><span class=\"term-name\">t→∞</span>：   x∞                                            y∞                          体系平衡</div>\n<div class=\"term-item\">被分散的物质叫做分散相；</div>\n<div class=\"term-item\">容纳分散相的另一种物质叫做分散介质。</div>\n<div class=\"term-item\">放射性物质作分散相形成的胶体体系，即为放射性胶体。</div>\n<div class=\"term-item\">一种是在放射性核素的原子、离子或分子直接聚合在一起，构成胶粒大小的聚集体，分散在介质中，形成放射性胶体分散体系，这称为放射性真胶体。</div>\n<div class=\"term-item\">放射性核素（离子或分子）被吸附在存在于介质中的其它非放射性悬浮粒子（杂质）上，这种吸附了放射性核素的杂质胶粒为分散相的胶体体系，称为放射性假胶体。此种体系的胶粒直径比真胶体的胶粒要大。</div>\n<div class=\"term-item\">液相内放射性核素所处的两种可能的极端状态（即呈普通离子状态和呈胶体状态）之间，随着pH值的增加，多价元素可生成水解离子、中性分子和聚合结构。</div>\n<div class=\"term-item\"><span class=\"term-name\">玻璃的主要成分</span>：SiO2</div>\n<div class=\"term-item\"><span class=\"term-name\">普通玻璃</span>：Si-O-Si键和Si-O-M键</div>\n<div class=\"term-item\">用硅烷或其他憎水剂对玻璃表面进行预处理，使玻璃表面形成一层疏水薄膜，从而较少对放射性核素的吸附。这个过程称为玻璃表面的硅烷化处理。</div>\n<div class=\"term-item\"><span class=\"term-name\">滤纸吸附放射性核素的机理</span>：放射性核素是以离子状态或以胶体状态而被滤纸吸附的。</div>\n<div class=\"term-item\">被吸附气体的沸点愈高，即较容易凝结为液态的气体，愈容易被吸附。被吸附气体的分压（p）升高（浓度增大），吸附量当然也增加。</div>\n<div class=\"term-item\">使微量的放射性核素从溶液中分离出来，向溶液中加入某种常量元素的化合物，当常量元素形成沉淀时，同时将微量的放射性核素从溶液中载带下来，这种微量放射性核素与常量元素共同沉淀的过程即称为共沉淀。</div>\n<div class=\"term-item\">放射性核素分布在常量物质晶体的内部，与常量物质形成混晶而一起沉淀出来，这种沉淀称为共结晶共沉淀（或体积分配）。</div>\n<div class=\"term-item\">微量物质分布在常 量物质晶体的表面而一起沉淀出来，这种沉淀称为吸附共沉淀（或表面分配）。</div>\n<div class=\"term-item\">微量物质与常量物质的混合物在溶液中结晶时，形成同一晶体的现象，这种混合晶体称为类质同晶，简称同晶。真正的混晶。</div>\n<div class=\"term-item\"><span class=\"term-name\">共同点</span>：没有混合下限</div>\n<div class=\"term-item\"><span class=\"term-name\">不同点</span>：同二晶存在混合上限</div>\n<div class=\"term-item\">化学性质不相似、结晶结构也不相似的两种化合物形成的混晶、称为反常混晶。</div>\n<div class=\"term-item\"><span class=\"term-name\">式中</span>：Cs—微量物质在晶体中的浓度；</div>\n<div class=\"term-item\"><span class=\"term-name\">x，x0</span>：微量物质在晶体中的含量和在体系中的总量；</div>\n<div class=\"term-item\"><span class=\"term-name\">y，y0</span>：常量物质在晶体中的量和在体系中的总量。</div>\n<div class=\"term-item\"><span class=\"term-name\">二级吸附</span>：液膜层中离子与溶液中相同符号的离子不断地进行交换。这个过程称为二级交换吸附。</div>\n<div class=\"term-item\">放射性核素在无定形沉淀上的吸附是属于分子吸附。即放射性物质以分子形式被吸附。如有些银盐（AgNO3，Ag2SO4等）是以分子形式被Fe2O3、Al2O3或SiO2表面吸附的。</div>\n<div class=\"term-item\"><span class=\"term-name\">能斯特（Nernst）根据热力学方法，从理论上导出了在1大气压和25℃条件下的电极电势的理论计算公式，即某种物质的氧化型与其相应的还原型之间的电势之理论计算式，称为能斯特方程式</span>：</div>\n<div class=\"term-item\"><span class=\"term-name\">d </span>：紧密层厚度10-10m</div>\n<div class=\"term-item\"><span class=\"term-name\">M</span>：电极电势</div>\n<div class=\"term-item\"><span class=\"term-name\"> l</span>：本体溶液电势</div>\n<div class=\"term-item\"><span class=\"term-name\">2 </span>：界面电势差。与电极的种类，温度，离子浓度有关。</div>\n<div class=\"term-item\"><span class=\"term-name\">电池电势</span>：任一电池的电动势,都是电池中各界面上所产生的电势差的代数和.</div>\n<div class=\"term-item\">电势低的电极称为负极，电子从负极流向正极。</div>\n<div class=\"term-item\">电势高的电极称为正极，电流从正极流向负极。</div>\n<div class=\"term-item\"><span class=\"term-name\">常用的分离方法有</span>：沉淀法、溶剂萃取法、色谱法等。</div>\n<div class=\"term-item\"><span class=\"term-name\">例如</span>：分离226Ra加入Ba，127I对131I，1H对3H等。</div>\n<div class=\"term-item\"><span class=\"term-name\">例如</span>：用MnO2从95Zr-95Nb体系中吸附95Nb时，加入稳定的Zr。</div>\n<div class=\"term-item\">某一物质M在不相溶的两相中达到分配平衡即在两相中的浓度不再变化时，它分别在两相中的表观浓度之比。</div>\n<div class=\"term-item\"><span class=\"term-name\">影响共沉淀的因素有</span>：温度、液相组成、固相组成及溶剂等。</div>\n<div class=\"term-item\"><span class=\"term-name\">例如</span>：为了从裂变产物中分离碘，可加入碘化钾作载体，在碱性溶液中用次氯酸钠将低价态的碘全部氧化成7价，再用亚硝酸钠将七价碘还原为单质碘。</div>\n<div class=\"term-item\"><span class=\"term-name\">载体</span>：尽量选用同位素载体，也可选用非同位素载体。</div>\n<div class=\"term-item\"><span class=\"term-name\">净化载体</span>：可将多种杂志离子从溶液中除去，让所需的放射性核素留在溶液中。又称清扫载体或净化载体。</div>\n<div class=\"term-item\"><span class=\"term-name\">常用的净化载体</span>：氢氧化铁、氢氧化钍、硫酸钡、碳酸钡、二氧化锰、三硫化二铋等。净化操作要经过多次才能达到净化程度。</div>\n<div class=\"term-item\"><span class=\"term-name\">溶液</span>：一种或一种以上的物质分散到另一种物质里，形成均一的、稳定的混合物。</div>\n<div class=\"term-item\"><span class=\"term-name\">溶剂</span>：能溶解其他物质的物质。</div>\n<div class=\"term-item\"><span class=\"term-name\">溶质</span>：被溶解的物质。</div>\n<div class=\"term-item\">利用不同的物质在溶剂中溶解度不同，在一种混合物中加入适当的溶剂，使混合物中的组分得到部分或完成分离的过程叫做溶剂萃取。</div>\n<div class=\"term-item\">通常把有机相中能将处于水相中的欲萃取物质转移到有机相的有机试剂叫做萃取剂。</div>\n<div class=\"term-item\">R为相比，其值为有机相与水相的体积之比，即V有/V水。</div>\n<div class=\"term-item\">中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)3PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</div>\n<div class=\"term-item\">这类萃取剂是指磷酸分子（HO)3PO中的一个或二个羟基被烷基酯化或取代所生成的化合物；</div>\n<div class=\"term-item\"><span class=\"term-name\">这类萃取剂在萃取过程中生成具有螯合环的萃合物，即</span>：螯合物。</div>\n<div class=\"term-item\"><span class=\"term-name\">料液</span>：乏燃料经过冷却、去壳、切割和硝酸溶解后，将溶液的酸度调至浓度为2-3mol/L，加入适量的亚硝酸钠将Pu稳定在四价态，制成料液。</div>\n<div class=\"term-item\"><span class=\"term-name\">第 一循环</span>：共去污循环</div>\n<div class=\"term-item\"><span class=\"term-name\">第 二循环</span>：铀钚分离循环</div>\n<div class=\"term-item\"><span class=\"term-name\">第 三循环</span>：净化循环</div>\n<div class=\"term-item\">所有色谱系统都包括两个相，即固定相和流动相。</div>\n<div class=\"term-item\"><span class=\"term-name\">可分为</span>：液-固和气-固两种。</div>\n<div class=\"term-item\"><span class=\"term-name\">基本原理</span>：吸附柱色谱法是利用溶液在通过装有吸附剂的柱子时，各组分因吸附能力的不同，在吸附剂上滞留程度不同，从而实现各组分的分离。</div>\n<div class=\"term-item\"><span class=\"term-name\">装柱</span>：分干法和湿法两种。</div>\n<div class=\"term-item\"><span class=\"term-name\">分离操作</span>：在进行分离操作过程时，流速控制在1ml/min左右。</div>\n<div class=\"term-item\"><span class=\"term-name\">基本原理</span>：是利用固体物质中的可交换离子与溶液中的不同离子之间能发生交换反应来进行分离的一种方法。</div>\n<div class=\"term-item\">具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</div>\n<div class=\"term-item\">选择系数，也称为浓度平衡常数</div>\n<div class=\"term-item\"><span class=\"term-name\">阳离子可转成</span>：H+、NH4+、Na+和Ca2+等，</div>\n<div class=\"term-item\"><span class=\"term-name\">阴离子可转成</span>：OH-、NO3-、Cl-和SO42-；</div>\n<div class=\"term-item\"><span class=\"term-name\">分离操作</span>：有吸附、洗涤、淋洗及树脂再生</div>\n<div class=\"term-item\"><span class=\"term-name\">（1）外部溶液中的可交换离子穿过树脂颗粒表面的液膜，到达树脂表面，这个过程称为</span>：膜扩散。</div>\n<div class=\"term-item\"><span class=\"term-name\">（2）可交换离子在树脂颗粒内部扩散，到达树脂交换基团附近的交换位置，这个过程称为</span>：内扩散。</div>\n<div class=\"term-item\"><span class=\"term-name\">交联度</span>：是指树脂中所含交联剂的质量百分数。</div>\n<div class=\"term-item\"><span class=\"term-name\">交联剂</span>：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</div>\n<div class=\"term-item\">理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</div>\n<div class=\"term-item\"><span class=\"term-name\">树脂的单位量用1 mL表示，则称为</span>：体积理论交换容量。</div>\n<div class=\"term-item\"><span class=\"term-name\">树脂的单位量用1 g表示，则称为</span>：质量理论交换容量。</div>\n<div class=\"term-item\">工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。</div>\n<div class=\"term-item\"><span class=\"term-name\">工作交换容量分类</span>：穿透交换容量、饱和交换容量和再生交换容量。</div>\n<div class=\"term-item\"><span class=\"term-name\">质量单位表示</span>：mmol/g干树脂；</div>\n<div class=\"term-item\"><span class=\"term-name\">体积单位表示</span>：mmol/mL湿树脂。</div>\n<div class=\"term-item\"><span class=\"term-name\">式中</span>：X－ 是树脂交换基团的反离子，例如：Cl－ 或NO3－；</div>\n<div class=\"term-item\"><span class=\"term-name\">式中</span>：X－ 为Cl－ 或NO3－，n和m为与解吸条件有关的常数。</div>\n<div class=\"term-item\">萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。</div>\n<div class=\"term-item\"><span class=\"term-name\">例如</span>：欲分离母－子体核素210Bi－210Po，可将铜片（电极材料）插入含有上述母－子体核素的溶液中，由于铜的标准电极电势大于铋而小于钋，导致Po在铜表面析出，或称Po自镀在铜片上。而铋仍留在溶液中。</div>\n<div class=\"term-item\">电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</div>\n<div class=\"term-item\">凡具有放射性的核素称为放射性核素。</div>\n<div class=\"term-item\">全部由放射性核素核素所组成的元素称为放射性元素。</div>\n<div class=\"term-item\"><span class=\"term-name\">由天然核反应生成的放射性核素</span>：3H、14C等。</div>\n<div class=\"term-item\"><span class=\"term-name\">母体</span>：238U，</div>\n<div class=\"term-item\"><span class=\"term-name\">T1/2</span>：4.468×109 a；</div>\n<div class=\"term-item\"><span class=\"term-name\">母体</span>：235U</div>\n<div class=\"term-item\"><span class=\"term-name\">T1/2</span>：7.038×108 a ；</div>\n<div class=\"term-item\"><span class=\"term-name\">母体</span>：232Th</div>\n<div class=\"term-item\"><span class=\"term-name\">T1/2</span>：1.41×1010a。</div>\n<div class=\"term-item\"><span class=\"term-name\">母体</span>：237Np</div>\n<div class=\"term-item\"><span class=\"term-name\">T1/2</span>：2.14×106a 。</div>\n<div class=\"term-item\"><span class=\"term-name\">它们的寿命大于或接近于地球的年龄(地球年龄</span>： 约4.5×109 a)。因此，至今仍能存在于地球上；</div>\n<div class=\"term-item\">氡衰变后生成的产物都是一些金属元素的放射性同位素，它们容易沉积在与氡相接触的物体表面，称为放射性淀质。</div>\n<div class=\"term-item\"><span class=\"term-name\">比活度为</span>：34.8Bq/1 kg=34.8 Bq•kg-1。</div>\n<div class=\"term-item\"><span class=\"term-name\">暂时平衡</span>：母体长半衰期保障供应稳定性，子体短半衰期降低患者辐射风险。子体核素积累量与母体衰变速率相关，需定期洗脱以维持最佳活性。</div>\n<div class=\"term-item\"><span class=\"term-name\">‌Mo–Tc发生器‌</span>：临床最常用，⁹⁹Mo衰变生成⁹⁹mTc，用于SPECT显像。</div>\n<div class=\"term-item\"><span class=\"term-name\">‌Sn–In发生器‌</span>：适合交通不便地区，¹¹³Sn衰变生成¹¹³mIn，用于器官显像。</div>\n<div class=\"term-item\"><span class=\"term-name\">‌W–Re、Sr–Rb发生器‌</span>：用于PET显像，如⁸²Rb心肌代谢检查。</div>\n<div class=\"term-item\">提高铀中235U丰度的过程称铀的浓缩，其产品称为浓缩铀。</div>\n<div class=\"term-item\"><span class=\"term-name\">氧气中</span>：着火，生成U3O8.</div>\n<div class=\"term-item\"><span class=\"term-name\">强酸中</span>：生成四价铀盐（绿色）</div>\n<div class=\"term-item\">各种铀离子的水解能力取决于离子电荷z与离子裸半径r0的比值的大小，即离子势z/r0的大小。</div>\n<div class=\"term-item\"><span class=\"term-name\">常量分析测定有</span>：重量法和容量法；</div>\n<div class=\"term-item\"><span class=\"term-name\">微量铀的测定主要有</span>：分光光度法、荧光法、活化分析法等。</div>\n<div class=\"term-item\"><span class=\"term-name\">铀浓缩</span>：气体扩散法、离心法、喷嘴法等；</div>\n<div class=\"term-item\"><span class=\"term-name\">（1）可以形成挥发性氟化物或氟氧化物的金属，例如</span>：钼、钨、钒、铬。</div>\n<div class=\"term-item\"><span class=\"term-name\">其中只有6种是天然存在的</span>：227Th、 228Th、 230Th、 231Th、 232Th和234Th；</div>\n<div class=\"term-item\"><span class=\"term-name\">钍的化学性质与锆、铪相似，钍的电子结构为</span>：6s26p66d27s2，最高氧化态是正四价。</div>\n<div class=\"term-item\"><span class=\"term-name\">镭的分离方法</span>：目前镭的化学分离和浓集主要采用共沉淀法。</div>\n<div class=\"term-item\"><span class=\"term-name\">铀系</span>：226Ra→222Rn → 218Po(RaA)→214Pb(RaB) →214Bi (RaC)→214Po (RaCʹ)→</div>\n<div class=\"term-item\"><span class=\"term-name\">钍系</span>：224Ra→220Rn → 216Po(ThA)→212Pb(ThB) →212Bi (ThC)→212Po (ThCʹ)→</div>\n<div class=\"term-item\">它们分别被称为镭、钍和锕射气。</div>\n<div class=\"term-item\"><span class=\"term-name\">电子结构为</span>：5s25p65d106s26p6，外层电子有八个电子，呈惰性，一般情况下不与其它物质发生化学反应，在一定条件下水、苯芬、甲苯形成化合物。</div>\n<div class=\"term-item\"><span class=\"term-name\">从反应堆中也能制得钋，反应式为</span>：   209Bi(n,γ)210Bi(β) →210Po (α) →206Pb</div>\n<div class=\"term-item\"><span class=\"term-name\">钋的氧化物有</span>：PoO、PoO2、PoO3。</div>\n<div class=\"term-item\"><span class=\"term-name\">钋（Ⅳ）的盐类</span>：有PoCl4、Po(NO3)4和Po(SO4)2等。</div>\n<div class=\"term-item\"><span class=\"term-name\">Po2-</span>：H2Po;</div>\n<div class=\"term-item\"><span class=\"term-name\">Po2+</span>：单质溶于稀盐酸，用SO2还原得到Po4+；</div>\n<div class=\"term-item\"><span class=\"term-name\">Po3+</span>：共沉淀；</div>\n<div class=\"term-item\"><span class=\"term-name\">Po4+</span>：酸性存在</div>\n<div class=\"term-item\"><span class=\"term-name\">中性或碱性</span>：PoO(OH)2胶粒</div>\n<div class=\"term-item\">已知镤的核素共有17种，即216Pa、224 Pa-238 Pa和一种同质异能素。</div>\n<div class=\"term-item\"><span class=\"term-name\">氧化物</span>：金属Pa随条件不同，可氧化为组成在PaO2-Pa2O5间的氧化物。</div>\n<div class=\"term-item\"><span class=\"term-name\">卤化物</span>：PaCl4是挥发性化合物，PaF4•nH2O易溶于水。在溶液中，Pa可以十4和+5两种价态存在。</div>\n<div class=\"term-item\"><span class=\"term-name\">放出纯的β射线</span>：                            ，其半衰期为12.33 a，比活度为3.62×108 Bq/μg，它的平均能量为5.72 keV；</div>\n<div class=\"term-item\"><span class=\"term-name\">天然来源</span>：主要来源为宇宙线中的中子轰击氮气及太阳耀斑爆，14N +1n →3T+12C；</div>\n<div class=\"term-item\"><span class=\"term-name\">87Rb-87Sr法</span>：                   半衰期为4.8×1010a。</div>\n<div class=\"term-item\"><span class=\"term-name\">2、总的87Rb</span>：0.096%+0.004%=0.1%,即在矿石形成时总87Rb为0.1%;</div>\n<div class=\"term-item\"><span class=\"term-name\">天然放射性核素</span>：14N +1n →3T+12C</div>\n<div class=\"term-item\">在同一原子中，不可能有两个电子具有完全相同的四个量子数。如果原子中电子的n、L、m三个量子数都相同，则第四个量子数ms一定不同，即同一轨道上最多能容纳2个自旋方向相反的电子。</div>\n<div class=\"term-item\">在同一亚层的各个轨道(即等价轨道)上，电子的排布将尽可能分占不同的轨道，并且自旋方向相同。</div>\n<div class=\"term-item\"><span class=\"term-name\">半充满</span>： p3，d5，f7。</div>\n<div class=\"term-item\"><span class=\"term-name\">全空</span>： p0，d0，f0。</div>\n<div class=\"term-item\"><span class=\"term-name\">全充满</span>：p6，d10，f14。</div>\n<div class=\"term-item\"><span class=\"term-name\">能大规模生产的有</span>：钚、镎、镅；</div>\n<div class=\"term-item\"><span class=\"term-name\">小规模生产的有</span>：锔、锫、锎等。</div>\n<div class=\"term-item\">离子的自身氧化还原反应，称为歧化反应。</div>\n<div class=\"term-item\">金属离子水解即是它们与OH-的络合。</div>\n<div class=\"term-item\"><span class=\"term-name\">抑制水解</span>：（1）酸性条件；（2）加入络合阴离子</div>\n<div class=\"term-item\"><span class=\"term-name\">做各种辐射源</span>：241Am可做γ源，238Pu、241Am、242Cm、254Es可做α源，252Cf可做中子 let currentSubject = null;

// ═══ 科目选择 ═══
function showSubjectSelector() {
  document.getElementById('searchBox').style.display = 'none';
  document.getElementById('subjectSelector').classList.add('active');
  document.getElementById('reviewPage').classList.remove('active');
  document.title = '复习系统 | Review';
  window.scrollTo(0, 0);
}

function enterSubject(subjectId) {
  currentSubject = SUBJECTS[subjectId];
  document.getElementById('subjectSelector').classList.remove('active');
  document.getElementById('reviewPage').classList.add('active');
  document.title = currentSubject.name + ' | ';
  document.getElementById('subjectTitle').textContent = currentSubject.name;
  document.getElementById('subjectTitleEn').textContent = currentSubject.nameEn;
  document.getElementById('examBadge').textContent = currentSubject.examDate;
  document.getElementById('searchBox').style.display = 'inline-block';
  document.getElementById('searchBox').value = '';
  searchContent('');
  renderSidebarChapters(currentSubject.chapters);
  renderMainContent(currentSubject);
  navigateTo('overview');
}

function renderSidebarChapters(chapters) {
  const nav = document.getElementById('chapterNav');
  let html = '<div class="sidebar-section-title">章节复习</div>';
  chapters.forEach((ch, i) => {
    const hasExam = ch.exam && ch.exam.length > 0;
    html += '<a class="sidebar-item" data-target="ch-' + ch.id + '" onclick="navigateTo(\'ch-' + ch.id + '\')">'
         + '<span class="ch-num">' + (i+1) + '</span>'
         + ch.title
         + (hasExam ? ' <span class="exam-tag">考</span>' : '')
         + '</a>';
  });
  nav.innerHTML = html;
}

  const container = document.getElementById('mainContent');
  let html = '';

  html += '</div>';

  // --- 各章节 ---
  subject.chapters.forEach(ch => {
    html += '<div id="section-ch-' + ch.id + '" class="chapter-block">';

    html += '</div>';
  });

  // --- 重点专题 ---
  html += '<div id="section-formulas" class="chapter-block">';
  html += subject.formulasHTML || '<div class="empty-state"><div class="icon">📐</div><p>暂无公式数据</p></div>';
  html += '</div>';

  html += '<div id="section-terms" class="chapter-block">';
  html += subject.termsHTML || '<div class="empty-state"><div class="icon">📖</div><p>暂无名词数据</p></div>';
  html += '</div>';

  container.innerHTML = html;
}

// ═══ 导航 ═══
function navigateTo(target) {
  // 更新侧边栏状态
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const sidebarItem = document.querySelector('.sidebar-item[data-target="' + target + '"]');
  if (sidebarItem) sidebarItem.classList.add('active');

  // 显示对应内容
  document.querySelectorAll('.chapter-block').forEach(el => el.classList.remove('active'));
  const section = document.getElementById('section-' + target);
  if (section) {
    section.classList.add('active');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 关闭移动端侧边栏
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.remove('mobile-show');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('mobile-show');
  overlay.classList.toggle('show');
}

// ═══ 初始化：渲染科目卡片 ═══

// === 搜索功能 ===
function searchContent(query) {
  if (!query.trim()) {
    document.querySelectorAll('.slide-card').forEach(c => c.style.display = '');
    document.querySelectorAll('.chapter-block').forEach(b => {
      if (b.classList.contains('active')) b.style.display = 'block';
    });
    return;
  }
  const q = query.toLowerCase();
  document.querySelectorAll('.slide-card').forEach(card => {
    const body = card.querySelector('.slide-body');
    if (body && body.textContent.toLowerCase().includes(q)) {
      card.style.display = '';
      card.querySelector('.slide-header')?.classList.remove('collapsed');
      card.querySelector('.slide-body')?.classList.remove('collapsed');
    } else {
      card.style.display = 'none';
    }
  });
}
function initSubjectCards() {
  const container = document.querySelector('.subject-cards');
  let html = '';
  let first = true;
  for (const [id, sub] of Object.entries(SUBJECTS)) {
    const chCount = sub.chapters.length;
    html += '<div class="subject-card" onclick="enterSubject(\'' + id + '\')">'
         + '<h3>' + sub.name + '</h3>'
         + '<div class="en">' + sub.nameEn + '</div>'
         + '<div class="meta">📚 ' + chCount + ' 章 · 📅 ' + sub.examDate + '</div>'
         + '<div class="badge">点击复习 →</div>'
         + '</div>';
  }
  // 占位卡片
  html += '<div class="subject-card add-subject-card">+ 后续可添加更多科目</div>';
  container.innerHTML = html;

  // 如果只有一个科目，直接进入
  const keys = Object.keys(SUBJECTS);
  if (keys.length === 1) {
    enterSubject(keys[0]);
  }
}

initSubjectCards();
</script>
