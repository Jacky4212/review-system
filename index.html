        "exam": [],
        "html": "<div class=\"chapter-header\">\n<h2>第八章 裂片元素及活化产物化学</h2>\n<div class=\"no-exam\">📖 了解性内容</div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Np的同位素中半衰期最长的核素？</p>\n<p>A、234Np；B、235Np；C、236Np；D、237Np</p>\n<p>2. Pu4+在弱酸性溶液中的聚合过程及防止方法？</p>\n<p>Pu4+在弱酸性溶液中的聚合过程：首先Pu4+水解生成Pu(OH)4，然后氢氧根转变为“氧”桥（—O—）而形成Pu4+的聚合物。这个聚合物不可逆，该聚合物一旦形成，不容易破坏，从而给钚的分离带来麻烦。</p>\n<p>提高溶液的酸度、加放络合剂可防止聚合的发生。</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>第8章  裂片元素及活化产物化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>目录</p>\n<p>壹</p>\n<p>概况</p>\n<p>贰</p>\n<p>放射性铯、锶、锝和钌</p>\n<p>叁</p>\n<p>放射性碘、氪和氙</p>\n<p>肆</p>\n<p>放射性铈、钷</p>\n<p>伍</p>\n<p>活化产物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>壹</p>\n<p>概  况</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.1 概论</p>\n<p>核裂变：重原子核分裂成两个质量大体相等碎片的过程。</p>\n<p>自发裂变</p>\n<p>没有外来粒子轰击下发生裂变</p>\n<p>诱发裂变</p>\n<p>入射粒子轰击下发生裂变</p>\n<p>热（中子诱发）裂变       ◆快（中子诱发）裂变</p>\n<p>带电粒子诱发裂变           ◆光致裂变</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>裂变碎片：原子核裂变时最初形成的两块核碎片。因其中子的质子数之比值高，为丰中子核。</p>\n<p>8.1 概论</p>\n<p>在裂变后约10-15 s内会直接发射1~3个中子，发射中子后的碎片称为次级碎片或裂变的初级产物。</p>\n<p>其能量仍然很高，但不能发射中子，在10-11s内发射γ 光子，发射光子后的碎片仍为丰中子核，它们继续进行β衰变直到变为稳定的核素，形成一个称为衰变链的系列。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>裂片元素的来源：</p>\n<p>反应堆或加速器生产</p>\n<p>核武器爆炸时产生</p>\n<p>衰变链：</p>\n<p>原子核→裂变碎片→ 次级碎片→ ….. →稳定核素</p>\n<p>8.1 概论</p>\n<p>裂变产物：裂片元素是重原子核发生裂变反应时生成的产物。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>95Y和139I均不稳定，会发生如下的一系列衰变：</p>\n<p>95Y       95Zr        95Nb         95Mo</p>\n<p>139I        139Xe       139Cs         139Ba           139La</p>\n<p>铀在慢中子作用下裂变，生成的裂片元素组成很复杂。如：</p>\n<p>95Sr→95Y → 95Zr → 95Nb → 95Mo（稳定）</p>\n<p>140Xe→140Cs → 140Ba → 140La → 140Ce（稳定）</p>\n<p>8.1 概论</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>几种裂变产物衰变链</p>\n<p>8.1 概论</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.1 概论</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>通常以每100个重核核裂变所产生的某种裂变产物原子核数来表示。因为重核裂变基本上都为二分裂，所以所有裂变产物的裂变产额之和为200%。</p>\n<p>8.1 概论</p>\n<p>裂变产额</p>\n<p>裂变产物的某一核素在裂变过程中产生的几率。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核裂变时直接生成某一裂变产物的几率。</p>\n<p>8.1 概论</p>\n<p>裂变产额分类</p>\n<p>独立产额</p>\n<p>累积产额</p>\n<p>链产额</p>\n<p>某一核素的独立产额加上由于其它裂变产物衰变生成的该核素的产额。</p>\n<p>链产额是指某一衰变链上所有链成员独立产额之和。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核爆炸和核反应堆事故产生的裂变产物进入环境中会造成环境污染，其中以89Sr、90Sr、131I、137Cs等中长寿命核素危害最大。</p>\n<p>8.1 概论</p>\n<p>为什么要关注这样的核素呢？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>55号元素，属碱金属元素，有31种同位（116Cs~146Cs）和5种同质异能素。</p>\n<p>133Cs是唯一的天然稳定同位素，在地壳中中含量约7  ppm。</p>\n<p>8.2 放射性铯</p>\n<p>铯的同位素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  铯的主要同位素</p>\n<div class=\"formula-line\">铀核裂变时最主要裂变产物是137Cs，为β放射体，半衰期为30.17年，比活度为3.2×105 Bq/μg， 137Cs既可能作β放射源又可以作γ放射源。</div>\n<p>134Cs， β、γ放射体，131Cs是活化产物，134Cs、137Cs均属中毒性核素， 131Cs属低核素。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>137Cs是用途最大的核素。它是核裂变的重要产物之一，也可以通过                     反应来生产。放射性比活度为3.2×106Bq/μg，其β射线能量（即最大能量）为0.514 MeV（93.5％）和1.176 MeV（6.5％）。137Cs的衰变子体是处于激发态的137mBa，其半衰期仅为2.55min，放出能量为0.66164 MeV的γ射线，衰变产物是稳定的137Ba。</p>\n<p>8.2 放射性铯</p>\n<p>铯的来源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>134Cs通过133 Cs(n，γ)134Cs反应和    反应生产。它的β射线能量为0.662MeV（71％）和0.089 MeV（27％），主要的γ射线能量为0.6046和0.7958 MeV。</p>\n<p>131Cs通过                          反应和                        反应生产。131Cs的衰变方式是电子俘获，放出29.6 KeV的氙特征X射线。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铯的化合价为+1价，它的绝大部分化合物易溶于水，铯具有碱金属的通性。此外，铯能形成下列难溶性盐类。</p>\n<p>铯盐与镍、锌、铜、亚铁和钴等金属的亚铁氰化盐作用，能生成亚铁氰化铯复盐沉淀，如：</p>\n<p>8.2 放射性铯</p>\n<p>铯的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.2 放射性铯</p>\n<p>铯盐反应</p>\n<p>Na3[Co(NO2)6]+2CsCl→Cs2Na[Co(NO2)6]↓+2NaCl</p>\n<p>Cs(I)+3HI+2BiI3→Cs3Bi2I9 ↓+2HCl</p>\n<p>Na(C6H5)4B+CsCl →Cs(C6H5)4B ↓+2NaCl</p>\n<p>H3[PO4(WO3)12] +3CsCl →Cs3[PO4(WO3)12 ]↓+3HCl</p>\n<p>H3[PO4(MoO3)12] +3CsCl →Cs3[PO4(MoO3)12 ]↓+3HCl</p>\n<p>H2PtCl6+2CsCl →Cs2PtCl6↓+2HCl</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>可用于辐照育种、辐照贮存食品、医疗器械的杀菌、癌症的治疗以及工业设备的γ探伤等。由于137Cs辐射源的半衰期长，γ射线能量适宜，且价格便宜，因而在许多方面已取代了226Ra。</p>\n<p>8.2 放射性铯</p>\n<p>铯的应用</p>\n<p>137Cs既可作β辐射源，又可作γ辐射源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.2 放射性铯</p>\n<p>铯的应用</p>\n<p>134Cs既可作β辐射源，又可作γ辐射源</p>\n<p>131Cs医学应用</p>\n<p>131Cs的131Cs-CsCl（131CsCl）注射液可用于心脏扫描、诊断甲状腺肿瘤等医学用途。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>监测的主要对象是137Cs和134Cs。特别是137Cs，它是核裂变反应的重要产物之一，是核污染中的重要核素之一。</p>\n<p>现在，环境和生物样品中137Cs的分析测定已成为环境放射性监测中的常规项目。</p>\n<p>8.2 放射性铯</p>\n<p>铯的监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>测量137Cs普遍采用辐射测量法</p>\n<p>由于环境和生物样品中137Cs的含量很低，因此必须先将样品中所含的大量钾、钠、钙、镁等干扰元素，特别是与铯同属碱金属的天然β放射性核素40K和87Rb分离掉，然后才能进行137Cs的β放射性测量。由于铯总是与钾共存，所以，常常以每克钾中含137Cs的微微居里数来表示铯的放射性含量水平。</p>\n<p>铯单位。1个铯单位＝1μCi 137Cs/g钾。</p>\n<p>8.2 放射性铯</p>\n<p>铯的监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>为了分离和浓集放射性铯，可用稳定铯作载体，利用铯能生成多种难溶性盐类的特点，采用共沉淀法。</p>\n<p>共沉淀法操作简便，浓集效果好，但净化效果较差。也可利用某些无机离子交换剂，如使用最普遍的磷钼酸铵，对放射性铯具有的选择性吸附作用，使铯与其它杂质得到分离，而且对铷、钾特别是钾的净化效果较好，从而分离和浓集放射性铯。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.2 放射性铯</p>\n<p>必须注意，铯的盐类在高温下易挥发，宜采用湿法灰化样品，若用干法灰化样品，必须控制温度不超过450 ℃。137Cs的测量主要有β射线测量法和γ能谱测量法。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>分离浓集的方法有：</p>\n<p>离子交换法：</p>\n<p>1、无机离子交换剂（这些材料基本属于杂多酸盐、过渡金属的络氰化物、锆和钼的磷酸盐或碲酸盐等 ） ；</p>\n<p>2、离子交换树脂（阳离子交换树脂）。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>沉淀法</p>\n<p>1、高氯酸法；</p>\n<p>2、碘铋酸钾法；</p>\n<p>3、氯铂酸法；</p>\n<p>4、硅钨酸法；</p>\n<p>5、四苯硼酸盐法。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶剂萃取法</p>\n<p>1、四苯硼酸钠萃取；</p>\n<p>2、二苦胺盐萃取；</p>\n<p>3、4-另丁基-2-（α-甲苄基）酚（BAMBP）萃取等。</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1、放化法</p>\n<p>重量法：铯与载体铯一起沉淀，所称重的化合物有氯铂酸铯、四苯硼铯、碘铋酸铯、高氯酸铯。</p>\n<p>2、直接γ能谱法</p>\n<p>137Cs：30a，纯β辐射体。137Bam： 2.55min ，γ辐射体。137Cs-137Bam平衡体，测量到的661keVγ射线。</p>\n<p>测量方法</p>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3、质谱分析法</p>\n<div class=\"formula-line\">电感耦合等离子体质谱法（ICP-MS） 测135Cs（纯β辐射体 、2.3×106a），有效抑制137Cs 。</div>\n<p>4、中子活化分析法</p>\n<div class=\"formula-line\">135Cs(n,γ) 136Cs，反应截面为9×10-28m2, 136Cs：13d。</div>\n<p>8.2 放射性铯</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锶的物理性质</p>\n<p>锶是38号元素，属碱土金属，锶在自然界含量较少，约占地壳重量的0.042%，主要存在于海水中，约8mg/L。</p>\n<p>锶共有23种同位素和3种同质异能素。 Sr-84、86、87、88四种锶同位素是稳定稳定核素，其中89Sr和90Sr是两种重要的分裂产物，核裂变中产额较高，分别属于高毒和中毒性核素。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>我国对这两种核素在水源及放射性工作场所的量有所规定。</p>\n<p>90Sr是纯β射线，用于能源、医学及军事方面。89Sr可作β源，85Sr可作γ 辐射源和示踪剂。</p>\n<p>表   某些生物样品中的锶含量</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锶的化学性质</p>\n<p>锶的化合价只有+2价，锶的硝酸盐、碳酸盐及其氢氧化物经高温均可转变为SrO。</p>\n<p>锶的盐类有易溶性和难溶性两种盐，易溶盐有：SrCl2、Sr(NO3)2等，难溶盐有SrSO4、SrCrO4等。</p>\n<p>锶能与EDTA、DTAP等生成络合物。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锶的化学分离方法</p>\n<p>沉淀法：</p>\n<p>硝酸锶沉淀：硝酸锶在水中的溶解度大，在高浓度硝酸中溶解度变得很小，可以形成硝酸锶沉淀。</p>\n<p>为放化分离锶的经典方法。</p>\n<p>在60%~80%HNO3介质中沉淀Sr(NO3)2，可与大多数裂变产物核素分离，只有钡一起沉淀。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表   锶、钙和钡的硝酸盐在HNO3中的溶解度</p>\n<p>硝酸盐 | 硝酸浓度（mol/L） |  | </p>\n<p> | 15 | 17 | 19</p>\n<p>硝酸钙 | 7.38 | 2.46 | 0.49</p>\n<div class=\"formula-line\">硝酸锶 | 9.66×10-2 | 1.45×10-3 | 4.35×10-4</div>\n<div class=\"formula-line\">硝酸钡 | 2.29×10-3 | 1.91×10-4 | 7.62×10-5</div>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>硫酸锶：</p>\n<p>在锶载体溶液的重量法测定中，硫酸锶是较适宜的称重形式。在含锶的中性溶液中，加入过量的1:1H2SO4溶液后，加乙醇使溶液的水与乙醇的比例达到1:1，以降低硫酸锶的溶解度。</p>\n<p>此外，还有草酸锶、碳酸锶、玫红酸锶等沉淀。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换法</p>\n<p>阳离子交换树脂分离锶，离子交换法能使碱土金属与其它元素很好地分离，常用于示踪量碱土元素的分离与纯化，也用于测定环境样品中的放射性锶。但因其操作时间较长，在一般裂变产物的放化分离操作中较少采用。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子在树脂上的吸附次序按水合离子半径大小排列，较小的先吸附。</p>\n<p>其吸附次序为稀土、钡、锶、钙、镁、碱金属。</p>\n<p>碱土金属不被阴离子交换树脂吸附，可以利用阴离子交换法使90Sr 与子体90Y分离，以获得不含有90Y 的纯90Sr 。或者分离出90Y 然后测量90Y ，以求出放射性锶（89Sr+90Sr）中90Sr的含量。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶剂萃取法</p>\n<p>8-羟基喹啉</p>\n<p>锶能被1mol/L8-羟基喹啉的氯仿溶液萃取。将少于0.1mg锶的水溶液用NaOH调节至pH11.3,并稀释到15mL,以8-羟基喹啉的氯仿溶液萃取,约96%的锶被萃取。</p>\n<p>噻吩甲酰三氟丙酮（TTA）</p>\n<p>用0.05mol/L TTA-己酮溶液萃取无载体锶，萃取率随pH升高而增加，升至pH9时，萃取率达95%以上。</p>\n<p>此处，还有：二（2-乙基已基）磷酸（HDEHP）、1-苯基-3-甲基-4-辛酰基吡唑酮-5(PMCyP)、冠醚等萃取。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Sr-90的分析测定</p>\n<p>自从高分辨的Ge(Li)或HPGe探测器问世以来，大多数发射γ射线的短寿命锶同位素可以不经放化分离，直接应用γ能谱法测量。</p>\n<p>只有长寿命的89Sr、90Sr这些纯β核素的分析，还需经过放化分离程序。</p>\n<p>还有 测定方法有β 计数法及液体闪烁计数法等。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>硝酸盐共沉淀法测定89Sr、 90Sr ：</p>\n<p>1、锶、钙在浓硝酸中的溶解度不同来分离锶与钙；</p>\n<p>2、锶、钡的铬酸盐在草酸溶液中的溶解度不同除去钡；</p>\n<p>3、用氢氧化铝或氢氧化铁沉淀去除稀土元素和锆等元素；</p>\n<p>4、以碳酸盐形式沉淀放射性锶（89Sr、 90Sr ），测总β；</p>\n<p>5、放置15天后，分离测量90Y。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例：某环境样品，经分离得89Sr、90Sr混合样，测定它们的总活度为12Bq，放置10d，分离出90Y，化学收率为85%，经测定90Y的活度为5.5Bq，问该环境样品中89Sr、90Sr的活度各为多少Bq？如放置15d？已知90Y ： 64h， 90Sr ：28.8a。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放置15d：约为90Y的5.6个半衰期。</p>\n<p>8.3 放射性锶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝是43号元素，位于元素周期表第五周期的第七副族，Tc是1937年被佩里尔等人用氘轰击钼得到人工制造的第一个元素：</p>\n<p>取意希腊“人造的”意思，后来在自然界中发现锝的存在（铀矿石中有痕量锝存在）。</p>\n<p>8.3 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">99Tc的半衰期为2.14×105年。</div>\n<p>它的半衰期不长，在自然界应该不存在，但是由于238U的自发裂变产生的99Mo衰变而生成的，因此铀矿中能提炼出锝。</p>\n<p>8.3 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Tc有20多种同位素，其中99Tc 、99Tcm是最重要的，</p>\n<div class=\"formula-line\">99Tc是β放射体，其半衰期2.14×105年，从乏燃料后处理废液中大量获得</div>\n<p>99Tcm 主要放射出γ射线，它的半衰期随锝原子的化学状态的不同和外界压力的变化而有所改变。 99Tc、99Tcm均属低毒核素。</p>\n<p>8.3 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  锝的部分核素的主要辐射特性</p>\n<p>8.3 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  235U发生裂变生成的锝</p>\n<p>8.3 锝和钌</p>\n<p>通过核反应制取锝的大量的各种核素，比如制取99Tc：</p>\n<p>氧化物有：Tc2O7、TcO2，</p>\n<p>卤化物有：TcF6、TcF5、TcCl6、TcCl4</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝的应用</p>\n<p>锝有较好的抗腐蚀性能和较小的中子俘获截面，它是建造核反应堆防腐层的理想材料。</p>\n<p>低浓度（6 Bq L-1）的 对含氧介质中的钢具有抗腐蚀性质，因此，在水作冷却剂或慢化剂的反应堆中锝可作缓蚀剂。</p>\n<p>8.4 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝的应用</p>\n<p>锝及其合金是临界温度最高的超导体，如Mo-Tc（40％Tc）合金的临界温度为15K，因此是很好的超导磁体结构材料。</p>\n<p>99Tc可用来制备高温热电偶，用于控制核反应堆燃料的燃耗。99Tc也常用来制备β标准源。</p>\n<p>99mTc在医学上用于脏器扫描以诊断甲状腺、肾脏等疾病。</p>\n<p>8.4 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝没有可作载体的同位素，因而微量锝的分离纯化十分困难，非同位素载体有Re、Cu等。</p>\n<p>8.4 锝和钌</p>\n<p>锝的分析测定</p>\n<p>微量90Tc的测量有辐射测量法和中子活化法， 90Tcm的测量一般用γ谱仪进行测量。</p>\n<p>锝的测量方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锝的测定</p>\n<p>在锝的分离和纯化过程中，关键是将锝与同族元素铼以及周期系中相邻的元素钼、钌进行分离。</p>\n<p>方法:溶剂萃取法、离子交换色层法等。</p>\n<p>8.4 锝和钌</p>\n<p>锝与铼、钼进行定量分离的最好方法</p>\n<p>利用高锝酸根离子比铼、钼更强烈地被强碱性阴离子交换树脂所吸附的性质来进行分离的。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.4 锝和钌</p>\n<p>在锝的分离过程中，要特别注意防止锝由于形成易挥发的化合物而造成丢失。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>99Tc的测定，目前应用较多的是辐射测量法、分光光度法。</p>\n<p>以测量99Tc的β放射性为基础的辐射测量法是测定99Tc最简单和应用最早的方法。99Tc的放射性比活度为630 Bq/μg，若用低本底β测量装置测量，灵敏度可达10-10g或更高。</p>\n<p>根据高锝酸根离子（         ）强烈地吸收紫外光的特性，可用分光光度法测定锝。</p>\n<p>8.4 锝和钌</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>106Ru、103Ru是最重要的放射性同位素，它们都是β放射体，前者属高毒后者属中毒核素。 106Ru在核爆后的1~3年沉降物中占有较大的放射性份额。</p>\n<p>8.4 锝和钌</p>\n<p>放射性钌(Ru)</p>\n<p>钌是44号元素，位于元素周期表第五周期的第八族。</p>\n<p>与Rh铌、Pd钯、Os锇、Ir铱、Pt铂同属铂族元素。</p>\n<p>钌有21种同位素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.4 锝和钌</p>\n<p>钌的化学性</p>\n<p>钌从0~+8价共有9种价态的多种化合物</p>\n<p>钌可与硝酸根、亚硝酸根、氢氧根、水、一氧化碳等酸位体形成多种无机络合物。</p>\n<p>钌的氧化物有RuO2和RuO4两种</p>\n<p>钌可形成多种含氧酸盐，其中钌酸钾、高钌酸钾它们可用于钌的分光光度法测量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钌是最难除去的裂变产物之一。106Ru在土壤中易迁移，在海水中易被某些海藻浓集，造成环境和生物的污染。一般认为，骨骼和肾是放射性钌的紧要器官。</p>\n<p>8.4 锝和钌</p>\n<p>钌的监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>106Ru的测量方法有γ放射性测量法和β放射性测量法。由于106Ru放出的β粒子能量很低，直接测量是困难的，通常是通过测量其子体106Rh放出的β射线（3.540MeV）或γ射线（0.5118MeV）来计算样品中的106Ru的含量的。</p>\n<p>8.4 锝和钌</p>\n<p>测定样品中的106Ru时，必须将样品中的钌进行浓集和分离。其常用方法有共沉淀法和溶剂萃取法等。一般是将经过预处理的样品溶液用硫化钴共沉淀法定量浓集钌，然后在碱性介质中加入强氧化剂将钌氧化为四氧化钌并用四氯化碳萃取，再经还原反萃后，用金属镁将钌还原为金属，最后进行称重和放射性测量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>硝酸盐共沉淀法测定89Sr、 90Sr？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>1、锶、钙在浓硝酸中的溶解度不同来分离锶与钙；</p>\n<p>2、锶、钡的铬酸盐在草酸溶液中的溶解度不同除去钡；</p>\n<p>3、用氢氧化铝或氢氧化铁沉淀去除稀土元素和锆等元素；</p>\n<p>4、以碳酸盐形式沉淀放射性锶（89Sr、 90Sr ），测总β；</p>\n<p>5、放置15天后，分离测量90Y。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2.  某环境样品，经化学处理后，放置5d，从化学处理后的样品中分离、测定90Y的活度为25Bq，化学收率为100 %，则该环境样中的90Sr活度为多少Bq？已知：</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  裂变产额，独立产额，累积产额，链产额</p>\n<p>裂变产额：裂变产物的某一核素在裂变过程中产生的几率。</p>\n<p>独立产额：核裂变时直接生成某一裂变产物的几率。</p>\n<p>累积产额：某一核素的独立产额加上由于其它裂变产物衰变生成的该核素的产额。</p>\n<p>链产额：某一衰变链上所有链成员独立产额之和</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性碘</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">碘是53号元素，位于元素周期表第五周期的第七主族。海水中有微量碘，约为5×10-6 %，海藻能吸收碘，其灰份中约含1%，人体甲状腺中含碘量5~8 mg。</div>\n<p>碘有27种同位素，即115I~141I，其中127I是唯一的稳定同位素，131I、129I、125I、123I是比较重要的放射性核素，前三者是裂片核素。</p>\n<p>8.5 放射性碘</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>123I通过电子俘获发生衰变，放出X射线和低能γ射线。</p>\n<p>8.5 放射性碘</p>\n<p>123I</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>125I的衰变方式为电子俘获，放出X射线和低能γ射线。</p>\n<p>8.5 放射性碘</p>\n<p>125I</p>\n<p>由于发生核反应125I(n，γ)126I。为了降低产品中的126I的含量，必须把生产出的125I放置几个星期。产品中所含的由126Xe生成的少量137Cs则用离子交换法分离。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>131I——放射性碘。</p>\n<p>8.5 放射性碘</p>\n<p>131I</p>\n<p>制备方法</p>\n<p>（1）235U裂变。每1000个235U原子发生离变形成29个131I原子，仅形成7.5个129I原子核1.2个127I原子。</p>\n<p>（2）在反应堆中辐照130Te富集的碲</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>131I是β、γ放射体，在裂变反应中，由于它有相当大的产额，因此可作为检查反应堆燃料元件包壳破损的监测指标，也可作为反应堆故或核爆炸后环境监测的信号核素。另一方面，它还是制备诊断用放射性药物的重要核素之一。</p>\n<p>8.5 放射性碘</p>\n<p>131I</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>129I是低能β放射体。</p>\n<p>125I的衰变方式为电子俘获，放出X射线和低能γ射线。</p>\n<p>123I也是电子俘获，放出X射线和低能γ射线。</p>\n<p>8.5 放射性碘</p>\n<p>131I属高毒性核素， 129I属于低毒性核素， 125I属中毒核素。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 75 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>碘是紫黑色的片状晶体，易升化，在水中的溶解度极低，如有KI在中存在，I的溶解度会大大增加，其溶液呈棕色。易溶于有机溶剂中，易被活性炭、硅胶等吸附。</p>\n<p>8.5 放射性碘</p>\n<p>碘的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 76 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>酸性溶液中I-与      会发生反应生成I2</p>\n<p>5I-+      +6H+→3I2+3H2O</p>\n<p>碱性溶液中会发生水解反应</p>\n<p>3I3+6OH- →       +5I-+3H2O</p>\n<p>8.5 放射性碘</p>\n<p>碘的化合价有-1、+1、+3、+5、+7价，碘的氧化能力弱，易被氧化能力强物质氧化。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 77 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）氢化物</p>\n<p>HI溶于水成氢碘酸，能生成相应的可溶性的盐及难溶性的盐。</p>\n<p>2）氧化物</p>\n<p>I2O4、I4O9、I2O5，只有I2O5是真正的氧化物它是HIO3的酸酐。</p>\n<p>3） 含氧酸</p>\n<p>碘的氧酸有次碘酸HIO、碘酸HIO3、偏高碘酸HIO4、高碘酸H5IO6，它们所后成的相应的盐类以碘酸盐最为重要，是一种很重要的氧化剂，有时也作沉淀剂。</p>\n<p>8.5 放射性碘</p>\n<p>碘的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4 ） 卤族的互化物</p>\n<p>碘保与其它卤族元素形成互化物，这些互化物的化学性质很活泼，可作氧化剂作于制备碘的标记化合物。</p>\n<p>5 ）多卤化物</p>\n<p>碘可与碘离子化合形成多卤化物。</p>\n<p>6 ）放射性标记化合物</p>\n<p>7 ）碘的络合物</p>\n<p>无机络合物，即I2溶于氢碘酸或其它含I-离子的溶液中形成    络阴离子；有机络合物，碘与抗甲状腺功能剂可形成有机络合物。</p>\n<p>8.5 放射性碘</p>\n<p>碘的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>碘人多种放射性核素，以131I为例，首先要对样品中的131I进行分离和浓集，常用的方法是用CCl4萃取，即在酸性溶液中，先用氧化剂如亚硝酸钠将碘离子氧化成为单质碘，然后用CCl4萃取，再在碱性条件下，用H2O2将碘还原为碘离子，使碘反萃取到水溶液中，最后以碘化银沉淀的形式制源和称重，测定131I的β 放射性活度。</p>\n<p>8.5 放射性碘</p>\n<p>放射性碘的分析测定</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性</p>\n<p>氪和氙</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 81 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氪是36号元素，氙是54号元素，它们均属零元素，又称为稀有气体， Kr、 Xe在空气中的体积分数分别为1.14×10-6和0.086×10-6，重要的放射性氪和氙气体有多种，其中最重要的是85Kr及133Xe，它们均为β、γ放射体，均属低毒核素。</p>\n<p>T Kr-85：10.7a；   T Xe-133 ：5.25d。</p>\n<p>85Kr是核工业和核爆炸中生成量最大的气体放射性核素，是一种全球性的气体污染源。</p>\n<p>8.6 放射性氪(Kr)和氙(Xe)</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 82 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在常温下均为气体，沸点分别为-153.4℃和-108.1℃，它们均易被活性碳和分子筛等吸附，但其最佳吸附温度和吸附能力各不相同，它们易溶于甲苯等有机溶剂中，在液态二氧化碳中，氪有较高的溶解度。作为稀有气体，其化学性质极不活泼，但在一些特定条件下也能得到一些化合物。</p>\n<p>8.6 放射性氪(Kr)和氙(Xe)</p>\n<p>氪和氙的性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 83 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>活性炭吸附法；</p>\n<p>液体CO2吸收法；</p>\n<p>低温分馏法等。</p>\n<p>8.6 放射性氪(Kr)和氙(Xe)</p>\n<p>85Kr的分析测定</p>\n<p>85Kr浓集分离的方法</p>\n<p>85Kr测定法</p>\n<p>β或γ测量；</p>\n<p>液闪法测量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 84 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.6 放射性氪(Kr)和氙(Xe)</p>\n<p>81Kr的分析测定</p>\n<div class=\"formula-line\">用氘核或质子轰击82Kr来生产81Rb（4.58 h），81Rb的衰变产物是81Krm（13.3 s），81Krm再衰变成寿命极长的81Kr（2.1×105 a）。</div>\n<p>81Rb-81Krm用于医学诊断（肺部功能检测）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.6 放射性氪(Kr)和氙(Xe)</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性</p>\n<p>铈和钷</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镧系元素（57号至71号元素）</p>\n<p>镧（La）、铈（Ce）、镨（Pr）、钕（Nd）、钷（Pm）、钐（Sm）、铕（Eu）、钆（Gd）、铽（Tb）、镝（Dy）、钬（Ho）、铒（Er）、铥（Tm）、镱（Yb）、镥（Lu）15个元素。</p>\n<p>镧系元素与同族钇和钪合称为稀土元素(RE-Rare Earth Elements)。</p>\n<p>8.7 放射性铈和钷</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.7 放射性铈和钷</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 89 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>8.7 放射性铈和钷</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 90 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>重核裂变反应产生许多RE裂片放射性核素，如90Y、91Y、</p>\n<p>140La、144Ce、141Ce、147Pm等，尤其是144Ce和147Pm、</p>\n<p>爆炸后的三年内，占沉降物总放射性的比例较大，因而是环境污染的两个重要放射性核素。</p>\n<p>8.7 放射性铈和钷</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 91 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铈的化学性质</p>\n<p>它具有RE元素的通性，+3价，但铈的化合物以+4价最为得要，RE碘酸盐中唯有四价的铈盐Ce(IO3)4是难溶性，此性质可用于铈与其它稀土的分离。</p>\n<p>8.7 放射性铈和钷</p>\n<p>铈共有24种同位素和3种同质异能素，Ce-136、138、140和142这四种同位素是Ce的稳定核素，其余的都为放射性核素，其中144Ce最重要，141Ce次之。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 92 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>共沉淀法</p>\n<p>萃取法等</p>\n<p>8.7 放射性铈和钷</p>\n<p>Ce-144的分析测定</p>\n<p>浓集分离的方法</p>\n<p>85Kr测试</p>\n<p>β计数法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 93 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Pm是人工放射性元素目前已发现20多种同位素，147Pm可以从裂变产物中大量得到，其半衰期为2.26年，纯β放射体， 147Pm只需要简单屏蔽就可以作为核电池，用作心脏起博器及空间能源，它属中毒核素。</p>\n<p>8.7 放射性铈和钷</p>\n<p>钷  Pm</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 94 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>具有RE的通性，化合物中呈正三价，氧化物Pm2O3为紫色，可用作电极，钷的硝酸盐、醋酸盐和氯化物均溶于水，而碳酸盐、草酸盐、磷酸盐和氟化物等难溶于水。</p>\n<p>8.7 放射性铈和钷</p>\n<p>钷的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 95 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>活化产物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 96 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>活化产物是物质在中子等粒子作用下，发生核反应而产生的放射性核素。在核爆炸及核反应堆中中子引起核反应产生的活化产物。</p>\n<p>大气层和地下核爆炸，产生的大量中子会与空气、土壤、水和弹壳等材料发生核反应生成各种活化产物；核电厂和核动力舰船的反应堆运行时也会放出大量中子，这样也会产生活化产行。</p>\n<p>它们能通过各种途径流出污染环境，因此对活化产物的分析监测是环境保护的一项重要内容。</p>\n<p>8.8某些活化产物元素的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 97 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>压水反应堆材料构成及与冷却剂接触面</p>\n<p>燃料包壳管为Zr-4合金：25%；</p>\n<p>设备与管道为不锈钢：5%；</p>\n<p>蒸汽发生器传热管为Inconel600/690或Incoloy800： 70%。</p>\n<p>腐蚀金属：15kg/a；</p>\n<p>界面污物的主要来源是一回路结构材料表面的腐蚀产物，特别是Incoloy800 /nconel690表面上生成的氧化膜。</p>\n<p>8.8某些活化产物元素的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 98 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>活化反应</p>\n<p>8.8某些活化产物元素的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 99 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中子反应 | 反应物在冷却剂中存在的形式 | 放射性类型</p>\n<p>50Cr(n,)51Cr</p>\n<p>54Cr(n,)55Cr</p>\n<p>55Mn(n,)56Mn</p>\n<p>54Fe(n,)55Fe</p>\n<p>58Fe(n,)59Fe</p>\n<p>59Co(n,)60mCo</p>\n<p>59Co(n,)60Co</p>\n<p>58Ni(n,)59Ni</p>\n<p>62Ni(n,)63Ni</p>\n<p>64Ni(n,)65Ni</p>\n<p>94Zr(n,)95Zr</p>\n<p>96Zr(n,)97Zr | 腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物</p>\n<p>腐蚀产物 | 电子俘获</p>\n<p></p>\n<p>，</p>\n<p>电子俘获</p>\n<p>，</p>\n<p>，</p>\n<p>，</p>\n<p>电子俘获</p>\n<p></p>\n<p>，</p>\n<p>，</p>\n<p>，</p>\n<p>反应堆中主要腐蚀物的核反应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 100 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钴是27号元素，钴的活化产物有57、58、60Co ，其中最重要的是60Co ，它是β、γ放射体，属于高毒核素。59Co（n,γ）60Co。</p>\n<p>60Co主要作为外照射源用途</p>\n<p>辐射育种；食品保鲜；</p>\n<p>医疗器械灭菌；</p>\n<p>肿瘤治疗以及工业设备的γ 探伤等。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>60Co</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 101 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>主要以+2、+3两种价态，其中+3价极不稳定。钴的氧化物有 Co3O4、 CoO、 Co2O3；</p>\n<p>往钴盐溶液中加入氢氧化钠能得到氢氧化钴沉淀，在空气中缓慢氧化成棕色的Co2O3水合物；</p>\n<p>二价钴离子盐酸盐、硝酸盐、硫酸盐均能溶于水，邻氨基苯甲酸钴可作为估的分析基准物质。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>60Co钴的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 102 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铁是26号元素，它的活化产物有Fe-55、59等，它们均属中毒核素，其中主要是Fe-59，它是β、γ放射体。58Fe(n,)59Fe</p>\n<p>化学性质  铁的化合价有+2、+3两种价态，其中+3价较稳定；</p>\n<p>氧化物有FeO、Fe2O3、Fe3O4三种，其中Fe3O4是最稳定的氧化物，它与酸作用生成二价铁和三价铁两种盐。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>铁-59</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 103 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锌是30号元素，它的重要活化产物是Zn-65，其半衰期为244.1天，主要衰变形式为电子俘获（EC）和少量的β+辐射。 Zn-65属中毒核素。</p>\n<p>锌的化学性质  其原子价总是+2价，它能形成四类化合物：简单的电价化合物、共价化合物、正的络合离子、负的络合离子。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>锌-65</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 104 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锰是25号元素，位于周期表第四周期的第七副族。Mn-54是核爆炸和核反应堆的重要活化产物，其半衰期为312天，衰变方式为电子俘获。55Mn(n,)56Mn,它属于中毒核素。</p>\n<p>锰的化学性质  锰有10种氧化状态，即-3、-1、0、+1~+7这十种价态。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>锰-54</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 105 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锰能形成六种氧化物，其中MnO2是最重要的，是强氧化剂。</p>\n<p>MnSO4是最稳定的二价锰盐；</p>\n<p>KMnO4是最重要的含锰化合物，易溶于水，溶液呈深红色。</ p>41Ar的半衰期为1.8h。当反应堆安全壳的空气进行换气，主要是在反应堆功率运行期间，这种放射性核素会排放到环境中，对周围环境产生一些辐射剂量。</p>\n<p>8.8某些活化产物元素的化学</p>\n<p>氩-41</p>\n</div></div>"

        "html": "<div class=\"chapter-header\">\n<h2>第九章 放射性核素的制备</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 核素制备</span><span class=\"exam-topic-tag\">★ 分析方法</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>第9章</p>\n<p>放射性核素的制备及放射性分析技术</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>到目前为止已被利用的放射性核素有200余种，放射性标记化合物已达到数千种。</p>\n<p>9.1 概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.1 概述</p>\n<p>为什么制备放射性同位素？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>国防上的应用：核武器、核潜艇的燃料元件等</p>\n<p>工业上的应用：各种放射源，各种放射性检测、控制仪表等</p>\n<p>农业上的应用：辐射育种，辐射灭虫、辐射保鲜等；(γ、X或β-射线。 60Co的γ 射线的能量为1.33及1.17MeV，137Cs：0.66MeV。产生感生核素的阈值为5MeV，O、C、P、S、N产生感生核素的能量大于10MeV。)</p>\n<p>医学上的应用：诊断，治疗、辐射灭菌等；</p>\n<p>9.1 概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>迄今为止已发现的放射性核素有2800种，其中常用的有200多种。</p>\n<p>9.2  放射性核素的制备</p>\n<p>分为两大类</p>\n<p>通过反应堆、加速器进行核反应，乏燃料后处理等，239Pu、239Np、131I等。</p>\n<p>天然放射性核素</p>\n<p>238U、232Th、226Ra、210Po。</p>\n<p>人工放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 下列元素中哪些是放射性元素(          )</p>\n<p>A、43Tc；  B、61Pm；   C、88Ra；  D、90U。</p>\n<div class=\"formula-line\">2. 计算10 g 226Ra的活度为：                 Bq 。(T1/2 = 1602 a，L = 6.02×1023/mol</div>\n<div class=\"formula-line\">3. 某单位有一个含3H（T1/2 = 12.33 a）的放射源，距今25a，为搞清楚它的初始活度，测试该源现在的活度为1104 Bq，它的初始活度为：          Bq。</div>\n<p>习题</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 下列元素中哪些是放射性元素( A、B、C、D)</p>\n<p>A、43Tc；  B、61Pm；   C、88Ra；  D、90U。</p>\n<div class=\"formula-line\">2. 计算10 g 226Ra的活度为： 3.7×1011 Bq 。(T1/2 = 1602 a，L = 6.02×1023/mol</div>\n<div class=\"formula-line\">3. 某单位有一个含3H（T1/2 = 12.33 a）的放射源，距今25a，为搞清楚它的初始活度，测试该源现在的活度为1104 Bq，它的初始活度为： 4500 Bq。</div>\n<p>习题</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产</p>\n<p>加速器生产</p>\n<p>乏燃料提取</p>\n<p>制备放射性核素的方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应堆（核裂变反应堆）</p>\n<p>实现可控核裂变链式反应并把产生的能量转换成热能或电能的装置。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n<p>一个铀原子核裂变，释放约200 MeV的能量，比一个碳原子氧化时放出的能量（4.1eV）几乎大1亿倍；</p>\n<p>1kgU-235裂变释放的能量相当于2800吨优质煤燃烧或20000吨TNT炸药爆炸时放出的能量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应堆发展历程</p>\n<p>1942.12 费米建成第一座原子核裂变反应堆；</p>\n<p>1945.8 原子弹（利用U-235和Pu-239）；</p>\n<p>1954.1 美国核潜艇下水；</p>\n<p>1954.6 苏联第一座核电站建成。</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n<p>反应堆“燃烧”（加工）对象？</p>\n<p>反应堆燃料元件按其物理状态可分为固态、液态和气态三大类，其中最广泛应用的是固态燃料元件。</p>\n<p>核燃料元件</p>\n<p>能量的来源</p>\n<p>燃料芯</p>\n<p>金属或其他材料（包壳）</p>\n<p>粘合剂</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n<p>固体燃料元件形状不同。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应堆是一种强大的中子源，其中子通量一般为1010~1013cm-2·s-1，可通过反应堆的(n,α)、(n,p)、(n,f)及(n,γ)反应和次级核反应来生产放射性核素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(n,α)、(n,p)反应所需中子的能量较高，在热中子反应堆中，反应的截面都很小，仅少数几种轻元素（6Li、14N、32S、35Cl）可发生这类反应。由于这两种反应的产核与靶核分属不同的元素，故可用化学分离方法制得无载体的放射性核素。</p>\n<p>32S(n,p)32P；      6Li(n,α)3H 。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(n,f)反应。裂变反应可产生大量的裂变产物，是放射性核素的重要来源之一，如233U、235U、 239Pu的裂变反应，所生成的放射性核素达500种以上。</p>\n<p>(n,γ)反应。生产放射性核素具有产额高成本低等优点而被广泛采用。产核和靶核是同位素而难以用化学方法分离，因而产品的比活度受到限制。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>目前全球有445座商用核动力反应堆在31个国家运行，总装机容量达  387GW，另有64座在建。</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>民用核电已拥有超过1.65万堆年的运行经验，并且占世界电力能源供给的11.5%(来自31个国家的核动力发电)。</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>将金属钴丝或钴片、钴棒装不锈钢壳内，氩弧焊接密封；</p>\n<p>放入反应堆中照射， 59Co(n,γ) 60Co反应制得60Co。</p>\n<p>9.2  放射性核素的制备</p>\n<p>生产放射性60Co</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>粒子加速器（带电粒子加速器）</p>\n<p>用人工方法获得快速带电粒子束的大型实验装置，是研究原子核物理和核化学、认识物质深层次结构的重要工具。正、负电子，质子，轻、重离子</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>加速器：回旋加速器、静电加速器、高压加速器、直线加速器等。</p>\n<p>用回旋加速器由于能量适中，流量足够而被常用，可加速p，d，α，15N和18O等粒子，加速的粒子轰击靶可引起(p,n)、(p,α)、(d,n)、(d,2n)、(d,α)、(α,n)、(α,2n)等核反应。</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>粒子加速器发展历程</p>\n<p>1924~1928  建成直线加速器</p>\n<p>1932  回旋加速器</p>\n<p>1932  建造世界上第一台高压倍加器7Li(p，α)4He</p>\n<p>1933  静电加速器</p>\n<p>1945  自动稳相原理（同步回旋加速器、同步加速器）</p>\n<p>1952   强聚焦同步加速器</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n<p>加速器分类</p>\n<p>按加速粒子的种类不同：电子加速器，质子和重离子加速器，微物质粒子（粉末、灰尘等）加速器</p>\n<p>按加速粒子能量：低能加速器（100 MeV以下），中能加速器（100 MeV~1 GeV），高能加速器（1~100 GeV），超高能加速器（ 100 GeV以上 ）</p>\n<p>按束流强度：强流加速器（1 mA以上）、中流加速器（10 μm~1 mA），弱流加速器（10 μm以下）等</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.2  放射性核素的制备</p>\n<p>加速器基本构成</p>\n<p>粒子源</p>\n<p>注入分析运输系统</p>\n<p>真空加速室</p>\n<p>分析系统</p>\n<p>靶室</p>\n<p>束流导引与聚焦系统</p>\n<p>高真空设备</p>\n<p>束流检测诊断设备</p>\n<p>供电与稳定控制设备</p>\n<p>操作台控制</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>加速器生产放射性核素特点</p>\n<p>核反应的产核和靶核一般是不同的元素，因此可用化学法分离，从而获得放射性纯度和比活度都很高的放射性核素；</p>\n<p>可生产反应堆不能生产的缺中子放射性核素，其衰变多为EC或发射正电子，用于医疗诊断；</p>\n<p>由于(n,γ)反应截面低，反应堆无法生产碳、氮、氧等轻元素，即使能生产，其半衰期不是太长（14C：5730a），就是太短（19O：26.9s），不适合于医用。而加速器能方便产生11C、13N等核素。</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>与反应堆相比,加速器的投资少，运行和管理方便，但生量低，成本高，制靶过程复杂，一般在下列情况用于弥补反应堆的不足：</p>\n<p>当用反应堆不能产生出比活度高的放射性核；</p>\n<p>当反应堆不能产生出符合使用要求的某种放射性核素；</p>\n<p>当远离反应堆的地方需要短半衰期放射性核素；</p>\n<p>当对某种核素需要量少，加速生产较方便。</p>\n<p>9.2  放射性核素的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(1)制靶</p>\n<p>在紫铜靶基上用电镀法镀锌（天然锌），厚度为30~70mg/cm2；</p>\n<p>(2)轰靶</p>\n<p>用回旋加速器产生的26MeV、流强为50μA的质子流轰靶，68Zn(p,2n) 67Ga;</p>\n<p>(3)化学分离</p>\n<p>照射后，取出，放在铅罐内冷却3d，降低66Ga的活度，然后进行化学分离得67Ga。</p>\n<p>9.2  放射性核素的制备</p>\n<p>生产67Ga</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应堆乏燃料是提取放射性核素的重要原料。这些放射性核素都集中在后处理厂的高放废液和废气中。</p>\n<p>裂片元素；超铀元素。</p>\n<p>一个1000MW的核电站产生：</p>\n<p>乏燃料：30t/a；      Pu：0.27t/a；</p>\n<p>U： 28.6t/a；          裂变产物：1.13t/a。</p>\n<p>9.2  放射性核素的制备</p>\n<p>从乏燃料后处理中提取放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核废料原件中的长寿命高放废物</p>\n<p>1GWe PWR核反应堆年卸料33吨</p>\n<p>9.2  放射性核素的制备</p>\n<p>核素 | 半衰期/a | 质量/kg | 核素 | 半衰期/a | 质量/kg</p>\n<p>Pu-238 | 88 | 4.5 | Se-79 | 65000 | 0.2</p>\n<p>Pu-239 | 24000 | 166 | Tc-99 | 210000 | 25</p>\n<p>Pu-240 | 6600 | 77 | I-129 | 15700000 | 6</p>\n<p>Pu-241 | 15 | 25 | Cs-135 | 2300000 | 10</p>\n<p>Pu-242 | 387000 | 16 | Cs-137 | 30 | 31</p>\n<p>Np-237 | 2120000 | 15 | Zr-93 | 950000 | 23</p>\n<p>Am-241 | 433 | 17 | Pd-107 | 6500000 | 7</p>\n<p>Am-243 | 7950 | 3 | Sr-90 | 29 | 13</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>应用：动力堆的低富集铀燃料元件的后处理</p>\n<p>处理不锈钢包壳或锆合金包壳乏燃料</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑴放射性核素发生器，是一种可以定期从放射性母体核素中分离出放射性子体核素的装置，其母体核素的半衰期较长，子体核素半衰期较短，母体与子体易达到平衡；(99Mo-99mTc，66h，6h)</p>\n<p>⑵用放射性同位素中子源照射来获得微量的放射性核素；</p>\n<p>⑶用热核中子闪曝合成超铀元素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>制备放射性核素的其他方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  几种医用核子发生器</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1、放射性核素示踪法</p>\n<p>利用放射性核素作为示踪原子，通过放射性的测量以显示其存在的位置、数时及其转变过程，从而跟踪观察研究对象的运动变化情况。</p>\n<p>9.3  放射性核素示踪法</p>\n<p>原理</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>灵敏度高，检测限可达10-15~10-13g；</p>\n<p>测量方法简便；</p>\n<p>能揭示原子、分子的运动规律及其他方法难以发现的规律。</p>\n<p>9.3  放射性核素示踪法</p>\n<p>特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（1）简单示踪法</p>\n<p>将放射性核素机械地结合或附着于研究对象上，然后通过探测放射性来观察研究对象的运动情况。</p>\n<p>9.3  放射性核素示踪法</p>\n<p>放射性核素示踪法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.3  放射性核素示踪法</p>\n<p>放射性核素示踪法</p>\n<p>（2）物理混合示踪法</p>\n<p>将放射性核素与研究对象充分进行物理混合，然后通过测量放射性活度的变化来弄清研究对象的行为和质性。如稀释测定法。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（3）标记化合物示踪法</p>\n<p>根据放射性核素与其稳定同位素除了同位素效应外在化学和生物学性质上完全相同的前提下，利用放射性标记化合物对同类化合物进行示踪。</p>\n<p>9.3  放射性核素示踪法</p>\n<p>放射性核素示踪法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>从实验目的和实验周期长短来考虑放射性示踪核素的半衰期；</p>\n<p>辐射类型和能量，用作示踪剂的主要是β和γ放射性核素；</p>\n<p>比活度，放射性示踪剂的比活度必须足够高，要求测量时样品中的活度至少大于本底计数率标准偏差的3倍。</p>\n<p>9.3  放射性核素示踪法</p>\n<p>放射性示踪剂的选择</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性药物是指在医学上使用的含有放射性核素的化合物或生物物质的统称。根据其临床应用的目的不同可分为两类：</p>\n<p>⑴治疗用放射性药物；</p>\n<p>⑵诊断用放射性药物。</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n<p>放射性药物及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性药物符合药物的一般要求外，需满足以下要求</p>\n<p>放射性核素及其衰变产物应对机体基本无害，且容易从体内廓清；</p>\n<p>半衰期较短，减少对机体的辐射损伤；</p>\n<p>有较高的化学纯度，放射性纯度和放化纯度，减少毒副作用；</p>\n<p>有适宜于探测的射线，一般为γ射线，能量在100~300keV；</p>\n<p>有适宜的比活度。</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n<p>放射免疫技术</p>\n<p>放射免疫分析法(RIA)</p>\n<p>放射免疫显像(RII)</p>\n<p>放射免疫治疗(RIT)</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑴放射免疫分析法</p>\n<p>将免疫反应与放射性核素示踪技术相结合的一种体外测定方法。</p>\n<p>原    理</p>\n<p>利用放射性核素标记的抗原(*Ag)和试样中的非标记抗原(Ag)在与特异抗体(Ab)结合成抗原-抗体复合物(*Ag- Ab和Ag- Ab)的过程中，两者发生竞争性反应：</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>当*Ag和Ab的量固定时，若样品中的Ag（待测物质）的含量增高，则*Ag被稀释的程度就增加，*Ag- Ab和后成量就减少。</p>\n<p>只要将未结合的*Ag与*Ag- Ab分离，并分别测定它们的活度，即可从*Ag- Ab的结合百分率与Ag浓度的标准竞争曲线上出样品中Ag的含量。</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑵放射免疫显像和放射免疫治疗</p>\n<p>利用放射性核素标记的McAb具有特异的免疫反应，可定位到某种肿瘤上，从而可将其作为诊断和治疗癌症的一种有交方法。</p>\n<p>人源化的McAb替代鼠性的McAb；</p>\n<p>99Tcm、111In替代131I。使此两项技术得到快速发展。</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>自放射显影技术是从本上个世纪20年代初开始发展起来的一种测定放射性示踪核素的方法，它利用放射性物质产生的射线使核乳胶感光，根据其感光的部位及强度来记录、检查和测量样品中放射性物质。我国科学家钱三强、何泽慧等人就是利用核乳胶技术发现了重原子核的三分裂与四分裂现象。</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n<p>自放射显影技术</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在化学研究中，通过追踪同位素标记原子在化学过程中的运动、分配和转移情况来辨别物质运动、分配和转变的规律。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n<p>放射性同位素在化学研究中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>主要用于以下几方面</p>\n<p>对分子重排反应机理研究；</p>\n<p>对反应动力学研究；</p>\n<p>应用于一些物理化学常数的测定，如平衡常数、分配系数、微溶物质溶解度、难挥发物质蒸汽压、晶体比表面等的测定。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性同位素在工业中有着广泛的应用，它已应用于化工、冶金、石油等领域。</p>\n<p>化工：放射性同位素可用作辐射加工、示踪剂；</p>\n<p>冶金：研究非金属杂质的来源、金属凝固过程等及活化分析一些金属含量；</p>\n<p>石油；中子测井技术等；</p>\n<p>利用放射性同位素还可制成各种检测和控制仪表。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n<p>放射性同位素在工业中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中子测井技术：有中子-γ测井、中子-中子测井等。</p>\n<p>中子-γ测井：中子源产生中子，易被轻核慢化，如氢核(水、石油中氢量多)；</p>\n<p>快中子被慢化成热中子；</p>\n<p>热中子被岩石中的其它原子核俘获，(n,γ)反应,产生γ射线,含氢多， γ射线离中子源近，反之离中子源远；</p>\n<p>γ射线被γ探测器接收；</p>\n<p>根据γ射线接收量来判断井下情况。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>同位素稀释分析法是将待测元素与放射性同位素示踪剂充分混合，然后分离出一部分纯净待测样品，测其比活度，由比活度的变化来算出待测元素的含量。</p>\n<p>这种方法常用来测定不易分离的组份的含量。</p>\n<p>有正稀释法、反稀释法及亚化学计量稀释法。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>同位素稀释法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>也称直接稀释法。它是将一种比活度和质量已知的放射性核素或其标记化合物作为标准物加到含该放射性核素的稳定同位素或其化合物的待测物中，混合均匀后分离提出其中的一部分，然后测其比活度。</p>\n<div class=\"formula-line\">mx=m0(s0/sd-1)</div>\n<p>M0、mx分别为引入的标准物和待测物的质量；</p>\n<p>s0、sd分别为标准物和稀释后化合物的比活度。</p>\n<p>当mx ＞＞M0时，</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>正稀释法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>将一种质量为M0的稳定同位素加到含有其放射性同位素（比活度为s0 ）的待测样品之中，混合均匀后分离提纯一部分化合物，再测其比活度sd，并由此计算出待测样品中原有的放射性同位素的质量mx：</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>反稀释法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例  用反稀释法稀释含137Cs的待测样品，已知137Cs的T1/2为30.17a，K值为1.32×1016，将质量为10mg铯稳定同位素加到待测样品中，混合均匀后分离提纯一部分混合物，测其比活度sd=1.19×109   Bq/mg，则待测样品中的137Cs的质量为多少mg？</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应式：A+B→AB</p>\n<p>式中：A为被分离或分析的对象，</p>\n<p>B是为了分离或分析而加入的试剂。</p>\n<p>当B试剂相对于A来说化学计量不足时（A  》B），即为亚化学计量。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>亚化学计量稀释法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>该方法做为定量分析方法,要满足条件：</p>\n<p>①分离试剂必须定量地消耗在所测定的元素上；</p>\n<p>②必须采用某种分离方法使被测元素的已经反应部分与尚未反应部分分离开来。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>对于放射分析来说，亚化学计量稀释法即用少于化学计算量的两份相等的分离试剂，分别从放射性标准物溶液和从经过同位素稀释后样品溶液中分离出质量相等的化合物，这样它们的比活度之比A0/Ad就等于其活度之比S0/Sd，则正稀法中的表达式就可改为：</p>\n<p>同位素稀释法的最大优点是不需定量分离被测物，这可避免在分离提纯过程中由于化合物的回收率低而造成的误差。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例题：用亚化学计量进行测定时，已知引入标准物的质量为30.0mg，从放射性标准溶液中和从经同位素稀释后的样品中分离提纯的化合物的放射性计数分别为1200和60cpm，求待测物的质量为多少？</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">解：m0=30.0mg,</div>\n<div class=\"formula-line\">mx=m0 (A0/Ad-1 )=30.0(1200/60-1)=570.0mg</div>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>经过核反应，把原来没有放射性或放射性不易被测量的样品中的被测核素变成具有特征放射性的产物，然后可以通过测定其射线能量和半衰期进行定性鉴定，通过测定射线强度作定量分析。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>活化分析法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>分两步</p>\n<p>活化：将含待测核素的样品经n，p，d，α或γ等粒子或射线的照射，发生核反应，使其转化为适宜于射线测量的放射性核素；</p>\n<p>分析：常采用相对法来测定样品中微量核素的含量，即将标准样品和待测样品在相同条件下进行照射，化学处理和放射性测量，然后按下式进行计算：</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>测量中子与样品中待测核素发生核反应所产生的放射性核素来测定该核素含量的一种方法。</p>\n<p>常用的有热中子活化分析（以反应堆为中子源，利用(n,γ)反应对核素进行活化）</p>\n<p>快中子活化分析(以同位素中子源、中子发生器和加速器为活化源，利用(n,p)、(n,α)、(n,2n)等核反应进行活化)。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>中子活化分析</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>活化分析已成功地应用于生命科学。用于测量微量元素等。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>带电粒子活化分析</p>\n<p>测量带电粒子与样品中待测核素发生核反应所产生的放射性核素来测定元素含量的一种方法。</p>\n<p>活化分析的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例  活化分析中，含微量氯的物质在</p>\n<p>1012中子/(cm2·s)通量密度下辐照5 h，辐照结束5h后，测得38Cl的活度为2.33×104Bq，则LiCl中氯含量为多少g？已知其核反应式为：                            ，38Cl的半衰期T1/2为37.2min，37Cl的丰度H为24.23%，氯的平均分子量    为35.453，阿佛加德罗常数L=6.02×1023/ mol , ln2=0.693，反应截面为0.43b，1 b=10-24 cm2。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：已知φ=1012中子/（cm2·s），σ=0.43b，辐照时间t=5h，冷却时间t`=5h，阿佛加德罗常数L=6.02×1023/ mol，丰度H=24.23%，半衰期T1/2=37.2min，     =35.453。</p>\n<p>求氯的质量m</p>\n<p>9.6 放射分析技术及其应用</p>\n<div class=\"formula-line\">m=3.55×10-3g</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.6 放射分析技术及其应用</p>\n<p>例：某环境样品在中子注量率为1×1013 cm-2•s-1，辐照24h，测得238Np的活度为1.2Bq，该环境样品中237Np质量为多少g? 238Np的半衰期为2.117d，H=1，L=6.02×1023/mol，237Np的反应截面为169b ，1b=10-24cm2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>9.6 放射分析技术及其应用</p>\n<div class=\"formula-line\">m=1.0×10-12g</div>\n<p>解：</p>\n<div class=\"formula-line\">例：某环境样品在中子注量率为1×1013 cm-2•s-1，辐照24h，测得238Np的活度为1.2Bq，该环境样品中237Np质量为多少g?</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>波长色散和能量色散两种方式。</p>\n<p>能量色散X射线荧光分析法是利用一定能量的粒子使样品中待测元素的原子激发，并发出特征X射线荧光，然后根据不同元素发出特征X射线的能量不同，且元素的含量与X射线强度在一定条件下成正比的原理，通过X射线谱仪测量其能谱和强度，可确定待测元素的种类和含量。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>X射线荧光分析法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>The End</p>\n</div></div>"

    "examOverviewHTML": "<div class=\"exam-overview\">\n<h2>放射化学 考试概览</h2>\n<div class=\"exam-date\">📅 考试时间：2026年6月18日</div>\n<div class=\"exam-grid\">\n<div class=\"exam-type\"><div class=\"name\">填空题</div><div class=\"score\">16分</div><div class=\"detail\">8题 × 2分，一空分值不定</div></div>\n<div class=\"exam-type\"><div class=\"name\">选择题</div><div class=\"score\">14分</div><div class=\"detail\">7题，含单选和多选，部分答对得分</div></div>\n<div class=\"exam-type\"><div class=\"name\">名词解释</div><div class=\"score\">16分</div><div class=\"detail\">4个 × 4分</div></div>\n<div class=\"exam-type\"><div class=\"name\">问答题</div><div class=\"score\">24分</div><div class=\"detail\">4个 × 6分</div></div>\n<div class=\"exam-type\"><div class=\"name\">计算题</div><div class=\"score\">30分</div><div class=\"detail\">3题 × 10分，保留两位小数</div></div>\n</div></div>\n<div class=\"exam-tips\"><h3>⚠️ 考试注意事项</h3><ul>\n<li>本次课堂围绕放射化学考试展开，介绍题型分值、重点知识及考试注意事项。</li>\n<li>考试注意事项：6 月 18 日晚九十节考试，带 2B 铅笔、计算器，计算题掌握公式，别依赖原题。</li>\n</ul></div>\n<div class=\"exam-tips\"><h3>放射化学重点知识</h3><ul>\n<li>考试题型与分值：</li>\n<li>填空题：8 道题共 16 分，一题 2 分，一空分值不定。</li>\n<li>选择题：7 道题共 14 分，有单选和多选，选对部分答案可得分。</li>\n<li>名词解释：4 个共 16 分，每个 4 分。</li>\n<li>问答题：4 个共 24 分，每个 6 分。</li>\n<li>计算题：3 道题共 30 分，一道题 10 分，答案保留小数点后两位。</li>\n<li>学科特点：放射化学有 4 个特点，常考填空题。</li>\n<li>公式概念：牢记衰变公式、半衰期与衰变常数关系、贝克和居里定义、比活度计算、平衡公式等。</li>\n<li>衰变类型：了解阿尔法、贝塔、伽马衰变本质。</li>\n<li>胶体判定：掌握分散体系相关概念，会判断放射性真、假胶体。</li>\n<li>吸附相关：了解吸附剂、吸附类型，会计算吸附率和吸附系数。</li>\n<li>共沉淀：区分结晶共沉淀和吸附共沉淀，记住同二晶特殊例子。</li>\n<li>电化学：能斯特方程，理解电化学置换法和电沉积法原理。</li>\n<li>载体相关：区分载体、反载体等，简答题会分析萃取、吸附和沉淀作用。</li>\n<li>萃取：记萃取率公式，了解萃取剂和沉淀剂选择标准，区分盐析剂、掩蔽剂。</li>\n<li>离子交换：理解离子交换相关概念，解释稀释液性能，记住分离三阶段。</li>\n<li>天然放射性：识别天然放射性元素，记住天然放射性系母体及关键元素，了解来源。</li>\n<li>核反应式：会写铀钚、钍铀转化等核反应式，掌握镭氡计算。</li>\n<li>核素制备：记住核素产生方式、反应特点，会写同位素制备方法。</li>\n<li>分析方法：记住同位素稀释法等分析方法，了解活化分析步骤。</li>\n</ul></div>\n<div class=\"exam-tips exam-mapping\"><h3>考点 → 章节对应</h3>\n<div class=\"mapping-table\">\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch1');return false\"><span class=\"mapping-ch\">第一章</span><span class=\"mapping-topic\">学科特点</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">衰变公式</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">半衰期与衰变常数</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">衰变类型</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">贝克和居里</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">比活度</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch2');return false\"><span class=\"mapping-ch\">第二章</span><span class=\"mapping-topic\">平衡公式</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch3');return false\"><span class=\"mapping-ch\">第三章</span><span class=\"mapping-topic\">同位素效应</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch3');return false\"><span class=\"mapping-ch\">第三章</span><span class=\"mapping-topic\">胶体判定</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<a class=\"mapping-row\" href=\"#\" onclick=\"navigateTo('ch-ch3');return false\"><span class=\"mapping-ch\">第三章</span><span class=\"mapping-topic\">吸附</span><span class=\"mapping-arrow\">→ 复习</span></a>\n<
