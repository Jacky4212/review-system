        "html": "<div class=\"chapter-header\">\n<h2>第四章 物质的分离</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 共沉淀</span><span class=\"exam-topic-tag\">★ 同二晶</span><span class=\"exam-topic-tag\">★ 电化学</span><span class=\"exam-topic-tag\">★ 载体</span><span class=\"exam-topic-tag\">★ 萃取</span><span class=\"exam-topic-tag\">★ 离子交换</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 放射性物质在溶液中的行为不包括：</p>\n<p>电化学</p>\n<p>吸附</p>\n<p>共结晶共沉淀</p>\n<p>解离</p>\n<p>A</p>\n<p>B</p>\n<p>C</p>\n<p>D</p>\n<p>提交</p>\n<p>单选题</p>\n<p>2分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2. 类质同晶能形成真正的混晶，某些化学组成类似但晶体结构不同的物质，在一定条件下  [填空1]  形成真正的混晶。</p>\n<p>作答</p>\n<p>填空题</p>\n<p>2分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3. 两种物质形成同晶的条件 [填空1] 。</p>\n<p>作答</p>\n<p>填空题</p>\n<p>1分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">4. 238U的比活度S0为 [填空1]  Bq/mg (已知：238U的半衰期为4.46×108 a)？</div>\n<p>作答</p>\n<p>可为此题添加文本、图片、公式等解析，且需将内容全部放在本区域内。</p>\n<div class=\"formula-line\">S0=K/MT1/2</div>\n<p>填空题</p>\n<p>5分</p>\n<p>答案解析</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程内容</p>\n<p>1</p>\n<p>引言——基本概念</p>\n<p>2</p>\n<p>共沉淀法</p>\n<p>4</p>\n<p>离子交换法</p>\n<p>5</p>\n<p>色层法</p>\n<p>6</p>\n<p>电化学分离法</p>\n<p>3</p>\n<p>萃取法</p>\n<p>7</p>\n<p>其他分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程要求</p>\n<p>1</p>\n<p>了解分离方法的原理和过程</p>\n<p>2</p>\n<p>掌握分离效率指标</p>\n<p>3</p>\n<p>熟悉应用方向</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>已发现了118种元素，2800余种核素，271种是稳定的，其余的都是放射性的。</p>\n<p>放射性核素通常与其母体、其它子体以及其它放射性核素共存，要得到某种放射性核素就必须进行一些分离。</p>\n<p>常用的分离方法有：沉淀法、溶剂萃取法、色谱法等。</p>\n<p>4.1 引言</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>对以微量或低浓度状态存在的放射性物质的分离，为避免被容器表面吸附或被沉淀载带损失，常需要载体；</p>\n<p>对极短寿命放射性物质需进行快速分离。如Zr-101（2.0 s）、Mo-107 （3.5 s）和Ru-112 （3.6 s）</p>\n<p>有时存在临界事故危险及辐射效应影响。Pu-239</p>\n<p>放射性物质的毒性及其辐射对人体有伤害作用，需进行必要的辐射防护。</p>\n<p>4.1 引言</p>\n<p>放射化学分离特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射分离中的概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性 Radioactivity</p>\n<p>某些核素自发放出粒子或射线，或在轨道电子俘获后放出射线，或发生自发裂变的性质。</p>\n<p>放射性元素Radioelement</p>\n<p>所有同位素具有放射性的化学元素。</p>\n<p>放射性核素Radioactive isotope</p>\n<p>某种元素中发生放射性衰变的核素。放射性核素按其来源有天然放射性核素和人工核素之分。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>载体Carrier</p>\n<p>载体是以适当的数量载带某种微量物质共同参与某化学或物理过程的另一种物质。</p>\n<p>载体与被载带物具有相同的化学行为，最终能与放射性物质一起被分离出来。</p>\n<p>例如：分离226Ra加入Ba，127I对131I，1H对3H等。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n<p>同位素载体</p>\n<p>非同位素载体</p>\n<p>载体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>稳定同位素或长寿命同位素的可溶性盐类作载体</p>\n<p>89Sr、90Sr用SrCl2；137Cs用CsCl</p>\n<p>4.1.1 放射化学分离中的概念</p>\n<p>同位素载体</p>\n<p>非同位素载体</p>\n<p>没有稳定同位素的放射性核素，应用化学性质相似的稳定元素的盐类作载体。</p>\n<p>147Pm—Nd(NO3)3；99Tc—NH4ReO4</p>\n<p>载体溶液的浓度一般10mg元素/ml，加入10~20mg。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>提高被分离物质的量；</p>\n<p>克服微量放射性物质易被吸附而丢失和不易分离的问题;</p>\n<p>不影响对它进行定性和定量。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n<p>载体的作用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反载体Anti-carrier</p>\n<p>为了减少分离过程对杂质核素的载带，在加入被分离核素和载体之外，还必须加入这些杂质核素的稳定同位素或化学类似物，以减少它们对被分离核素和器皿的污染，即起反载带作用，这类稳定同们素或化学类似物就称为反载体或抑制体。</p>\n<p>例如：用MnO2从95Zr-95Nb体系中吸附95Nb时，加入稳定的Zr。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素纯度(Radionuclide purity)</p>\n<p>放射性核素纯度也称放射性纯度，指在含有某种特定放射性核素的物质中，该核素的放射性活度对物质中总放射性活度的比值。（该物质中可能有多种放射性核素，放射性核素纯度只与其中放射性杂质的量有关，而与非放射性杂质的量无关）。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学纯度(Radiochemical purity)</p>\n<p>简称放化纯度，指在一种放射性样品中，以某种特定的化学形态存在的放射性核素占总的该放射性核素的百分数（该物质中可能有多种放射性核素，只针对某一种放射性核素而言）。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）分配系数 D</p>\n<p>某一物质M在不相溶的两相中达到分配平衡即在两相中的浓度不再变化时，它分别在两相中的表观浓度之比。</p>\n<p>如131I在水和CCl4中的分配。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2) 分离系数α</p>\n<p>物料中两种物质经过某一分离过程后分别在不相溶的两相中相对含量之比,它表示两物质经过分离操作之后所达到的相互分离的程度。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n<p>α越大于1或越少于1，两种物质越容易分离，若等于1，则两种物质无法分离。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例如：</p>\n<p>在Purex流程中，加入TBP-煤油，将           、     萃取放有机相中，使U、Pu与其它杂质分离；加入U(Ⅳ)将Pu(Ⅳ)还原成Pu(Ⅲ)，钚反萃入水中，使铀、钚分离。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n<p>2) 分离系数β</p>\n<p>物料中两种物质在分离前，原始样品中含量的比值与分离后产品中含量的比值之比 。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）化学回收率Y</p>\n<p>放射性核素的化学回收率可通过测量其活度来计算：</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>回收率可以通过加入载体或者加入放射性示踪剂的方法来测定。</p>\n<p>当载体的化学状态与被分离的放射性核素的化学状态完全相同时，化学收率可用载体的化学收率来表示。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4）净化系数DF</p>\n<p>净化系数又称去污系数或去污因子，它是衡量分离过程对某种放射性杂质去除程度的一种指标。</p>\n<p>当欲分离核素在分离过程中的化学回收率接近100%，</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>净化系数用放射性活度来计算可表示为：</p>\n<p>对各种干扰测定的入放射性杂质的去污系数愈高，则测定的欲分离核素放射性活度愈可靠。一般要求DF高于103以上。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>共沉淀法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.1 基本原理</p>\n<p>基本原理</p>\n<p>共沉淀法是利用微量物质随常量物质一起生成沉淀现象来进行分离、浓集和纯化微量物质的一种方法。</p>\n<p>早期研究共沉淀规律的有哈恩、赫洛宾等，其中亨德森和克雷克西提出了一个公式。</p>\n<p>影响共沉淀的因素有：温度、液相组成、固相组成及溶剂等。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>共沉淀有以下两种：</p>\n<p>1）无机共沉淀法</p>\n<p>无机化合物做载体。共结晶共沉淀法和吸附共沉淀法。</p>\n<p>2）有机共沉淀法</p>\n<p>有机化合物作载体。难溶的离子缔合物、难溶的金属螯合物、有机胶体的吸附作用而生成的共沉淀。</p>\n<p>4.2.1 基本原理</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核反应生成的放射性核素能以各种不同的价态存在</p>\n<p>溶解靶子时，放射性核素可以和溶剂发生各种化学反应</p>\n<p>射线对溶液的辐射化学效应也可以引起核素的价态变化</p>\n<p>4.2.2 共沉淀法分离过程</p>\n<p>影响化学状态的因素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.2 共沉淀法分离过程</p>\n<p>调节化学状态的方法</p>\n<p>向溶液中加入各种可能存在的价态的载体，然后用某种氧化-还原反应使价态变成一致</p>\n<p>加入一种价态的载体，然后进行一次氧化-还原反应循环，把各种可能的价态变成一种价态。</p>\n<p>例如：为了从裂变产物中分离碘，可加入碘化钾作载体，在碱性溶液中用次氯酸钠将低价态的碘全部氧化成7价，再用亚硝酸钠将七价碘还原为单质碘。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>载体：尽量选用同位素载体，也可选用非同位素载体。</p>\n<p>为了减少 分离过程中放射性杂质对欲分离核素的污染，必须加入反载体。</p>\n<p>一般情况下，载体量在5~20mg，反载体量10mg为宜。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>净化载体：可将多种杂志离子从溶液中除去，让所需的放射性核素留在溶液中。又称清扫载体或净化载体。</p>\n<p>常用的净化载体：氢氧化铁、氢氧化钍、硫酸钡、碳酸钡、二氧化锰、三硫化二铋等。净化操作要经过多次才能达到净化程度。</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n<p>实际分离过程中是载体、反载体、净化载体共同使用。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 放射化学分离中的概念</p>\n<p>净化载体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>沉淀剂的选择</p>\n<p>沉淀剂与载体生成的共沉淀化合物溶解度要小；</p>\n<p>对杂质的载带少，去污系数高；</p>\n<p>沉淀性能好，易于固液分离；</p>\n<p>有利于分离操作和制源测量。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶度积常数KSP：</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>加反载体或络合剂；</p>\n<p>控制溶液的酸度；</p>\n<p>采用均相沉淀法；</p>\n<p>改变氧化价态；</p>\n<p>选择适当的沉淀条件；</p>\n<p>进行多次沉淀；</p>\n<p>洗涤沉淀。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（2）共沉淀产物纯度的提高</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>共沉淀法的应用</p>\n<p>主要用于环境和生物样品的放射化学分析中；</p>\n<p>净化放射性废水和沾污的饮水中的应用。</p>\n<p>4.2.4 共沉淀法分离应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>萃取法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶剂萃取法又叫液-液萃取法。</p>\n<p>有机试剂配制成有机相，将金属离子从水相转移到有机相的过程。</p>\n<p>例：从铀、钍共生矿中提取铀的工艺中，其中有一步是用5%TBP煤油溶液从含铀、钍的5mol/L的 HNO3料液中，将铀从水相提取到有机相，将钍保留在水相。</p>\n<p>4.3 溶剂萃取法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>溶液：一种或一种以上的物质分散到另一种物质里，形成均一的、稳定的混合物。</p>\n<p>溶剂：能溶解其他物质的物质。</p>\n<p>溶质：被溶解的物质。</p>\n<p>在核燃料后处理过程中，通常所说的溶剂，无特殊加以说明，均为有机溶液。</p>\n<p>水是形成水溶液的溶剂，但是在核燃料后处理工程中所说的水一般不是溶剂。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>利用不同的物质在溶剂中溶解度不同，在一种混合物中加入适当的溶剂，使混合物中的组分得到部分或完成分离的过程叫做溶剂萃取。</p>\n<p>被处理的</p>\n<p>混合物</p>\n<p>固态</p>\n<p>液态</p>\n<p>“固-液” 萃取</p>\n<p>“液-液” 萃取</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>TBP-煤油提取U、Pu（溶剂萃取）</p>\n<p>相</p>\n<p>溶剂相</p>\n<p>水相（料液）</p>\n<p>TBP-煤油</p>\n<p>含有U、Pu和裂变产物的硝酸水溶液。</p>\n<p>萃取之前</p>\n<p>萃取之后</p>\n<p>相</p>\n<p>有机相（萃取液）</p>\n<p>含铀、钚</p>\n<p>绝大部分裂变产物</p>\n<p>水相（萃残液）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>优  点</p>\n<p>方法简便，分离速度快，适用于短寿命放射性核素的分离；选择性好，回收率高，可用于制备无载体的源； 设备简单，操作方便，易于连续化和自动化；可供选择的萃取剂多，对微量物质的分离合工业生产规模的分离均可使用等。</p>\n<p>缺  点</p>\n<p>有机物的毒性、易挥发性及易燃性等。</p>\n<p>4.3 溶剂萃取法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>萃取净化过程包括三个主要步骤：</p>\n<p>萃取、洗涤和反萃</p>\n<p>铀钚共去污-分离循环</p>\n<p>铀钚共萃取共去污</p>\n<p>（1A）</p>\n<p>铀钚分离</p>\n<p>（1B）</p>\n<p>铀的反萃</p>\n<p>（1C）</p>\n<p>4.1.1 萃取法基本概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>料    液</p>\n<p>1A槽（柱）</p>\n<p>溶剂相</p>\n<p>萃残液</p>\n<p>4.1.1 萃取法基本概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>萃取平衡是一种动态平衡，当条件发生变化时，原理的平衡被破坏，又会建立新的平衡。建立萃取平衡是需要较长时间的，因此，在实际应用上，只能设法接近于平衡，以便提高生产效率。</p>\n<p>萃取平衡</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Nernst分配定律</p>\n<p>当温度一定时，一种物质在两种互不相溶的溶剂中溶解达到平衡，该物质在这两种溶剂中的浓度之比为一常数。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Nernst分配定律</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>溶质在两相中以相同的化学形式存在，且浓度很低时，溶质在两项的分配比才服从分配定律。</p>\n<p>溶质</p>\n<p>有机相</p>\n<p>水相</p>\n<p>无化学反应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Nernst分配定律</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>溶质在两相中多种化学形式存在</p>\n<p>溶质</p>\n<p>有机相</p>\n<p>水相</p>\n<p>实际常有化学反应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的 →疏水的</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.1.1 萃取法基本概念</p>\n<p>分配系数 D</p>\n<p>某一物质M在不相溶的两相中达到分配平衡即在两相中的浓度不再变化时，它分别在两相中的表观浓度之比。</p>\n<p>如131I在水和CCl4中的分配。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>萃取方法</p>\n<p>利用各种不同物质在互不相溶的两种液体中具有各种不同的分配比例，选择特殊的有机试剂，将待分离的微量核素从原溶液中转移到另一种液体中，进而达到分离、提纯或浓缩等目的。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）萃取剂和稀释剂</p>\n<p>通常把有机相中能将处于水相中的欲萃取物质转移到有机相的有机试剂叫做萃取剂。</p>\n<p>为了改善萃取剂的某些物理性能而加入的有机溶剂叫稀释剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>溶剂</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2)反萃取剂</p>\n<p>能使被萃取物质从有机相返回到水相溶液的试剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>例：在铀浸出液-30%TBP(TBP+煤油)萃取铀，有机相用水清洗，洗出铀。TBP为萃取剂、煤油为稀释剂、水为反萃取剂</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）萃取率E</p>\n<p>经萃取而进入有机相的欲萃取物的量占其在两相中总量的百分数。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）萃取率E</p>\n<p>萃取率E与分配系数D萃的关系：</p>\n<p>R为相比，其值为有机相与水相的体积之比，即V有/V水。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>E与D的关系：</p>\n<p>4.3 溶剂萃取法</p>\n<div class=\"formula-line\">当R=1时，</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的         →疏水的</p>\n<p>4.3.2 萃取机理和萃取剂的种类</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2）萃取剂的种类</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>惰性萃取剂（CCl4 、CHCl3、 C6H14等），萃取剂与萃取物不发生化学反应，欲萃取物在两相之间按溶解度大小进行分配；</p>\n<p>中性含氧萃取剂（酮类、醚类、醇类等）具有一定极性的含氧有机化合物，在酸的作用下萃取剂先与水生成烊离子，再与欲萃取物发生离子缔合反应，也称盐萃取；</p>\n<p>4.3.2 萃取机理和条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中性含氧萃取剂形成烊盐的能力与其所含氧原子的配位能力有关，大致有如下的关系：</p>\n<p>醚＜醇＜酸＜酯＜酮＜醛。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)3PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>反应式：</p>\n<p>这类萃取剂的萃取能力取决于P=O键的极性，其大小顺序：</p>\n<p>＞               ＞                ＞</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>酸性磷类萃取剂</p>\n<p>这类萃取剂是指磷酸分子（HO)3PO中的一个或二个羟基被烷基酯化或取代所生成的化合物；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>胺类萃取剂</p>\n<p>氨分子NH3中三氢原子部分或全部为烷基取代后生成的伯、仲、叔胺以及季铵盐。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>能与水相中的金属阳离子结合成疏水的电中性环状螯合物而被萃取；</p>\n<p>这类萃取剂在萃取过程中生成具有螯合环的萃合物，即：螯合物。</p>\n<p>在螯合萃取剂中至少要有两个参加反应的官能团，其中一个为-OH或-SH基团，另一个为具有给电子性质的碱性官能团。金属置换-OH或-SH基团上的氢，并与碱性官能团配位，形成稳定的五元或六元环（从键角考虑，五元或六元环最稳定）。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>为了满足萃取剂亲有机相的基本要求，还必须在萃取剂分子中引入适当的取代基，并且在萃取剂分子中不应有亲水性基团。</p>\n<p>协同萃取剂 和冠状化合物类萃取剂</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>协同萃取剂，当萃取剂中含有两种或两种以上的萃取剂，使被萃取物的分配系数显著大于每一种萃取剂在相同条件下单独使用时的分配系数之和；TTA-TBP协同萃取水中的U(Ⅵ) →</p>\n<p>冠状化合物类萃取剂，主要包括冠醚和穴醚。</p>\n<p>冠醚是由三个以上[-CH2-O-CH2-]单元组成的单环聚醚；穴醚是在醚环上有两个氧原子被氮原子取代并联结起来的二环聚醚。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(I)对萃取剂的要求</p>\n<p>对欲萃取物的分配系数大，萃取容量大，选择性好，易于反萃取；</p>\n<p>萃取反应速度快；粘度小，与水的比重差别大，相分离和流动性能好，不易形成第三相或发生乳化；</p>\n<p>具有较高的化学稳定性和辐照稳定性；</p>\n<p>与水溶液的互溶性小；</p>\n<p>毒性低，沸点高，挥发性小；</p>\n<p>价格低廉，易于回收。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>影响萃取率的因素？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(II) 水相的选择</p>\n<p>水相组成的选择主要有以下方面：</p>\n<p>i)酸度和酸类，在保证萃取率足够高和不发生水解反应的前提下，应尽可能在较低酸度下进行萃取，水相中的酸类也会影响萃取剂的能力，在放射化学分离中，常用的是硝酸和盐酸体系。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>ii)掩蔽剂，加入一种适宜的掩蔽剂（通常是络合剂），使之与不希望被萃取的元素发生络合作用，对干扰物质进行掩蔽，以阻止它们进入有机相，从而提高欲萃取物的纯度。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>用TBP萃取含有杂质Zr离子的U(VI)时，加入EDTA，使之与Zr等杂质离子络合。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>iii)盐析剂，在萃取体中，如果加入一种易溶于水相的盐类，它既不被萃取，又不与欲萃取物发生反应，但可提高欲萃取物的萃取率，这种盐称为盐析剂。它能提高被萃取物的萃取率，是由于它具有水合作用和同离子效应；如萃取          ，用          。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>iv)欲萃取物的价态，欲萃取物的价态不同，其分配系数也就不同，因此，可借助于控制水相中各种物质的不同价态来实现分离。U(Ⅵ)， U(Ⅳ)。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>调节化学状态的方法</p>\n<p>向溶液中加入各种可能存在的价态的载体，然后用某种氧化-还原反应使价态变成一致</p>\n<p>加入一种价态的载体，然后进行一次氧化-还原反应循环，把各种可能的价态变成一种价态。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 75 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>进行一次萃取  萃取率E1为：</p>\n<div class=\"formula-line\">E1=[1-1/(D萃R+1)]×100%</div>\n<p>残留欲萃取物的百分数r1为：</p>\n<div class=\"formula-line\">r1=1- E1=[1/(D萃R＋1)]×100%</div>\n<p>进行x次萃取</p>\n<p>萃取率Ex,总为：</p>\n<div class=\"formula-line\">Ex,总=｛1-[1/(D萃R+1)]x｝×100%</div>\n<p>残留欲萃取物的百分数rx为：</p>\n<div class=\"formula-line\">rx= [1/(D萃R＋1)]x×100%</div>\n<p>(III) 萃取次数（相比固定）</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 76 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例题：</p>\n<div class=\"formula-line\">用HDEHP萃取放射性废水中的90Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求90Sr的总萃取率达到99.9%，试计算萃取次数？</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 77 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">用HDEHP萃取放射性废水中的90Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求90Sr的总萃取率达到99.9%，试计算萃取次数？</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>(III) 萃取次数（有机相用量固定）</p>\n<p>进行一次萃取  萃取率E1（/100%）为：</p>\n<p>进行x次萃取，萃取率Ex,总（/100%）为：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>(IV)洗涤次数</p>\n<p>洗涤液条件的选择原则是杂质的分配系数要小，欲萃取物的分配系数要大。洗涤次数的选择必须兼顾净化效果和回收率。</p>\n<p>(V) 反萃取剂的选择、萃取设备的选择</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>用于核燃料生产</p>\n<p>放射性核素分离</p>\n<p>环境和生物样品的放射化学分析</p>\n<p>4.3.3 溶剂萃取法的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>1）萃取的原理</p>\n<p>2）萃取机理</p>\n<p>3）影响萃取结果的因素有哪些？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Purex流程</p>\n<p>早期的Purex流程有共去污、分离以及净化三个循环，铀和钚都经过三次萃取和反萃</p>\n<p>料液：乏燃料经过冷却、去壳、切割和硝酸溶解后，将溶液的酸度调至浓度为2-3mol/L，加入适量的亚硝酸钠将Pu稳定在四价态，制成料液。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Purex流程</p>\n<p>第 一循环：共去污循环</p>\n<p>料液</p>\n<p>30%TBP-煤油</p>\n<p>Extraction</p>\n<p>U(VI)和Pu(IV)萃入有机相，与大部分裂变产物分离</p>\n<p>洗涤Scrubbing</p>\n<p>HNO3</p>\n<p>反萃Stripping</p>\n<p>dil HNO3</p>\n<p>U和Pu反萃至水相</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Purex流程</p>\n<p>第 二循环：铀钚分离循环</p>\n<p>第一循环反萃液</p>\n<p>调节酸度</p>\n<p>含Fe(NH2SO3)2的HNO3溶液</p>\n<p>30%TBP-kerosene</p>\n<p>Extraction</p>\n<p>U(VI)和Pu(IV)萃入有机相</p>\n<p>Scrubbing</p>\n<p>HNO3</p>\n<p>Stripping</p>\n<p>Pu(IV)还原为Pu(III)，从有机相反萃至水相（成为钚净化工序原料液）</p>\n<p>U(VI)保留于有机相</p>\n<p>HNO3</p>\n<p>铀净化工序原料液</p>\n<p>Stripping</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 89 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Purex流程</p>\n<p>第 三循环：净化循环</p>\n<p>钚净化工序</p>\n<p>第二循环钚料液</p>\n<p>加入NaNO2</p>\n<p>Pu3+氧化为Pu4+</p>\n<p>调节酸度</p>\n<p>30%TBP-kerosene</p>\n<p>Extraction</p>\n<p>Stripping</p>\n<p>dil HNO3</p>\n<p>钚产品</p>\n<p>铀净化工序</p>\n<p>第二循环铀料液</p>\n<p>浓缩</p>\n<p>调节酸度</p>\n<p>加入Fe(NH2SO3)2</p>\n<p>30%TBP-kerosene</p>\n<p>Extraction</p>\n<p>Stripping</p>\n<p>dil HNO3</p>\n<p>铀产品</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 90 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Purex流程</p>\n<p>经上述3个循环后，铀和钚对裂变产物的去污因子分别可达106和107~108；</p>\n<p>铀钚彼此间去污因子可达到105；</p>\n<p>铀和钚的回收率可达到99.9%</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 91 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 92 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Talspeak流程</p>\n<p>1964年</p>\n<p>二-（2-乙基己基）磷酸从Purex流程的废液中回收镅和锔</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 93 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Talspeak流程原理</p>\n<p>适当pH条件下，3价锕系与DTPA的阴离子形成稳定的水溶性络合物，而镧系形成的络合物稳定性差</p>\n<p>在HDEHP萃取时，锕系留在水相，镧系进入有机相，从而使二者分离</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 94 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Talspeak流程典型分离条件</p>\n<p>3价镧系可从镅到镄的三价锕系分离；</p>\n<p>铈和镅的分离因子为约130；</p>\n<p>分离因子最小的是钕和镧，约为10</p>\n<p>水相pH2.5到3.5的1mol/L乳酸和0.05mol/L DTPA五钠盐溶液</p>\n<p>有机相为0.2-0.5 mol/L HDEHP的二异丙苯溶液</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 95 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Amex流程</p>\n<p>从硫酸浸出液中萃取铀</p>\n<p>铀的开采</p>\n<p>浸出</p>\n<p>提铀</p>\n<p>核提纯</p>\n<p>矿石开采</p>\n<p>矿石浸出</p>\n<p>铀的提取</p>\n<p>铀的精制</p>\n<p>形态 | 矿石 | 矿浆 | 粉末 | 陶瓷等</p>\n<p>铀含量 | 0.1%~0.2% | - | 40%~70% | 75%</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 96 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>Amex流程</p>\n<p>美国一水冶厂用Alamine-336从硫酸浸出液中萃取铀流程</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 97 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>某含131I放射性样品制备好后50 h 测量，活度为8 Bq，则它的初始活度为           。已知131I的半衰期为8.04 d</p>\n<p>下列哪几种情况下同位素效应最明显</p>\n<div class=\"formula-line\">A 、K交换= 6.26；       B、 K交换=1.45 ；</div>\n<div class=\"formula-line\">C、 K交换=1.034；      D、K交换= 1.004。</div>\n<p>萃取率E与分配系数D萃的关系？</p>\n<p>知识问答</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 98 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 99 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（1）概述</p>\n<p>色谱法又叫色层法或层析法，色谱法是利用混合物中各组分在固定相和流动相中亲和力的差异使各组分在两相之间分配不同来实现彼此分离的。</p>\n<p>所有色谱系统都包括两个相，即固定相和流动相。</p>\n<p>4.3 色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 100 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3 色谱法</p>\n<p>色谱法的分类</p>\n<p>流动相物态</p>\n<p>分离过程机理</p>\n<p>固定相使用方式</p>\n<p>动力学过程</p>\n<p>气相、液相色谱</p>\n<p>吸附色谱法、离子交换色谱法、萃取色谱法和凝胶色谱</p>\n<p>柱色谱法、纸色谱法和薄层色谱法</p>\n<p>前沿法、淋洗法和顶替色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 101 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>柱色法</p>\n<p>1）吸附柱色谱法</p>\n<p>可分为：液-固和气-固两种。</p>\n<p>基本原理：吸附柱色谱法是利用溶液在通过装有吸附剂的柱子时，各组分因吸附能力的不同，在吸附剂上滞留程度不同，从而实现各组分的分离。</p>\n<p>用于做吸附剂分为有机吸附剂和无机吸附剂。的有硅胶、氧化铝、活性炭和分子筛（沸石，具有网状晶体结构的硅酸铝盐）等。</p>\n<p>使用前要经过预处理。</p>\n<p>4.3.1 柱色法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 102 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>装柱：分干法和湿法两种。</p>\n<p>分离操作：在进行分离操作过程时，流速控制在1ml/min左右。</p>\n<p>4.3.1 柱色法</p>\n<p>预处理</p>\n<p>水浸泡→一定浓度的酸浸泡→水清洗→一定浓度的碱浸泡→水清洗等。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 103 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.3.1 柱色法</p>\n<p>柱色谱法分离过程示意图</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 104 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换柱色谱法</p>\n<p>基本原理：是利用固体物质中的可交换离子与溶液中的不同离子之间能发生交换反应来进行分离的一种方法。</p>\n<p>具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 105 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>从阳离子Mn+与氢型阳离子交换树脂RH之间可发生下列反应：</p>\n<p>4.3.1 柱色法</p>\n<p>平衡常数K可近似表示：</p>\n<p>、      表示Mn+在离子交换剂和溶液中的平衡浓度；</p>\n<p>、     表示H+在离子交换剂和溶液中的平衡浓度。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 106 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>选择系数，也称为浓度平衡常数</p>\n<p>表示在一定条件下，离子交换剂对Mn+、 H+的选择能力的大小。</p>\n<p>4.3.1 柱色法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 107 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>影响离子交换亲和力的因素很多，主要是离子的电荷数Z和离子的水化离子半径r水。</p>\n<p>电荷数越大，水化离子半径越小，则亲和力越大。</p>\n<p>4.3.1 柱色法</p>\n<p>交换亲和力影响因素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 108 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换剂的选择和预处理；</p>\n<p>装柱与转型，</p>\n<p>阳离子可转成：H+、NH4+、Na+和Ca2+等，</p>\n<p>阴离子可转成：OH-、NO3-、Cl-和SO42-；</p>\n<p>分离操作：有吸附、洗涤、淋洗及树脂再生</p>\n<p>4.3.1 柱色法</p>\n<p>基本操作</p>\n<p>分类代号•骨架代号•顺序号•连接符号•交联度数值</p>\n<p>大孔型代号•分类代号•骨架代号•顺序号</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 109 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>完成一个离子交换过程需要经过五个步骤：</p>\n<p>（1）外部溶液中的可交换离子穿过树脂颗粒表面的液膜，到达树脂表面，这个过程称为：膜扩散。</p>\n<p>（2）可交换离子在树脂颗粒内部扩散，到达树脂交换基团附近的交换位置，这个过程称为：内扩散。</p>\n<p>（3）可交换离子与树脂交换基团的反离子发生离子交换反应，可交换离子与树脂官能团结合，反离子则脱离树脂官能团。</p>\n<p>4.3.1 柱色法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 110 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（4）反离子在树脂颗粒内部扩散，到达树脂表面，这也是内扩散过程。</p>\n<p>（5）反离子穿过树脂颗粒表面的液膜，进入外部溶液，这也是膜扩散过程。</p>\n<p>4.3.1 柱色法</p>\n<p>离子交换过程示意图</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 111 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>交联度：是指树脂中所含交联剂的质量百分数。</p>\n<p>交联剂：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂性能</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 112 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 113 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>树脂的单位量用1 mL表示，则称为：体积理论交换容量。</p>\n<p>树脂的单位量用1 g表示，则称为：质量理论交换容量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 114 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2）工作交换容量</p>\n<p>工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。</p>\n<p>工作交换容量分类：穿透交换容量、饱和交换容量和再生交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 115 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）穿透交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度达到规定的穿透浓度时，树脂所达到的交换容量。</p>\n<p>穿透交换容量不仅与具体的操作条件和离子交换反应速度有关，而且与穿透浓度的规定值有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 116 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4）饱和交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度与流入液中的浓度相等时，树脂所达到的交换容量。饱和交换容量是动力学意义上的工作交换容量，它与具体的操作条件和离子交换反应速度有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 117 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>5）再生交换容量</p>\n<p>在指定的再生剂（或解吸剂）用量相同条件下测定的树脂交换容量。再生交换容量与再生剂的用量有关，在实际使用时，从经济原因考虑一般不要求树脂达到完全再生（或解吸），所以树脂的再生交换容量一般小于新树脂的饱和交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 118 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换树脂的交换容量用单位量树脂所吸附离子的量表示。</p>\n<p>质量单位表示：mmol/g干树脂；</p>\n<p>体积单位表示：mmol/mL湿树脂。</p>\n<p>工厂从操作和计量方便考虑，经常采用mg/g干树脂(简化为mg/g)或mg/mL湿树脂(简化为mg/mL)表示。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 119 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020/4/13</p>\n<p>离子交换树脂的溶胀</p>\n<p>由于离子交换树脂是由亲油性的大分子骨架和亲水性的交换基团组成的，干燥的离子交换树脂接触水或有机溶剂时，在树脂结构的不同部分会分别发生溶剂化作用，都会引起树脂体积的膨胀（溶胀）。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 120 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020/4/13</p>\n<p>离子交换树脂的粒度</p>\n<p>树脂粒度对其工作的交换容量、离子交换速度等有很大的影响。</p>\n<p>树脂粒度的大小用筛孔目数或树脂颗粒的直径（mm）表示。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 122 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>加入交联剂</p>\n<p>二乙烯苯，生成苯乙烯-二乙烯苯共聚体或丙烯酸及其衍生物-二乙烯苯共聚体，形成立体交联结构的树脂骨架。</p>\n<p>通过化学反应，在树脂的共聚体骨架上引入交换基团以后，就成为离子交换树脂。</p>\n<p>交联剂加入量越多，立体交叉网络的交联程度越大，网络交织得越紧密。</p>\n<p>4.3.1 柱色法</p>\n<p>离子交换树脂结构</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 123 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020/4/13</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n<p>离子交换树脂</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>特种离子交换树脂</p>\n<p>强酸型阳离子交换树脂（R-SO3H型）</p>\n<p>弱酸型阳离子交换树脂（R-COOH型）</p>\n<p>强碱性阴离子交换树脂（R-CH2NR3Cl型）</p>\n<p>弱碱性阴离子交换树脂（R-CH2NH3OH型）</p>\n<p>特殊交换性能的树脂（螯合型、两性和氧化还原性树脂）</p>\n<p>特殊结构性能的树脂（大孔等）</p>\n<p>混合型阳离子交换树脂</p>\n<p>低酸及碱性条件下使用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 124 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子交换树脂按照官能团的电荷性质分为：</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>离子交换树脂按照树脂交换基团在水中的电离常数分为：</p>\n<p>强酸性和弱酸性、强碱性和弱碱性。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 125 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>阳离子交换树脂</p>\n<p>阳离子交换树脂的官能团带负电荷，反离子为带正电荷的氢离子或金属阳离子，可以与外部溶液中的阳离子进行交换反应；</p>\n<p>阴离子交换树脂</p>\n<p>阴离子交换树脂的官能团带正电荷，反离子为带负电荷的阴  离子（氢氧根离子或其它酸根离子），可以与外部溶液中的阴离子进行交换反应。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 126 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>用阳离子交换树脂吸附铀</p>\n<div class=\"formula-line\">2RH + UO22+ = R2UO2 + 2H+</div>\n<p>用阴离子交换树脂吸附铀</p>\n<div class=\"formula-line\">(2n－2) R4NX + UO2(SO4)n 2－2n = (R4N)2n－2 UO2(SO4) n + (2n－2)X－</div>\n<p>式中：X－ 是树脂交换基团的反离子，例如：Cl－ 或NO3－；</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 127 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">(n－1)(R4N) 2SO4 + UO2SO4 = (R4N) 2n－2 UO2(SO4)n</div>\n<div class=\"formula-line\">(n－1)(R4N) 2SO4 + UO2(SO4)n2－2n =</div>\n<p>(R4N) 2n－2 UO2(SO4)n + (n－1) SO42－</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 128 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>树脂上硫酸铀酰配合物的解吸</p>\n<div class=\"formula-line\">R4UO2(SO4)3 + 4X－ = 4RX + nUO2SO4 +</div>\n<p>(1－n)UO22+ + (3－n)SO42－</p>\n<div class=\"formula-line\">R2UO2(SO4)2 + 2X－ = 2RX + mUO2SO4 +</div>\n<p>(1－m)UO22+ + (2－n)SO4 2－</p>\n<p>式中：X－ 为Cl－ 或NO3－，n和m为与解吸条件有关的常数。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 129 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.2 离子交换柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 130 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（1）离子交换树脂必须不溶于水，也不会因为被水溶剂化而分解。</p>\n<p>（2）离子交换树脂的高聚物骨架上应有足够数量的交换基团。在树脂被水溶剂化的条件下，交换基团能电离，生成能自由移动的反离子。</p>\n<p>（3）在溶剂化的条件下，树脂内部应当有足够的空间，反离子与外部溶液中相同电荷的离子可以不受阻碍地自由扩散，进行交换。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 131 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（4）离子交换树脂必须具有化学稳定性。离子交换树脂应当不溶于无机酸、碱、盐的水溶液，也不溶于各种有机溶剂。</p>\n<p>（5）离子交换树脂必须具有物理稳定性。离子交换树脂应当有足够的机械强度和使用寿命，能够耐热和耐辐照。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 132 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.3 其他柱色谱法</p>\n<p>离子交换分离方法</p>\n<p>离子交换</p>\n<p>树脂的预处理</p>\n<p>装柱和转型</p>\n<p>分离</p>\n<p>筛分（粒度选择）、溶胀、酸碱浸泡洗涤</p>\n<p>吸附</p>\n<p>洗涤</p>\n<p>淋洗(洗脱或解吸)</p>\n<p>预处理方法洗涤</p>\n<p>树脂的再生</p>\n<p>关键</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 133 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>萃取柱色谱法</p>\n<p>萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。</p>\n<p>正相萃取柱色谱法中水溶液被吸附在吸附剂上作为固定相，有机萃取剂为流动相。</p>\n<p>反相萃取柱色谱法是使有机萃取剂吸附在吸附剂上作为固定相，水溶液为流动。</p>\n<p>4.2.3 其他柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 134 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.3 其他柱色谱法</p>\n<p>萃取柱色谱法基本原理</p>\n<p>利用不同物质在固定相（萃取剂）和流动相之间萃取分配系数的不同来达到彼此分离的。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 135 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4）凝胶渗透柱色谱法</p>\n<p>关键是凝胶。</p>\n<p>5）高效液相色谱法</p>\n<p>又称高压液相色谱法，是以液体为流动相，固态或液态物质为固定相的色谱方法。</p>\n<p>4.2.3 其他柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 136 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.2.3 其他柱色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 137 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>用色谱纸或以萃取剂、液体离子交换剂吸附在色谱纸上作固定相，用有机溶剂或水溶液作流动相来分离不同物质的一种色谱分离方法。</p>\n<p>各组分在色谱纸上移动的情况可用比移值Rf来表示：</p>\n<p>4.3 纸色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 138 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（4）薄层色谱法</p>\n<p>将固定相均匀地涂覆在一块玻璃板或塑料板上，开成薄层，将试样滴在它的一端，用适宜的展开剂作流动相，借助毛细作用流经薄层，使不同组分随流动相展开，从而得到分离目的的一种方法。</p>\n<p>4.4 薄层色谱法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 139 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>“不使用外加电压时放射性物质的电化学析出法”（称电化学置换法）</p>\n<p>“使用外加电压时放射性物质的电化学沉积法”（称电解沉积法）</p>\n<p>4.5  电化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 140 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 电化学置换法</p>\n<p>4.5  电化学分离方法</p>\n<p>电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 141 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 电化学置换法基本原理</p>\n<p>4.5  电化学分离方法</p>\n<p>基于每种金属元素都有一定的标准电极电势值（   ），在溶液中电极电势值（E）大的金属离子，可以将浸在溶液中其电极电势值（E）较小的金属原子置换下来，而自身沉积于金属的表面。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 142 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例如：欲分离母－子体核素210Bi－210Po，可将铜片（电极材料）插入含有上述母－子体核素的溶液中，由于铜的标准电极电势大于铋而小于钋，导致Po在铜表面析出，或称Po自镀在铜片上。而铋仍留在溶液中。</p>\n<p>4.5  电化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 143 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（1）降低溶液中作为电极材料的金属的离子浓度，使金属电极的实际电极电势（E）值小于欲分离核素离子的电极电势（E）值。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 144 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑵用氢电极法来改变电极电势。此法是用标准电极电势值大的铂金属作电极，浸入含有欲分离放射性核素的溶液中，然后将纯氢气通入溶液，铂金属就会吸附氢，并被氢所饱和，成为氢电极。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 145 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2 电解沉积法</p>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>基本原理：微量放射性核素各有不同的临界沉积电压--即电解时的分解电压，选择适宜的外加电压，使其等于或大于某一核素离子的临界沉积电压（分解电压，即开始电解时所需的外加最低电压），则该种核素离子可在阴极上析出。</p>\n<p>4.5  电化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 146 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2 电解沉积法</p>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 147 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>基本原理：微量放射性核素各有不同的临界沉积电压--即电解时的分解电压，选择适宜的外加电压，使其等于或大于某一核素离子的临界沉积电压（分解电压，即开始电解时所需的外加最低电压），则该种核素离子可在阴极上析出。</p>\n<p>4.5  电化学分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 148 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>蒸馏法</p>\n<p>相同温度不同蒸气压</p>\n<p>同位素交换法</p>\n<p>例：重水的制备</p>\n<p>快化学分离法</p>\n<p>1.核化学研究；2.核衰变研究；3.活化分析</p>\n<p>膜分离技术</p>\n<p>利用固态合成高分子膜建立电渗析、扩散渗析、超过滤、微孔过滤和反渗透</p>\n<p>4.6  其它分离方法</p>\n<p>其他分离方法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 149 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>本章总结</p>\n<p>微量放射性物质的分离 |  |  |  | </p>\n<p> | 沉淀法 | 萃取法 | 色谱法 | 电化学法</p>\n<p>基本原理 |  |  |  | </p>\n<p>条件 |  |  |  | </p>\n<p>分离效率指标 |  |  |  | </p>\n<p>优缺点 |  |  |  |</p>\n</div></div>"

        "html": "<div class=\"chapter-header\">\n<h2>第六章 天然放射性元素化学</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 天然放射性系</span><span class=\"exam-topic-tag\">★ 天然放射性元素</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>天然放射性元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程内容</p>\n<p>1</p>\n<p>放射性核素概况</p>\n<p>2</p>\n<p>铀化学</p>\n<p>4</p>\n<p>镭、氡的化学</p>\n<p>5</p>\n<p>镤、锕、钫、砹的化学</p>\n<p>6</p>\n<p>氚和放射性碳的化学</p>\n<p>3</p>\n<p>钍化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程要求</p>\n<p>1</p>\n<p>掌握天然放射性核素化合物的性质</p>\n<p>2</p>\n<p>了解放射性核素/元素的来源</p>\n<p>3</p>\n<p>熟悉其应用与测定</p>\n<p>2020/4/13</p>\n<p>17:33:47</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>凡具有放射性的核素称为放射性核素。</p>\n<p>6.1 放射性核素概况</p>\n<p>放射性核素</p>\n<p>放射性元素</p>\n<p>全部由放射性核素核素所组成的元素称为放射性元素。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020/4/13</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.1 放射性核素概况</p>\n<p>放射性元素</p>\n<p>（ 84号元素(Po)到118号元素以及43Tc和61Pm共30个）</p>\n<p>自然界中存在的放射性元素</p>\n<p>84Po、85At、86Rn、87Fr、88Ra、89Ac 、90Th、91Pa和92U等9个元素。</p>\n<p>人工放射性元素</p>\n<p>通过人工核反应生成的放射元素</p>\n<p>U以后的93号元素Np至118号元素以及43Tc和61Pm等。</p>\n<p>天然放射性元素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>自然界还存在一些不属于天然放射系而半衰期很长的放射性核素：40K、87Rb；</p>\n<p>由天然核反应生成的放射性核素：3H、14C等。</p>\n<p>6.1 放射性核素概况</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>自然界中存三个天然放射系</p>\n<p>人工放射系</p>\n<p>6.1 放射性核素概况</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>自然界中存三个天然放射系</p>\n<p>（4n+2铀系）</p>\n<p>母体：238U，</p>\n<div class=\"formula-line\">T1/2：4.468×109 a；</div>\n<p>6.1 放射性核素概况</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>自然界中存三个天然放射系</p>\n<p>母体：235U</p>\n<p>锕系（4n+3）</p>\n<div class=\"formula-line\">T1/2：7.038×108 a ；</div>\n<p>6.1 放射性核素概
