堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>(n,α)、(n,p)反应所需中子的能量较高，在热中子反应堆中，反应的截面都很小，仅少数几种轻元素（<sup>6</sup>Li、<sup>14</sup>N、<sup>32</sup>S、<sup>35</sup>Cl）可发生这类反应。由于这两种反应的产核与靶核分属不同的元素，故可用化学分离方法制得无载体的放射性核素。</p>\n<p><sup>32</sup>S(n,p)<sup>32</sup>P；      <sup>6</sup>Li(n,α)<sup>3</sup>H 。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>(n,f)反应。裂变反应可产生大量的裂变产物，是放射性核素的重要来源之一，如<sup>233</sup>U、<sup>235</sup>U、 <sup>239</sup>Pu的裂变反应，所生成的放射性核素达500种以上。</p>\n<p>(n,γ)反应。生产放射性核素具有产额高成本低等优点而被广泛采用。产核和靶核是同位素而难以用化学方法分离，因而产品的比活度受到限制。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>目前全球有445座商用核动力反应堆在31个国家运行，总装机容量达  <sup>387</sup>GW，另有64座在建。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>将金属钴丝或钴片、钴棒装不锈钢壳内，氩弧焊接密封；</p>\n<p>放入反应堆中照射， <sup>59</sup>Co(n,γ) <sup>60</sup>Co反应制得<sup>60</sup>Co。</p>\n<p>9.2  放射性核素的制备</p>\n<p>生产放射性<sup>60</sup>Co</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>粒子加速器（带电粒子加速器）</p>\n<p>用人工方法获得快速带电粒子束的大型实验装置，是研究原子核物理和核化学、认识物质深层次结构的重要工具。正、负电子，质子，轻、重离子</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>加速器：回旋加速器、静电加速器、高压加速器、直线加速器等。</p>\n<p>用回旋加速器由于能量适中，流量足够而被常用，可加速p，d，α，<sup>15</sup>N和<sup>18</sup>O等粒子，加速的粒子轰击靶可引起(p,n)、(p,α)、(d,n)、(d,2n)、(d,α)、(α,n)、(α,2n)等核反应。</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>粒子加速器发展历程</p>\n<p>1924~1928  建成直线加速器</p>\n<p>1932  回旋加速器</p>\n<p>1932  建造世界上第一台高压倍加器<sup>7</sup>Li(p，α)<sup>4</sup>He</p>\n<p>1933  静电加速器</p>\n<p>1945  自动稳相原理（同步回旋加速器、同步加速器）</p>\n<p>1952   强聚焦同步加速器</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>加速器分类</p>\n<p>按加速粒子的种类不同：电子加速器，质子和重离子加速器，微物质粒子（粉末、灰尘等）加速器</p>\n<p>按加速粒子能量：低能加速器（100 MeV以下），中能加速器（100 MeV~1 GeV），高能加速器（1~100 GeV），超高能加速器（ 100 GeV以上 ）</p>\n<p>按束流强度：强流加速器（1 mA以上）、中流加速器（10 μm~1 mA），弱流加速器（10 μm以下）等</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>加速器基本构成</p>\n<p>粒子源</p>\n<p>注入分析运输系统</p>\n<p>真空加速室</p>\n<p>分析系统</p>\n<p>束流导引与聚焦系统</p>\n<p>高真空设备</p>\n<p>束流检测诊断设备</p>\n<p>供电与稳定控制设备</p>\n<p>操作台控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>加速器生产放射性核素特点</p>\n<p>核反应的产核和靶核一般是不同的元素，因此可用化学法分离，从而获得放射性纯度和比活度都很高的放射性核素；</p>\n<p>可生产反应堆不能生产的缺中子放射性核素，其衰变多为EC或发射正电子，用于医疗诊断；</p>\n<p>由于(n,γ)反应截面低，反应堆无法生产碳、氮、氧等轻元素，即使能生产，其半衰期不是太长（<sup>14</sup>C：5730a），就是太短（<sup>19</sup>O：26.9s），不适合于医用。而加速器能方便产生<sup>11</sup>C、<sup>13</sup>N等核素。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>与反应堆相比,加速器的投资少，运行和管理方便，但生量低，成本高，制靶过程复杂，一般在下列情况用于弥补反应堆的不足：</p>\n<p>当用反应堆不能产生出比活度高的放射性核；</p>\n<p>当反应堆不能产生出符合使用要求的某种放射性核素；</p>\n<p>当远离反应堆的地方需要短半衰期放射性核素；</p>\n<p>当对某种核素需要量少，加速生产较方便。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>(1)制靶</p>\n<p>在紫铜靶基上用电镀法镀锌（天然锌），厚度为30~70mg/cm2；</p>\n<p>(2)轰靶</p>\n<p>用回旋加速器产生的<sup>26</sup>MeV、流强为50μA的质子流轰靶，<sup>68</sup>Zn(p,2n) <sup>67</sup>Ga;</p>\n<p>(3)化学分离</p>\n<p>照射后，取出，放在铅罐内冷却3d，降低<sup>66</sup>Ga的活度，然后进行化学分离得<sup>67</sup>Ga。</p>\n<p>9.2  放射性核素的制备</p>\n<p>生产<sup>67</sup>Ga</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>反应堆乏燃料是提取放射性核素的重要原料。这些放射性核素都集中在后处理厂的高放废液和废气中。</p>\n<p>裂片元素；超铀元素。</p>\n<p>一个10<sup>00</sup>MW的核电站产生：</p>\n<p>乏燃料：30t/a；      Pu：0.27t/a；</p>\n<p>U： 28.6t/a；          裂变产物：1.13t/a。</p>\n<p>9.2  放射性核素的制备</p>\n<p>从乏燃料后处理中提取放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>核废料原件中的长寿命高放废物</p>\n<p><sup>1</sup>GWe PWR核反应堆年卸料33吨</p>\n<p>9.2  放射性核素的制备</p>\n<p>核素 | 半衰期/a | 质量/kg | 核素 | 半衰期/a | 质量/kg</p>\n<p>Pu<sup>-238</sup> | 88 | 4.5 | Se<sup>-79</sup> | 65000 | 0.2</p>\n<p>Pu<sup>-239</sup> | 24000 | 166 | Tc<sup>-99</sup> | 210000 | 25</p>\n<p>Pu<sup>-240</sup> | 6600 | 77 | I<sup>129</sup> | 15700000 | 6</p>\n<p>Pu<sup>-241</sup> | 15 | 25 | Cs<sup>-135</sup> | 2300000 | 10</p>\n<p>Pu<sup>-242</sup> | 387000 | 16 | Cs<sup>-137</sup> | 30 | 31</p>\n<p>Np<sup>-237</sup> | 2120000 | 15 | Zr<sup>-93</sup> | 950000 | 23</p>\n<p>Am<sup>-241</sup> | 433 | 17 | Pd<sup>-107</sup> | 6500000 | 7</p>\n<p>Am<sup>-243</sup> | 7950 | 3 | Sr<sup>-90</sup> | 29 | 13</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>⑴放射性核素发生器，是一种可以定期从放射性母体核素中分离出放射性子体核素的装置，其母体核素的半衰期较长，子体核素半衰期较短，母体与子体易达到平衡；(99Mo<sup>-9</sup>9mTc，66h，6h)</p>\n<p>⑵用放射性同位素中子源照射来获得微量的放射性核素；</p>\n<p>⑶用热核中子闪曝合成超铀元素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>制备放射性核素的其他方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>放射性同位素在工业中有着广泛的应用，它已应用于化工、冶金、石油等领域。</p>\n<p>化工：放射性同位素可用作辐射加工、示踪剂；</p>\n<p>冶金：研究非金属杂质的来源、金属凝固过程等及活化分析一些金属含量；</p>\n<p>石油；中子测井技术等；</p>\n<p>利用放射性同位素还可制成各种检测和控制仪表。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n<p>放射性同位素在工业中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>测量中子与样品中待测核素发生核反应所产生的放射性核素来测定该核素含量的一种方法。</p>\n<p>常用的有热中子活化分析（以反应堆为中子源，利用(n,γ)反应对核素进行活化）</p>\n<p>快中子活化分析(以同位素中子源、中子发生器和加速器为活化源，利用(n,p)、(n,α)、(n,2n)等核反应进行活化)。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>中子活化分析</p>\n</div>", "同位素稀释法": "<div class=\"th\"><div class=\"th-top\"><h2>同位素稀释法</h2><span class=\"tt\" style=\"background:#4361ee\">填空/计算</span><span class=\"tcb\">24页</span></div><div class=\"src\">来源：第九章 放射性核素的制备</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>放射性核素的制备及放射性分析技术</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>加速器基本构成</p>\n<p>粒子源</p>\n<p>注入分析运输系统</p>\n<p>真空加速室</p>\n<p>分析系统</p>\n<p>束流导引与聚焦系统</p>\n<p>高真空设备</p>\n<p>束流检测诊断设备</p>\n<p>供电与稳定控制设备</p>\n<p>操作台控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n<p>放射免疫技术</p>\n<p>放射免疫分析法(RIA)</p>\n<p>放射免疫显像(RII)</p>\n<p>放射免疫治疗(RIT)</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>⑴放射免疫分析法</p>\n<p>将免疫反应与放射性核素示踪技术相结合的一种体外测定方法。</p>\n<p>原    理</p>\n<p>利用放射性核素标记的抗原(*Ag)和试样中的非标记抗原(Ag)在与特异抗体(Ab)结合成抗原-抗体复合物(*Ag- Ab和Ag- Ab)的过程中，两者发生竞争性反应：</p>\n<p>9.4 放射性核素在医学、生物学中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>放射性同位素在工业中有着广泛的应用，它已应用于化工、冶金、石油等领域。</p>\n<p>化工：放射性同位素可用作辐射加工、示踪剂；</p>\n<p>冶金：研究非金属杂质的来源、金属凝固过程等及活化分析一些金属含量；</p>\n<p>石油；中子测井技术等；</p>\n<p>利用放射性同位素还可制成各种检测和控制仪表。</p>\n<p>9.5 放射性核素在其它领域中的应用</p>\n<p>放射性同位素在工业中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>同位素稀释分析法是将待测元素与放射性同位素示踪剂充分混合，然后分离出一部分纯净待测样品，测其比活度，由比活度的变化来算出待测元素的含量。</p>\n<p>这种方法常用来测定不易分离的组份的含量。</p>\n<p>有正稀释法、反稀释法及亚化学计量稀释法。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>同位素稀释法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>也称直接稀释法。它是将一种比活度和质量已知的放射性核素或其标记化合物作为标准物加到含该放射性核素的稳定同位素或其化合物的待测物中，混合均匀后分离提出其中的一部分，然后测其比活度。</p>\n<p>mx=m<sub>0</sub>(s0/sd<sup>-1</sup>)</p>\n<p>M<sub>0</sub>、mx分别为引入的标准物和待测物的质量；</p>\n<p>s0、sd分别为标准物和稀释后化合物的比活度。</p>\n<p>当mx ＞＞M0时，</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>正稀释法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>将一种质量为M0的稳定同位素加到含有其放射性同位素（比活度为s0 ）的待测样品之中，混合均匀后分离提纯一部分化合物，再测其比活度sd，并由此计算出待测样品中原有的放射性同位素的质量mx：</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>反稀释法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>例  用反稀释法稀释含<sup>137</sup>Cs的待测样品，已知<sup>137</sup>Cs的T<sub>1/2</sub>为30.17a，K值为1.32×10<sup>16</sup>，将质量为10mg铯稳定同位素加到待测样品中，混合均匀后分离提纯一部分混合物，测其比活度sd=1.19×10<sup>9</sup>   Bq/mg，则待测样品中的<sup>137</sup>Cs的质量为多少mg？</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>反应式：A+B→AB</p>\n<p>式中：A为被分离或分析的对象，</p>\n<p>B是为了分离或分析而加入的试剂。</p>\n<p>当B试剂相对于A来说化学计量不足时（A  》B），即为亚化学计量。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>亚化学计量稀释法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 59 页</div>\n<p>该方法做为定量分析方法,要满足条件：</p>\n<p>①分离试剂必须定量地消耗在所测定的元素上；</p>\n<p>②必须采用某种分离方法使被测元素的已经反应部分与尚未反应部分分离开来。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>对于放射分析来说，亚化学计量稀释法即用少于化学计算量的两份相等的分离试剂，分别从放射性标准物溶液和从经过同位素稀释后样品溶液中分离出质量相等的化合物，这样它们的比活度之比A0/Ad就等于其活度之比S0/Sd，则正稀法中的表达式就可改为：</p>\n<p>同位素稀释法的最大优点是不需定量分离被测物，这可避免在分离提纯过程中由于化合物的回收率低而造成的误差。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>例题：用亚化学计量进行测定时，已知引入标准物的质量为30.0mg，从放射性标准溶液中和从经同位素稀释后的样品中分离提纯的化合物的放射性计数分别为1200和60cpm，求待测物的质量为多少？</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>解：m<sub>0</sub>=30.0mg,</p>\n<p>mx=m<sub>0</sub> (A<sub>0</sub>/Ad<sup>-1</sup> )=30.0(1200/60-1)=570.0mg</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>经过核反应，把原来没有放射性或放射性不易被测量的样品中的被测核素变成具有特征放射性的产物，然后可以通过测定其射线能量和半衰期进行定性鉴定，通过测定射线强度作定量分析。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>活化分析法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>分两步</p>\n<p>活化：将含待测核素的样品经n，p，d，α或γ等粒子或射线的照射，发生核反应，使其转化为适宜于射线测量的放射性核素；</p>\n<p>分析：常采用相对法来测定样品中微量核素的含量，即将标准样品和待测样品在相同条件下进行照射，化学处理和放射性测量，然后按下式进行计算：</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>测量中子与样品中待测核素发生核反应所产生的放射性核素来测定该核素含量的一种方法。</p>\n<p>常用的有热中子活化分析（以反应堆为中子源，利用(n,γ)反应对核素进行活化）</p>\n<p>快中子活化分析(以同位素中子源、中子发生器和加速器为活化源，利用(n,p)、(n,α)、(n,2n)等核反应进行活化)。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>中子活化分析</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>活化分析已成功地应用于生命科学。用于测量微量元素等。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>带电粒子活化分析</p>\n<p>测量带电粒子与样品中待测核素发生核反应所产生的放射性核素来测定元素含量的一种方法。</p>\n<p>活化分析的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>例  活化分析中，含微量氯的物质在</p>\n<p>10<sup>12</sup>中子/(cm2·s)通量密度下辐照5 h，辐照结束5h后，测得<sup>38</sup>Cl的活度为2.33×10<sup>4</sup>Bq，则LiCl中氯含量为多少g？已知其核反应式为：                            ，<sup>38</sup>Cl的半衰期T<sub>1/2</sub>为37.2min，<sup>37</sup>Cl的丰度H为24.23%，氯的平均分子量    为35.453，阿佛加德罗常数L=6.02×10<sup>23</sup>/ mol , ln2=0.693，反应截面为0.43b，1 b=10-24 cm2。</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>解：已知φ=10<sup>12</sup>中子/（cm2·s），σ=0.43b，辐照时间t=5h，冷却时间t`=5h，阿佛加德罗常数L=6.02×10<sup>23</sup>/ mol，丰度H=24.23%，半衰期T<sub>1/2</sub>=37.2min，     =35.453。</p>\n<p>求氯的质量m</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>m=3.55×10-3g</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>9.6 放射分析技术及其应用</p>\n<p>例：某环境样品在中子注量率为1×10<sup>13</sup> cm<sup>-2</sup>•s<sup>-1</sup>，辐照24h，测得<sup>238</sup>Np的活度为1.<sup>2</sup>Bq，该环境样品中<sup>237</sup>Np质量为多少g? <sup>238</sup>Np的半衰期为2.117d，H=1，L=6.02×10<sup>23</sup>/mol，<sup>237</sup>Np的反应截面为169b ，1b=10-24cm2</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>9.6 放射分析技术及其应用</p>\n<p>m=1.0×10-12g</p>\n<p>例：某环境样品在中子注量率为1×10<sup>13</sup> cm<sup>-2</sup>•s<sup>-1</sup>，辐照24h，测得<sup>238</sup>Np的活度为1.<sup>2</sup>Bq，该环境样品中<sup>237</sup>Np质量为多少g?</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 71 页</div>\n<p>波长色散和能量色散两种方式。</p>\n<p>能量色散X射线荧光分析法是利用一定能量的粒子使样品中待测元素的原子激发，并发出特征X射线荧光，然后根据不同元素发出特征X射线的能量不同，且元素的含量与X射线强度在一定条件下成正比的原理，通过X射线谱仪测量其能谱和强度，可确定待测元素的种类和含量。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>X射线荧光分析法</p>\n</div>"}, "fH": "<div class=\"ss\"><h3>必背公式</h3>\n<div class=\"fg\"><div class=\"fg-title\">放射性衰变</div>\n<div class=\"fi\"><div class=\"fn\">衰变定律</div><div class=\"math\">`N = N_0 e^{-\\lambda t}`</div></div>\n<div class=\"fi\"><div class=\"fn\">衰变定律(另一形式)</div><div class=\"math\">`N = N_0 \\left(\\frac{1}{2}\\right)^{t/T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">时间计算</div><div class=\"math\">`t = \\frac{1}{\\lambda} \\ln \\frac{N_0}{N}`</div></div>\n<div class=\"fi\"><div class=\"fn\">衰变常数</div><div class=\"math\">`\\lambda = \\frac{\\ln 2}{T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">半衰期</div><div class=\"math\">`T_{1/2} = \\frac{\\ln 2}{\\lambda}`</div></div>\n<div class=\"fi\"><div class=\"fn\">活度定义</div><div class=\"math\">`A = \\lambda N = -\\frac{dN}{dt}`</div></div>\n<div class=\"fi\"><div class=\"fn\">初始活度</div><div class=\"math\">`A_0 = \\lambda N_0`</div></div>\n<div class=\"fi\"><div class=\"fn\">活度衰变</div><div class=\"math\">`A = A_0 e^{-\\lambda t}`</div></div>\n<div class=\"fi\"><div class=\"fn\">长期平衡</div><div class=\"math\">`\\lambda_1 N_1 = \\lambda_2 N_2`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">放射性单位</div>\n<div class=\"fi\"><div class=\"fn\">比活度</div><div class=\"math\">`S = \\frac{A}{m}`</div></div>\n<div class=\"fi\"><div class=\"fn\">比活度与核素参数</div><div class=\"math\">`S = \\frac{N_A \\ln 2}{M \\cdot T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">居里->贝克换算</div><div class=\"math\">`1\\;\\text{Ci} = 3.7 \\times 10^{10}\\;\\text{Bq}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">吸附</div>\n<div class=\"fi\"><div class=\"fn\">吸附率</div><div class=\"math\">`R = \\frac{C_0 - C}{C_0} \\times 100\\%`</div></div>\n<div class=\"fi\"><div class=\"fn\">吸附量</div><div class=\"math\">`q = \\frac{V(C_0 - C)}{m}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分配系数</div><div class=\"math\">`K_d = \\frac{\\text{固相浓度}}{\\text{液相浓度}}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">溶剂萃取</div>\n<div class=\"fi\"><div class=\"fn\">分配比</div><div class=\"math\">`D = \\frac{C_{\\text{有}}}{C_{\\text{水}}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分离系数</div><div class=\"math\">`\\alpha = \\frac{D_A}{D_B}`</div></div>\n<div class=\"fi\"><div class=\"fn\">萃取率(一次)</div><div class=\"math\">`E = \\frac{D}{D + V_{\\text{水}}/V_{\\text{有}}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">萃取率(多次)</div><div class=\"math\">`E_n = 1 - \\left(\\frac{1}{D+1}\\right)^n`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">电化学</div>\n<div class=\"fi\"><div class=\"fn\">能斯特方程</div><div class=\"math\">`E = E^0 + \\frac{RT}{nF} \\ln \\frac{a_{\\text{ox}}}{a_{\\text{red}}}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">共沉淀</div>\n<div class=\"fi\"><div class=\"fn\">同晶定义</div><div class=\"math\">`\\text{类质同晶：晶体结构相同，化学组成类似}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分配系数</div><div class=\"math\">`D = \\frac{[A]_{\\text{晶}}}{[A]_{\\text{液}}} / \\frac{[B]_{\\text{晶}}}{[B]_{\\text{液}}}`</div></div>\n</div>\n</div>", "typeSe  src=\"slides/9.第九章 放射性核素的制备_slide043.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 53 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide053.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 54 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide054.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 55 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide055.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 56 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide056.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 57 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide057.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 58 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide058.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 59 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide059.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 60 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide060.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 61 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide061.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 62 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide062.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 63 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide063.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 64 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide064.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 65 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide065.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 66 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide066.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 67 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide067.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 68 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide068.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 70 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide070.png\" loading=\"lazy\" class=\"si\"></div>\n<div class=\"siw\"><span class=\"sil\">第 71 页</span><img src=\"slides/9.第九章 放射性核素的制备_slide071.png\" loading=\"lazy\" class=\"si\"></div>\n</div>"}, "tH": "<div class=\"ss\"><h3>名词解释（按考点分类）</h3>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">学科特点</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">核燃料循环</span><span class=\"ti-ref\">第16页</span><span class=\"ti-def\">核燃料循环是核燃料进入反应堆前的制备和在反应堆中反应及处理的过程，包括有矿冶、铀转化、铀浓缩、燃料元件制造、燃料元件的堆内燃烧释放能量、乏燃料的贮存和后处理。开式核燃料循环闭式核燃料循环</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性(radioactivity)</span><span class=\"ti-ref\">第29页</span><span class=\"ti-def\">她在发现了钋和镭元素后才将这一现象称为放射性(radioactivity)。放射化学的产生</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">衰变公式与半衰期</span><span class=\"tg-badge\" style=\"background:#e63946\">计算</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性浓度c</span><span class=\"ti-ref\">第17页</span><span class=\"ti-def\">放射性浓度c是指单位体积某放射性活度。cA=A/V单位：Bq/mL 或Bq/L。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">β射线</span><span class=\"ti-ref\">第55页</span><span class=\"ti-def\">β射线是快速电子流，其质量小，速度快。在电离能量损失率小，穿透力强，在核库伦场中能产生韧致辐射，易被核和电子散射而形成多次散射，它在物质中的路程十分弯曲，呈锯齿形。韧致辐射：高能量电子在原子核电厂内慢化时放出一种连续的X射线。      强度正比于吸收物原子序数及电子能量。外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">同位素效应与交换</span><span class=\"tg-badge\" style=\"background:#06d6a0\">选择/填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性气溶胶</span><span class=\"ti-ref\">第59页</span><span class=\"ti-def\">放射性气溶胶是放射性核素以极小微粒（1～100 nm）形式分散在空气中而形成的，它是放射性核素在气相中一种非常重要的存在形式。放射性气溶胶</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">共沉淀与同晶</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空/选择</span></div>\n<div class=\"ti\"><span class=\"ti-term\">共沉淀法</span><span class=\"ti-ref\">第26页</span><span class=\"ti-def\">共沉淀法是利用微量物质随常量物质一起生成沉淀现象来进行分离、浓集和纯化微量物质的一种方法。早期研究共沉淀规律的有哈恩、赫洛宾等，其中亨德森和克雷克西提出了一个公式。影响共沉淀的因素有：温度、液相组成、固相组成及溶剂等。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">萃取平衡</span><span class=\"ti-ref\">第46页</span><span class=\"ti-def\">萃取平衡是一种动态平衡，当条件发生变化时，原理的平衡被破坏，又会建立新的平衡。建立萃取平衡是需要较长时间的，因此，在实际应用上，只能设法接近于平衡，以便提高生产效率。萃取平衡</span></div>\n<div class=\"ti\"><span class=\"ti-term\">中性磷类萃取剂，</span><span class=\"ti-ref\">第62页</span><span class=\"ti-def\">中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)<sup>3</sup>PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</span></div>\n<div class=\"ti\"><span class=\"ti-term\">冠醚</span><span class=\"ti-ref\">第68页</span><span class=\"ti-def\">冠醚是由三个以上[-CH2-O-CH2-]单元组成的单环聚醚；穴醚是在醚环上有两个氧原子被氮原子取代并联结起来的二环聚醚。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">洗涤液条件的选择原则</span><span class=\"ti-ref\">第79页</span><span class=\"ti-def\">洗涤液条件的选择原则是杂质的分配系数要小，欲萃取物的分配系数要大。洗涤次数的选择必须兼顾净化效果和回收率。(V) 反萃取剂的选择、萃取设备的选择</span></div>\n<div class=\"ti\"><span class=\"ti-term\">离子交换剂</span><span class=\"ti-ref\">第104页</span><span class=\"ti-def\">具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">交联度</span><span class=\"ti-ref\">第111页</span><span class=\"ti-def\">交联度：是指树脂中所含交联剂的质量百分数。交联剂：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">理论交换容量</span><span class=\"ti-ref\">第112页</span><span class=\"ti-def\">理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">体积理论交换容量</span><span class=\"ti-ref\">第113页</span><span class=\"ti-def\">树脂的单位量用1 mL表示，则称为：体积理论交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">质量理论交换容量</span><span class=\"ti-ref\">第113页</span><span class=\"ti-def\">树脂的单位量用1 g表示，则称为：质量理论交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">工作交换容量</span><span class=\"ti-ref\">第114页</span><span class=\"ti-def\">工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。工作交换容量分类：穿透交换容量、饱和交换容量和再生交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">分配色谱法</span><span class=\"ti-ref\">第133页</span><span class=\"ti-def\">萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。正相萃取柱色谱法中水溶液被吸附在吸附剂上作为固定相，有机萃取剂为流动相。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">电化学置换法</span><span class=\"ti-ref\">第140页</span><span class=\"ti-def\">电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">天然放射性系</span><span class=\"tg-badge\" style=\"background:#06d6a0\">选择/填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性元素</span><span class=\"ti-ref\">第4页</span><span class=\"ti-def\">全部由放射性核素核素所组成的元素称为放射性元素。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">UF6</span><span class=\"ti-ref\">第55页</span><span class=\"ti-def\">UF6是一种白晶体，易升华，常压下其升华点为56.5℃，此特性被用于气体扩散法富集天然铀中的<sup>235</sup>U，UF6是极毒气体，有强烈腐蚀性，对金属腐蚀性强，对诸如聚四氟乙烯等有机没有腐蚀。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">最重要的</span><span class=\"ti-ref\">第109页</span><span class=\"ti-def\">最重要的是<sup>226</sup>Ra，它是自然界中丰度最高的一种同位素， <sup>226</sup>Ra的比活度很高；习惯上说的镭是<sup>226</sup>Ra。氡的核素</span></div>\n<div class=\"ti\"><span class=\"ti-term\">卤化物：PaCl4</span><span class=\"ti-ref\">第161页</span><span class=\"ti-def\">卤化物：PaCl4是挥发性化合物，PaF4•nH2O易溶于水。在溶液中，Pa可以十4和+5两种价态存在。Pa<sub>4</sub>+在稀盐酸和高氯酸介质中以Pa4+的水合离子存在，在其他酸中则形成络离子。Pa<sub>4</sub>+与TTA、乙酰丙酮可形成溶于有机溶剂的鳌合物。Pa<sub>4</sub>+可形成一系列难溶化合物，PaF4•H2O、磷</span></div>\n<div class=\"ti\"><span class=\"ti-term\">大多数砹的核素</span><span class=\"ti-ref\">第174页</span><span class=\"ti-def\">大多数砹的核素是用不同能量的α粒子轰击铋靶或针靶得到的。<sup>209</sup>Bi(α，2n)<sup>211</sup>At核反应，其半衰期为9.2 h，具有α衰变性质（40%）和K电子俘获性质（60%）。这是砹的同位素中半衰期最长的核素之一，另一个半衰期最长的核素是<sup>210</sup>At，半衰期是8.3h。砹有-1、0、+1、+5和+7价。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">锕系元素与核反应</span><span class=\"tg-badge\" style=\"background:#f77f00\">问答/计算</span></div>\n<div class=\"ti\"><span class=\"ti-term\">NpO2</span><span class=\"ti-ref\">第60页</span><span class=\"ti-def\">NpO2是最稳定的氧化物，是镎工厂的半成品，由煅烧所制得的NpO2在大多数酸中很难溶解，只在氧化剂（如溴酸钾）存在下才被溶解。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">钚同铀和镎一样</span><span class=\"ti-ref\">第80页</span><span class=\"ti-def\">钚同铀和镎一样，是活泼金属。在空气中易被氧化，其氧化速度与空气的相对湿度有关，相对湿度越大，氧化速度越快。粉末状的钚在空气中能自燃，而生成PuO2。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">PuO2</span><span class=\"ti-ref\">第83页</span><span class=\"ti-def\">PuO2是十分难溶的物质，在下列溶剂可以溶解它200℃的85~100%H3PO4、10mol/LHNO3-0.05mol/LHF溶液、 5mol/LHF溶液；也常用熔融技术来溶解PuO2，熔剂有NaHSO4、KHSO4、NH4HF2。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">核素制备方法</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空/问答</span></div>\n<div class=\"ti\"><span class=\"ti-term\">反应堆</span><span class=\"ti-ref\">第14页</span><span class=\"ti-def\">反应堆是一种强大的中子源，其中子通量一般为10<sup>10</sup>~10<sup>13</sup>cm<sup>-2</sup>·s<sup>-1</sup>，可通过反应堆的(n,α)、(n,p)、(n,f)及(n,γ)反应和次级核反应来生产放射性核素。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">反应堆乏燃料</span><span class=\"ti-ref\">第28页</span><span class=\"ti-def\">反应堆乏燃料是提取放射性核素的重要原料。这些放射性核素都集中在后处理厂的高放废液和废气中。裂片元素；超铀元素。一个10<sup>00</sup>MW的核电站产生：</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性药物</span><span class=\"ti-ref\">第40页</span><span class=\"ti-def\">放射性药物是指在医学上使用的含有放射性核素的化合物或生物物质的统称。根据其临床应用的目的不同可分为两类：⑴治疗用放射性药物；⑵诊断用放射性药物。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">自放射显影技术</span><span class=\"ti-ref\">第48页</span><span class=\"ti-def\">自放射显影技术是从本上个世纪20年代初开始发展起来的一种测定放射性示踪核素的方法，它利用放射性物质产生的射线使核乳胶感光，根据其感光的部位及强度来记录、检查和测量样品中放射性物质。我国科学家钱三强、何泽慧等人就是利用核乳胶技术发现了重原子核的三分裂与四分裂现象。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">同位素稀释分析法</span><span class=\"ti-ref\">第53页</span><span class=\"ti-def\">同位素稀释分析法是将待测元素与放射性同位素示踪剂充分混合，然后分离出一部分纯净待测样品，测其比活度，由比活度的变化来算出待测元素的含量。这种方法常用来测定不易分离的组份的含量。有正稀释法、反稀释法及亚化学计量稀释法。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">也称直接稀释法。它</span><span class=\"ti-ref\">第54页</span><span class=\"ti-def\">也称直接稀释法。它是将一种比活度和质量已知的放射性核素或其标记化合物作为标准物加到含该放射性核素的稳定同位素或其化合物的待测物中，混合均匀后分离提出其中的一部分，然后测其比活度。mx=m<sub>0</sub>(s0/sd<sup>-1</sup>)M<sub>0</sub>、mx分别为引入的标准物和待测物的质量；</span></div>\n<div class=\"ti\"><span class=\"ti-term\">同位素稀释法的最大优点</span><span class=\"ti-ref\">第60页</span><span class=\"ti-def\">同位素稀释法的最大优点是不需定量分离被测物，这可避免在分离提纯过程中由于化合物的回收率低而造成的误差。</span></div>\n</div>\n</div>"}};
const TC = {"学科特点": "填空", "衰变公式与半衰期": "计算", "放射性的单位与比活度": "计算", "衰变类型(α/β/γ)": "选择", "放射性平衡": "选择/填空", "同位素效应与交换": "选择/填空", "放射性胶体": "填空/选择", "吸附作用": "填空/计算", "共沉淀与同晶": "填空/选择", "电化学(能斯特方程)": "计算/选择", "载体与反载体": "问答", "溶剂萃取": "问答/填空", "离子交换分离": "问答/填空", "天然放射性系": "选择/填空", "锕系元素与核反应": "问答/计算", "镭氡计算": "计算", "核素制备方法": "填空/问答", "同位素稀释法": "填空/计算"};
let C = null;

function back(){document.getElementById('sel').classList.add('act');document.getElementById('rev').classList.remove('act');document.title='复习系统';}

function enter(id){
  C=D[id];
  document.getElementById('sel').classList.remove('act');
  document.getElementById('rev').classList.add('act');
  document.getElementById('st').textContent=C.name;
  document.getElementById('se').textContent=C.nameEn;
  document.getElementById('sb').textContent=C.examDateLabel;
  ud(); rs(); rm();
  setTimeout(function(){document.querySelectorAll('.math').forEach(function(el){try{katex.render(el.textContent.slice(1,-1),el,{displayMode:false})}catch(e){}})},100);
  nav('overview');
}

function rs(){
  var s=document.getElementById('sidebar');
  var h='<div class="st">概览</div><a class="it act" data-t="overview" onclick="nav(\'overview\')">考试概览</a>';
  h+='<div class="st">考点复习</div>';
  C.examTopics.forEach(function(t,i){
    var tp=TC[t.topic]||'';
    var col={'填空':'#4361ee','选择':'#06d6a0','计算':'#e63946','问答':'#f77f00','填空/选择':'#4361ee','选择/填空':'#06d6a0','填空/计算':'#4361ee','计算/选择':'#e63946','问答/填空':'#f77f00','问答/计算':'#f77f00','填空/问答':'#4361ee'}[tp]||'#888';
    h+='<a class="it tp" data-t="topic-'+i+'" onclick="nav(\'topic-'+i+'\')">'+t.topic+(tp?'<span class="tag" style="background:'+col+'">'+tp+'</span>':'')+'</a>';
  });
  h+='<div class="st">题型专项</div><a class="it" data-t="type-填空" onclick="nav(\'type-填空\')">填空题</a><a class="it" data-t="type-选择" onclick="nav(\'type-选择\')">选择题</a><a class="it" data-t="type-名词" onclick="nav(\'type-名词\')">名词解释</a><a class="it" data-t="type-问答" onclick="nav(\'type-问答\')">问答题</a><a class="it" data-t="type-计算" onclick="nav(\'type-计算\')">计算题</a>';
  h+='<div class="st">专题</div><a class="it" data-t="formulas" onclick="nav(\'formulas\')">公式</a><a class="it" data-t="terms" onclick="nav(\'terms\')">名词解释</a>';
  s.innerHTML=h;
}

function rm(){
  var m=document.getElementById('main');
  var h='<div id="s-overview" class="bl act">'+C.ovHTML+'</div>';
  C.examTopics.forEach(function(t,i){h+='<div id="s-topic-'+i+'" class="bl">'+(C.tpH[t.topic]||'')+'</div>';});
  h+='<div id="s-type-填空" class="bl">'+C.typeSections['填空题专项']+'</div>';
  h+='<div id="s-type-选择" class="bl">'+C.typeSections['选择题专项']+'</div>';
  h+='<div id="s-type-名词" class="bl">'+C.typeSections['名词解释专项']+'</div>';
  h+='<div id="s-type-问答" class="bl">'+C.typeSections['问答题专项']+'</div>';
  h+='<div id="s-type-计算" class="bl">'+C.typeSections['计算题专项']+'</div>';
  h+='<div id="s-formulas" class="bl">'+C.fH+'</div>';
  h+='<div id="s-terms" class="bl">'+C.tH+'</div>';
  m.innerHTML=h;
}

function nav(t){
  document.querySelectorAll('.sb .it').forEach(function(e){e.classList.remove('act');});
  var si=document.querySelector('.sb .it[data-t="'+t+'"]');if(si)si.classList.add('act');
  document.querySelectorAll('.ma .bl').forEach(function(e){e.classList.remove('act');});
  var sec=document.getElementById('s-'+t);if(sec){sec.classList.add('act');sec.scrollIntoView({behavior:'smooth',block:'start'});}
}

function ts(){document.getElementById('sidebar').classList.toggle('ms');document.getElementById('so').classList.toggle('s');}

function td(){document.body.classList.toggle('dark-mode');var b=document.getElementById('dtBtn');b.textContent=document.body.classList.contains('dark-mode')?'☀️':'🌙';localStorage.setItem('rd',document.body.classList.contains('dark-mode')?'1':'0');}
if(localStorage.getItem('rd')==='1'){document.body.classList.add('dark-mode');document.getElementById('dtBtn').textContent='☀️';}

function ud(){var e=document.getElementById('sc');if(!e||!C)return;var d=new Date(C.examDate).getTime()-Date.now();if(d<=0){e.textContent='考试已开始';return;}e.textContent=Math.floor(d/86400000)+'天'+Math.floor((d%86400000)/3600000)+'小时';}
setInterval(ud,60000);
window.addEventListener('scroll',function(){var b=document.getElementById('progressBar');if(!b)return;var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight;if(d>0)b.style.width=(s/d*100)+'%';});
(function(){var c=document.getElementById('cards');var h='';for(var[id,sub]of Object.entries(D)){h+='<div class="scd" onclick="enter(\''+id+'\')"><h3>'+sub.name+'</h3><div style="font-size:.78em;color:var(--text2)">'+sub.nameEn+'</div><div style="margin-top:4px;font-size:.75em;color:var(--text2)">'+sub.examTopics.length+' 考点</div></div>';}c.innerHTML=h;var k=Object.keys(D);if(k.length===1)enter(k[0]);})();
</script>

(function(){var b=document.getElementById("stb");window.addEventListener("scroll",function(){b.style.display=window.scrollY>300?"flex":"none"})})();
