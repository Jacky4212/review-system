<style>

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:52px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
#progressBar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));z-index:9999;width:0%;transition:width .08s}
.top{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);height:48px;padding:0 14px;display:flex;align-items:center;gap:8px}

.top button:hover{background:var(--plight)}

.top .ti .en{font-weight:400;color:var(--text2);font-size:.73em;margin-left:5px}
.top .bd{background:var(--accent);color:#fff;padding:2px 12px;border-radius:12px;font-size:.65em;font-weight:500}
.top .cd{font-size:.65em;color:var(--text2)}
.lo{display:flex;max-width:1440px;margin:0 auto;min-height:calc(100vh - 48px)}
.sb{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto;padding:6px 0}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb .st{padding:5px 14px 3px;font-size:.62em;color:var(--text2);font-weight:600;letter-spacing:.04em}
.sb .it{display:block;padding:5px 14px 5px 16px;color:var(--text);text-decoration:none;font-size:.78em;border-left:3px solid transparent;cursor:pointer;transition:all .1s;line-height:1.4}
.sb .it:hover{background:var(--plight);color:var(--primary)}
.sb .it.act{background:var(--plight);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.sb .tp{padding-left:20px;font-size:.76em}
.sb .tag{display:inline-block;font-size:.55em;padding:0 6px;border-radius:6px;color:#fff;margin-left:3px;font-weight:500;line-height:1.6}
.ma{flex:1;padding:20px 32px 60px;min-width:0}
.bl{display:none;animation:f .2s}
.bl.act{display:block}

.ob{background:linear-gradient(135deg,#3a56d4,#764ba2);color:#fff;border-radius:var(--radius);padding:24px 28px;margin-bottom:20px}

.oi .sc{font-size:1.3em;font-weight:700}

.ti{padding:8px 16px;border-bottom:1px solid #f0f0f0;background:var(--surface)}

.sil{display:block;font-size:.7em;color:var(--text2);padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--border);font-weight:600}
.si{width:100%;height:auto;display:block}

#stb{display:none;position:fixed;bottom:24px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.2em;cursor:pointer;box-shadow:0 3px 10px rgba(58,86,212,.3);z-index:50;align-items:center;justify-content:center;transition:opacity .2s}

@media print{.top,.sb,#progressBar,.so,.mb,#stb{display:none!important}.lo{display:block}.ma{padding:0}.bl{display:block!important;page-break-after:always}.ob{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

const D = {"radiochemistry": {"name": "放射化学", "nameEn": "Radiochemistry", "examDate": "2026-06-18T18:30:00+08:00", "examDateLabel": "2026年6月18日", "chapters": [{"id": "ch1", "file": "1.第一章 绪论 (2026)-1(2).txt", "title": "第一章 绪论"}, {"id": "ch2", "file": "2.第二章 放射性(2026)-1.txt", "title": "第二章 放射性"}, {"id": "ch3", "file": "3.第三章 放射性核素的物理化学.txt", "title": "第三章 放射性核素的物理化学"}, {"id": "ch4", "file": "4.第四章 物质的分离.txt", "title": "第四章 物质的分离"}, {"id": "ch5", "file": "6. 天然核素-1.txt", "title": "第六章 天然放射性元素化学"}, {"id": "ch6", "file": "7. 第七章 锕系理论(2).txt", "title": "第七章 锕系理论"}, {"id": "ch7", "file": "8.第八章(2).txt", "title": "第八章 裂片元素及活化产物化学"}, {"id": "ch8", "file": "9.第九章 放射性核素的制备.txt", "title": "第九章 放射性核素的制备"}], "examTopics": [{"topic": "学科特点", "ch": "ch1", "kw": ["特点", "放射化学", "学科", "研究", "内容"]}, {"topic": "衰变公式与半衰期", "ch": "ch2", "kw": ["衰变", "公式", "半衰期", "N=", "N0", "λ", "指数", "衰变常数"]}, {"topic": "放射性的单位与比活度", "ch": "ch2", "kw": ["贝克", "居里", "比活度", "Bq", "Ci", "活度"]}, {"topic": "衰变类型(α/β/γ)", "ch": "ch2", "kw": ["衰变", "α", "β", "γ", "alpha", "beta", "gamma", "粒子", "射线", "电子流"]}, {"topic": "放射性平衡", "ch": "ch2", "kw": ["平衡", "久期平衡", "长期平衡", "子体", "母体"]}, {"topic": "同位素效应与交换", "ch": "ch3", "kw": ["同位素效应", "同位素交换", "平衡常数"]}, {"topic": "放射性胶体", "ch": "ch3", "kw": ["胶体", "真胶体", "假胶体", "分散体系"]}, {"topic": "吸附作用", "ch": "ch3", "kw": ["吸附", "吸附剂", "吸附率", "吸附系数"]}, {"topic": "共沉淀与同晶", "ch": "ch4", "kw": ["共沉淀", "同晶", "同二晶", "结晶", "混晶"]}, {"topic": "电化学(能斯特方程)", "ch": "ch4", "kw": ["能斯特", "电化学", "置换", "电沉积", "电极"]}, {"topic": "载体与反载体", "ch": "ch4", "kw": ["载体", "反载体", "Carrier", "放射性核素纯度"]}, {"topic": "溶剂萃取", "ch": "ch4", "kw": ["萃取", "萃取率", "萃取剂", "盐析剂", "掩蔽剂"]}, {"topic": "离子交换分离", "ch": "ch4", "kw": ["离子交换", "稀释液", "分离", "交换"]}, {"topic": "天然放射性系", "ch": "ch5", "kw": ["天然放射", "放射系", "铀系", "钍系", "母体"]}, {"topic": "锕系元素与核反应", "ch": "ch6", "kw": ["锕系", "核反应", "反应式", "铀钚", "钍铀", "转化", "锕", "铀", "钚", "钍", "核反应式"]}, {"topic": "镭氡计算", "ch": "ch6", "kw": ["镭", "氡", "计算"]}, {"topic": "核素制备方法", "ch": "ch8", "kw": ["制备", "反应堆", "加速器", "同位素", "中子"]}, {"topic": "同位素稀释法", "ch": "ch8", "kw": ["稀释法", "同位素稀释", "分析"]}], "ovHTML": "<div class=\"ob\"><h2>放射化学 考试概览</h2><div class=\"date\">2026年6月18日</div><div class=\"og\">\n<div class=\"oi\"><div class=\"nm\">填空题</div><div class=\"sc\">16分</div><div class=\"dt\">8题×2分</div></div>\n<div class=\"oi\"><div class=\"nm\">选择题</div><div class=\"sc\">14分</div><div class=\"dt\">7题含多选</div></div>\n<div class=\"oi\"><div class=\"nm\">名词解释</div><div class=\"sc\">16分</div><div class=\"dt\">4个×4分</div></div>\n<div class=\"oi\"><div class=\"nm\">问答题</div><div class=\"sc\">24分</div><div class=\"dt\">4个×6分</div></div>\n<div class=\"oi\"><div class=\"nm\">计算题</div><div class=\"sc\">30分</div><div class=\"dt\">3题×10分</div></div>\n</div></div>\n<div class=\"tc\"><h3>重点知识</h3><ul>\n<li>考试题型与分值：</li>\n<li>填空题：8 道题共 16 分，一题 2 分，一空分值不定。</li>\n<li>选择题：7 道题共 14 分，有单选和多选，选对部分答案可得分。</li>\n<li>名词解释：4 个共 16 分，每个 4 分。</li>\n<li>问答题：4 个共 24 分，每个 6 分。</li>\n<li>计算题：3 道题共 30 分，一道题 10 分，答案保留小数点后两位。</li>\n<li>学科特点：放射化学有 4 个特点，常考填空题。</li>\n<li>公式概念：牢记衰变公式、半衰期与衰变常数关系、贝克和居里定义、比活度计算、平衡公式等。</li>\n<li>衰变类型：了解阿尔法、贝塔、伽马衰变本质。</li>\n<li>胶体判定：掌握分散体系相关概念，会判断放射性真、假胶体。</li>\n<li>吸附相关：了解吸附剂、吸附类型，会计算吸附率和吸附系数。</li>\n<li>共沉淀：区分结晶共沉淀和吸附共沉淀，记住同二晶特殊例子。</li>\n<li>电化学：能斯特方程，理解电化学置换法和电沉积法原理。</li>\n<li>载体相关：区分载体、反载体等，简答题会分析萃取、吸附和沉淀作用。</li>\n<li>萃取：记萃取率公式，了解萃取剂和沉淀剂选择标准，区分盐析剂、掩蔽剂。</li>\n<li>离子交换：理解离子交换相关概念，解释稀释液性能，记住分离三阶段。</li>\n<li>天然放射性：识别天然放射性元素，记住天然放射性系母体及关键元素，了解来源。</li>\n<li>核反应式：会写铀钚、钍铀转化等核反应式，掌握镭氡计算。</li>\n<li>核素制备：记住核素产生方式、反应特点，会写同位素制备方法。</li>\n<li>分析方法：记住同位素稀释法等分析方法，了解活化分析步骤。</li>\n</ul></div>\n<div class=\"tc\"><h3>注意事项</h3><ul>\n<li>本次课堂围绕放射化学考试展开，介绍题型分值、重点知识及考试注意事项。</li>\n<li>考试注意事项：6 月 18 日晚九十节考试，带 2B 铅笔、计算器，计算题掌握公式，别依赖原题。</li>\n</ul></div>", "tpH": {"学科特点": "<div class=\"th\"><div class=\"th-top\"><h2>学科特点</h2><span class=\"tt\" style=\"background:#4361ee\">填空</span><span class=\"tcb\">46页</span></div><div class=\"src\">来源：第一章 绪论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>Radiochemistry is the branch of chemistry</p>\n<p>dealing with radioactive phenomena.</p>\n<p>(From Webster’s New World Dictionary, Third College Edition, p1108)</p>\n<p>1910年由卡麦隆（Cameron）提出，</p>\n<p>是近代化学的一个分支学科，</p>\n<p>是研究有关放射性现象的一门科学。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>放射化学指研究放射性物质及其辐射效应的一门化学分支学科（二级学科）</p>\n<p>有关原子核反应、放射性核素和放射性物质的化学及其应用研究的一门科学。</p>\n<p>放射性核素和核转变产物的行为和化学性质</p>\n<p>它们的制备、分离、纯化及鉴定的方法</p>\n<p>放射性核素在化学和其他某些方面的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>确定放射化学的基本概念和研究内容；</p>\n<p>掌握放射化学的特点；</p>\n<p>了解放射化学的发展简史和在我国的概况。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>放射化学的产生</p>\n<p>1895年末德国物理学家伦琴用Crookes管研究高压放电现象时注意到, 当用阴极电子束流轰击玻璃管壁时, 产生了荧光以及X射线。</p>\n<p>W. Roentgen</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>放射性规律的一系列研究和探索</p>\n<p>1912 年 赫维西等利用同位素之间的化学性质相同，难以分开的特点。以铅-210为示踪剂，成功地测定了铬酸铅的溶解度。</p>\n<p>创立了放射性示踪法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>中国放射化学发展史</p>\n<p>1932年秋建立国立北平研究院镭学研究所</p>\n<p>——我国最早的放射化学研究机构</p>\n<p>镤化学；</p>\n<p>测定铀镭系与铀锕系的分支比；</p>\n<p>测定温泉水中氡的浓度以寻找铀矿；</p>\n<p>铀盐中UX的分离；</p>\n<p>测定放射源中β-射线的吸收系数,并发现了背散射效应；</p>\n<p>1948年国立北平研究院成立了原子学研究所</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>1950年</p>\n<p>中国科学院近代物理研究所</p>\n<p>镭学研究所</p>\n<p>原子学研究所</p>\n<p>中国科学院原子能研究所（1958）</p>\n<p>1955年起，清华、北大等先后设立放射化学或放射化工专业。</p>\n<p>1958年到60年代初，又成立了两个新的原子能研究基地：上海原子核研究所，兰州近代物理研究所。</p>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>中国放射化学发展史</p>\n<p>1956年，从国外引进研究用的重水堆和回旋加速器。</p>\n<p>反应堆于1958年运行后生产出33种放射性核素。</p>\n<p>1959年，我国召开了全国第一次和平利用原子能会议。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>1.2 放射化学主要研究内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>放射化学内容</p>\n<p>基础放射化学</p>\n<p>放射性元素化学</p>\n<p>核化学</p>\n<p>应用放射化学</p>\n<p>放射分析化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>放射化学内容</p>\n<p>低浓度时放射性物质的物理化学行为和状态；</p>\n<p>吸附、共沉淀、胶体</p>\n<p>研究放射性物质的分离、纯化方法及其原理。</p>\n<p>共沉淀法、溶剂萃取法、离子交换法、色谱法等。</p>\n<p>1.基础放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>天然放射元素化学</p>\n<p>研究天然放射性元素(U、Th、Ra、Po)的化学性质，以及有关它们的提炼精制的化学工艺，重点是铀和钍；</p>\n<p>人工放射元素化学</p>\n<p>主要研究人工放射性元素的化学性质和核性质, 以及它们的分离、纯化和精制的化学过程, 重点是钚等超铀元素和主要的裂片元素。</p>\n<p>放射化学内容</p>\n<p>2.放射性元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>放射化学内容</p>\n<p>3.核化学</p>\n<p>用各种能量的轻重粒子引发核反应, 实现原子核的转变；</p>\n<p>分离、纯化、鉴定核反应的产物，并由此探讨其反应机理。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>放射化学内容</p>\n<p>核反应</p>\n<p>原子核与基本粒子或其他原子核相互作用时发生的变化过程。（p84）</p>\n<p>放射性衰变是自发性的</p>\n<p>核反应式</p>\n<p>起始核或靶核</p>\n<p>最终产物</p>\n<p>出射粒子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 59 页</div>\n<p>放射化学内容</p>\n<p>核反应通式</p>\n<p>（1）化学反应涉及可称量的物质的变化，而核反应涉及的是单个原子；</p>\n<p>（2）化学反应元素保持不变，只是原子间的化学间发生了变化。</p>\n<p>（3）化学反应放出的能量通常远低于核反应放出的，在核反应中有显著的物质转变为能量。</p>\n<p>与化学反应区别</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>放射化学内容</p>\n<p>4.放射分析化学</p>\n<p>研究放射性物质的分离分析方法以及核技术在分析中的应用。</p>\n<p>突出成功的分析方法是中子活化分析；</p>\n<p>带电粒子激发X荧光分析及其微区扫描；</p>\n<p>同位素稀释法；</p>\n<p>加速器质谱分析等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>放射化学内容</p>\n<p>5. 应用放射化学</p>\n<p>合成用于诊断各种疾病的新药物，诸如心肌显像药物、脑显像药物；</p>\n<p>为核医学对各种脏器多种疾病的诊断和治疗, 以及为研究人体的体内动态生理活动提供药物。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>放射性+化学</p>\n<p>1. 核化工&amp;放射化学</p>\n<p>(3) 放射性元素化学</p>\n<p>研究天然和人工放射性元素及其化合物的化学性质、制备方法。</p>\n<p>(1) 基础放射化学</p>\n<p>研究放射性物质的物理化学的规律，低浓度行为和状态及分离原理。</p>\n<p>(2) 核化学</p>\n<p>研究各种原子核转变过程所引起的化学变化及生成的产物。</p>\n<p>(4) 放射分析化学</p>\n<p>研究放射性核素及其制剂的分析、测量和纯度鉴定方法。</p>\n<p>(5) 应用放射化学</p>\n<p>研究放射性核素在工业、农业、国防、医学等各个领域中的应用。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>1.3 放射化学特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>1.放射性  放射化学最根本的特点</p>\n<p>优点：使研究方法的灵敏度大大提高；通过对放射性的原子跟踪，可对整个化学过程及其每个阶段进行研究和观察。</p>\n<p>弊端：射线可能对工作人员产生辐射损伤；放射性物质还会对所研究的体系产生一系列的物理化学效应—辐射化学效应。</p>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>1.3 放射化学的特点</p>\n<p>2.不稳定性     发生衰变</p>\n<p>化学位移规律</p>\n<p>α衰变</p>\n<p>β衰变（β-衰变、β+衰变电子俘获EC）</p>\n<p>γ衰变以及发射转换电子或俄歇电子</p>\n<p>自发裂变</p>\n<p>质子裂变</p>\n<p>发射过重量粒子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>1.3 放射化学的特点</p>\n<p>原子结构</p>\n<p>质量数=核内质子+中子</p>\n<p>质子数=原子序数</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>1.3 放射化学的特点</p>\n<p>具有相同的质子数Z、相同的中子数N、处于相同的能态且寿命可测的一类原子称为核素。</p>\n<p>核子数</p>\n<p>(质量数）</p>\n<p>原子序数</p>\n<p>若不是表示核反应式中的核素时，可省略</p>\n<p>中子数，可省略</p>\n<p>表示能态</p>\n<p>元素符号</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>1.3 放射化学的特点</p>\n<p>同位素</p>\n<p>具有相同的原子序数但质量数不同的原子</p>\n<p>具有同一原子序数的某化学元素的放射性原子。</p>\n<p>放射性同位素</p>\n<p>放射性元素</p>\n<p>元素周期表中，某一原子序数的位置内，所有同位素都具有放射性。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>1.3 放射化学的特点</p>\n<p>同中子异位素：中子数相同、质子数不同的核素。</p>\n<p>同质异位素：质量数相同、质子数不同的核素</p>\n<p>同质异能素：处于不同的能量状态且其寿命可以用仪器测量的同一种原子核。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>2.不稳定性     发生衰变(P<sub>13</sub>)</p>\n<p>按照发射粒子的不同，放射性衰变的种类主要有：</p>\n<p>1) α衰变：</p>\n<p>母体其核子数减少4;</p>\n<p>核电荷数减少2。</p>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 71 页</div>\n<p>1.3 放射化学的特点</p>\n<p>1. α衰变：本质是释放高速运动的氦原子流</p>\n<p>放出<sup>42</sup>He<sub>2</sub>+(简称α粒子），</p>\n<p>其核子数减少4;核电荷数减少2。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 72 页</div>\n<p>1.3 放射化学的特点</p>\n<p>－衰变</p>\n<p>﹢衰变和电子俘获</p>\n<p>电子俘获</p>\n<p>﹢衰变</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>1.3 放射化学的特点</p>\n<p>2. β衰变：本质是释放高速运动的电子流</p>\n<p>原子核自发地放射出β粒子（电子和正电子）</p>\n<p>或俘获一个轨道电子而发生的核内核子之间相互转化的过程。</p>\n<p>其核子数减少不变，核电荷数增加或减少1。</p>\n<p>-衰变：</p>\n<p>+衰变</p>\n<p>电子俘获(EC)</p>\n<p>pn++(e+)+</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 74 页</div>\n<p>1.3 放射化学的特点</p>\n<p>+衰变</p>\n<p>中子俘获</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 75 页</div>\n<p>电子俘获</p>\n<p>1.3 放射化学的特点</p>\n<p>原子核</p>\n<p>电子俘获</p>\n<p>电子跃迁和同时发射特征X射线</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 76 页</div>\n<p>电子俘获与β衰变的区别</p>\n<p>1.3 放射化学的特点</p>\n<p>β衰变</p>\n<p>电子俘获</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 77 页</div>\n<p>1.3 放射化学的特点</p>\n<p>3. γ衰变本质是释波长很短的电磁波</p>\n<p>质量数和原子序数均不改变，只是损失了结合能。</p>\n<p>亚稳态：激发态的寿命长到可以被检测出来。</p>\n<p><sup>209</sup>F(T<sub>1/2</sub>=11.0 s)</p>\n<p><sup>2010</sup>Ne（稳态）</p>\n<p>β-，5.398 MeV</p>\n<p>γ，1.633 MeV</p>\n<p>Qβ=7.03 MeV</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 78 页</div>\n<p>1.3 放射化学的特点</p>\n<p>内转换电子（e-）：发射的单能电子</p>\n<p>内转换系数（转换数，α）：两个能态之间的同一跃迁的内电子的概率We与发射γ量子的概率Wγ的商值。</p>\n<p>局部内转换系数：与原子壳层K、L……上的电子相互作用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 79 页</div>\n<p>1.3 放射化学的特点</p>\n<p>K俘获过程的另一种伴随粒子是俄歇电子：当一个L层电子跳到K层来填充空位时，可以不发射X射线，而把能量交给另一个L电子，于是这个L电子就会克服结合能而飞出。这种电子叫俄歇电子。</p>\n<p>俄歇电子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>1.3 放射化学的特点</p>\n<p>+IC electrons + X rays or Auger electrons</p>\n<p>原子核从激发态到较低的能态或基态的跃迁，除发射光子外，还可以通过发射电子来完成。这种电子通常不是来自原子核，而是来自原子的电子壳层。</p>\n<p>X射线和俄歇电子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 81 页</div>\n<p>1.3 放射化学的特点</p>\n<p>放射性衰变中原子核分裂成两个大小相近的碎片的过程</p>\n<p>只有少量的核素的主要衰变形式是自发裂变，例：Cm、Cf、Fm。</p>\n<p>4. 自发裂变</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 82 页</div>\n<p>1.3 放射化学的特点</p>\n<p>放射性衰变中原子核分裂成两个大小相近的碎片的过程</p>\n<p>只有少量的核素的主要衰变形式是自发裂变，例：Cm、Cf、Fm。</p>\n<p>大部分为诱发裂变</p>\n<p>4. 自发裂变</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 83 页</div>\n<p>1.3 放射化学的特点</p>\n<p>5.质子衰变</p>\n<p>6. 发射中等重量粒子如<sup>14</sup>C、<sup>24</sup>Ne的衰变</p>\n<p>发射质子，质子数较少1</p>\n<p><sup>226</sup>Ra、<sup>224</sup>Ra、<sup>222</sup>Ra发射<sup>14</sup>C</p>\n<p><sup>234</sup>U发射<sup>24</sup>Ne和发射<sup>28</sup>Mg</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 84 页</div>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 86 页</div>\n<p>诱发裂变</p>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>3.低浓度和微量</p>\n<p>放射性胶体溶液、放射性气体溶胶；</p>\n<p>易被器皿或其它固体物质沉淀所载带和吸附。</p>\n<p>吸附能力如下：</p>\n<p>玻璃＞石英＞聚乙烯 ＞聚丙烯＞聚四乙烯。</p>\n<p>1.3 放射化学的特点</p>\n<p>1）加载体；</p>\n<p>2）提高溶液的酸度；</p>\n<p>3）硅烷化。</p>\n<p>减少?</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 88 页</div>\n<p>4.伴随辐射化学效应</p>\n<p>特别是放射性活度比较高的α放射体， α射线与其相作用的物质产生一些活性物质等。需要注意辐射防护问题</p>\n<p>放射性物质发射的核辐射对人体有伤害作用，因此必须采取必要的防护措施。</p>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 89 页</div>\n<p>放射性物质的量通常都比较小（ug、ng级），低于一般的化学方法的检出限。</p>\n<p>1.3 放射化学的特点</p>\n<p>放射性</p>\n<p>不稳定性</p>\n<p>低浓度和微量性</p>\n<p>伴随辐射化学效应</p>\n<p>放射性核素一直按固有的速率衰变，并释放出带电粒子或射线。</p>\n<p>放射性物质总是在不停地衰变，由一种物质转变为另一种或多种物质</p>\n<p>放射性活度比较高的α放射体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 91 页</div>\n<p>不忘前人，勇担重担，稳态发展，逐步前进</p>\n<p>五个内容：基础放射化学、放射性元素化学、核化学、放射分析化学、应用放射化学</p>\n<p>四个特点：放低姿态、不服（辐）就干</p>\n</div>", "衰变公式与半衰期": "<div class=\"th\"><div class=\"th-top\"><h2>衰变公式与半衰期</h2><span class=\"tt\" style=\"background:#e63946\">计算</span><span class=\"tcb\">15页</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>放射性衰变的时间规律</p>\n<p>衰变常数：原子核的放射性衰变或同质异能跃迁的概率</p>\n<p>表示放射性衰变的快慢</p>\n<p>在一般情况下，衰变常数与外界条件（诸如温度、压力、外部电磁场等）无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>放射性衰变的时间规律</p>\n<p>0~t时间对上式积分</p>\n<p>Time (t) | number of atoms of a certain radionuclide</p>\n<p>0 | N<sub>0</sub></p>\n<p>t | N</p>\n<p>N(t=T<sub>1/2</sub>）=N<sub>0/2</sub></p>\n<p>半衰期</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>放射性衰变的时间规律</p>\n<p>注意：半衰期是每种放射性核素的特征参数，仅由原子核的内部特性决定，几乎与核素所处的化学和物理状态、外界条件（温度、压力和外加磁场等）无关。</p>\n<p>半衰期是一种不稳定的核素原子发生衰变的概率为50%。</p>\n<p>只适用于原子数量“巨大”的时候！</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>放射性衰变的时间规律</p>\n<p>衰变常数（λ）</p>\n<p>原子核的放射性衰变或同质异能跃迁的概率。</p>\n<p><sup>1</sup>Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有<sup>1</sup>Bq的活度。</p>\n<p>1 Ci(相当于1g <sup>226</sup>Ra的放射性活度)=3.7×10<sup>10</sup> Bq</p>\n<p>放射性活度（简称活度，符号为A，单位：Bq）</p>\n<p>某一时刻</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>放射性衰变的时间规律</p>\n<p>平均寿命τ：在τ时间里，放射性活度下降到1/e。</p>\n<p>τ等于衰变常数的倒数。</p>\n<p>A(t=τ）=A<sub>0</sub>/e</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>放射性衰变的时间规律</p>\n<p>对于无载体的纯放射性核素（m=0）</p>\n<p>S0该放射性核素的一个特征常数，比活度的单位为Bq/g。</p>\n<p>1 g任何放射性核素：S<sub>0</sub>=K/MT<sub>1/2</sub>（Bq/g）</p>\n<p>K为4.17×10<sup>23</sup></p>\n<p>对应半衰期单位是秒（s）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>例题：</p>\n<p>氚单位TU：表示每10<sup>18</sup>个氢原子中有一个氚原子。</p>\n<p>某环境水样，经分析其浓度为5 TU/L，用Bq/L表示为多少？（<sup>3</sup>H的半衰期为12.33 a）</p>\n<p>放射性衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>例1：在1g天然钾中每分钟衰变多少个<sup>40</sup>K的原子？已知<sup>40</sup>K的丰度为：1.18×10－2 %，钾的平均原子量为39.1， <sup>40</sup>K 的半衰期为1.28×10<sup>9</sup>a。</p>\n<p>放射性计算</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>母体核素的半衰期比子体核素的半衰期长很多</p>\n<p>T<sub>1/2</sub>,1 &gt;&gt; T<sub>1/2</sub>,2，λ<sub>1</sub> &lt;&lt; λ<sub>2</sub></p>\n<p>λ<sub>2</sub>- λ<sub>1</sub>≈ λ<sub>2</sub>，</p>\n<p>放射性平衡的建立只取决于子体核素的半衰期</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>这一关系对母体核素半衰期非常长的放射性衰变链来说是相当重要的。一旦平衡建立，就存在如下关系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>2. 暂时平衡</p>\n<p>母体核素的半衰期不太长，但仍比子体核素的半衰期长</p>\n<p>T<sub>1/2</sub>,1 &gt;T<sub>1/2</sub>,2，λ<sub>1</sub> &lt; λ<sub>2</sub></p>\n<p>平衡条件</p>\n<p>实际时间满足</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体核素的半衰期比子体半衰期的半衰期短，没有放射性平衡可以达到。</p>\n<p>T<sub>1/2</sub>,1 &lt; T<sub>1/2</sub>,2，λ<sub>1</sub> ＞ λ<sub>2</sub></p>\n<p>母体衰变比子体生长快，不能满足平衡条件。</p>\n<p>实际时间足够长时</p>\n<p>3. 不成平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>大多数裂变产物的第一代或前几代均是半衰期较短的情况，而子体是长寿命的，所以均为不平衡情况。</p>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体均服从指数衰变规律</p>\n<p>暂时平衡与长期平衡无明显界限（5~7T<sub>1/2</sub>,2）</p>\n<p>平衡体系受到破坏，平衡重新建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>从1t含有 40％U3O8的沥青铀矿中能分离多少克<sup>226</sup>Ra？ <sup>238</sup>U 的半衰期为4.15×10<sup>9</sup> a , <sup>226</sup>Ra 的半衰期为1602 a。</p>\n<p>可为此题添加文本、图片、公式等解析，且需将内容全部放在本区域内。</p>\n<p>m=29.59</p>\n<p>答案解析</p>\n<p>主观题</p>\n<p>10分</p>\n</div>", "放射性的单位与比活度": "<div class=\"th\"><div class=\"th-top\"><h2>放射性的单位与比活度</h2><span class=\"tt\" style=\"background:#e63946\">计算</span><span class=\"tcb\">6页</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>放射性衰变的时间规律</p>\n<p>衰变常数（λ）</p>\n<p>原子核的放射性衰变或同质异能跃迁的概率。</p>\n<p><sup>1</sup>Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有<sup>1</sup>Bq的活度。</p>\n<p>1 Ci(相当于1g <sup>226</sup>Ra的放射性活度)=3.7×10<sup>10</sup> Bq</p>\n<p>放射性活度（简称活度，符号为A，单位：Bq）</p>\n<p>某一时刻</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>放射性衰变的时间规律</p>\n<p>比放射活度（简称比活度，符号S ，单位：Bq /g）：</p>\n<p>单位质量的某种放射性物质的放射性活度。</p>\n<p>放射性        稳定</p>\n<p>通常情况下：m  》mA</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>放射性衰变的时间规律</p>\n<p>对于无载体的纯放射性核素（m=0）</p>\n<p>S0该放射性核素的一个特征常数，比活度的单位为Bq/g。</p>\n<p>1 g任何放射性核素：S<sub>0</sub>=K/MT<sub>1/2</sub>（Bq/g）</p>\n<p>K为4.17×10<sup>23</sup></p>\n<p>对应半衰期单位是秒（s）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>放射性衰变的时间规律</p>\n<p>放射性浓度(Radioactive concentration)</p>\n<p>放射性浓度c是指单位体积某放射性活度。</p>\n<p>cA=A/V</p>\n<p>单位：Bq/mL 或Bq/L。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>例题：</p>\n<p>配10<sup>00</sup> mL浓度为10 Bq/mL标准铀溶液，需分析纯U3O8多少克?</p>\n<p>(已知：<sup>238</sup>U、<sup>235</sup>U、<sup>234</sup>U的丰度分别为：99.275 %，0.720 %，0.0054 %；比活度S0分别为：12.4 Bq/mg，79.4 Bq/mg，2.3×10<sup>5</sup> Bq/mg；U的平均匀原子量为237.98，O的平均匀原子量为16)</p>\n<p>放射性衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>例2：<sup>1</sup>Bq的不同的放射性核素各有多重？多大质量的放射性核素的放射性活度为<sup>1</sup>Bq？</p>\n<p>放射性计算</p>\n</div>", "衰变类型(α/β/γ)": "<div class=\"th\"><div class=\"th-top\"><h2>衰变类型(α/β/γ)</h2><span class=\"tt\" style=\"background:#06d6a0\">选择</span><span class=\"tcb\">12页</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>（        ）建立了第一座核反应堆；</p>\n<p>（             ）发现了超铀元素镎和钚；</p>\n<p>（           ）发现原子核裂现象；</p>\n<p>（                              ）在研究α粒子对轻核作用时，发现了人工放射性。</p>\n<p>放射化学的特点？</p>\n<p>放射性</p>\n<p>不稳定性</p>\n<p>低浓度和微量</p>\n<p>伴随辐射化学效应</p>\n<p>防止放射性核素在容器表面上损失的方法？</p>\n<p>加载体（放射性核素的化学性质相同或相近的稳定核素）</p>\n<p>提高溶液酸度</p>\n<p>玻璃容器用硅烷溶液进行处理</p>\n<p>约里奥-居里夫妇</p>\n<p>西博格</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>放射性衰变规律</p>\n<p>放射性衰变类型</p>\n<p>射线与物质的相互作用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>放射性计算的应用</p>\n<p>了解射线与物质的相互作用</p>\n<p>掌握反射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>放射性：原子核自发地放射出各种射线的现象。</p>\n<p>原子核自发地放射出各种粒子的现象。</p>\n<p>各种离子： α、β、p、<sup>14</sup>C</p>\n<p>电磁辐射、俘获核外电子，自发裂变。</p>\n<p>放射性现象是由原子核的变化引起的</p>\n<p>放射性核素（不稳定核素）：能自发地放射各种射线的核素。</p>\n<p>放射性衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>放射衰变存在几种类型？</p>\n<p>α  衰变</p>\n<p>β  衰变</p>\n<p>γ  衰变</p>\n<p>自发裂变</p>\n<p>质子衰变</p>\n<p>中等重量粒子的发射</p>\n<p>核衰变：不稳定原子核自发地放出粒子或电磁辐射变成另一种原子核的过程。</p>\n<p>放射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α射线与物质有强相互作用，因而很容易被完全吸收。</p>\n<p>表   <sup>214</sup>Po(能量Ea=7.<sup>69</sup>MeV)的α射线在不同材料中的射程</p>\n<p>物质 | 外推射程/cm | 射程/（mg/cm2）</p>\n<p>空气 | 6.95 | 8.5</p>\n<p>云母 | 3.60×10-3 | 10.1</p>\n<p>铝 | 4.06×10-3 | 11.0</p>\n<p>铜 | 1.83×10-3 | 16.8</p>\n<p>金 | 1.40×10-3 | 27.0</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α粒子通过物质时，主要是与电子碰撞。 α粒子不仅带有电荷，且其能量和质量比电子大得多，因此每次碰撞损失的能量很小，经过很多次碰撞才能失去全部能量而被吸收。</p>\n<p>与电子碰撞时，重的α粒子（质量比电子大得多）的运动方向实际上不受影响，而且α粒子是做“直线飞行”的，被原子核散射的几率小，其路径长度与射程几乎相等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α粒子与物质的作用强，测量α放射性时必须制成很薄的源，其厚度应该在μg/cm2范围，同时要在真空中进行。</p>\n<p>源太厚或者在空气中测量会因α辐射的自吸收或被空气中吸收而造成能量分辨率的严重降低。</p>\n<p>质子、氚核和重离子与物质的相互作用和α辐射的作用相似。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>射线与物质的相互作用</p>\n<p>β射线与物质相互作用</p>\n<p>β射线是快速电子流，其质量小，速度快。在电离能量损失率小，穿透力强，在核库伦场中能产生韧致辐射，易被核和电子散射而形成多次散射，它在物质中的路程十分弯曲，呈锯齿形。</p>\n<p>韧致辐射：高能量电子在原子核电厂内慢化时放出一种连续的X射线。      强度正比于吸收物原子序数及电子能量。</p>\n<p>外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</p>\n<p>内韧致辐射：电子俘获放出韧致辐射，在慢化生成的衰变核本身附近。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>射线与物质的相互作用</p>\n<p>β射线与物质相互作用</p>\n<p>常用铝做β辐射的吸收剂</p>\n<p>I=I0e-μd</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>射线与物质的相互作用</p>\n<p>γ射线与物质相互作用</p>\n<p>γ辐射的作用很弱，穿透能力比带点粒子大得多。严格遵循：</p>\n<p>I=I0e-μd</p>\n<p>半厚度：使辐射强度降低一半的吸收厚度。表征γ辐射的穿透能力。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>射线与物质的相互作用</p>\n<p>γ辐射吸收三种效应：光电效应、康普顿效应、电子对形成效应。</p>\n<p>光电效应：γ光子在一次碰撞中把全部能量给予一个壳层电子，放出的光电子能量等于γ光子能量减去电子的结合能。</p>\n<p>康普顿效应：γ光子把部分能量给予一个壳层电子， γ量子本身发生散射。</p>\n<p>电子对形成效应：一个γ光子在原子核电场内成负电子—正电子对。</p>\n</div>", "放射性平衡": "<div class=\"th\"><div class=\"th-top\"><h2>放射性平衡</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span><span class=\"tcb\">10页</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>放射性衰变的时间规律</p>\n<p><sup>238</sup>U的衰变</p>\n<p>第二代子体</p>\n<p>第三代子体</p>\n<p>1. 放射性衰变是一个统计过程，原子核放射彼此独立的变化，每一种核素均有其特征的衰变概率。</p>\n<p>2. 衰变概率是特定核素的一种固有性质，它与放射性核素的化学及物理性质无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>A<sub>1</sub>,N<sub>1</sub></p>\n<p>A<sub>2</sub>,N<sub>2</sub></p>\n<p>A<sub>3</sub>,N<sub>3</sub></p>\n<p>（1）T<sub>1/2</sub>,1 &gt;&gt; T<sub>1/2</sub>,2         长期平衡 Secular Radioactive Equilibrium</p>\n<p>（2）T<sub>1/2</sub>,1  &gt; T<sub>1/2</sub>,2           暂时平衡 Transient Radioactive Equilibrium</p>\n<p>（3）T<sub>1/2</sub>,1 &lt;T<sub>1/2</sub>,2             不成平衡 Non-equilibrium</p>\n<p>放射性平衡：母子体放射性活度之比恒定的状态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>母体核素的半衰期比子体核素的半衰期长很多</p>\n<p>T<sub>1/2</sub>,1 &gt;&gt; T<sub>1/2</sub>,2，λ<sub>1</sub> &lt;&lt; λ<sub>2</sub></p>\n<p>λ<sub>2</sub>- λ<sub>1</sub>≈ λ<sub>2</sub>，</p>\n<p>放射性平衡的建立只取决于子体核素的半衰期</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>一般情况下，当t＞5~7 T<sub>1/2</sub>,2时（一般为7T<sub>1/2</sub>,2），</p>\n<p>平衡时，A<sub>1</sub>=A<sub>2</sub>，那么A是多少呢？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>这一关系对母体核素半衰期非常长的放射性衰变链来说是相当重要的。一旦平衡建立，就存在如下关系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>2. 暂时平衡</p>\n<p>母体核素的半衰期不太长，但仍比子体核素的半衰期长</p>\n<p>T<sub>1/2</sub>,1 &gt;T<sub>1/2</sub>,2，λ<sub>1</sub> &lt; λ<sub>2</sub></p>\n<p>平衡条件</p>\n<p>实际时间满足</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>2. 暂时平衡</p>\n<p>与长期平衡不同</p>\n<p>暂时平衡时中A和A2均有最大值，</p>\n<p>A2在最大值之后大于A1</p>\n<p>放射性衰变平衡的建立</p>\n<p>拓展：我们可以求出最大值时刻的时间么？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体核素的半衰期比子体半衰期的半衰期短，没有放射性平衡可以达到。</p>\n<p>T<sub>1/2</sub>,1 &lt; T<sub>1/2</sub>,2，λ<sub>1</sub> ＞ λ<sub>2</sub></p>\n<p>母体衰变比子体生长快，不能满足平衡条件。</p>\n<p>实际时间足够长时</p>\n<p>3. 不成平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>大多数裂变产物的第一代或前几代均是半衰期较短的情况，而子体是长寿命的，所以均为不平衡情况。</p>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体均服从指数衰变规律</p>\n<p>暂时平衡与长期平衡无明显界限（5~7T<sub>1/2</sub>,2）</p>\n<p>平衡体系受到破坏，平衡重新建立</p>\n</div>", "同位素效应与交换": "<div class=\"th\"><div class=\"th-top\"><h2>同位素效应与交换</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span><span class=\"tcb\">30页</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>同位素交换</p>\n<p>放射性核素在介质中存在状态</p>\n<p>放射性核素吸附现象</p>\n<p>微量放射性物质在固-液两相之间的分配</p>\n<p>电化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>熟识同位素交换反应</p>\n<p>了解放射性核素在介质中存在状态</p>\n<p>掌握放射性核素的吸附、共沉淀及电化学相关知识</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>3.1.1 同位素效应</p>\n<p>什么是同位素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>3.1 同位素交换</p>\n<p>3.1 1 同位素效应</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>3.1.3 同位素交换的基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>3.1 同位素交换</p>\n<p>不同种分子、原子间进行交换，形成了新的分子种类，即形成了新的化学物质。除此之外，还存在如下的一些运动形态。</p>\n<p>A-B+C-D→A-C+B-D</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>一、同种原子之间</p>\n<p>① 同类分子、不同个体的分子之间，同种原子之间的交换</p>\n<p>3.1 同位素交换</p>\n<p>②不同类分子之间，同种原子之间的交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>③ 同一个分子内部、同种原子之间的交换</p>\n<p>3.1 同位素交换</p>\n<p>④ 同类分子处于不同物理状态的两个分子之间的同种原子之间的交换</p>\n<p>S             L                   S                    L</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>在体系的物理和化学状态都不变化的情况下，在不同分子间，同一分子内和不同的相之间，相同原子或同位素原子之间都存在着同位素的交换。</p>\n<p>3.1 同位素交换</p>\n<p>二、同位素原子之间</p>\n<p><sup>131</sup>I-<sup>127</sup>I之间的交换，<sup>127</sup>I为稳定的同位素，<sup>131</sup>I为放射性原子，即为标记原子。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>利用同位素交换研究核素的存在状态；</p>\n<p>制备标记化合物；</p>\n<p>作为示踪剂等。</p>\n<p>3.1 同位素交换</p>\n<p>同位素交换的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>由于同位素质量不同而引起的同位素在物理和化学性质上的差别称为同位素效应。</p>\n<p>同位素的核电荷数相同，彼此仅有质量之差，它们的化学行为没有本质的不同，仅在程度上有一些微小的差别。</p>\n<p>对于许多同位素交换反应，其效应的理论预测已被实验证实。</p>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>质量--质量差异</p>\n<p>分子的空间形状--即对称性</p>\n<p>转动情况--即分子的转动惯量；</p>\n<p>振动情况--即分子热运动情况，用温度表达；</p>\n<p>其它如结构稳定状况--即分子最低能级状态等等。</p>\n<p>3.1.1 同位素效应</p>\n<p>同位素交换有关因素：</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>3.1.1 同位素效应</p>\n<p>m：相应物质的质量</p>\n<p>δ：相应分子的对称数（分子在空间转对360°，分子形态复原的次数）</p>\n<p>I：相应分子的转动惯量</p>\n<p>ΔU：反应前后分子最低能级的差值</p>\n<p>T：表示温度</p>\n<p>R：理想气体常数</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>3.1.1 同位素效应</p>\n<p>K交换是衡量同位素效应的大小</p>\n<p>K交换远离1，说明体系中各种同位素分布很不均匀，同位素效应大。</p>\n<p>K交换→1，说明体系中各种同位素分布趋向均匀。</p>\n<p>K交换=0与K交换=∞是一个意思，说明同位素“不交换”，理论上是不可能的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>表   若干同位素交换反应的平衡常数  (25℃）</p>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>同位素交换</p>\n<p>反应的特征</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>3.1.2 同位素交换反应特征</p>\n<p>Q=0</p>\n<p>由于同位素彼此间化学性质相同，所以，除氢以外，所有的同位素交换反应的热效应几乎等于零，即Q=0。</p>\n<p>2. K近似不变的，当然与温度也无关。</p>\n<p>除氢之外，同位素交换反应的平衡常数K交换极近似等于1，且与温度无关。所以，一般情况下，同位素效应可忽略，即K≈1。K近似不变的，当然与温度也无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>3.1.2 同位素交换反应特征</p>\n<p>同位素交换反应是可逆反应，而可逆反应的热效应等于正反应与逆反应的活化能之差。</p>\n<p>E逆－E正＝Q＝0    E逆＝E正</p>\n<p>所以，同位素交换反应的正反应与逆反应的活化能是相等的。</p>\n<p>3. 同位素交换反应的E逆＝E正。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>4. k正＝k逆</p>\n<p>因为平衡常数K交换＝1，所以同位素交换反应的正反应和逆反应的速度常数相等，即k正＝k逆。</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>5. 同位素交换反应的进行，不伴随有普通元素浓度的变化。  熵值</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>表示同位素交换反应达到平衡时，AX*的浓度；</p>\n<p>表示同位素交换反应达到平衡时，BX*的浓度。</p>\n<p>体系中AX与AX*的浓度之和为a；</p>\n<p>体系中BX与BX*的浓度之和为b。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>AX*+BX          AX+BX*      (如<sup>3</sup>H2O与CH3CH2OH)</p>\n<p>以均相（单相）体系为例进行研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>R：交换的原子X在AX和BX之间的交换速度（mol/s）。</p>\n<p>AX*+BX          AX+BX*      (如<sup>3</sup>H2O与CH3CH2OH)</p>\n<p>t=0：AX(AX*)    BX</p>\n<p>a                b</p>\n<p>t=t：             x                            y</p>\n<p>t→∞：          x∞                                     y∞                          体系平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>x=x0-y=x∞+y∞-y</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>F：交换度，表示同位素（标记原子）在参加交换的物质之间的分配与平衡分配相距的程度。</p>\n<p>AX*+BX2            AX+BX*X</p>\n<p>t=t<sub>1/2</sub>时，半交换期</p>\n<p>t=0：     a       2b</p>\n<p>t=t：      x                               y</p>\n<p>t→∞：   x∞                                            y∞                          体系平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>AX2*+BX2            AXX*+BX*X</p>\n<p>t=0：     a       2b</p>\n<p>t=t：      x                               y</p>\n<p>t→∞：   x∞                                            y∞                          体系平衡</p>\n<p>AXm*+BXn            AX*Xn<sup>-1</sup>+BX*Xn<sup>-1</sup></p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>某种元素的交换速度取决于交换原子在两相中的扩散速度和相界面上的交换速度。</p>\n<p>过程总速度由最慢的阶段决定。</p>\n<p>如果原子在两相中的扩散速度远大于交换速度，则同位素交换是过程的限制阶段</p>\n<p>如果交换速度远大于在一相或两相中原子在两相中的扩散速度，则扩散是过程的限制阶段。</p>\n<p>在非均相条件下，同位素交换服从指数关系。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>非均相体系中</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>以下是几种物质的K交换值，哪种物质的同位素交换效应最大？</p>\n<p>单选题</p>\n<p>10分</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>放射性胶粒在空气中的浓度虽不高，但由于放射性高度集中在微小的胶粒上，放射性的比活度并不很低，所以，一旦进入生物体内，产生的生物效应却很强；</p>\n<p>在电沉积过程中，反常地难沉积在较活泼的金属上；</p>\n<p>在共结晶、吸附、离子交换、萃取和同位素交换能力方面也有反常行为。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 135 页</div>\n<p>真溶液</p>\n<p>放射性物质存在状态</p>\n<p>同位素交换</p>\n<p>活性炭</p>\n<p>气溶胶</p>\n<p>共结晶共沉淀</p>\n<p>吸附共沉淀</p>\n</div>", "放射性胶体": "<div class=\"th\"><div class=\"th-top\"><h2>放射性胶体</h2><span class=\"tt\" style=\"background:#4361ee\">填空/选择</span><span class=\"tcb\">13页</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>3.2  放射性核素在介质中存在的状态</p>\n<p>分散体系按分散相颗粒大小的不同，可以分为三类：</p>\n<p>类型 | 颗粒大小（分散相物质，m） | 例子</p>\n<p>粗分散体系 | ＞10-7 | 矿石，乳状液，悬浮液（如油漆）</p>\n<p>胶体分散体系 | 10-7~10-9 | 氢氧化铝溶液，明胶液</p>\n<p>分子与离子分散体系 | ＜10-9 | 气体混合物，一般溶液（如盐水）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>放射性真胶体</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体</p>\n<p>放射性假胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>一种是在放射性核素的原子、离子或分子直接聚合在一起，构成胶粒大小的聚集体，分散在介质中，形成放射性胶体分散体系，这称为放射性真胶体。</p>\n<p>真胶体的胶粒很小，比如在液溶胶体系中，这些胶粒聚集体的直径只为10-9 m数量级。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性真胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>放射性核素（离子或分子）被吸附在存在于介质中的其它非放射性悬浮粒子（杂质）上，这种吸附了放射性核素的杂质胶粒为分散相的胶体体系，称为放射性假胶体。此种体系的胶粒直径比真胶体的胶粒要大。</p>\n<p>例：氢氧化铝吸附放射性核素。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性假胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>液体分散体系</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性物质</p>\n<p>气体分散体系（气溶胶）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>放射性核素在溶液中生成难溶水解产物或其他难溶化合物的趋势越大，越有利于放射性胶体（真胶体）的形成。相反，若在溶液中有能与放射性核素形成可溶性络合物的物质（络合物中的配位体）存在，则不利于放射性胶体的形成。</p>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>在强酸介质中，放射性核素一般不形成胶体，当溶液酸度降低时，在一定的pH值条件下，各种放射性核素都能生成胶体粒子，但 碱金属和碱土金属例外，不过在一定条件下能形成假胶体，碱土金属生成假胶体的趋势一般随原子序数的增加而加大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>③ 杂质粒子的影响</p>\n<p>杂质粒子对<sup>212</sup>Pb和<sup>212</sup>Bi胶体的影响 |  |  |</p>\n<p>放射性核素 | 用水稀释后反射性胶体的量/% |  |</p>\n<p>| 未净化得水 | 过滤净化的水 | 离心净化的水</p>\n<p><sup>212</sup>Pb | 59.4 | 28 | -</p>\n<p>| 37.9 | - | 15.6</p>\n<p><sup>212</sup>Bi | 48.0 | 16.0 | -</p>\n<p>| 87.6 | - | 30.5</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>③ 杂质粒子的影响</p>\n<p>④ 分散介质液体本身的性质、存在的电解质、溶液的保存时间和温度等的影响。</p>\n<p>研究放射性胶体的形成主要是以水为分散介质而进行的，其它分散介质研究得尚少，介质性质不同，对胶体形成有重大影响。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>① 操作过程</p>\n<p>在放射性物质的研磨、粉碎、过筛以及放射性溶液的鼓泡、蒸发和转移过程中，放射性物质会扩散到空气中，与空气中的尘埃或雾滴结合在一起形成放射性气溶胶（假胶体）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>② 不稳定性</p>\n<p>天然放射性核素<sup>226</sup>Ra、<sup>224</sup>Ra、<sup>223</sup>Ra在衰变过程中分别放出<sup>222</sup>Rn、<sup>220</sup>Rn、<sup>219</sup>Rn等放射性气体，这些气体及其放射性子体在空气中与尘埃或雾滴相结合形成放射性气溶胶。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>③ 反冲粒子</p>\n<p>放射性核素在衰变时产生的反冲原子在空气中可以形成放射性气溶胶。而且反冲原子往往会将放射性物质带入空气中，比如<sup>210</sup>Po、<sup>239</sup>Pu以及超钚元素，特别突出。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>④ 核爆炸</p>\n<p>核武器爆炸时，核裂变反应生成几十种元素的放射性裂变产物，由于高温使周围的物质发生强烈蒸发，将放射性物质卷扬到高空，冷却后在大气中形成大量的放射性气溶胶云，从而形成大量的放射性气溶胶。</p>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n</div>", "吸附作用": "<div class=\"th\"><div class=\"th-top\"><h2>吸附作用</h2><span class=\"tt\" style=\"background:#4361ee\">填空/计算</span><span class=\"tcb\">12页</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>吸附放射性核素的固体物质。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>放射性核素从液相或气相转移到固体物质表面的过程。</p>\n<p>吸附剂</p>\n<p>吸附类型</p>\n<p>物理吸附</p>\n<p>化学吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>吸附质和吸附剂分子间作用力所引起，此力也称作范德华力。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n<p>由于固体表面分子（或原子、离子）存在剩余吸引力而引起的，当吸附剂表面被吸附的一层粒子尚未完全抵消固体表面的力场（即剩余引力）时，可再吸附一层粒子，直到完全抵消固体表面的力场为止，因此，物理吸附是多层吸附。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>吸附剂表面的分子由于作用力没有平衡而保留有自由的力场来吸引吸附质，它是由分子间的吸力所引起的吸附，因此结合力较弱，吸附热较小，吸附和解吸速度也都较快。被吸附物质也较容易解吸出来，所以物理吸附在一定程度上是可逆的。</p>\n<p>如：活性炭对许多气体的吸附，被吸附的气体很容易解脱出来而不发生性质上的变化。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>吸附剂与被吸附的原子、离子或分子发生化学反应，靠化学键力而引起的。</p>\n<p>化学吸附中，吸附剂只能吸附一定结构的物质，所以化学吸附的选择性高。由于固体表面存在不均匀力场，表面上的原子往往还有剩余的成键能力，当气体分子碰撞到固体表面上时便与表面原子间发生电子的交换、转移或共有，形成吸附化学键的吸附作用。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>化学吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素的吸附能力与玻璃表面的不同处理过程、玻璃种类以及放射性核素所处的介质条件有关。</p>\n<p>为衡量吸附能力，定义Kα吸附系数</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>滤纸是一种能强烈吸附某些放射性核素的吸附剂。</p>\n<p>滤纸吸附放射性核素的机理：放射性核素是以离子状态或以胶体状态而被滤纸吸附的。</p>\n<p>以离子状态被滤纸吸附时，可能是以离子交换形式进行的，</p>\n<p>胶态吸附几乎是不可逆的。</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>一般说来，经过表面活化处理的多孔性吸附剂具有较大的比表面和活性，其吸附能力就较大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 86 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>⑵温度</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>由于吸附剂吸附气体是放热过程，所以，体系温度愈高，气体愈不易被吸附，已被吸附的气体愈易从吸附剂表面解吸下来。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>⑵温度</p>\n<p>⑶被吸附气体的性质及压力</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>被吸附气体的沸点愈高，即较容易凝结为液态的气体，愈容易被吸附。被吸附气体的分压（p）升高（浓度增大），吸附量当然也增加。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 106 页</div>\n<p>被吸附离子进入吸附剂表面的晶格里。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级交换吸附：溶液中离子、晶体表面的离子，并非处于静止状态，它们和溶液中相同种类的离子不断地进行交换。如果溶液中有同种离子（包括同位素离子）或同晶离子存在，则这些离子也能参与交换，而转移到晶体表面，这个过程称为一级交换吸附。同晶离子的交换吸附又称为同晶交换吸附。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 110 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级吸附特点</p>\n<p>只有与常量晶体同晶或同二晶的离子才能被吸附。</p>\n<p>被吸附化合物溶解度越小，吸附量越大。</p>\n<p>对于一定的常量物质体系，吸附系数与结晶常数D成正比，D取决于常量物质的溶解度与被吸附离子化合物的溶解度的比值。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 113 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>二级吸附</p>\n<p>二级吸附规律</p>\n<p>被吸附离子的价态数越高，越容易被吸附；</p>\n<p>溶液中晶体本身离子或同晶离子浓度越高，吸收微量放射性核素的量越大；</p>\n<p>竞争离子的浓度越高，放射性核素的吸附系数下降。</p>\n</div>", "共沉淀与同晶": "<div class=\"th\"><div class=\"th-top\"><h2>共沉淀与同晶</h2><span class=\"tt\" style=\"background:#4361ee\">填空/选择</span><span class=\"tcb\">3页</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>1. 放射性物质在溶液中的行为不包括：</p>\n<p>电化学</p>\n<p>共结晶共沉淀</p>\n<p>单选题</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>2. 类质同晶能形成真正的混晶，某些化学组成类似但晶体结构不同的物质，在一定条件下  [填空1]  形成真正的混晶。</p>\n<p>填空题</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>共沉淀有以下两种：</p>\n<p>1）无机共沉淀法</p>\n<p>无机化合物做载体。共结晶共沉淀法和吸附共沉淀法。</p>\n<p>2）有机共沉淀法</p>\n<p>有机化合物作载体。难溶的离子缔合物、难溶的金属螯合物、有机胶体的吸附作用而生成的共沉淀。</p>\n<p>4.2.1 基本原理</p>\n</div>", "电化学(能斯特方程)": "<div class=\"th\"><div class=\"th-top\"><h2>电化学(能斯特方程)</h2><span class=\"tt\" style=\"background:#e63946\">计算/选择</span><span class=\"tcb\">8页</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 139 页</div>\n<p>“不使用外加电压时放射性物质的电化学析出法”（称电化学置换法）</p>\n<p>“使用外加电压时放射性物质的电化学沉积法”（称电解沉积法）</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 140 页</div>\n<p>1. 电化学置换法</p>\n<p>4.5  电化学分离方法</p>\n<p>电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 141 页</div>\n<p>1. 电化学置换法基本原理</p>\n<p>4.5  电化学分离方法</p>\n<p>基于每种金属元素都有一定的标准电极电势值（   ），在溶液中电极电势值（E）大的金属离子，可以将浸在溶液中其电极电势值（E）较小的金属原子置换下来，而自身沉积于金属的表面。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 142 页</div>\n<p>例如：欲分离母－子体核素<sup>210</sup>Bi－<sup>210</sup>Po，可将铜片（电极材料）插入含有上述母－子体核素的溶液中，由于铜的标准电极电势大于铋而小于钋，导致Po在铜表面析出，或称Po自镀在铜片上。而铋仍留在溶液中。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 143 页</div>\n<p>（1）降低溶液中作为电极材料的金属的离子浓度，使金属电极的实际电极电势（E）值小于欲分离核素离子的电极电势（E）值。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 144 页</div>\n<p>⑵用氢电极法来改变电极电势。此法是用标准电极电势值大的铂金属作电极，浸入含有欲分离放射性核素的溶液中，然后将纯氢气通入溶液，铂金属就会吸附氢，并被氢所饱和，成为氢电极。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 145 页</div>\n<p>2 电解沉积法</p>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>基本原理：微量放射性核素各有不同的临界沉积电压--即电解时的分解电压，选择适宜的外加电压，使其等于或大于某一核素离子的临界沉积电压（分解电压，即开始电解时所需的外加最低电压），则该种核素离子可在阴极上析出。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 146 页</div>\n<p>2 电解沉积法</p>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div>", "载体与反载体": "<div class=\"th\"><div class=\"th-top\"><h2>载体与反载体</h2><span class=\"tt\" style=\"background:#f77f00\">问答</span><span class=\"tcb\">5页</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>载体Carrier</p>\n<p>载体是以适当的数量载带某种微量物质共同参与某化学或物理过程的另一种物质。</p>\n<p>载体与被载带物具有相同的化学行为，最终能与放射性物质一起被分离出来。</p>\n<p>例如：分离<sup>226</sup>Ra加入Ba，<sup>127</sup>I对<sup>131</sup>I，<sup>1</sup>H对<sup>3</sup>H等。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n<p>同位素载体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>反载体Anti-carrier</p>\n<p>为了减少分离过程对杂质核素的载带，在加入被分离核素和载体之外，还必须加入这些杂质核素的稳定同位素或化学类似物，以减少它们对被分离核素和器皿的污染，即起反载带作用，这类稳定同们素或化学类似物就称为反载体或抑制体。</p>\n<p>例如：用MnO2从95Zr<sup>-9</sup>5Nb体系中吸附<sup>95</sup>Nb时，加入稳定的Zr。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>载体：尽量选用同位素载体，也可选用非同位素载体。</p>\n<p>为了减少 分离过程中放射性杂质对欲分离核素的污染，必须加入反载体。</p>\n<p>一般情况下，载体量在5~20mg，反载体量10mg为宜。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>净化载体：可将多种杂志离子从溶液中除去，让所需的放射性核素留在溶液中。又称清扫载体或净化载体。</p>\n<p>常用的净化载体：氢氧化铁、氢氧化钍、硫酸钡、碳酸钡、二氧化锰、三硫化二铋等。净化操作要经过多次才能达到净化程度。</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n<p>实际分离过程中是载体、反载体、净化载体共同使用。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>加反载体或络合剂；</p>\n<p>控制溶液的酸度；</p>\n<p>采用均相沉淀法；</p>\n<p>改变氧化价态；</p>\n<p>选择适当的沉淀条件；</p>\n<p>进行多次沉淀；</p>\n<p>洗涤沉淀。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（2）共沉淀产物纯度的提高</p>\n</div>", "溶剂萃取": "<div class=\"th\"><div class=\"th-top\"><h2>溶剂萃取</h2><span class=\"tt\" style=\"background:#f77f00\">问答/填空</span><span class=\"tcb\">30页</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>优  点</p>\n<p>方法简便，分离速度快，适用于短寿命放射性核素的分离；选择性好，回收率高，可用于制备无载体的源； 设备简单，操作方便，易于连续化和自动化；可供选择的萃取剂多，对微量物质的分离合工业生产规模的分离均可使用等。</p>\n<p>缺  点</p>\n<p>有机物的毒性、易挥发性及易燃性等。</p>\n<p>4.3 溶剂萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>4.1.1 萃取法基本概念</p>\n<p>萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的 →疏水的</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>1）萃取剂和稀释剂</p>\n<p>通常把有机相中能将处于水相中的欲萃取物质转移到有机相的有机试剂叫做萃取剂。</p>\n<p>为了改善萃取剂的某些物理性能而加入的有机溶剂叫稀释剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>2)反萃取剂</p>\n<p>能使被萃取物质从有机相返回到水相溶液的试剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>例：在铀浸出液-30%TBP(TBP+煤油)萃取铀，有机相用水清洗，洗出铀。TBP为萃取剂、煤油为稀释剂、水为反萃取剂</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>3）萃取率E</p>\n<p>经萃取而进入有机相的欲萃取物的量占其在两相中总量的百分数。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>3）萃取率E</p>\n<p>萃取率E与分配系数D萃的关系：</p>\n<p>R为相比，其值为有机相与水相的体积之比，即V有/V水。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>1）萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的         →疏水的</p>\n<p>4.3.2 萃取机理和萃取剂的种类</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 59 页</div>\n<p>2）萃取剂的种类</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>惰性萃取剂（CCl4 、CHCl3、 C6H14等），萃取剂与萃取物不发生化学反应，欲萃取物在两相之间按溶解度大小进行分配；</p>\n<p>中性含氧萃取剂（酮类、醚类、醇类等）具有一定极性的含氧有机化合物，在酸的作用下萃取剂先与水生成烊离子，再与欲萃取物发生离子缔合反应，也称盐萃取；</p>\n<p>4.3.2 萃取机理和条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>中性含氧萃取剂形成烊盐的能力与其所含氧原子的配位能力有关，大致有如下的关系：</p>\n<p>醚＜醇＜酸＜酯＜酮＜醛。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)<sup>3</sup>PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>反应式：</p>\n<p>这类萃取剂的萃取能力取决于P=O键的极性，其大小顺序：</p>\n<p>＞               ＞                ＞</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>酸性磷类萃取剂</p>\n<p>这类萃取剂是指磷酸分子（HO)<sup>3</sup>PO中的一个或二个羟基被烷基酯化或取代所生成的化合物；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>胺类萃取剂</p>\n<p>氨分子NH3中三氢原子部分或全部为烷基取代后生成的伯、仲、叔胺以及季铵盐。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>能与水相中的金属阳离子结合成疏水的电中性环状螯合物而被萃取；</p>\n<p>这类萃取剂在萃取过程中生成具有螯合环的萃合物，即：螯合物。</p>\n<p>在螯合萃取剂中至少要有两个参加反应的官能团，其中一个为-OH或-SH基团，另一个为具有给电子性质的碱性官能团。金属置换-OH或-SH基团上的氢，并与碱性官能团配位，形成稳定的五元或六元环（从键角考虑，五元或六元环最稳定）。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>为了满足萃取剂亲有机相的基本要求，还必须在萃取剂分子中引入适当的取代基，并且在萃取剂分子中不应有亲水性基团。</p>\n<p>协同萃取剂 和冠状化合物类萃取剂</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>协同萃取剂，当萃取剂中含有两种或两种以上的萃取剂，使被萃取物的分配系数显著大于每一种萃取剂在相同条件下单独使用时的分配系数之和；TTA-TBP协同萃取水中的U(Ⅵ) →</p>\n<p>冠状化合物类萃取剂，主要包括冠醚和穴醚。</p>\n<p>冠醚是由三个以上[-CH2-O-CH2-]单元组成的单环聚醚；穴醚是在醚环上有两个氧原子被氮原子取代并联结起来的二环聚醚。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>(I)对萃取剂的要求</p>\n<p>对欲萃取物的分配系数大，萃取容量大，选择性好，易于反萃取；</p>\n<p>萃取反应速度快；粘度小，与水的比重差别大，相分离和流动性能好，不易形成第三相或发生乳化；</p>\n<p>具有较高的化学稳定性和辐照稳定性；</p>\n<p>与水溶液的互溶性小；</p>\n<p>毒性低，沸点高，挥发性小；</p>\n<p>价格低廉，易于回收。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>影响萃取率的因素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>(II) 水相的选择</p>\n<p>水相组成的选择主要有以下方面：</p>\n<p>i)酸度和酸类，在保证萃取率足够高和不发生水解反应的前提下，应尽可能在较低酸度下进行萃取，水相中的酸类也会影响萃取剂的能力，在放射化学分离中，常用的是硝酸和盐酸体系。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 72 页</div>\n<p>ii)掩蔽剂，加入一种适宜的掩蔽剂（通常是络合剂），使之与不希望被萃取的元素发生络合作用，对干扰物质进行掩蔽，以阻止它们进入有机相，从而提高欲萃取物的纯度。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>用TBP萃取含有杂质Zr离子的U(VI)时，加入EDTA，使之与Zr等杂质离子络合。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>iii)盐析剂，在萃取体中，如果加入一种易溶于水相的盐类，它既不被萃取，又不与欲萃取物发生反应，但可提高欲萃取物的萃取率，这种盐称为盐析剂。它能提高被萃取物的萃取率，是由于它具有水合作用和同离子效应；如萃取          ，用          。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 75 页</div>\n<p>进行一次萃取  萃取率E1为：</p>\n<p>E<sub>1</sub>=[1-1/(D萃R+1)]×10<sup>0</sup>%</p>\n<p>残留欲萃取物的百分数r1为：</p>\n<p>r1=1- E<sub>1</sub>=[1/(D萃R＋1)]×10<sup>0</sup>%</p>\n<p>进行x次萃取</p>\n<p>萃取率Ex,总为：</p>\n<p>Ex,总=｛1-[1/(D萃R+1)]x｝×10<sup>0</sup>%</p>\n<p>残留欲萃取物的百分数rx为：</p>\n<p>rx= [1/(D萃R＋1)]x×10<sup>0</sup>%</p>\n<p>(III) 萃取次数（相比固定）</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 76 页</div>\n<p>例题：</p>\n<p>用HDEHP萃取放射性废水中的<sup>90</sup>Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求<sup>90</sup>Sr的总萃取率达到99.9%，试计算萃取次数？</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 77 页</div>\n<p>用HDEHP萃取放射性废水中的<sup>90</sup>Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求<sup>90</sup>Sr的总萃取率达到99.9%，试计算萃取次数？</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 78 页</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>(III) 萃取次数（有机相用量固定）</p>\n<p>进行一次萃取  萃取率E1（/100%）为：</p>\n<p>进行x次萃取，萃取率Ex,总（/100%）为：</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 79 页</div>\n<p>(IV)洗涤次数</p>\n<p>洗涤液条件的选择原则是杂质的分配系数要小，欲萃取物的分配系数要大。洗涤次数的选择必须兼顾净化效果和回收率。</p>\n<p>(V) 反萃取剂的选择、萃取设备的选择</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 97 页</div>\n<p>某含<sup>131</sup>I放射性样品制备好后50 h 测量，活度为8 Bq，则它的初始活度为           。已知<sup>131</sup>I的半衰期为8.04 d</p>\n<p>下列哪几种情况下同位素效应最明显</p>\n<p>A 、K交换= 6.26；       B、 K交换=1.45 ；</p>\n<p>C、 K交换=1.034；      D、K交换= 1.004。</p>\n<p>萃取率E与分配系数D萃的关系？</p>\n<p>知识问答</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 133 页</div>\n<p>萃取柱色谱法</p>\n<p>萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。</p>\n<p>正相萃取柱色谱法中水溶液被吸附在吸附剂上作为固定相，有机萃取剂为流动相。</p>\n<p>反相萃取柱色谱法是使有机萃取剂吸附在吸附剂上作为固定相，水溶液为流动。</p>\n<p>4.2.3 其他柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 134 页</div>\n<p>4.2.3 其他柱色谱法</p>\n<p>萃取柱色谱法基本原理</p>\n<p>利用不同物质在固定相（萃取剂）和流动相之间萃取分配系数的不同来达到彼此分离的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 137 页</div>\n<p>用色谱纸或以萃取剂、液体离子交换剂吸附在色谱纸上作固定相，用有机溶剂或水溶液作流动相来分离不同物质的一种色谱分离方法。</p>\n<p>各组分在色谱纸上移动的情况可用比移值Rf来表示：</p>\n<p>4.3 纸色谱法</p>\n</div>", "离子交换分离": "<div class=\"th\"><div class=\"th-top\"><h2>离子交换分离</h2><span class=\"tt\" style=\"background:#f77f00\">问答/填空</span><span class=\"tcb\">32页</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>引言——基本概念</p>\n<p>共沉淀法</p>\n<p>离子交换法</p>\n<p>色层法</p>\n<p>电化学分离法</p>\n<p>萃取法</p>\n<p>其他分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 100 页</div>\n<p>4.3 色谱法</p>\n<p>色谱法的分类</p>\n<p>流动相物态</p>\n<p>分离过程机理</p>\n<p>固定相使用方式</p>\n<p>动力学过程</p>\n<p>气相、液相色谱</p>\n<p>吸附色谱法、离子交换色谱法、萃取色谱法和凝胶色谱</p>\n<p>柱色谱法、纸色谱法和薄层色谱法</p>\n<p>前沿法、淋洗法和顶替色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 104 页</div>\n<p>离子交换柱色谱法</p>\n<p>基本原理：是利用固体物质中的可交换离子与溶液中的不同离子之间能发生交换反应来进行分离的一种方法。</p>\n<p>具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 105 页</div>\n<p>从阳离子Mn+与氢型阳离子交换树脂RH之间可发生下列反应：</p>\n<p>4.3.1 柱色法</p>\n<p>平衡常数K可近似表示：</p>\n<p>、      表示Mn+在离子交换剂和溶液中的平衡浓度；</p>\n<p>、     表示H+在离子交换剂和溶液中的平衡浓度。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 106 页</div>\n<p>选择系数，也称为浓度平衡常数</p>\n<p>表示在一定条件下，离子交换剂对Mn+、 H+的选择能力的大小。</p>\n<p>4.3.1 柱色法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 107 页</div>\n<p>影响离子交换亲和力的因素很多，主要是离子的电荷数Z和离子的水化离子半径r水。</p>\n<p>电荷数越大，水化离子半径越小，则亲和力越大。</p>\n<p>4.3.1 柱色法</p>\n<p>交换亲和力影响因素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 108 页</div>\n<p>离子交换剂的选择和预处理；</p>\n<p>装柱与转型，</p>\n<p>阳离子可转成：H+、NH4+、Na+和Ca2+等，</p>\n<p>阴离子可转成：OH-、NO3-、Cl-和SO42-；</p>\n<p>分离操作：有吸附、洗涤、淋洗及树脂再生</p>\n<p>4.3.1 柱色法</p>\n<p>基本操作</p>\n<p>分类代号•骨架代号•顺序号•连接符号•交联度数值</p>\n<p>大孔型代号•分类代号•骨架代号•顺序号</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 109 页</div>\n<p>完成一个离子交换过程需要经过五个步骤：</p>\n<p>（1）外部溶液中的可交换离子穿过树脂颗粒表面的液膜，到达树脂表面，这个过程称为：膜扩散。</p>\n<p>（2）可交换离子在树脂颗粒内部扩散，到达树脂交换基团附近的交换位置，这个过程称为：内扩散。</p>\n<p>（3）可交换离子与树脂交换基团的反离子发生离子交换反应，可交换离子与树脂官能团结合，反离子则脱离树脂官能团。</p>\n<p>4.3.1 柱色法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 110 页</div>\n<p>（4）反离子在树脂颗粒内部扩散，到达树脂表面，这也是内扩散过程。</p>\n<p>（5）反离子穿过树脂颗粒表面的液膜，进入外部溶液，这也是膜扩散过程。</p>\n<p>4.3.1 柱色法</p>\n<p>离子交换过程示意图</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 111 页</div>\n<p>交联度：是指树脂中所含交联剂的质量百分数。</p>\n<p>交联剂：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂性能</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 112 页</div>\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 113 页</div>\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>树脂的单位量用1 mL表示，则称为：体积理论交换容量。</p>\n<p>树脂的单位量用1 g表示，则称为：质量理论交换容量。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 114 页</div>\n<p>2）工作交换容量</p>\n<p>工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。</p>\n<p>工作交换容量分类：穿透交换容量、饱和交换容量和再生交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 115 页</div>\n<p>3）穿透交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度达到规定的穿透浓度时，树脂所达到的交换容量。</p>\n<p>穿透交换容量不仅与具体的操作条件和离子交换反应速度有关，而且与穿透浓度的规定值有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>4）饱和交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度与流入液中的浓度相等时，树脂所达到的交换容量。饱和交换容量是动力学意义上的工作交换容量，它与具体的操作条件和离子交换反应速度有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 117 页</div>\n<p>5）再生交换容量</p>\n<p>在指定的再生剂（或解吸剂）用量相同条件下测定的树脂交换容量。再生交换容量与再生剂的用量有关，在实际使用时，从经济原因考虑一般不要求树脂达到完全再生（或解吸），所以树脂的再生交换容量一般小于新树脂的饱和交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 118 页</div>\n<p>离子交换树脂的交换容量用单位量树脂所吸附离子的量表示。</p>\n<p>质量单位表示：mmol/g干树脂；</p>\n<p>体积单位表示：mmol/mL湿树脂。</p>\n<p>工厂从操作和计量方便考虑，经常采用mg/g干树脂(简化为mg/g)或mg/mL湿树脂(简化为mg/mL)表示。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 119 页</div>\n<p>离子交换树脂的溶胀</p>\n<p>由于离子交换树脂是由亲油性的大分子骨架和亲水性的交换基团组成的，干燥的离子交换树脂接触水或有机溶剂时，在树脂结构的不同部分会分别发生溶剂化作用，都会引起树脂体积的膨胀（溶胀）。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 120 页</div>\n<p>离子交换树脂的粒度</p>\n<p>树脂粒度对其工作的交换容量、离子交换速度等有很大的影响。</p>\n<p>树脂粒度的大小用筛孔目数或树脂颗粒的直径（mm）表示。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 122 页</div>\n<p>加入交联剂</p>\n<p>二乙烯苯，生成苯乙烯-二乙烯苯共聚体或丙烯酸及其衍生物-二乙烯苯共聚体，形成立体交联结构的树脂骨架。</p>\n<p>通过化学反应，在树脂的共聚体骨架上引入交换基团以后，就成为离子交换树脂。</p>\n<p>交联剂加入量越多，立体交叉网络的交联程度越大，网络交织得越紧密。</p>\n<p>4.3.1 柱色法</p>\n<p>离子交换树脂结构</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 123 页</div>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>特种离子交换树脂</p>\n<p>强酸型阳离子交换树脂（R-SO3H型）</p>\n<p>弱酸型阳离子交换树脂（R-COOH型）</p>\n<p>强碱性阴离子交换树脂（R-CH2NR3Cl型）</p>\n<p>弱碱性阴离子交换树脂（R-CH2NH3OH型）</p>\n<p>特殊交换性能的树脂（螯合型、两性和氧化还原性树脂）</p>\n<p>特殊结构性能的树脂（大孔等）</p>\n<p>低酸及碱性条件下使用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 124 页</div>\n<p>离子交换树脂按照官能团的电荷性质分为：</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>离子交换树脂按照树脂交换基团在水中的电离常数分为：</p>\n<p>强酸性和弱酸性、强碱性和弱碱性。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 125 页</div>\n<p>阳离子交换树脂</p>\n<p>阳离子交换树脂的官能团带负电荷，反离子为带正电荷的氢离子或金属阳离子，可以与外部溶液中的阳离子进行交换反应；</p>\n<p>阴离子交换树脂</p>\n<p>阴离子交换树脂的官能团带正电荷，反离子为带负电荷的阴  离子（氢氧根离子或其它酸根离子），可以与外部溶液中的阴离子进行交换反应。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 126 页</div>\n<p>用阳离子交换树脂吸附铀</p>\n<p><sup>2</sup>RH + UO22+ = R2UO2 + <sup>2</sup>H+</p>\n<p>用阴离子交换树脂吸附铀</p>\n<p>(2n－2) R4NX + UO2(SO4)n 2－2n = (R4N)2n－2 UO2(SO4) n + (2n－2)X－</p>\n<p>式中：X－ 是树脂交换基团的反离子，例如：Cl－ 或NO3－；</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 127 页</div>\n<p>(n－1)(R4N) <sup>2</sup>SO4 + UO2SO4 = (R4N) 2n－2 UO2(SO4)n</p>\n<p>(n－1)(R4N) <sup>2</sup>SO4 + UO2(SO4)n<sub>2</sub>－2n =</p>\n<p>(R4N) 2n－2 UO2(SO4)n + (n－1) SO42－</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 128 页</div>\n<p>树脂上硫酸铀酰配合物的解吸</p>\n<p>R4UO2(SO4)3 + <sup>4</sup>X－ = <sup>4</sup>RX + nUO2SO4 +</p>\n<p>(1－n)UO22+ + (3－n)SO42－</p>\n<p>R2UO2(SO4)2 + <sup>2</sup>X－ = <sup>2</sup>RX + mUO2SO4 +</p>\n<p>(1－m)UO22+ + (2－n)SO4 2－</p>\n<p>式中：X－ 为Cl－ 或NO3－，n和m为与解吸条件有关的常数。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 129 页</div>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 130 页</div>\n<p>（1）离子交换树脂必须不溶于水，也不会因为被水溶剂化而分解。</p>\n<p>（2）离子交换树脂的高聚物骨架上应有足够数量的交换基团。在树脂被水溶剂化的条件下，交换基团能电离，生成能自由移动的反离子。</p>\n<p>（3）在溶剂化的条件下，树脂内部应当有足够的空间，反离子与外部溶液中相同电荷的离子可以不受阻碍地自由扩散，进行交换。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 131 页</div>\n<p>（4）离子交换树脂必须具有化学稳定性。离子交换树脂应当不溶于无机酸、碱、盐的水溶液，也不溶于各种有机溶剂。</p>\n<p>（5）离子交换树脂必须具有物理稳定性。离子交换树脂应当有足够的机械强度和使用寿命，能够耐热和耐辐照。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 132 页</div>\n<p>4.2.3 其他柱色谱法</p>\n<p>离子交换分离方法</p>\n<p>离子交换</p>\n<p>树脂的预处理</p>\n<p>装柱和转型</p>\n<p>筛分（粒度选择）、溶胀、酸碱浸泡洗涤</p>\n<p>淋洗(洗脱或解吸)</p>\n<p>预处理方法洗涤</p>\n<p>树脂的再生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 137 页</div>\n<p>用色谱纸或以萃取剂、液体离子交换剂吸附在色谱纸上作固定相，用有机溶剂或水溶液作流动相来分离不同物质的一种色谱分离方法。</p>\n<p>各组分在色谱纸上移动的情况可用比移值Rf来表示：</p>\n<p>4.3 纸色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 148 页</div>\n<p>蒸馏法</p>\n<p>相同温度不同蒸气压</p>\n<p>同位素交换法</p>\n<p>例：重水的制备</p>\n<p>快化学分离法</p>\n<p>1.核化学研究；2.核衰变研究；3.活化分析</p>\n<p>膜分离技术</p>\n<p>利用固态合成高分子膜建立电渗析、扩散渗析、超过滤、微孔过滤和反渗透</p>\n<p>4.6  其它分离方法</p>\n<p>其他分离方法</p>\n</div>", "天然放射性系": "<div class=\"th\"><div class=\"th-top\"><h2>天然放射性系</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span><span class=\"tcb\">11页</span></div><div class=\"src\">来源：第六章 天然放射性元素化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>自然界还存在一些不属于天然放射系而半衰期很长的放射性核素：<sup>40</sup>K、<sup>87</sup>Rb；</p>\n<p>由天然核反应生成的放射性核素：<sup>3</sup>H、<sup>14</sup>C等。</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>人工放射系</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>（4n+2铀系）</p>\n<p>母体：<sup>238</sup>U，</p>\n<p>T<sub>1/2</sub>：4.468×10<sup>9</sup> a；</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>母体：<sup>235</sup>U</p>\n<p>锕系（4n+3）</p>\n<p>T<sub>1/2</sub>：7.038×10<sup>8</sup> a ；</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>母体：<sup>232</sup>Th</p>\n<p>（4n）钍系</p>\n<p>T<sub>1/2</sub>：1.41×10<sup>10</sup>a。</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>人工放射系</p>\n<p>母体：<sup>237</sup>Np</p>\n<p>（ 4n+1）镎系</p>\n<p>T<sub>1/2</sub>：2.14×10<sup>6</sup>a 。</p>\n<p>6.1 放射性核素概况</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>1.天然放射性元素有        种。</p>\n<p><sup>84</sup>Po、<sup>85</sup>At、<sup>86</sup>Rn、<sup>87</sup>Fr、<sup>88</sup>Ra、<sup>89</sup>Ac 、<sup>90</sup>Th、<sup>91</sup>Pa和<sup>92</sup>U</p>\n<p><sup>43</sup>Tc和<sup>61</sup>Pm</p>\n<p>2.人工放射性元素是从<sup>93</sup>Np至118号元素（对/错）</p>\n<p>放射系名称 | 又称 | 起始核素 | 终止核素</p>\n<p>U系 |  |  |</p>\n<p>| 4n+2 | <sup>238</sup>U | <sup>206</sup>Pb</p>\n<p>Ac系 |  |  |</p>\n<p>Th系 |  |  |</p>\n<p>Np系 |  |  |</p>\n<p>| 4n+3 | <sup>235</sup>U | <sup>207</sup>Pb</p>\n<p>| 4n | 232 Th | <sup>208</sup>Pb</p>\n<p>| 4n+1 | 237 Np | <sup>209</sup>Bi</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 108 页</div>\n<p>1898年居里夫人发现了镭。天然镭是铀系、钍系和锕系三个天然放射系的成员，与铀、钍矿共存。</p>\n<p><sup>238</sup>U → <sup>226</sup>Ra；</p>\n<p><sup>232</sup>Th → <sup>224</sup>Ra；</p>\n<p><sup>235</sup>U → <sup>223</sup>Ra。</p>\n<p>由于镭在衰变过程中的反冲作用以及镭的物理化学和结晶化学性质，它在矿石受地下水浸蚀时易被浸出，其流失量可达85%。</p>\n<p>6.4.1 镭化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 125 页</div>\n<p>1899年欧文和卢瑟夫在研究钍的放射性时，发现了氡，当时称为钍射气（<sup>220</sup>Rn）。次年，道恩又发现了<sup>222</sup>Rn，它们是铀和钍的放射性子体，主要存在于铀、钍矿石、矿井水和矿泉水中，一般所指的氡是<sup>226</sup>Ra的衰变产物<sup>222</sup>Rn。即：</p>\n<p>铀系：<sup>226</sup>Ra→<sup>222</sup>Rn → <sup>218</sup>Po(RaA)→<sup>214</sup>Pb(RaB) →<sup>214</sup>Bi (RaC)→<sup>214</sup>Po (RaCʹ)→</p>\n<p>钍系：<sup>224</sup>Ra→<sup>220</sup>Rn → <sup>216</sup>Po(ThA)→<sup>212</sup>Pb(ThB) →<sup>212</sup>Bi (ThC)→<sup>212</sup>Po (ThCʹ)→</p>\n<p>6.4.2 氡化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 126 页</div>\n<p>氡有27 种同位素和３种同质异能素。</p>\n<p>在氡的放射性同位素中最重要的是三个天然放射系的成员<sup>222</sup>Rn、 <sup>220</sup>Rn和<sup>219</sup>Rn。</p>\n<p>它们分别被称为镭、钍和锕射气。</p>\n<p>氡的核素</p>\n<p>6.4.2 氡化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 148 页</div>\n<p>钋是1898年被玛丽．居里夫人发现的，这了纪念她的祖国波兰，而命名为Polonium，尽管铀系和钍系的衰变均可产生钋，但它含量很低，地壳中钋的分布量2×10-14%。</p>\n<p>6.4.3 钋化学</p>\n</div>", "锕系元素与核反应": "<div class=\"th\"><div class=\"th-top\"><h2>锕系元素与核反应</h2><span class=\"tt\" style=\"background:#f77f00\">问答/计算</span><span class=\"tcb\">63页</span></div><div class=\"src\">来源：第七章 锕系理论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>天然放射性元素（84~92）</p>\n<p>铀系（4n+2）</p>\n<p>锕系（4n+3）</p>\n<p>钍系（4n）</p>\n<p><sup>238</sup>U→<sup>234</sup>Th →<sup>234</sup>U →<sup>230</sup>Th → →…… →<sup>226</sup>Ra →<sup>222</sup>Rn →<sup>210</sup>Po →<sup>206</sup>Pb</p>\n<p>天然放射性核素：<sup>14</sup>N +1n →<sup>3</sup>T+<sup>12</sup>C</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>锕系元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>7.1 锕系概论</p>\n<p>7.2 镎化学</p>\n<p>7.3 钚化学</p>\n<p>7.4 镅化学</p>\n<p>7.5 锔与超锔元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>锕系理论</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>原子是一种电中性的粒子。</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>原子的组成</p>\n<p>带正电荷的原子核</p>\n<p>带负电的核外电子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n<p>在含有多个电子的原子里，电子的能量并不相同。能量低的电子通常在离核近的区域运动，能量高的电子通常在离核远的区域运动。</p>\n<p>电子层表示离核远近的不同。</p>\n<p>K     L     M     N      O      P      Q</p>\n<p>能量逐渐升高</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n<p>电子运动没有确定的轨道</p>\n<p>电子运动是有规律的</p>\n<p>核外空间电子出现的概率。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n<p>核外电子排布</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>在原子中，电子总是尽可能先进入能量较低的轨道，以使原子处于能量最低的状态。</p>\n<p>而只有当能量最低的亚层填满后，电子才进入能量较高的亚层。</p>\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>2.泡利不相容原理</p>\n<p>在同一原子中，不可能有两个电子具有完全相同的四个量子数。如果原子中电子的n、L、m三个量子数都相同，则第四个量子数ms一定不同，即同一轨道上最多能容纳2个自旋方向相反的电子。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>2.泡利（Pauli）不相容原理</p>\n<p>3.洪特（Hund）规则</p>\n<p>在同一亚层的各个轨道(即等价轨道)上，电子的排布将尽可能分占不同的轨道，并且自旋方向相同。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>洪特规则特例</p>\n<p>对于同一电子亚层，轨道在全充满、半充满或全空的状态是比较稳定的，也就是说下列电子层结构是比较稳定的。</p>\n<p>半充满： p3，d<sub>5</sub>，f7。</p>\n<p>全空： p0，d<sub>0</sub>，f0。</p>\n<p>全充满：p6，d<sub>10</sub>，f14。</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p><sup>24</sup>Cr不是3d44s2,而是3d54s1</p>\n<p><sup>29</sup>Cu不是3d94s2,而是3d104s1</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>7.1 锕系通论——电子结构</p>\n<p>锕系元素（actinides，简写An）</p>\n<p>元素 | 原子序数 | 符号 | 价电子层结构</p>\n<p>锕 | 89 | Ac | 6d17s2</p>\n<p>钍 | 90 | Th | 6d27s2</p>\n<p>镤 | 91 | Pa | 5f26d17s2</p>\n<p>铀 | 92 | U | 5f36d17s2</p>\n<p>镎 | 93 | Np | 5f46d17s2</p>\n<p>钚 | 94 | Pu | 5f6      7s2</p>\n<p>镅 | 95 | Am | 5f7          7s2</p>\n<p>锔 | 96 | Cm | 5f76d17s2</p>\n<p>锫 | 97 | Bk | 5f9           7s2</p>\n<p>锎 | 98 | Cf | 5f10          7s2</p>\n<p>锿 | 99 | Es | 5f11         7s2</p>\n<p>镄 | 100 | Fm | 5f12      7s2</p>\n<p>钔 | 101 | Md | 5f13         7s2</p>\n<p>锘 | 102 | No | 5f14      7s2</p>\n<p>铹 | 103 | Lr | 5f146d17s2</p>\n<p>主锕系元素</p>\n<p>次锕系元素</p>\n<p>超铀元素</p>\n<p>铀前元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>钚后的元素（从95号开始）叫超钚元素；</p>\n<p>锔后的元素叫超锔元素，</p>\n<p>镄后的元素叫超镄元素。</p>\n<p>Np、Pu和Am称铀系元素；</p>\n<p>从Cm到Lr的元素称锔系元素。</p>\n<p>锕系元素中的Ac、Pa、Np、Pu也存在于自然界中，但含量极微，而Th和U则是锕系元素中发现最早和地壳中含量较多的放射性元素。</p>\n<p>7.1 锕系通论——电子结构</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>7.1 锕系通论——原子半径</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>7.1 锕系通论——原子半径</p>\n<p>名称 |  | 锕 | 钍 | 镤 | 铀 | 镎 | 钚 | 镅 | 锔 | 锫 | 锎 | 锿 | 镄 | 钔 | 锘 | 铹</p>\n<p>符号 |  | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf | Es | Fm | Md | No | Lr</p>\n<p>半径/Å | 三价 | 1.11 | 1.08 | 1.05 | 1.03 | 1.01 | 1.00 | 0.99 | 0.986 | 0.981 | 0.976 | 0.97 |  |  |  |</p>\n<p>| 四价 |  | 0.99 | 0.96 | 0.93 | 0.92 | 0.90 | 0.89 | 0.88 | 0.87 |  |  |  |  |  |</p>\n<p>| 五价 |  |  | 0.90 | 0.89 | 0.88 | 0.87 | 0.86 |  |  |  |  |  |  |  |</p>\n<p>| 六价 |  |  |  | 0.83 | 0.82 | 0.81 | 0.80 |  |  |  |  |  |  |  |</p>\n<p>表  锕系元素离子半径</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>锕系元素的离子半径随原子序数的增加而减小，这种收缩是连续的但不均匀，前面几个元素的离子半径随5f电子的充填收缩较大，后面元素的半径收缩趋势就愈来愈小，其结果就使锕系元素的化学行为的差别随原子序数的增加而逐渐变小，以致分离超铀元素变得越来越困难。</p>\n<p>7.1 锕系通论——半径</p>\n<p>锕系收缩现象</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>锕系元素的化学性质与镧系元素相似，但比镧系复杂。由于锕系元素5f层电子的结合能，比镧系元素4f电子的结合能小，而且锕系元素的前几个元素有6d电子，故锕系元素有一系列氧化态（化合价）。</p>\n<p>7.1 锕系通论——价态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>表  锕系元素的价态</p>\n<p>原子序数 | 89 | 90 | 91 | 92 | 93 | 94 | 95 | 96 | 97 | 98 | 99 | 100 | 101 | 102 | 103</p>\n<p>元素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf | Es | Fm | Md | No | Lr</p>\n<p>态 | (2) | (2) |  | 2 |  |  | 2(2) | (2) |  | 2 | 2 | 2 | 2 | 2 |</p>\n<p>| 3 | 3 | (3) | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3</p>\n<p>|  | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 |  |  |  |  |</p>\n<p>|  |  | 5 | 5 | 5 | 5 | 5 |  |  | (5) |  |  |  |  |</p>\n<p>|  |  |  | 6 | 6 | 6 | 6 |  |  |  |  |  |  |  |</p>\n<p>|  |  |  |  | 7 | 7 | (7) |  |  |  |  |  |  |  |</p>\n<p>7.1 锕系通论——价态</p>\n<p>下面有横线的是最稳定的价态；有括号的价态是尚不确定的价态。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>核反应中达到所需裂变物质的最小反应物的质量，也就是刚好可以产生连锁反应的组合，所需最小系统质量，超过此质量就会发生核反应。</p>\n<p>7.1 锕系通论——临界质量</p>\n<p>临界质量</p>\n<p>其大小受核子的性质、物理性质、物料形状、纯度、是否被中子反射物所包围、是否有中子吸收物料等因素影响。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>表   可裂变部分锕系的最小临界质量</p>\n<p>7.1 锕系通论——临界质量</p>\n<p>核素 | 临界质量（g） | 浓度（g L-1）</p>\n<p><sup>242</sup>Am | 23 | 5</p>\n<p><sup>243</sup>Cm | 213 | 40</p>\n<p><sup>245</sup>Cm | 42 | 15</p>\n<p><sup>247</sup>Cm | 159 | 60</p>\n<p><sup>249</sup>Cf | 32 | 20</p>\n<p><sup>251</sup>Cf | 10 | 6</p>\n<p><sup>235</sup>U | 22.8kg | 820</p>\n<p><sup>239</sup>Pu | 5.6kg(α-Pu)或7.6kg(δ-Pu) | 510</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>新制备的锕系金属呈银白色或银灰色，有很高的密度；</p>\n<p>能相互形成许多种合金体系；</p>\n<p>由于金属态锕系元素的电正性很大，可与大多数非金属直接化合，在空气中很快变暗；</p>\n<p>与沸水或稀酸反应放出氢气，与浓H2SO4和HNO3作用时由于形成氧化膜而难溶解。</p>\n<p>7.1 锕系通论——金属性质</p>\n<p>锕系元素金属的性质</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>锕系元素从锕到锫的金属态均己制得。</p>\n<p>能大规模生产的有：钚、镎、镅；</p>\n<p>小规模生产的有：锔、锫、锎等。</p>\n<p>其中Th、U和Pu己经大规模生产而用作核燃料，超锫金属还未得到。</p>\n<p><sup>235</sup>U、<sup>239</sup>Pu等锕系元素都是裂变物质，当它们堆聚到一定量时，在一定的反射条件和分布形状下，就要发生链式反应，引起爆炸。例如，<sup>235</sup>U金属球状金属有水全反射时，临界质量为23kg，<sup>235</sup>U水溶液的最小临界质量只有800g。</p>\n<p>7.1 锕系通论——金属性质</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>7.1 锕系通论——化合物</p>\n<p>氢化物</p>\n<p>锕系元素金属与氢加热至200-300℃，固体金属即变成粉末状氢化物。氢化物遇热不稳定，在减压下或真空中加热至300℃则分解成粉末状金属。氢化物的化学性质很活泼，在空气中能自燃，它能与许多物质起反应，可以作为合成某些化合物的起始物质。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>锕系元素能形成MH2和MH3两种氢化物</p>\n<p>7.1 锕系通论——化合物</p>\n<p>氢化物</p>\n<p>表  锕系元素的氢化物</p>\n<p>元 素 | Th | Pa | U | Np | Pu | Am | Cm</p>\n<p>氢化物 | ThH2</p>\n<p>Th4H15 | PaH3 | α，β-UH3 | PuH2</p>\n<p>NpH3 | PuH2</p>\n<p>PuH3 | AmH2</p>\n<p>AmH3 | CmH2</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>表 锕系元素的氧化物</p>\n<p>7.1 锕系通论——化合物</p>\n<p>氧化物</p>\n<p>元素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf</p>\n<p>氧化物 | Ac2O3 |  |  |  |  |  | Am2O3 | Cm2O3 | Bk2O3 | Cf2O3</p>\n<p>|  | ThO2 | PaO2 | UO2 | NpO2 | PuO2 | AmO2 | CmO2 | BkO2 | Cf O<sub>2</sub></p>\n<p>|  |  | Pa2O5 |  | Np2O5 |  |  |  |  |</p>\n<p>|  |  |  | UO3 | NpO3 |  |  |  |  |</p>\n<p>|  |  |  | U3O8 | Np3O8 |  |  |  |  |</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>7.1 锕系通论——化合物</p>\n<p>卤化物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>锕系元素的碳化物类型有MC、M2C3和MC2，Pu还可形成Pu3C2。锕系元素中除U和Th外，其余的元素仅能形成一氮化物MN。</p>\n<p>7.1 锕系通论——化合物</p>\n<p>碳化物和氮化物</p>\n<p>元素 | Th | Pa | U | Np | Pu</p>\n<p>氮化物 | ThN |  | UN | NpN | PuN</p>\n<p>| Th3N4 |  | UNx |  |</p>\n<p>|  |  | UN2 |  |</p>\n<p>碳化物 | ThC | PaC | UC | NpC | PuC</p>\n<p>| Th2C3 |  | U2C3 | Np2C3 | Pu2C3</p>\n<p>| ThC2 | PaC2 | UC2 |  | PuC2</p>\n<p>锕系元素的氮化物和碳化物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>7.1 锕系通论——化合物</p>\n<p>氧化物可以制作和材料</p>\n<p>卤化物尤其是氟化物是制备锕系化合物的中间体</p>\n<p>铀和钚的碳化物的导热性比氧化物的高，将来可能作高温下工作的快中子增殖堆的核燃料</p>\n<p>含氧酸盐常用于锕系元素的水溶液化学的研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>表  锕系部分离子状态</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系元素离子状态</p>\n<p>元  素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf</p>\n<p>M<sub>3</sub>+ | 无 |  |  | 红 | 兰→紫 | 兰→紫 | 淡红 | 无 | 绿 | 绿</p>\n<p>M<sub>4</sub>+ |  | 无 | 无 | 绿 | 黄 | 褐→橙棕 | - | - | 黄 |</p>\n<p>MO2+ |  |  | 无 | - | 绿 | 淡红→紫 | 黄 |  |  |</p>\n<p>MO22+ |  |  |  | 黄 | 淡红→红 | 黄→淡橙 |  |  |  |</p>\n<p>MO53- |  |  |  |  | 暗绿 | 暗绿 |  |  |  |</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+3价 | 形式</p>\n<p>Ac | 稳定</p>\n<p>U | 其水溶液中释放出H2，转变为U4+</p>\n<p>Np | 在水溶液中无氧存在时稳定，但易被空气氧化为Np4+</p>\n<p>Pu | 在水溶液和空气中稳定，但易被弱氧化剂氧化为Pu4+,在自辐射下缓慢氧化</p>\n<p>Am | 稳定</p>\n<p>Cm | 稳定</p>\n<p>Bk | 稳定，但能被氧化为Bk4+</p>\n<p>Cf~Lr | 稳定</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+4价 | 形式</p>\n<p>Th | 稳定</p>\n<p>Pa | 无氧存在时稳定</p>\n<p>U | 其水溶液中无氧是稳定，在空气中缓慢氧化为UO22+</p>\n<p>Np | 在水溶液中无氧存在时稳定，在空气中缓慢氧化为NpO22+</p>\n<p>Pu | 在高酸度下稳定，在低酸度下歧化为Pu3+和PuO22+</p>\n<p>Am | 仅能以络离子状态存在，无络合剂时完全歧化为Am3+和AmO2+</p>\n<p>Cm | 仅能以络离子状态存在</p>\n<p>Bk | 稳定，易还原为Bk3+，能在自身α辐射下迅速还原</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+4价 | 形式</p>\n<p>UO2+ | 歧化为U4+和UO22+，在pH为2~4时稳定</p>\n<p>NpO2+ | 稳定，在高酸度下歧化</p>\n<p>PuO2+ | 常发生歧化，在pH为2~6时稳定</p>\n<p>AmO2+ | 稳定，在强酸中歧化，低酸度下能在自身α辐射下迅速还原</p>\n<p>UO22+ | 稳定，难于还原</p>\n<p>NpO22+ | 稳定，容易还原</p>\n<p>PuO22+ | 稳定，很易还原，能在自身α辐射下缓慢还原</p>\n<p>AmO22+ | 能在自身α辐射下迅速还原</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>如何评价锕系离子在水溶液中的稳定性？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>一种元素在溶液中的各种价态的稳定性，一般用元素在不同价态间的标准电极电势或摩尔还原电势来表示</p>\n<p>电势越负，从低价态氧化到高价态的趋势越大</p>\n<p>电势越正，从高价态还原到高价态的趋势越大</p>\n<p>还原电势</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>改变电极电势的方法</p>\n<p>1.络合物</p>\n<p>2.溶液酸度</p>\n<p>利用络合生成效应，改变元素不同价态间的稳定性</p>\n<p>如果氧化还原过程中铀H+参加反应，那么可以通过调节溶液酸度来控制其价态的稳定性。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>离子的自身氧化还原反应，称为歧化反应。</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>歧化反应</p>\n<p>歧化势越大，离子发生歧化反应的倾向越大</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>元素 | <sup>3</sup>M(IV)↔<sup>2</sup>M(III)+M(VI) | <sup>3</sup>M(V)↔<sup>2</sup>M(IV)+M(VI)</p>\n<p>U | -0.969 | -0.55</p>\n<p>Np | -0.783 | -0.398</p>\n<p>Pu | -0.064 | 0.254</p>\n<p>Am | 0.96 | -</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>歧化反应</p>\n<p>表 锕系元素歧化势</p>\n<p>不同元素，不同价态的歧化能力不同</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>金属离子水解即是它们与OH-的络合。</p>\n<p>锕系元素离子的半径较小和电荷较高，在水溶液中大都要发生水解，形成 M(OH)(n<sup>-1</sup>)+等物。</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>水解反应</p>\n<p>水解程度递减顺序</p>\n<p>M<sub>4</sub>+&gt;MO22+&gt; M<sub>3</sub>+&gt;MO2+</p>\n<p>Mn++H2O↔M(OH)(n<sup>-1</sup>)++H+</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>溶液中锕系元素络合物的稳定性按下列顺序降低</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>络合反应</p>\n<p>在较低浓度时，某些锕系离子还易形成胶体溶液</p>\n<p>低酸度下的Pu(IV)</p>\n<p>易形成胶体</p>\n<p>聚合钚。</p>\n<p>一旦形成很难降解。</p>\n<p>抑制水解：（1）酸性条件；（2）加入络合阴离子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>溶液中，同种锕系元素络合物的稳定性</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>络合反应</p>\n<p>溶液中，四价锕系元素络合物的稳定性</p>\n<p>溶液中，六价锕系元素络合物的稳定性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>7.1 锕系通论——萃取化学</p>\n<p>研究较多的是锕系元素离子与中性磷类萃取剂配合，形成萃取配合物。</p>\n<p>最重要的是TBP、TOPO等</p>\n<p>TBP萃取锕系离子</p>\n<p>萃取能力</p>\n<p>M<sub>4</sub>++<sup>4</sup>NO3-+<sup>2</sup>TBP(o)↔M(NO3)4·<sup>2</sup>TBP(o)</p>\n<p>M<sub>3</sub>++<sup>3</sup>NO3-+<sup>3</sup>TBP(o)↔M(NO3)3·<sup>3</sup>TBP(o)</p>\n<p>MO2++NO3-+TBP(o)↔MO2NO3·TBP(o)</p>\n<p>MO22++<sup>2</sup>NO3-+<sup>2</sup>TBP(o)↔MO2(NO3)2·<sup>2</sup>TBP(o)</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>铀和钍是天然放射性元素。</p>\n<p>锕和镤的同位素是铀和钍的衰变产物。</p>\n<p>超铀元素的人工制备</p>\n<p>7.1 锕系通论——来源</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>超铀元素获得方法</p>\n<p>① 在核反应堆中用中子照射铀或其他锕系元素。在这种情况下，元素的核连续俘获一些中子，得到的核又继续进行β衰变，生成重锕系元素。</p>\n<p>② 在热核爆炸中脉冲中子流照射铀和其他锕系元素。在这种情况下，核同样多次俘获中子，接着进行β衰变，生成重锕系元素。</p>\n<p>③用p、d、α、     、       、      等照射第七周期元素而获得。</p>\n<p>7.1 锕系通论——来源</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>锕系元素（<sup>235</sup>U、<sup>233</sup>U、<sup>239</sup>Pu）能做核燃料；</p>\n<p>锕系元素<sup>245</sup>Cm、<sup>249</sup>Cf和<sup>242</sup>Am可用做小型反应堆的核燃料，因为这些核素在热中子裂变时有非常小的临界质量，其质量用克计算。</p>\n<p>锕系元素（<sup>242</sup>Cm、<sup>244</sup>Cm、<sup>238</sup>Pu），能做同位素能量发生器，</p>\n<p>做各种辐射源：<sup>241</sup>Am可做γ源，<sup>238</sup>Pu、<sup>241</sup>Am、<sup>242</sup>Cm、<sup>254</sup>Es可做α源，<sup>252</sup>Cf可做中子源等。</p>\n<p>7.1 锕系通论——应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>1. 凝聚态下钚及其相邻元素5f电子结构及如何成键</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>2.锕系元素释放到环境中与环境介质的相互作用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>3.锕系的理论计算</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>4. 超锕系元素的研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>核外电子排布原理？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  超铀元素？</p>\n<p>2. 主锕系元素？</p>\n<p>1.能量最低原理</p>\n<p>2.泡利（Pauli）不相容原理</p>\n<p>3.洪特（Hund）规则</p>\n<p>铀和钚</p>\n<p>铀后的元素，Np~Lr</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>1） 水解反应  各种价态的镎都容易发生水解，其水解能力按下列顺序变化：</p>\n<p>Np<sub>4</sub>+&gt;NpO22+&gt;Np<sub>3</sub>+&gt;</p>\n<p>2）歧化反应  当不存在络合剂时，各种价态的镎都不发生歧化反应，Np(V)也不发生歧化，这与其它+5价锕系离子（如U等）是不一样的。</p>\n<p>3）络合反应  各种价态的镎的络合能力按下列顺序变化：</p>\n<p>7.2 镎化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>钚同铀和镎一样，是活泼金属。在空气中易被氧化，其氧化速度与空气的相对湿度有关，相对湿度越大，氧化速度越快。粉末状的钚在空气中能自燃，而生成PuO2。</p>\n<p>7.3 钚化学</p>\n<p>金属钚</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>钚能形成一系列难溶的氢氧化物</p>\n<p>如Pu(OH)3·xH2O 、 Pu(OH)4·xH2O 、PuO2OH、PuO2(OH)2等，都是胶体物质， 是兰色沉淀，在空气中很快被氧化成 绿色凝胶物Pu(OH)4·xH2O 。Pu(OH)4·xH2O是最常见的，它可溶于稀酸，在高温下加热可转化为PuO2。</p>\n<p>7.3 钚化学</p>\n<p>氢氧化物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>钚在水溶液中有+3~+7五种价态，分别以水合的Pu3+、Pu<sub>4</sub>+、         、        和            形式存在于水溶液中，其中最稳定的是Pu4+，其次是Pu6+，而铀最稳定的价态是U(VI)，它比Pu（VI）稳定，这符合铀和超铀元素高价态的稳定性随原子序数的增加而降低的规律。</p>\n<p>7.3 钚化学</p>\n<p>钚的水溶液化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 88 页</div>\n<p>钚能形成一系列难溶性盐类，如PuF4、草酸钚［Pu(C2O4)2］和碘酸钚［Pu(IO3)4］。难溶性的钚盐是沉淀法分离、浓集和纯化钚的重要化合物。比如Pu(C2O4)2是将Pu(NO3)4转化为金属钚的中间产物，Pu(C2O4)2加热分解为PuO2。</p>\n<p>7.3 钚化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 96 页</div>\n<p>钚的应用与监测</p>\n<p>钚能做核燃料，因此，钚在工业上的重要性超过其它所有的人造元素。<sup>239</sup>Pu的生产比<sup>235</sup>U容易，且钚弹的效率比铀弹高，容易做到小型化。<sup>239</sup>Pu还可作核动力堆特别是快中子堆的燃料。</p>\n<p>7.3 钚化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 109 页</div>\n<p>2 锫（Bk）</p>\n<p>1949年汤普森等用<sup>35</sup>MeV 的α粒子轰击<sup>241</sup>Am（镅）制得第一个锫同位素<sup>243</sup>Bk</p>\n<p>命名为锫是为了纪念曾合成多种锕系元素泊城市伯克利。</p>\n<p>在室温下呈六方晶系,在高温下呈面心立方晶系,已发现了9种锫的同位素，其中以α放射体<sup>247</sup>Bk的半衰期最长，半衰期为1400年；</p>\n<p>7.5锔和超锔元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 114 页</div>\n<p>锎后元素</p>\n<p>除锫的锎以外，到目前为止，已发现的超锔元素还有14种，即99-112号元素，其中99-103号元素属于锕系元素。</p>\n<p>第99号元素是为了纪念科学家爱恩斯坦。</p>\n<p>100号元素为纪念科学家费米而命名。</p>\n<p>除99号元素可达到微克级外，其它几种元素仅限于示踪量范围。</p>\n<p>7.5锔和超锔元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 115 页</div>\n<p>化合物</p>\n<p>水溶液</p>\n<p>锕系元素</p>\n<p>无机非金属化合物</p>\n<p>络合反应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>Np溶液中最稳定的是（       ）价？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  锕系（        ）物可以制作核材料？</p>\n<p>2. 中子活化分析法计算核反应产额？</p>\n<p>4.  锕系（        ）物可以制备锕系化合物的中间体？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 117 页</div>\n<p>铀和钍是天然放射性元素。</p>\n<p>锕和镤的同位素是铀和钍的衰变产物。</p>\n<p>超铀元素的人工制备</p>\n<p>5. 锕系元素的来源</p>\n<p>知识问答</p>\n</div>", "镭氡计算": "<div class=\"th\"><div class=\"th-top\"><h2>镭氡计算</h2><span class=\"tt\" style=\"background:#e63946\">计算</span><span class=\"tcb\">5页</span></div><div class=\"src\">来源：第七章 锕系理论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>锕系元素（<sup>235</sup>U、<sup>233</sup>U、<sup>239</sup>Pu）能做核燃料；</p>\n<p>锕系元素<sup>245</sup>Cm、<sup>249</sup>Cf和<sup>242</sup>Am可用做小型反应堆的核燃料，因为这些核素在热中子裂变时有非常小的临界质量，其质量用克计算。</p>\n<p>锕系元素（<sup>242</sup>Cm、<sup>244</sup>Cm、<sup>238</sup>Pu），能做同位素能量发生器，</p>\n<p>做各种辐射源：<sup>241</sup>Am可做γ源，<sup>238</sup>Pu、<sup>241</sup>Am、<sup>242</sup>Cm、<sup>254</sup>Es可做α源，<sup>252</sup>Cf可做中子源等。</p>\n<p>7.1 锕系通论——应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>3.锕系的理论计算</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>7.2 镎化学</p>\n<p>核反应产额计算在中子活化分析中的应用</p>\n<p>核反应：A+x→y+B</p>\n<p>B为稳定核</p>\n<p>B的生成速度：</p>\n<p>σ是反应截面：b，1b=10-24cm2；</p>\n<p>θ是粒子通量密度，n/cm2﹒s；</p>\n<p>N A是被照射原子A的数目。</p>\n<p>B为放射性核</p>\n<p>t=0和t=t（辐照时间）区间积分， t=0时，NB=0</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>通过测定短寿命的<sup>238</sup>Np来计算<sup>237</sup>Np。如中子注量率为1×10<sup>13</sup> cm<sup>-2</sup> s<sup>-1</sup>， <sup>237</sup>Np的反应截面为169b，照射质量为1×10－12 g <sup>237</sup>Np24h，得到的<sup>238</sup>Np活度为多少Bq？</p>\n<p>7.2 镎化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>Np溶液中最稳定的是（       ）价？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  锕系（        ）物可以制作核材料？</p>\n<p>2. 中子活化分析法计算核反应产额？</p>\n<p>4.  锕系（        ）物可以制备锕系化合物的中间体？</p>\n</div>", "核素制备方法": "<div class=\"th\"><div class=\"th-top\"><h2>核素制备方法</h2><span class=\"tt\" style=\"background:#4361ee\">填空/问答</span><span class=\"tcb\">24页</span></div><div class=\"src\">来源：第九章 放射性核素的制备</div></div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>9.1 概述</p>\n<p>为什么制备放射性同位素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>迄今为止已发现的放射性核素有2800种，其中常用的有200多种。</p>\n<p>9.2  放射性核素的制备</p>\n<p>分为两大类</p>\n<p>通过反应堆、加速器进行核反应，乏燃料后处理等，<sup>239</sup>Pu、<sup>239</sup>Np、<sup>131</sup>I等。</p>\n<p>天然放射性核素</p>\n<p><sup>238</sup>U、<sup>232</sup>Th、<sup>226</sup>Ra、<sup>210</sup>Po。</p>\n<p>人工放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产</p>\n<p>加速器生产</p>\n<p>乏燃料提取</p>\n<p>制备放射性核素的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>反应堆（核裂变反应堆）</p>\n<p>实现可控核裂变链式反应并把产生的能量转换成热能或电能的装置。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n<p>一个铀原子核裂变，释放约200 MeV的能量，比一个碳原子氧化时放出的能量（4.1eV）几乎大1亿倍；</p>\n<p>1kgU<sup>235</sup>裂变释放的能量相当于2800吨优质煤燃烧或20000吨TNT炸药爆炸时放出的能量。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>反应堆发展历程</p>\n<p>1942.12 费米建成第一座原子核裂变反应堆；</p>\n<p>1945.8 原子弹（利用U<sup>235</sup>和Pu<sup>-239</sup>）；</p>\n<p>1954.1 美国核潜艇下水；</p>\n<p>1954.6 苏联第一座核电站建成。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆“燃烧”（加工）对象？</p>\n<p>反应堆燃料元件按其物理状态可分为固态、液态和气态三大类，其中最广泛应用的是固态燃料元件。</p>\n<p>核燃料元件</p>\n<p>能量的来源</p>\n<p>燃料芯</p>\n<p>金属或其他材料（包壳）</p>\n<p>粘合剂</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>反应堆是一种强大的中子源，其中子通量一般为10<sup>10</sup>~10<sup>13</sup>cm<sup>-2</sup>·s<sup>-1</sup>，可通过反应堆的(n,α)、(n,p)、(n,f)及(n,γ)反应和次级核反应来生产放射性核素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应
