        "html": "<div class=\"chapter-header\">\n<h2>第三章 放射性核素的物理化学</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 同位素效应</span><span class=\"exam-topic-tag\">★ 胶体判定</span><span class=\"exam-topic-tag\">★ 吸附</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>第三章</p>\n<p>放射性核素的物理化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>A</p>\n<p>N</p>\n<p>S0</p>\n<p>mA</p>\n<p>T1/2</p>\n<div class=\"formula-line\">S0=K/MT1/2</div>\n<p>λ</p>\n<p>S</p>\n<p>m</p>\n<p>c</p>\n<p>V</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>（1）T1/2,1 &gt;&gt; T1/2,2         长期平衡 Secular Radioactive Equilibrium</p>\n<p>（2）T1/2,1  &gt; T1/2,2           暂时平衡 Transient Radioactive Equilibrium</p>\n<p>（3）T1/2,1 &lt;T1/2,2             不成平衡 Non-equilibrium</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程内容</p>\n<p>1</p>\n<p>同位素交换</p>\n<p>2</p>\n<p>放射性核素在介质中存在状态</p>\n<p>3</p>\n<p>放射性核素吸附现象</p>\n<p>4</p>\n<p>微量放射性物质在固-液两相之间的分配</p>\n<p>5</p>\n<p>电化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>课程要求</p>\n<p>1</p>\n<p>熟识同位素交换反应</p>\n<p>2</p>\n<p>了解放射性核素在介质中存在状态</p>\n<p>3</p>\n<p>掌握放射性核素的吸附、共沉淀及电化学相关知识</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1</p>\n<p>同位素交换</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.1 同位素效应</p>\n<p>什么是同位素？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1 同位素交换</p>\n<p>3.1 1 同位素效应</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>3.1.3 同位素交换的基本规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1 同位素交换</p>\n<p>不同种分子、原子间进行交换，形成了新的分子种类，即形成了新的化学物质。除此之外，还存在如下的一些运动形态。</p>\n<p>A-B+C-D→A-C+B-D</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>一、同种原子之间</p>\n<p>① 同类分子、不同个体的分子之间，同种原子之间的交换</p>\n<p>3.1 同位素交换</p>\n<p>②不同类分子之间，同种原子之间的交换</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>③ 同一个分子内部、同种原子之间的交换</p>\n<p>3.1 同位素交换</p>\n<p>④ 同类分子处于不同物理状态的两个分子之间的同种原子之间的交换</p>\n<p>S             L                   S                    L</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在体系的物理和化学状态都不变化的情况下，在不同分子间，同一分子内和不同的相之间，相同原子或同位素原子之间都存在着同位素的交换。</p>\n<p>3.1 同位素交换</p>\n<p>二、同位素原子之间</p>\n<p>131I-127I之间的交换，127I为稳定的同位素，131I为放射性原子，即为标记原子。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>利用同位素交换研究核素的存在状态；</p>\n<p>制备标记化合物；</p>\n<p>作为示踪剂等。</p>\n<p>3.1 同位素交换</p>\n<p>同位素交换的应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.1 同位素效应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>由于同位素质量不同而引起的同位素在物理和化学性质上的差别称为同位素效应。</p>\n<p>同位素的核电荷数相同，彼此仅有质量之差，它们的化学行为没有本质的不同，仅在程度上有一些微小的差别。</p>\n<p>对于许多同位素交换反应，其效应的理论预测已被实验证实。</p>\n<p>例：</p>\n<p>3.1.1 同位素效应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>质量--质量差异</p>\n<p>分子的空间形状--即对称性</p>\n<p>转动情况--即分子的转动惯量；</p>\n<p>振动情况--即分子热运动情况，用温度表达；</p>\n<p>其它如结构稳定状况--即分子最低能级状态等等。</p>\n<p>3.1.1 同位素效应</p>\n<p>同位素交换有关因素：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.1 同位素效应</p>\n<p>m：相应物质的质量</p>\n<p>δ：相应分子的对称数（分子在空间转对360°，分子形态复原的次数）</p>\n<p>I：相应分子的转动惯量</p>\n<p>ΔU：反应前后分子最低能级的差值</p>\n<p>T：表示温度</p>\n<p>R：理想气体常数</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.1 同位素效应</p>\n<p>K交换是衡量同位素效应的大小</p>\n<p>K交换远离1，说明体系中各种同位素分布很不均匀，同位素效应大。</p>\n<p>K交换→1，说明体系中各种同位素分布趋向均匀。</p>\n<div class=\"formula-line\">K交换=0与K交换=∞是一个意思，说明同位素“不交换”，理论上是不可能的。</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表   若干同位素交换反应的平衡常数  (25℃）</p>\n<p>3.1.1 同位素效应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.2</p>\n<p>同位素交换</p>\n<p>反应的特征</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.2 同位素交换反应特征</p>\n<div class=\"formula-line\">Q=0</div>\n<div class=\"formula-line\">由于同位素彼此间化学性质相同，所以，除氢以外，所有的同位素交换反应的热效应几乎等于零，即Q=0。</div>\n<p>2. K近似不变的，当然与温度也无关。</p>\n<p>除氢之外，同位素交换反应的平衡常数K交换极近似等于1，且与温度无关。所以，一般情况下，同位素效应可忽略，即K≈1。K近似不变的，当然与温度也无关。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.2 同位素交换反应特征</p>\n<p>同位素交换反应是可逆反应，而可逆反应的热效应等于正反应与逆反应的活化能之差。</p>\n<p>E逆－E正＝Q＝0    E逆＝E正</p>\n<p>所以，同位素交换反应的正反应与逆反应的活化能是相等的。</p>\n<p>3. 同位素交换反应的E逆＝E正。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4. k正＝k逆</p>\n<p>因为平衡常数K交换＝1，所以同位素交换反应的正反应和逆反应的速度常数相等，即k正＝k逆。</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>5. 同位素交换反应的进行，不伴随有普通元素浓度的变化。  熵值</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.3</p>\n<p>同位素交换反应基本规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表示同位素交换反应达到平衡时，AX*的浓度；</p>\n<p>表示同位素交换反应达到平衡时，BX*的浓度。</p>\n<p>体系中AX与AX*的浓度之和为a；</p>\n<p>体系中BX与BX*的浓度之和为b。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>AX*+BX          AX+BX*      (如3H2O与CH3CH2OH)</p>\n<p>以均相（单相）体系为例进行研究</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>R：交换的原子X在AX和BX之间的交换速度（mol/s）。</p>\n<p>AX*+BX          AX+BX*      (如3H2O与CH3CH2OH)</p>\n<div class=\"formula-line\">t=0：AX(AX*)    BX</div>\n<p>a                b</p>\n<p>x0</p>\n<p>t=t：             x                            y</p>\n<p>t→∞：          x∞                                     y∞                          体系平衡</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.3 同位素交换反应基本规律</p>\n<div class=\"formula-line\">x=x0-y=x∞+y∞-y</div>\n<p>积分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>F：交换度，表示同位素（标记原子）在参加交换的物质之间的分配与平衡分配相距的程度。</p>\n<p>AX*+BX2            AX+BX*X</p>\n<div class=\"formula-line\">t=t1/2时，半交换期</div>\n<div class=\"formula-line\">t=0：     a       2b</div>\n<p>t=t：      x                               y</p>\n<p>t→∞：   x∞                                            y∞                          体系平衡</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>AX2*+BX2            AXX*+BX*X</p>\n<div class=\"formula-line\">t=0：     a       2b</div>\n<p>t=t：      x                               y</p>\n<p>t→∞：   x∞                                            y∞                          体系平衡</p>\n<p>AXm*+BXn            AX*Xn-1+BX*Xn-1</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>某种元素的交换速度取决于交换原子在两相中的扩散速度和相界面上的交换速度。</p>\n<p>过程总速度由最慢的阶段决定。</p>\n<p>如果原子在两相中的扩散速度远大于交换速度，则同位素交换是过程的限制阶段</p>\n<p>如果交换速度远大于在一相或两相中原子在两相中的扩散速度，则扩散是过程的限制阶段。</p>\n<p>在非均相条件下，同位素交换服从指数关系。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n<p>非均相体系中</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>新制备好的226Ra放射源，其活度为1000 Bq，放置3 d，能累积222Rn的活度为多少?</p>\n<p>已知222Rn的半衰期为3.82 d。</p>\n<p>419  Bq</p>\n<p>519  Bq</p>\n<p>32  Bq</p>\n<p>51  Bq</p>\n<p>A</p>\n<p>B</p>\n<p>C</p>\n<p>D</p>\n<p>提交</p>\n<div class=\"formula-line\">A=A1,0(1-e-λt)</div>\n<p>单选题</p>\n<p>10分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>以下是几种物质的K交换值，哪种物质的同位素交换效应最大？</p>\n<p>0</p>\n<p>1.002</p>\n<p>6.23</p>\n<p>∞</p>\n<p>A</p>\n<p>B</p>\n<p>C</p>\n<p>D</p>\n<p>提交</p>\n<p>单选题</p>\n<p>10分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2</p>\n<p>放射性核素在介质中存在的状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2  放射性核素在介质中存在的状态</p>\n<p>在自然界中以及人类生产活动中，常常遇到一种或几种物质分散在另一种物质中的分散体系。</p>\n<p>被分散的物质叫做分散相；</p>\n<p>容纳分散相的另一种物质叫做分散介质。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2  放射性核素在介质中存在的状态</p>\n<p>分散体系按分散相颗粒大小的不同，可以分为三类：</p>\n<p>类型 | 颗粒大小（分散相物质，m） | 例子</p>\n<p>粗分散体系 | ＞10-7 | 矿石，乳状液，悬浮液（如油漆）</p>\n<p>胶体分散体系 | 10-7~10-9 | 氢氧化铝溶液，明胶液</p>\n<p>分子与离子分散体系 | ＜10-9 | 气体混合物，一般溶液（如盐水）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>胶体分类</p>\n<p>3.2  放射性核素在介质中存在的状态</p>\n<p>分散相物态 | 分散介质物态 | 胶体名称 | 实例</p>\n<p>固体 | 液体 | 液溶胶（溶胶） | As2S3溶胶，粘土混浊液</p>\n<p>液体 | 液体 | 乳胶 | 油在水里</p>\n<p>气体 | 液体 | 泡沫 | 喷打乳剂</p>\n<p>固体 | 气体 | 气溶胶 | 尘土、烟尘</p>\n<p>液体 | 气体 | 气溶胶 | 薄雾、浓雾</p>\n<p>固体 | 固体 | 凝胶 | 有色玻璃</p>\n<p>液体 | 固体 | 凝胶 | 冻胶</p>\n<p>气体 | 固体 | 凝胶 | 浮石粉末、泡沫塑料</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>物质处于胶体分散状态时，表现出许多特殊的性质：</p>\n<p>胶体体系的分散相颗粒（胶粒）具有特殊的可滤性胶体的粒径介于分子、原子直径与颗粒物直径之间，这样在过滤中可利用这一特点。</p>\n<p>分散相物质具有巨大的表面积</p>\n<p>分散相物质的高度分散，因此分散相物质有着巨大的表面积(㎡/g)；处于界面上分子的状况和物质内部的不同，因此，具有广大界面的胶体分散相物质有着突出的表面性质；</p>\n<p>3.2  放射性核素在介质中存在的状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>物质处于胶体分散状态时，表现出许多特殊的性质：</p>\n<p>胶体体系具有聚结不稳定性特点</p>\n<p>分散相物质具有广大表面积，具有很大的表面自由能，所以胶粒都有自发聚结成较大颗粒的趋势，使体系能量降低。</p>\n<p>处于高度分散状态的微小胶粒具有布朗运动性质，加上胶体颗粒具有强烈的电特性，胶粒带有同种电荷，互相排斥，不利聚结。特殊的光学性质。</p>\n<p>3.2  放射性核素在介质中存在的状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2  放射性核素在介质中存在的状态</p>\n<p>胶体体系的分散相颗粒（胶粒）具有特殊的可滤性</p>\n<p>胶体</p>\n<p>放射性胶体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性胶体及其特性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性物质作分散相形成的胶体体系，即为放射性胶体。</p>\n<p>分散介质</p>\n<p>放射性胶体</p>\n<p>液体（主要是水）</p>\n<p>气体（主要是空气）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性真胶体</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体</p>\n<p>放射性假胶体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>一种是在放射性核素的原子、离子或分子直接聚合在一起，构成胶粒大小的聚集体，分散在介质中，形成放射性胶体分散体系，这称为放射性真胶体。</p>\n<p>真胶体的胶粒很小，比如在液溶胶体系中，这些胶粒聚集体的直径只为10-9 m数量级。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性真胶体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素（离子或分子）被吸附在存在于介质中的其它非放射性悬浮粒子（杂质）上，这种吸附了放射性核素的杂质胶粒为分散相的胶体体系，称为放射性假胶体。此种体系的胶粒直径比真胶体的胶粒要大。</p>\n<p>例：氢氧化铝吸附放射性核素。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性假胶体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在渗析或超滤时，没有透过半透膜（只有离子才能透过的薄膜，如羊皮纸、火棉胶）和超细过滤介质的能力，或者降低了这种能力；</p>\n<p>扩散速度降低；</p>\n<p>在电解质的作用下，能发生凝聚或胶溶（胶粒解聚）的现象；</p>\n<p>在加速力场（重力或超离心力）的作用下，能够沉降；</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>胶粒本身带有电荷，在电场的作用下可向相应的电极方向移动，所以能产生电渗析和电泳现象；特别是放射性气溶胶胶粒更容易带电（多数情况下带正电）；</p>\n<p>胶粒带有放射性，所以可用自身射线照相考察胶粒；</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性胶粒在空气中的浓度虽不高，但由于放射性高度集中在微小的胶粒上，放射性的比活度并不很低，所以，一旦进入生物体内，产生的生物效应却很强；</p>\n<p>在电沉积过程中，反常地难沉积在较活泼的金属上；</p>\n<p>在共结晶、吸附、离子交换、萃取和同位素交换能力方面也有反常行为。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性胶体的形成</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>液体分散体系</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性物质</p>\n<p>气体分散体系（气溶胶）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在溶液中生成难溶水解产物或其他难溶化合物的趋势越大，越有利于放射性胶体（真胶体）的形成。相反，若在溶液中有能与放射性核素形成可溶性络合物的物质（络合物中的配位体）存在，则不利于放射性胶体的形成。</p>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>在强酸介质中，放射性核素一般不形成胶体，当溶液酸度降低时，在一定的pH值条件下，各种放射性核素都能生成胶体粒子，但 碱金属和碱土金属例外，不过在一定条件下能形成假胶体，碱土金属生成假胶体的趋势一般随原子序数的增加而加大。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>③ 杂质粒子的影响</p>\n<p>杂质粒子对212Pb和212Bi胶体的影响 |  |  | </p>\n<p>放射性核素 | 用水稀释后反射性胶体的量/% |  | </p>\n<p> | 未净化得水 | 过滤净化的水 | 离心净化的水</p>\n<p>212Pb | 59.4 | 28 | -</p>\n<p> | 37.9 | - | 15.6</p>\n<p>212Bi | 48.0 | 16.0 | -</p>\n<p> | 87.6 | - | 30.5</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>① 溶解度的影响</p>\n<p>② 溶液的酸度</p>\n<p>③ 杂质粒子的影响</p>\n<p>④ 分散介质液体本身的性质、存在的电解质、溶液的保存时间和温度等的影响。</p>\n<p>研究放射性胶体的形成主要是以水为分散介质而进行的，其它分散介质研究得尚少，介质性质不同，对胶体形成有重大影响。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>① 操作过程</p>\n<p>在放射性物质的研磨、粉碎、过筛以及放射性溶液的鼓泡、蒸发和转移过程中，放射性物质会扩散到空气中，与空气中的尘埃或雾滴结合在一起形成放射性气溶胶（假胶体）。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>② 不稳定性</p>\n<p>天然放射性核素226Ra、224Ra、223Ra在衰变过程中分别放出222Rn、220Rn、219Rn等放射性气体，这些气体及其放射性子体在空气中与尘埃或雾滴相结合形成放射性气溶胶。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>③ 反冲粒子</p>\n<p>放射性核素在衰变时产生的反冲原子在空气中可以形成放射性气溶胶。而且反冲原子往往会将放射性物质带入空气中，比如210Po、239Pu以及超钚元素，特别突出。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>④ 核爆炸</p>\n<p>核武器爆炸时，核裂变反应生成几十种元素的放射性裂变产物，由于高温使周围的物质发生强烈蒸发，将放射性物质卷扬到高空，冷却后在大气中形成大量的放射性气溶胶云，从而形成大量的放射性气溶胶。</p>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在三相中的存在状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>分子状态、气溶胶状态和浮尘状态</p>\n<p>3.2.3 放射性核素在气相中的存在状态</p>\n<p>气相中存在状态</p>\n<p>放射性气溶胶是放射性核素以极小微粒（1～100 nm）形式分散在空气中而形成的，它是放射性核素在气相中一种非常重要的存在形式。</p>\n<p>放射性气溶胶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.3 放射性核素在气相中的存在状态</p>\n<p>由放射性核素的分子或原子形成聚集体而悬浮于空气中，在许多情况下，这些聚集体被气相中的极性分子（水蒸汽、氯化氢、乙烯等）包围着而成为相当稳定的一种气溶胶颗粒。</p>\n<p>放射性核素吸附在气相中的杂质微粒上而形成的气溶胶微粒。</p>\n<p>放射性气溶胶状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>固体物质中，由核衰变或核反应生成的放射性子体，因核反冲的缘故，将在固相中穿行一定的路程。反冲核可能处 于不同的氧化态，在晶体中重新占据晶格结点的位置；或者卡在晶格结点之间。由于它们在晶体中所处环境不同，行为也就不同。离开了结点的原子，处于比较自由的状态，它能扩散到晶体表面或晶体间的缝隙中。由于这些占据晶格结点或卡在结点之间的核素之存在，使晶格受到破坏。</p>\n<p>3.2.4 放射性核素在固相中的存在状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.2.5 放射性核素在液相中的存在状态</p>\n<p>液相中存在状态</p>\n<p>真溶液</p>\n<p>胶体</p>\n<p>强酸介质中，放射性核素形成真溶液，溶液酸度降低时，每种核素在一定的条件下，都可能生成胶体粒子。</p>\n<p>液相内放射性核素所处的两种可能的极端状态（即呈普通离子状态和呈胶体状态）之间，随着pH值的增加，多价元素可生成水解离子、中性分子和聚合结构。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素的吸附状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>吸附放射性核素的固体物质。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>放射性核素从液相或气相转移到固体物质表面的过程。</p>\n<p>放射性核素的吸附现象</p>\n<p>吸附剂</p>\n<p>吸附类型</p>\n<p>物理吸附</p>\n<p>化学吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>吸附质和吸附剂分子间作用力所引起，此力也称作范德华力。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n<p>由于固体表面分子（或原子、离子）存在剩余吸引力而引起的，当吸附剂表面被吸附的一层粒子尚未完全抵消固体表面的力场（即剩余引力）时，可再吸附一层粒子，直到完全抵消固体表面的力场为止，因此，物理吸附是多层吸附。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>吸附剂表面的分子由于作用力没有平衡而保留有自由的力场来吸引吸附质，它是由分子间的吸力所引起的吸附，因此结合力较弱，吸附热较小，吸附和解吸速度也都较快。被吸附物质也较容易解吸出来，所以物理吸附在一定程度上是可逆的。</p>\n<p>如：活性炭对许多气体的吸附，被吸附的气体很容易解脱出来而不发生性质上的变化。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附的特点</p>\n<p>吸附热小</p>\n<p>吸附速率慢</p>\n<p>可逆</p>\n<p>多层吸附</p>\n<p>无选择性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>吸附剂与被吸附的原子、离子或分子发生化学反应，靠化学键力而引起的。</p>\n<p>化学吸附中，吸附剂只能吸附一定结构的物质，所以化学吸附的选择性高。由于固体表面存在不均匀力场，表面上的原子往往还有剩余的成键能力，当气体分子碰撞到固体表面上时便与表面原子间发生电子的交换、转移或共有，形成吸附化学键的吸附作用。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>化学吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>仅发生单分子层吸附；</p>\n<p>吸附热与化学反应热相当；</p>\n<p>有选择性；</p>\n<p>大多为不可逆吸附；</p>\n<p>吸附层能在较高温度下保持稳定等。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>化学吸附的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在</p>\n<p>玻璃上的吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>玻璃的主要成分：SiO2</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>酸性溶液</p>\n<p>Si-O-H键</p>\n<p>普通玻璃：Si-O-Si键和Si-O-M键</p>\n<p>碱性溶液</p>\n<p>Si-O-M键和Si-O-H键</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素在一定条件下可被玻璃表面吸附，改变条件，已被吸附的放射性核素可部分或全部地从玻璃表面上解吸下来。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素的吸附能力与玻璃表面的不同处理过程、玻璃种类以及放射性核素所处的介质条件有关。</p>\n<p>为衡量吸附能力，定义Kα吸附系数</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素的吸附能力与玻璃表面的不同处理过程、玻璃种类以及放射性核素所处的介质条件有关。</p>\n<p>吸附能力与放射性核素本身的性质有关。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 75 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在玻璃上的吸附类型</p>\n<p>② 易发生水解而形成胶体的元素，它们在玻璃上的吸附量随溶液pH值的增加而具有一个极大值。</p>\n<p>③ 阴离子状态存在的元素，只受范得华力作用，因此它在玻璃上的吸附量很低。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>① 不易发生水解的元素，玻璃对它的吸附量随溶液pH值的增加而有规律地增加。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 76 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>加入与放射性核素化学性质相同或相似的稳定核素，可大大降低玻璃对放射性核素的吸附量，或者用这类稳定核素的溶液预先对玻璃器皿表面进行处理，使其达到吸附平衡，从而减少玻璃表面对放射性核素的吸附。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n<p>⑴加入与放射性核素化学性质相同或相似的稳定核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 77 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>较高的酸度下保存放射性溶液或进行操作，可大大减少玻璃的吸附。</p>\n<p>提高溶液的酸度，还可使已被玻璃表面吸附的放射性核素解吸下来。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n<p>(1) 加入与放射性核素化学性质相同或相似的稳定核素</p>\n<p>(2) 提高溶液的酸度</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>用硅烷或其他憎水剂对玻璃表面进行预处理，使玻璃表面形成一层疏水薄膜，从而较少对放射性核素的吸附。这个过程称为玻璃表面的硅烷化处理。</p>\n<p>常用有二甲基二氯硅烷和甲基二氯硅烷</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n<p>(1) 加入与放射性核素化学性质相同或相似的稳定核素</p>\n<p>(2) 提高溶液的酸度</p>\n<p>(3) 硅烷化</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>滤纸是一种能强烈吸附某些放射性核素的吸附剂。</p>\n<p>滤纸吸附放射性核素的机理：放射性核素是以离子状态或以胶体状态而被滤纸吸附的。</p>\n<p>以离子状态被滤纸吸附时，可能是以离子交换形式进行的，</p>\n<p>胶态吸附几乎是不可逆的。</p>\n<p>3.3.2</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 81 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>滤纸对放射性核素存在强烈的吸附作用，因此在放射分离操作时，不宜用滤纸来去除放射性溶液中不溶的滤弃物等杂质，而一般适合用来过滤获得放射性沉淀物，弃去滤液。在放射性测量中，常将待测的放射性核素以沉淀物的形式在滤纸上直接制成放射源而测量。</p>\n<p>如用滤纸过滤分离212Pb、212Bi：</p>\n<p>3.3.2</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 82 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.3.2</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n<p>放射性核素在活性炭上的吸附是分子吸附、离子交换吸附和因静电引力产生的吸附。</p>\n<p>活性炭本身的组成对放射性核素的吸附影响很大。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 83 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性气体在固体物质上的吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 84 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性气体氡在固体物质上的吸附为例，通过研究氡在活性炭上的吸附，表明它符合享利（Henry）定律：在一定温度下，其吸附量与其分压成正比。</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>X--单位重量活性炭所吸附的氡量，</p>\n<p>p--氡在气相中的分压，</p>\n<p>K，n--系数。</p>\n<p>对于一定的吸附体系，它们与气体组分的性质及吸附温度有关，其值可由实验确定（n≥1）。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑴吸附剂的种类和性能</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>一般说来，经过表面活化处理的多孔性吸附剂具有较大的比表面和活性，其吸附能力就较大。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑴吸附剂的种类和性能</p>\n<p>⑵温度</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>由于吸附剂吸附气体是放热过程，所以，体系温度愈高，气体愈不易被吸附，已被吸附的气体愈易从吸附剂表面解吸下来。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>⑴吸附剂的种类和性能</p>\n<p>⑵温度</p>\n<p>⑶被吸附气体的性质及压力</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>被吸附气体的沸点愈高，即较容易凝结为液态的气体，愈容易被吸附。被吸附气体的分压（p）升高（浓度增大），吸附量当然也增加。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>微量放射性物质在固-液两相之间的分配</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 89 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>使微量的放射性核素从溶液中分离出来，向溶液中加入某种常量元素的化合物，当常量元素形成沉淀时，同时将微量的放射性核素从溶液中载带下来，这种微量放射性核素与常量元素共同沉淀的过程即称为共沉淀。</p>\n<p>3.4</p>\n<p>微量放射性物质在‘固-液’两相之间的分配</p>\n<p>共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 90 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素分布在常量物质晶体的内部，与常量物质形成混晶而一起沉淀出来，这种沉淀称为共结晶共沉淀（或体积分配）。</p>\n<p>共沉淀有两种类型</p>\n<p>共结晶共沉淀</p>\n<p>吸附共沉淀</p>\n<p>3.4</p>\n<p>微量放射性物质在‘固-液’两相之间的分配</p>\n<p>微量物质分布在常 量物质晶体的表面而一起沉淀出来，这种沉淀称为吸附共沉淀（或表面分配）。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 91 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>共结晶共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 92 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.1 共结晶共沉淀</p>\n<p>共结晶共沉淀分类</p>\n<p>同晶和同二晶共沉淀</p>\n<p>新类型混晶</p>\n<p>反常混晶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 93 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>微量物质与常量物质的混合物在溶液中结晶时，形成同一晶体的现象，这种混合晶体称为类质同晶，简称同晶。真正的混晶。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>① 同晶和同二晶共沉淀</p>\n<p>同晶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 94 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.1 共结晶共沉淀</p>\n<p>形成同晶共沉淀必须满足条件</p>\n<p>彼此的化学性质相似</p>\n<p>两种物质十分相近的晶体结构</p>\n<p>彼此的化学构型相同</p>\n<p>周期表中相邻的同族元素（如Ca、Sr、Ba），或同一周期相邻的过渡元素（如Fe、Co、Ni）</p>\n<p>所构成的化合物中，相应的阴、阳离子比例相同，相应的原子数比例也相同</p>\n<p>BaSO4-RaSO4-H2O体系</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 95 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>微量物质和常量物质没有混合的上限和下限，微量物质和常量物质可以以任意比例混合而形成同晶共沉淀。</p>\n<p>同晶共沉淀不受沉淀条件的限制；</p>\n<p>如酸度、试剂加入的次序、温度及结晶速度等。</p>\n<p>同晶共沉淀生成之后，不会因洗涤而改变其组成。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>同晶共沉淀特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 96 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>当微量物质与常量物质是化学类似物，并具有相同的化学构型，但它们的稳定结晶结构不相同。如果微量物质在一定条件下能形成一种介稳态（暂时稳定的结晶结构）以适应常量物质的结构，这种强制同晶的现象也能生成真正的混晶共沉淀，这就是同二晶共沉淀。</p>\n<p>同二晶混合上限。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>同二晶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 97 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.1 共结晶共沉淀</p>\n<p>同二晶/强制同晶</p>\n<p>FeSO4∙7H2O-MnSO4∙7H2O</p>\n<p>单斜晶系     FeSO4过量</p>\n<p>FeSO4∙5H2O-MnSO4∙5H2O</p>\n<p>三斜晶系     MnSO4过量</p>\n<p>同二晶混合上限，受沉淀条件影响</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 98 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.1 共结晶共沉淀</p>\n<p>同晶</p>\n<p>同二晶</p>\n<p>真正的混晶</p>\n<p>共同点：没有混合下限</p>\n<p>不同点：同二晶存在混合上限</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 99 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>化学性质并不相似的化合物，只要它们的化学构型和结晶结构相近（正、负离子半径之间的比值相近等），也能形成混晶，就是新类型混晶。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>新类型混晶</p>\n<p>存在混合下限</p>\n<p>分子或小的晶格单位进入晶体</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 100 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>化学性质不相似、结晶结构也不相似的两种化合物形成的混晶、称为反常混晶。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>反常混晶</p>\n<p>2NH4Cl-MnCl2∙2H2O；</p>\n<p>NH4Cl-MnCl3-H2O（其中M为Fe3+、Cr2+）;</p>\n<p>MF3-M'F2-H2O（其中M为Y3+、La2+，M'为Ca2+、Ba2+、Ra2+）;</p>\n<p>M(NO3)2-次甲基蓝-H2O（其中M为Pb3+、Ba2+）;</p>\n<p>AmO2--K4[UO2(CO3)2]</p>\n<p>Pu4+-La2(C2O4)3∙9H2O等</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 101 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>如果整个晶体和溶液间建立了热力学平衡，则微量物质在晶体内的分布是均匀的。那么，微量物质在结晶相和液相间的分配应服从贝斯洛—能斯特（Berthelot—Nernst）定律。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>微量物质在固—液两相的分配</p>\n<p>共结晶共沉淀</p>\n<p>微量物质在结晶固体内</p>\n<p>均匀分配</p>\n<p>非均匀分配</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 102 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>式中：Cs—微量物质在晶体中的浓度；</p>\n<p>CL—微量物质在溶液中的浓度；</p>\n<p>K—分配系数。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>贝斯洛—能斯特（Berthelot—Nernst）定律</p>\n<p>x，x0：微量物质在晶体中的含量和在体系中的总量；</p>\n<p>y，y0：常量物质在晶体中的量和在体系中的总量。</p>\n<p>均匀分配规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 103 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>D＞1时，微量物质和常量物质在固相中的含量比值大于平衡时在溶液中的含量比值，这说明微量物质在结晶中能得到富集。</p>\n<p>D＜1时，微量物质在结晶中得不到富集，反而在溶液中得到富集。</p>\n<p>D＝1时，在常量物质结晶过程中，微量物质和常量物质在溶液中的比值和晶体中的相同。</p>\n<p>3.4.1 共结晶共沉淀</p>\n<p>结晶常数D值与结晶状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 104 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 105 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>微量物质被吸附在常量物质晶体表面而一起共沉淀。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>吸附共沉淀</p>\n<p>分子吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 106 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>被吸附离子进入吸附剂表面的晶格里。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级交换吸附：溶液中离子、晶体表面的离子，并非处于静止状态，它们和溶液中相同种类的离子不断地进行交换。如果溶液中有同种离子（包括同位素离子）或同晶离子存在，则这些离子也能参与交换，而转移到晶体表面，这个过程称为一级交换吸附。同晶离子的交换吸附又称为同晶交换吸附。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 107 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 108 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 109 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>--微量物质和常量物质在晶体表面上的原子数；</p>\n<p>--微量物质和常量物质在溶液中的原子数。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 110 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级吸附特点</p>\n<p>只有与常量晶体同晶或同二晶的离子才能被吸附。</p>\n<p>被吸附化合物溶解度越小，吸附量越大。</p>\n<p>对于一定的常量物质体系，吸附系数与结晶常数D成正比，D取决于常量物质的溶解度与被吸附离子化合物的溶解度的比值。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 111 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子从溶液中转移到紧靠晶体表面的液膜层。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>二级吸附</p>\n<p>二级吸附：液膜层中离子与溶液中相同符号的离子不断地进行交换。这个过程称为二级交换吸附。</p>\n<p>二级交换吸附中，被吸附离子只是停留在紧靠晶体表面的液膜层中并不进入晶体的晶格中。</p>\n<p>二级交换吸附依赖于静电引力。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 112 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 113 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>二级吸附</p>\n<p>二级吸附规律</p>\n<p>被吸附离子的价态数越高，越容易被吸附；</p>\n<p>溶液中晶体本身离子或同晶离子浓度越高，吸收微量放射性核素的量越大；</p>\n<p>竞争离子的浓度越高，放射性核素的吸附系数下降。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 114 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>无定形沉淀的表面性质不稳定。</p>\n<p>新制备的沉淀，其化学组成、表面电荷数和沉淀比表面的大小，可能随时间发生变化。</p>\n<p>新生成的无定形沉淀具有大的发达表面，吸附能力强，随着放置时间延长，表面积缩小，吸附能力下降。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 115 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>无定型沉淀的离子交换吸附可以是一级交换吸附，也可以是二级交换吸附，但后者居多。</p>\n<p>例如，氢氧化锌无定型沉淀表面的液膜层中发生的离子交换吸附，随溶液介质不同，既可与阳离子发生交换，也可与阴离子发生交换。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>离子交换吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 116 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在氢氧化物或氧化物上的吸附是由于它们在沉淀表面上形成了表面化合物造成的,这就是化学吸附。</p>\n<p>例如，MnO2吸附二价金属离子（如Zn2+），是在MnO2表面上，二价金属离子与锰形成了六环螯合结构而被吸附的。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>化学吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 117 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.4.2 吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 118 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素在无定形沉淀上的吸附是属于分子吸附。即放射性物质以分子形式被吸附。如有些银盐（AgNO3，Ag2SO4等）是以分子形式被Fe2O3、Al2O3或SiO2表面吸附的。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>分子吸附</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 119 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>电 化 学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 120 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.5 电化学</p>\n<p>电能</p>\n<p>电解池</p>\n<p>原电池</p>\n<p>化学能</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 121 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>化学反应可分类</p>\n<p>一类是在反应过程中，反应物中的原子或离子所带的电子数没有变化，例如酸－碱反应，沉淀反应等；</p>\n<p>另一类是在反应过程中，反应物中的原子或离子所带的电子数发生了变化。当然，总的电子数既未增加，也未减少，只是电子从一个原子或离子的外层迁移到了另一个原子或离子的外层，也就是说，发生了原子或离子之间的电子传递。原子或离子之间发生电子传递的化学反应，称为氧化一还原反应。</p>\n<p>3.5 电化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 122 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>A还+B氧=A氧+B还</p>\n<p>3.5.1 氧化-还原反应</p>\n<p>A还→A氧+e</p>\n<p>B氧+e → +B还</p>\n<p>升失氧，降得还</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 123 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>能斯特（Nernst）根据热力学方法，从理论上导出了在1大气压和25℃条件下的电极电势的理论计算公式，即某种物质的氧化型与其相应的还原型之间的电势之理论计算式，称为能斯特方程式：</p>\n<p>3.5.1电极电势</p>\n<p>A还+B氧=A氧+B还</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 124 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>为标准电极电势；其物质的标准电极电势是指25 ℃时，该物质的氧化型或还原型以及其他有关离子或分子在水溶液中的浓度都为1 mol L-1 ，并且所有气体的分压都是1atm时，该物质的氧化型与其相应的还原型之间的电势值。</p>\n<p>比如，金属的标准电极电势，就是在25 ℃时，金属同该金属离子浓度为1 mol L-1的溶液相接触时的电势值。</p>\n<p>3.5.1电极电势</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 125 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>E（电极）越低（负）越易失去电子；</p>\n<p>E（电极）越高（正）越易得到电子</p>\n<p>所以</p>\n<p>E（电极）低的金属能从溶液中置换出</p>\n<p>E（电极）  高的金属</p>\n<p>K Ca Na Mg Al ;Zn Fe Sn Pb H2 ;Cu Hg Ag Pt Au.</p>\n<p>(嫁，给，那，美，女；身，体，细，纤，轻；总，共，一，百，斤。)</p>\n<p>3.5.1电极电势</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 126 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.5.1 电极电势</p>\n<p>d ：紧密层厚度10-10m</p>\n<p>：分散层厚度10-1010-8m</p>\n<p>溶液浓度越大， 越小</p>\n<p>M：电极电势</p>\n<p> l：本体溶液电势</p>\n<p>2 ：界面电势差。与电极的种类，温度，离子浓度有关。</p>\n<p>M</p>\n<p></p>\n<p>l</p>\n<p>d</p>\n<p>2</p>\n<p>电极|溶液界面电势2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 127 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>电池电势：任一电池的电动势,都是电池中各界面上所产生的电势差的代数和.</p>\n<p>这些电势差分别是:金属接触电势,阳极界面电势,液体接界电势和阴极界面电势.</p>\n<p>3.5.1 电极电势</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 128 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.5.2 原电池和电解池</p>\n<p>原电池</p>\n<p>电解池</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 129 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.5.2 原电池和电解池</p>\n<p>电势低的电极称为负极，电子从负极流向正极。</p>\n<p>负极：</p>\n<p>电势高的电极称为正极，电流从正极流向负极。</p>\n<p>正极：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 130 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.5.2 原电池和电解池</p>\n<p>电势低的电极称为负极，电子从负极流向正极。</p>\n<p>负极：</p>\n<p>电势高的电极称为正极，电流从正极流向负极。</p>\n<p>正极：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 131 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素的电化学行为特点</p>\n<p>3.5.3 微量放射性核素的电化学</p>\n<p>在高度稀释的溶液中，有许多因素会改变放射性核素的存在状态，如放射性核素在容器壁和杂质上的吸附、放射性胶体的生成、络合物的生成等，使放射性核素出现反常的电化学行为。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 132 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性核素的电化学行为特点</p>\n<p>3.5.3 微量放射性核素的电化学</p>\n<p>放射性元素处在低浓，对于氧化还原反应过程中产生的电子迁移的贡献，往往不是所研究的放射性元素本身而是其它杂质离子；也就是说，研究氧化还原过程的依据--反映在电极上的迁移电流不是主要由放射性元素的迁移电子决定，而是由其他杂质来决定。因此，这给放射性核素电化学研究造成特殊问题。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 133 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>研究某种物质的电极电势，常常需要将某物质做成的电极直接浸入本身离子的溶液中，可是，有些放射性核素太少，以至于不可能得到足够做一个电极的数量；有些虽可得到“可称量”的量，但因放射性比活度太大而不宜安全使用。</p>\n<p>放射性核素的电化学行为特点：</p>\n<p>3.5.3 微量放射性核素的电化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 134 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>微量放射性物质的量极少。</p>\n<p>电极表面无法形成一个单分子层</p>\n<p>能斯特方程不适用（浓度不确定）。</p>\n<p>放射性核素的电化学行为特点</p>\n<p>3.5.3 微量放射性核素的电化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 135 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>总结</p>\n<p>真溶液</p>\n<p>胶体</p>\n<p>放射性物质存在状态</p>\n<p>固态</p>\n<p>液态</p>\n<p>气态</p>\n<p>同位素交换</p>\n<p>玻璃</p>\n<p>滤纸</p>\n<p>活性炭</p>\n<p>分子</p>\n<p>气溶胶</p>\n<p>浮尘</p>\n<p>胶体</p>\n<p>共结晶共沉淀</p>\n<p>吸附共沉淀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 136 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>总结</p>\n<p>真正的混晶</p>\n<p>共结晶共沉淀</p>\n<p>化学性质</p>\n<p>化学构型</p>\n<p>晶体结构</p>\n<p>判断因素</p>\n<p>同晶</p>\n<p>同二晶</p>\n<p>新型混晶</p>\n<p>反常混晶</p>\n<p>上限</p>\n<p>下限</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 137 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>总结</p>\n<p>吸附共沉淀</p>\n<p>离子晶体上</p>\n<p>一级吸附</p>\n<p>二级吸附</p>\n<p>离子交换吸附</p>\n<p>化学吸附</p>\n<p>无定形沉淀上</p>\n<p>晶格里</p>\n<p>液膜层</p>\n<p>物理吸附</p>\n</div></div>"
