        "html": "<div class=\"chapter-header\">\n<h2>第七章 锕系理论</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 核反应式</span><span class=\"exam-topic-tag\">★ 镭氡计算</span><span class=\"exam-topic-tag\">★ 铀钚转化</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>天然放射性元素（84~92）</p>\n<p>铀系（4n+2）</p>\n<p>锕系（4n+3）</p>\n<p>钍系（4n）</p>\n<p>238U→234Th →234U →230Th → →…… →226Ra →222Rn →210Po →206Pb</p>\n<p>天然放射性核素：14N +1n →3T+12C</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系概论</p>\n<p>7.2 镎化学</p>\n<p>7.3 钚化学</p>\n<p>7.4 镅化学</p>\n<p>7.5 锔与超锔元素化学</p>\n<p>目</p>\n<p>录</p>\n<p>课程内容</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系理论</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>原子是一种电中性的粒子。</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>原子的组成</p>\n<p>带正电荷的原子核</p>\n<p>带负电的核外电子</p>\n<p>质子</p>\n<p>中子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——元素周期律</p>\n<p>在含有多个电子的原子里，电子的能量并不相同。能量低的电子通常在离核近的区域运动，能量高的电子通常在离核远的区域运动。</p>\n<p>电子层表示离核远近的不同。</p>\n<p>K     L     M     N      O      P      Q</p>\n<p>能量逐渐升高</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——元素周期律</p>\n<p>电子运动没有确定的轨道</p>\n<p>电子运动是有规律的</p>\n<p>核外空间电子出现的概率。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——元素周期律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——元素周期律</p>\n<p>核外电子排布</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在原子中，电子总是尽可能先进入能量较低的轨道，以使原子处于能量最低的状态。</p>\n<p>而只有当能量最低的亚层填满后，电子才进入能量较高的亚层。</p>\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——元素周期律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>2.泡利不相容原理</p>\n<p>在同一原子中，不可能有两个电子具有完全相同的四个量子数。如果原子中电子的n、L、m三个量子数都相同，则第四个量子数ms一定不同，即同一轨道上最多能容纳2个自旋方向相反的电子。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核外电子排布原理</p>\n<p>1.能量最低原理</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>2.泡利（Pauli）不相容原理</p>\n<p>3.洪特（Hund）规则</p>\n<p>在同一亚层的各个轨道(即等价轨道)上，电子的排布将尽可能分占不同的轨道，并且自旋方向相同。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>洪特规则特例</p>\n<p>对于同一电子亚层，轨道在全充满、半充满或全空的状态是比较稳定的，也就是说下列电子层结构是比较稳定的。</p>\n<p>半充满： p3，d5，f7。</p>\n<p>全空： p0，d0，f0。</p>\n<p>全充满：p6，d10，f14。</p>\n<p>7.1 锕系通论——元素周期律</p>\n<p>24Cr不是3d44s2,而是3d54s1</p>\n<p>29Cu不是3d94s2,而是3d104s1</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>s</p>\n<p>p</p>\n<p>d</p>\n<p>f</p>\n<p>ds</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——电子结构</p>\n<p>锕系元素（actinides，简写An）</p>\n<p>元素 | 原子序数 | 符号 | 价电子层结构</p>\n<p>锕 | 89 | Ac | 6d17s2</p>\n<p>钍 | 90 | Th | 6d27s2</p>\n<p>镤 | 91 | Pa | 5f26d17s2</p>\n<p>铀 | 92 | U | 5f36d17s2</p>\n<p>镎 | 93 | Np | 5f46d17s2</p>\n<p>钚 | 94 | Pu | 5f6      7s2</p>\n<p>镅 | 95 | Am | 5f7          7s2</p>\n<p>锔 | 96 | Cm | 5f76d17s2</p>\n<p>锫 | 97 | Bk | 5f9           7s2</p>\n<p>锎 | 98 | Cf | 5f10          7s2</p>\n<p>锿 | 99 | Es | 5f11         7s2</p>\n<p>镄 | 100 | Fm | 5f12      7s2</p>\n<p>钔 | 101 | Md | 5f13         7s2</p>\n<p>锘 | 102 | No | 5f14      7s2</p>\n<p>铹 | 103 | Lr | 5f146d17s2</p>\n<p>主锕系元素</p>\n<p>次锕系元素</p>\n<p>超铀元素</p>\n<p>铀前元素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚后的元素（从95号开始）叫超钚元素；</p>\n<p>锔后的元素叫超锔元素，</p>\n<p>镄后的元素叫超镄元素。</p>\n<p>Np、Pu和Am称铀系元素；</p>\n<p>从Cm到Lr的元素称锔系元素。</p>\n<p>锕系元素中的Ac、Pa、Np、Pu也存在于自然界中，但含量极微，而Th和U则是锕系元素中发现最早和地壳中含量较多的放射性元素。</p>\n<p>7.1 锕系通论——电子结构</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——原子半径</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——原子半径</p>\n<p>名称 |  | 锕 | 钍 | 镤 | 铀 | 镎 | 钚 | 镅 | 锔 | 锫 | 锎 | 锿 | 镄 | 钔 | 锘 | 铹</p>\n<p>符号 |  | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf | Es | Fm | Md | No | Lr</p>\n<p>半径/Å | 三价 | 1.11 | 1.08 | 1.05 | 1.03 | 1.01 | 1.00 | 0.99 | 0.986 | 0.981 | 0.976 | 0.97 |  |  |  | </p>\n<p> | 四价 |  | 0.99 | 0.96 | 0.93 | 0.92 | 0.90 | 0.89 | 0.88 | 0.87 |  |  |  |  |  | </p>\n<p> | 五价 |  |  | 0.90 | 0.89 | 0.88 | 0.87 | 0.86 |  |  |  |  |  |  |  | </p>\n<p> | 六价 |  |  |  | 0.83 | 0.82 | 0.81 | 0.80 |  |  |  |  |  |  |  | </p>\n<p>表  锕系元素离子半径</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素的离子半径随原子序数的增加而减小，这种收缩是连续的但不均匀，前面几个元素的离子半径随5f电子的充填收缩较大，后面元素的半径收缩趋势就愈来愈小，其结果就使锕系元素的化学行为的差别随原子序数的增加而逐渐变小，以致分离超铀元素变得越来越困难。</p>\n<p>7.1 锕系通论——半径</p>\n<p>锕系收缩现象</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素的化学性质与镧系元素相似，但比镧系复杂。由于锕系元素5f层电子的结合能，比镧系元素4f电子的结合能小，而且锕系元素的前几个元素有6d电子，故锕系元素有一系列氧化态（化合价）。</p>\n<p>7.1 锕系通论——价态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  锕系元素的价态</p>\n<p>原子序数 | 89 | 90 | 91 | 92 | 93 | 94 | 95 | 96 | 97 | 98 | 99 | 100 | 101 | 102 | 103</p>\n<p>元素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf | Es | Fm | Md | No | Lr</p>\n<p>价</p>\n<p>态 | (2) | (2) |  | 2 |  |  | 2(2) | (2) |  | 2 | 2 | 2 | 2 | 2 | </p>\n<p> | 3 | 3 | (3) | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3 | 3</p>\n<p> |  | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 | 4 |  |  |  |  | </p>\n<p> |  |  | 5 | 5 | 5 | 5 | 5 |  |  | (5) |  |  |  |  | </p>\n<p> |  |  |  | 6 | 6 | 6 | 6 |  |  |  |  |  |  |  | </p>\n<p> |  |  |  |  | 7 | 7 | (7) |  |  |  |  |  |  |  | </p>\n<p>7.1 锕系通论——价态</p>\n<p>下面有横线的是最稳定的价态；有括号的价态是尚不确定的价态。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核反应中达到所需裂变物质的最小反应物的质量，也就是刚好可以产生连锁反应的组合，所需最小系统质量，超过此质量就会发生核反应。</p>\n<p>7.1 锕系通论——临界质量</p>\n<p>临界质量</p>\n<p>其大小受核子的性质、物理性质、物料形状、纯度、是否被中子反射物所包围、是否有中子吸收物料等因素影响。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表   可裂变部分锕系的最小临界质量</p>\n<p>7.1 锕系通论——临界质量</p>\n<p>核素 | 临界质量（g） | 浓度（g L-1）</p>\n<p>242Am | 23 | 5</p>\n<p>243Cm | 213 | 40</p>\n<p>245Cm | 42 | 15</p>\n<p>247Cm | 159 | 60</p>\n<p>249Cf | 32 | 20</p>\n<p>251Cf | 10 | 6</p>\n<p>235U | 22.8kg | 820</p>\n<p>239Pu | 5.6kg(α-Pu)或7.6kg(δ-Pu) | 510</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>新制备的锕系金属呈银白色或银灰色，有很高的密度；</p>\n<p>能相互形成许多种合金体系；</p>\n<p>由于金属态锕系元素的电正性很大，可与大多数非金属直接化合，在空气中很快变暗；</p>\n<p>与沸水或稀酸反应放出氢气，与浓H2SO4和HNO3作用时由于形成氧化膜而难溶解。</p>\n<p>7.1 锕系通论——金属性质</p>\n<p>锕系元素金属的性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素从锕到锫的金属态均己制得。</p>\n<p>能大规模生产的有：钚、镎、镅；</p>\n<p>小规模生产的有：锔、锫、锎等。</p>\n<p>其中Th、U和Pu己经大规模生产而用作核燃料，超锫金属还未得到。</p>\n<p>235U、239Pu等锕系元素都是裂变物质，当它们堆聚到一定量时，在一定的反射条件和分布形状下，就要发生链式反应，引起爆炸。例如，235U金属球状金属有水全反射时，临界质量为23kg，235U水溶液的最小临界质量只有800g。</p>\n<p>7.1 锕系通论——金属性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——化合物</p>\n<p>氢化物</p>\n<p>锕系元素金属与氢加热至200-300℃，固体金属即变成粉末状氢化物。氢化物遇热不稳定，在减压下或真空中加热至300℃则分解成粉末状金属。氢化物的化学性质很活泼，在空气中能自燃，它能与许多物质起反应，可以作为合成某些化合物的起始物质。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素能形成MH2和MH3两种氢化物</p>\n<p>7.1 锕系通论——化合物</p>\n<p>氢化物</p>\n<p>表  锕系元素的氢化物</p>\n<p>元 素 | Th | Pa | U | Np | Pu | Am | Cm</p>\n<p>氢化物 | ThH2</p>\n<p>Th4H15 | PaH3 | α，β-UH3 | PuH2</p>\n<p>NpH3 | PuH2</p>\n<p>PuH3 | AmH2</p>\n<p>AmH3 | CmH2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表 锕系元素的氧化物</p>\n<p>7.1 锕系通论——化合物</p>\n<p>氧化物</p>\n<p>元素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf</p>\n<p>氧化物 | Ac2O3 |  |  |  |  |  | Am2O3 | Cm2O3 | Bk2O3 | Cf2O3</p>\n<p> |  | ThO2 | PaO2 | UO2 | NpO2 | PuO2 | AmO2 | CmO2 | BkO2 | Cf O2</p>\n<p> |  |  | Pa2O5 |  | Np2O5 |  |  |  |  | </p>\n<p> |  |  |  | UO3 | NpO3 |  |  |  |  | </p>\n<p> |  |  |  | U3O8 | Np3O8 |  |  |  |  |</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——化合物</p>\n<p>卤化物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素的碳化物类型有MC、M2C3和MC2，Pu还可形成Pu3C2。锕系元素中除U和Th外，其余的元素仅能形成一氮化物MN。</p>\n<p>7.1 锕系通论——化合物</p>\n<p>碳化物和氮化物</p>\n<p>元素 | Th | Pa | U | Np | Pu</p>\n<p>氮化物 | ThN |  | UN | NpN | PuN</p>\n<p> | Th3N4 |  | UNx |  | </p>\n<p> |  |  | UN2 |  | </p>\n<p>碳化物 | ThC | PaC | UC | NpC | PuC</p>\n<p> | Th2C3 |  | U2C3 | Np2C3 | Pu2C3</p>\n<p> | ThC2 | PaC2 | UC2 |  | PuC2</p>\n<p>锕系元素的氮化物和碳化物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——化合物</p>\n<p>氧化物可以制作和材料</p>\n<p>卤化物尤其是氟化物是制备锕系化合物的中间体</p>\n<p>铀和钚的碳化物的导热性比氧化物的高，将来可能作高温下工作的快中子增殖堆的核燃料</p>\n<p>含氧酸盐常用于锕系元素的水溶液化学的研究</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  锕系部分离子状态</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系元素离子状态</p>\n<p>元  素 | Ac | Th | Pa | U | Np | Pu | Am | Cm | Bk | Cf</p>\n<p>M3+ | 无 |  |  | 红 | 兰→紫 | 兰→紫 | 淡红 | 无 | 绿 | 绿</p>\n<p>M4+ |  | 无 | 无 | 绿 | 黄 | 褐→橙棕 | - | - | 黄 | </p>\n<p>MO2+ |  |  | 无 | - | 绿 | 淡红→紫 | 黄 |  |  | </p>\n<p>MO22+ |  |  |  | 黄 | 淡红→红 | 黄→淡橙 |  |  |  | </p>\n<p>MO53- |  |  |  |  | 暗绿 | 暗绿 |  |  |  |</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+3价 | 形式</p>\n<p>Ac | 稳定</p>\n<p>U | 其水溶液中释放出H2，转变为U4+</p>\n<p>Np | 在水溶液中无氧存在时稳定，但易被空气氧化为Np4+</p>\n<p>Pu | 在水溶液和空气中稳定，但易被弱氧化剂氧化为Pu4+,在自辐射下缓慢氧化</p>\n<p>Am | 稳定</p>\n<p>Cm | 稳定</p>\n<p>Bk | 稳定，但能被氧化为Bk4+</p>\n<p>Cf~Lr | 稳定</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+4价 | 形式</p>\n<p>Th | 稳定</p>\n<p>Pa | 无氧存在时稳定</p>\n<p>U | 其水溶液中无氧是稳定，在空气中缓慢氧化为UO22+</p>\n<p>Np | 在水溶液中无氧存在时稳定，在空气中缓慢氧化为NpO22+</p>\n<p>Pu | 在高酸度下稳定，在低酸度下歧化为Pu3+和PuO22+</p>\n<p>Am | 仅能以络离子状态存在，无络合剂时完全歧化为Am3+和AmO2+</p>\n<p>Cm | 仅能以络离子状态存在</p>\n<p>Bk | 稳定，易还原为Bk3+，能在自身α辐射下迅速还原</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n<p>+4价 | 形式</p>\n<p>UO2+ | 歧化为U4+和UO22+，在pH为2~4时稳定</p>\n<p>NpO2+ | 稳定，在高酸度下歧化</p>\n<p>PuO2+ | 常发生歧化，在pH为2~6时稳定</p>\n<p>AmO2+ | 稳定，在强酸中歧化，低酸度下能在自身α辐射下迅速还原</p>\n<p>UO22+ | 稳定，难于还原</p>\n<p>NpO22+ | 稳定，容易还原</p>\n<p>PuO22+ | 稳定，很易还原，能在自身α辐射下缓慢还原</p>\n<p>AmO22+ | 能在自身α辐射下迅速还原</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>如何评价锕系离子在水溶液中的稳定性？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>一种元素在溶液中的各种价态的稳定性，一般用元素在不同价态间的标准电极电势或摩尔还原电势来表示</p>\n<p>电势越负，从低价态氧化到高价态的趋势越大</p>\n<p>电势越正，从高价态还原到高价态的趋势越大</p>\n<p>还原电势</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——水溶液化学</p>\n<p>改变电极电势的方法</p>\n<p>1.络合物</p>\n<p>2.溶液酸度</p>\n<p>利用络合生成效应，改变元素不同价态间的稳定性</p>\n<p>如果氧化还原过程中铀H+参加反应，那么可以通过调节溶液酸度来控制其价态的稳定性。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离子的自身氧化还原反应，称为歧化反应。</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>歧化反应</p>\n<p>歧化势越大，离子发生歧化反应的倾向越大</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>元素 | 3M(IV)↔2M(III)+M(VI) | 3M(V)↔2M(IV)+M(VI)</p>\n<p>U | -0.969 | -0.55</p>\n<p>Np | -0.783 | -0.398</p>\n<p>Pu | -0.064 | 0.254</p>\n<p>Am | 0.96 | -</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>歧化反应</p>\n<p>表 锕系元素歧化势</p>\n<p>不同元素，不同价态的歧化能力不同</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>金属离子水解即是它们与OH-的络合。</p>\n<p>锕系元素离子的半径较小和电荷较高，在水溶液中大都要发生水解，形成 M(OH)(n-1)+等物。</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>水解反应</p>\n<p>水解程度递减顺序</p>\n<p>M4+&gt;MO22+&gt; M3+&gt;MO2+</p>\n<p>Mn++H2O↔M(OH)(n-1)++H+</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶液中锕系元素络合物的稳定性按下列顺序降低</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>络合反应</p>\n<p>在较低浓度时，某些锕系离子还易形成胶体溶液</p>\n<p>低酸度下的Pu(IV)</p>\n<p>易形成胶体</p>\n<p>聚合钚。</p>\n<p>一旦形成很难降解。</p>\n<p>抑制水解：（1）酸性条件；（2）加入络合阴离子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶液中，同种锕系元素络合物的稳定性</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>络合反应</p>\n<p>溶液中，四价锕系元素络合物的稳定性</p>\n<p>溶液中，六价锕系元素络合物的稳定性</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——萃取化学</p>\n<p>研究较多的是锕系元素离子与中性磷类萃取剂配合，形成萃取配合物。</p>\n<p>最重要的是TBP、TOPO等</p>\n<p>TBP萃取锕系离子</p>\n<p>萃取能力</p>\n<p>M4++4NO3-+2TBP(o)↔M(NO3)4·2TBP(o)</p>\n<p>M3++3NO3-+3TBP(o)↔M(NO3)3·3TBP(o)</p>\n<p>MO2++NO3-+TBP(o)↔MO2NO3·TBP(o)</p>\n<p>MO22++2NO3-+2TBP(o)↔MO2(NO3)2·2TBP(o)</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀和钍是天然放射性元素。</p>\n<p>锕和镤的同位素是铀和钍的衰变产物。</p>\n<p>超铀元素的人工制备</p>\n<p>7.1 锕系通论——来源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>超铀元素获得方法</p>\n<p>① 在核反应堆中用中子照射铀或其他锕系元素。在这种情况下，元素的核连续俘获一些中子，得到的核又继续进行β衰变，生成重锕系元素。</p>\n<p>② 在热核爆炸中脉冲中子流照射铀和其他锕系元素。在这种情况下，核同样多次俘获中子，接着进行β衰变，生成重锕系元素。</p>\n<p>③用p、d、α、     、       、      等照射第七周期元素而获得。</p>\n<p>7.1 锕系通论——来源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系元素（235U、233U、239Pu）能做核燃料；</p>\n<p>锕系元素245Cm、249Cf和242Am可用做小型反应堆的核燃料，因为这些核素在热中子裂变时有非常小的临界质量，其质量用克计算。</p>\n<p>锕系元素（242Cm、244Cm、238Pu），能做同位素能量发生器，</p>\n<p>做各种辐射源：241Am可做γ源，238Pu、241Am、242Cm、254Es可做α源，252Cf可做中子源等。</p>\n<p>7.1 锕系通论——应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——研究前沿</p>\n<p>1. 凝聚态下钚及其相邻元素5f电子结构及如何成键</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——研究前沿</p>\n<p>2.锕系元素释放到环境中与环境介质的相互作用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——研究前沿</p>\n<p>3.锕系的理论计算</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.1 锕系通论——研究前沿</p>\n<p>4. 超锕系元素的研究</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核外电子排布原理？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  超铀元素？</p>\n<p>2. 主锕系元素？</p>\n<p>1.能量最低原理</p>\n<p>2.泡利（Pauli）不相容原理</p>\n<p>3.洪特（Hund）规则</p>\n<p>铀和钚</p>\n<p>铀后的元素，Np~Lr</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镎是第一个超铀元素，1940年，由麦克米伦和艾贝尔森在用中子轰击铀时发现。</p>\n<p>7.2 镎化学</p>\n<p>Np的发现</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n<p>Np的同位素</p>\n<p>目前为止，发现镎共有18种同位素，其中237Np能在反应堆中大量制得。质量数在237以上的镎均为β-衰变放射性同位素。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表    镎的部分核素辐射特性</p>\n<p>7.2 镎化学</p>\n<p>Np的同位素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n<p>注意</p>\n<p>237Np的放射性比活度约为天然铀的2000倍，为了避免Np沾污和进入人体，可称量的Np必须在手套箱中操作。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n<p>Np金属</p>\n<p>金属Np是与Ag相似的延展性金属。熔点为640℃</p>\n<p>有α、β和γ三种变体，其相变温度分别为280℃和575℃</p>\n<p>室温时，金属Np在干燥空气中是稳定的，仅缓慢地形成薄的氧化层，但在高温时迅速氧化成NpO2</p>\n<p>Np易溶于稀酸</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n<p>Np的化合物</p>\n<p>1. 氧化物</p>\n<div class=\"formula-line\">镎的氧化物有NpO2、Np2O5、Np3O8和 NpO2·   nH2O（n=1、2）。</div>\n<p>NpO2是最稳定的氧化物，是镎工厂的半成品，由煅烧所制得的NpO2在大多数酸中很难溶解，只在氧化剂（如溴酸钾）存在下才被溶解。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2. 氢氧化物</p>\n<p>Np(OH)4、NpO2OH、NpO2(OH)2和NpO2(OH)3，都难溶于水。</p>\n<p>3. 盐类</p>\n<p>在各种价态的镎盐中，四价镎盐较重要。四价镎离子可形成一系列难溶性的盐类，如NpF4、Np(C2O4)2和Np3(PO4)4等，利用这些难溶性镎盐可分离纯化镎。</p>\n<p>7.2 镎化学</p>\n<p>Np的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镎在水溶液中能以5种价态存在</p>\n<p>Np(III)（以Np3+形式）;Np(IV)（以Np4+形式）</p>\n<p>Np(V)(以         形式)、Np(VI)(以         形式)和Np(VII)（强碱性溶液中以          形式存在，酸性溶液中以水合的          形式存在，但很快被还原成Np(VI)）。</p>\n<p>7.2 镎化学</p>\n<p>Np的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>溶液中最稳定的是Np(V)（       ）；Np(VI)可自发地转变为        ，Np(III)在溶液中是最不稳定的，在水溶液中可被空气中的氧氧化为Np4+和          ，在酸性介质中Np3+被氧化为Np4+时释放出H2。</p>\n<p>7.2 镎化学</p>\n<p>Np的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1） 水解反应  各种价态的镎都容易发生水解，其水解能力按下列顺序变化：</p>\n<p>Np4+&gt;NpO22+&gt;Np3+&gt;</p>\n<p>2）歧化反应  当不存在络合剂时，各种价态的镎都不发生歧化反应，Np(V)也不发生歧化，这与其它+5价锕系离子（如U等）是不一样的。</p>\n<p>3）络合反应  各种价态的镎的络合能力按下列顺序变化：</p>\n<p>Np4+&gt;NpO22+&gt;Np3+&gt;</p>\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>237Np的最大用途，是生产核电池的原料238Pu：</p>\n<p>239Np是238U转变成核燃料239Pu的中间物。此外，238Np与239Np常用作科研中的示踪剂。</p>\n<p>7.2 镎化学</p>\n<p>应用及监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">常用的分离方法有共沉淀法，阴离子交换法和反相萃取柱色层法等。对于含量极低的环境和生物样品中的237Np，一般采用α计数法进行测定，其检出下限为3.6×10-3μg。</div>\n<p>7.2 镎化学</p>\n<p>应用及监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.2 镎化学</p>\n<p>核反应产额计算在中子活化分析中的应用</p>\n<p>核反应：A+x→y+B</p>\n<p>B为稳定核</p>\n<p>B的生成速度：</p>\n<div class=\"formula-line\">σ是反应截面：b，1b=10-24cm2；</div>\n<p>θ是粒子通量密度，n/cm2﹒s；</p>\n<p>N A是被照射原子A的数目。</p>\n<p>B为放射性核</p>\n<div class=\"formula-line\">t=0和t=t（辐照时间）区间积分， t=0时，NB=0</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>则：</p>\n<p>L为阿佛加德罗常数；H为A的丰度。</p>\n<p>如辐照时间t1，辐照后放置时间t2的物质的放射性活度：</p>\n<p>7.2 镎化学</p>\n<p>B为放射性核</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1molLiCl在1012个中子/cm2﹒s通量密度辐照下5h产生38Cl和3H的放射性活度各多少? 辐照结束后5h，各活度还有多少?</p>\n<div class=\"formula-line\">T=12.3a,σ=940b,H(Li)=7.50%, M(Li)=6.939;</div>\n<div class=\"formula-line\">T=37.2min,σ=0.43b,H(Cl)=24.23%, M(Cl)=35.453.</div>\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3H：</p>\n<div class=\"formula-line\">5h：T》t，A≈ 1.365×109Bq。</div>\n<p>38Cl：</p>\n<p>5h：</p>\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>通过测定短寿命的238Np来计算237Np。如中子注量率为1×1013 cm-2 s-1， 237Np的反应截面为169b，照射质量为1×10－12 g 237Np24h，得到的238Np活度为多少Bq？</p>\n<p>7.2 镎化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 75 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1940年，西博格等人用16MeV的氘核轰击238U获得了238Pu：</p>\n<p>7.3 钚化学</p>\n<p>（1）钚的发现</p>\n<p>这是最早发现的钚的同位素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 76 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1941年，他们又发现了239Pu</p>\n<p>7.3 钚化学</p>\n<p>（1）钚的发现</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 77 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>２）钚的同位素</p>\n<div class=\"formula-line\">目前已发现15种钚的同位素，其质量数从232到246，其中最重要的是239Pu。其次是238Pu，它们的比活度分别为： 2.32×103 和6.44×105Bq/μg。</div>\n<p>7.3 钚化学</p>\n<p>钚-239</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表    钚的部分核素的辐射特性</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚为银白色的金属，具有多种晶型，熔点为639℃，沸点为3235℃, 239Pu和241Pu 可作核燃料， 239Pu又是核武器的核燃料。</p>\n<p>238Pu是制备放射性核素电池的良好材料，高纯度的238Pu还可作医用放射性核素，</p>\n<p>238Pu、 239Pu、 240Pu、 242Pu均属极毒性核素，平时，钚应密封保存。</p>\n<p>7.3 钚化学</p>\n<p>金属钚</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚同铀和镎一样，是活泼金属。在空气中易被氧化，其氧化速度与空气的相对湿度有关，相对湿度越大，氧化速度越快。粉末状的钚在空气中能自燃，而生成PuO2。</p>\n<p>7.3 钚化学</p>\n<p>金属钚</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 81 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的电子壳层结构为：5f66s27s2，可生成从+2~+7价的化合物，金属钚的制备：</p>\n<p>PuO＋2Ca→2CaO ＋Pu</p>\n<p>PuF4 ＋2Ca →2CaF2 ＋Pu</p>\n<p>7.3 钚化学</p>\n<p>钚的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 82 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>金属钚的保存：干燥空气、用惰性气体稀释使空气中氧含量低于5%；</p>\n<p>贮存3~5年以上的金属钚，在使用前必须进行再处理，这是由于氧化得太厉害，或镅含量增高而使材料的γ放射性活度增强的缘故。</p>\n<p>7.3 钚化学</p>\n<p>钚的化学性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 83 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氧化物有：PuO、Pu2O3、PuO2，其中PuO2熔点高，耐辐照，是一种重要的核燃料化合物。</p>\n<p>PuO2是十分难溶的物质，在下列溶剂可以溶解它200℃的85~100%H3PO4、10mol/LHNO3-0.05mol/LHF溶液、 5mol/LHF溶液；</p>\n<p>也常用熔融技术来溶解PuO2，熔剂有NaHSO4、KHSO4、NH4HF2。</p>\n<p>7.3 钚化学</p>\n<p>氧化物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 84 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>PuF3、PuCl3、PuBr3、PuI3、PuF4、PuCl4和PuF6。PuF3和PuF4的化学性质不活泼，难溶于水和酸， PuF6与UF6一样，是一种易挥发的氟化物，且是一种强氧化剂，能把UF4氧化成 UF6。</p>\n<p>PuO2+3HF+1/2H2               PuF3+ 2H2O↑</p>\n<p>PuO2+4HF         PuF4 + 2H2O↑</p>\n<p>4PuF3+O2             PuF4+PuO2</p>\n<p>7.3 钚化学</p>\n<p>卤化物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚能形成一系列难溶的氢氧化物</p>\n<p>如Pu(OH)3·xH2O 、 Pu(OH)4·xH2O 、PuO2OH、PuO2(OH)2等，都是胶体物质， 是兰色沉淀，在空气中很快被氧化成 绿色凝胶物Pu(OH)4·xH2O 。Pu(OH)4·xH2O是最常见的，它可溶于稀酸，在高温下加热可转化为PuO2。</p>\n<p>7.3 钚化学</p>\n<p>氢氧化物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氢化物：PuH2、PuH3，</p>\n<p>碳化物：Pu3C2、PuC、PuC2和Pu2C3，</p>\n<p>硅化物：PuSi、PuSi3，</p>\n<p>磷化物、砷化物及硫化物等，钚几乎与所有非金属元素结合，形成钚的化合物。</p>\n<p>7.3 钚化学</p>\n<p>其他化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚在水溶液中有+3~+7五种价态，分别以水合的Pu3+、Pu4+、         、        和            形式存在于水溶液中，其中最稳定的是Pu4+，其次是Pu6+，而铀最稳定的价态是U(VI)，它比Pu（VI）稳定，这符合铀和超铀元素高价态的稳定性随原子序数的增加而降低的规律。</p>\n<p>7.3 钚化学</p>\n<p>钚的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚能形成一系列难溶性盐类，如PuF4、草酸钚［Pu(C2O4)2］和碘酸钚［Pu(IO3)4］。难溶性的钚盐是沉淀法分离、浓集和纯化钚的重要化合物。比如Pu(C2O4)2是将Pu(NO3)4转化为金属钚的中间产物，Pu(C2O4)2加热分解为PuO2。</p>\n<p>7.3 钚化学</p>\n<p>盐类</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 89 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Pu(IO3)4常用于钚的分离。钚形成的易溶性盐类，如硝酸钚［Pu(NO3)4］，硫酸钚［Pu(SO4)2］、                       和氯化钚［PuCl4］等。四水硫酸钚                        非常稳定，组成确定，常作分析基准物质。</p>\n<p>7.3 钚化学</p>\n<p>盐类</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 90 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的水溶液有一个重要性质，就是Pu3+、Pu4+、      、       、         、      和</p>\n<p>能同时共存，成为一个稳定体系，四种价态的钚离子之间的平衡式为：</p>\n<p>7.3 钚化学</p>\n<p>钚的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 91 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 92 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）歧化作用  四价钚与五价钚在一定的溶液中会发生歧化反应。</p>\n<p>2）辐射效应  溶液中钚离子的价态除了歧化反应的影响外，还受到自身α射线辐射或X、γ射线辐射的影响。239Pu的放射性比活度较高，且能放出能量较大的α粒子，使水辐解。</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 93 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）水解作用  不同价态水合离子颜色不同。各种钚离子的水解能力依下列次序递：</p>\n<p>7.3 钚化学</p>\n<p>钚的聚合</p>\n<p>在弱酸性溶液中， Pu4+与Th4+及U4+相似，能形成胶状聚合物。 Pu4+                Pu(OH)4                                              聚合物。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 94 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的络合反应</p>\n<p>各种价态的钚离子在含有无机酸根或有机酸根的水溶液中能形成不同配位体的络合物，其中以Pu4+形成的络合物最稳定，无机酸根有：        、        、       、       、Cl-等，应用于钚的分离及难溶解性钚盐的溶解。</p>\n<p>有机试剂有：酮类、酯类、羧酸类等，应用于钚的萃分离和去污促排等方面。</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 95 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的氧化还原反应</p>\n<p>各种价态钚离子的氧化还原行为与氧化还原电位有关，而且还与溶液的酸度、介质、温度及氧化还原剂的性质等因素有关。</p>\n<p>在一定酸度下，钚的+3~+6价四种价态存在如下平衡：</p>\n<p>Pu4++                      Pu3++</p>\n<p>对于Pu4+而言，在低酸度溶液中，可发生如下歧化反应：</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 96 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的应用与监测</p>\n<p>钚能做核燃料，因此，钚在工业上的重要性超过其它所有的人造元素。239Pu的生产比235U容易，且钚弹的效率比铀弹高，容易做到小型化。239Pu还可作核动力堆特别是快中子堆的燃料。</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 97 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钚的应用与监测</p>\n<p>242Pu是生产超钚元素的重要原料。238Pu主要用于制备核电池。它已在宇宙飞行装置中作为能源使用；高纯的238Pu可作心脏起搏器的能源。</p>\n<p>常量钚的分析方法有：重量法、氧化还原法、分光光度法等。</p>\n<p>微量分析方法有：α计数法和α能谱法、液体闪烁计数法。</p>\n<p>7.3 钚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 98 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 99 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅的发现</p>\n<p>1944年西博格等人发现了镅：</p>\n<p>239Pu（ n,γ）240Pu（ n,γ） 241Pu            Am</p>\n<p>质量数232-247的所有镅的同位素现在都已被发现，其中最重要的是241Am和243Am。</p>\n<p>241Am除用于制备中子源和其它种放射源之外，其主要用于制备 242Cm（锔）。</p>\n<p>242Cm是制备放射性核素电池和生产医用238Pu的原料。 241Am（ n,γ） 242Am                242Cm</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 100 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表  241Am、243Am核性质</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 101 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅的化合物</p>\n<p>氧化物有AmO、Am2O3和AmO2三种；</p>\n<p>镅盐以三价镅盐最重要，Am（Ⅲ）能与多种阴离子生成难溶性盐类，主要有AmF3等，可利用它们的难溶性来分离、纯化镅。</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 102 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅的水溶液化学</p>\n<p>镅在水溶液中能以+2~+7六种价态存在，其中以+3的镅最稳定。当不存在络合剂时，水溶液中Ⅲ、Ⅳ及Ⅴ价镅离子均以水合离子的形式存在。而Am(Ⅲ) 只有在浓的氟化物和磷酸盐溶液中才能稳定存在。</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 103 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅的水溶液化学</p>\n<p>各种离子在水溶液中呈现不同颜色。</p>\n<p>+4、+5价镅在溶液中很不稳定，会发生歧化反应。</p>\n<p>镅的络合反应</p>\n<p>镅与      、     和        发生络合反应。</p>\n<p>镅能与TTA、PMBP螯合反应。</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 104 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镅的分析测定</p>\n<p>一般对含量较大的样品，可采用重量法或氧化还原法来测定。</p>\n<p>对含微量镅的样品，则可采用放射性测量法或分光光度法来测定，对环境和生物样品常用的方法是放射性测量法。</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 105 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>241Am-离子型火灾探测器</p>\n<p>离子感烟探测器。它在内、外电离室里面有放射源241Am。电离产生的正、负离子在电场的作用下分别向正、负电极移动。在正常的情况下，内、外电离室的电流、电压都是稳定的。一旦有烟雾窜逃至电离室，干扰了带电粒子的正常运动，使电流、电压有所改变，破坏了内、外电离室之间的平衡，于是探测器就发出报警信号。</p>\n<p>1、α射线电离作用强；      2 、α粒子射程较短；</p>\n<p>3、半衰期较长(433)年；  4、成本低。</p>\n<p>7.4 镅化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 106 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1. 锔</p>\n<p>1944年西博格等人用α粒子轰击239Pu制得了242Cm，为了纪念居里夫妇，此元素被命名为锔，它的密度为1.92g/cm3，熔点为1340℃，沸点为3267  ℃。</p>\n<p>已发现的锔共有14种同位素，其中以242Cm和244Cm最为重要。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 107 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锔的同位素都是α放射体，这两种核素都可作放射性核素电池的能源</p>\n<p>242Cm可用于生产纯的医用238Pu，</p>\n<p>244Cm可制成242Cm-Be中子源，</p>\n<p>245Cm可作核燃料，用于宇宙航行用的小型反应堆中。</p>\n<p>242Cm和 244Cm分别属于高毒性和极毒性核素。</p>\n<p>锔的氧化物有：Cm2O3、CmO2，</p>\n<p>锔的水溶液有：+3、+4两种价态，稳定的价态为+3价。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 108 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锔的强α辐射能迅速地将Cm4+还原为Cm3+，并使锔溶液升温，当242Cm溶液的质量浓度为0.7g/L时，溶液会产生自沸现象。</p>\n<p>络合物：</p>\n<p>锔与                                  生成络合物；还与EDTA，SCN-等也能络合。</p>\n<p>锔的测量常用α计数法。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 109 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2 锫（Bk）</p>\n<p>1949年汤普森等用35MeV 的α粒子轰击241Am（镅）制得第一个锫同位素243Bk</p>\n<p>命名为锫是为了纪念曾合成多种锕系元素泊城市伯克利。</p>\n<p>在室温下呈六方晶系,在高温下呈面心立方晶系,已发现了9种锫的同位素，其中以α放射体247Bk的半衰期最长，半衰期为1400年；</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 110 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>249Bk是β-放射体核素，其半衰期为311天。</p>\n<p>249Bk属于高毒性核素。</p>\n<p>锫的电子结构为：5f27s2或5f86d17s2。</p>\n<p>锫在水溶液中有+3和+4两种价态，稳定价态为+3价， Bk4+是一种强氧化剂。</p>\n<p>氧化物有Bk2O3、BkO2；</p>\n<p>卤化物有： BkX3。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 111 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3 锎（Cf）</p>\n<p>1950年汤普森等人用α粒子轰击242Cm（锔）时发现了245Cf：</p>\n<p>目前已得到15种锎的同位素，其中寿命最长的是251Cf，其半衰期为800年。</p>\n<p>249Cf~ 252Cf均属极毒性核素。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 112 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锎的电子结构为：5f106s26p67s2，在水溶液中有+2、+3、+4三促价态，稳定价态为+3价。</p>\n<p>Cf3+能与镧的氟化物、草酸盐及氢氧化物等共沉淀，与         、SCN-等生成络离子，与TTA可生成Cf(TTA)3螯合物而被萃取，此性质用于早期锎中毒病人的促排治疗。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 113 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>252Cf是周期表中迄今能够大规模生产的最后一个人工放射性核素，也是迄今超钚元素中用途最大的一个核素。用作中子源及活化分析。</p>\n<p>252Cf可作核燃料，用于宇宙航行用的小型反应堆中。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 114 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锎后元素</p>\n<p>除锫的锎以外，到目前为止，已发现的超锔元素还有14种，即99-112号元素，其中99-103号元素属于锕系元素。</p>\n<p>第99号元素是为了纪念科学家爱恩斯坦。</p>\n<p>100号元素为纪念科学家费米而命名。</p>\n<p>除99号元素可达到微克级外，其它几种元素仅限于示踪量范围。</p>\n<p>7.5锔和超锔元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 115 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>金属</p>\n<p>化合物</p>\n<p>水溶液</p>\n<p>锕系元素</p>\n<p>水解</p>\n<p>歧化</p>\n<p>无机非金属化合物</p>\n<p>络合反应</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 116 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Np溶液中最稳定的是（       ）价？</p>\n<p>知识问答</p>\n<p>课前几道题，学习更美好</p>\n<p>3.  锕系（        ）物可以制作核材料？</p>\n<p>2. 中子活化分析法计算核反应产额？</p>\n<p>V</p>\n<p>氧化</p>\n<p>4.  锕系（        ）物可以制备锕系化合物的中间体？</p>\n<p>卤化</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 117 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀和钍是天然放射性元素。</p>\n<p>锕和镤的同位素是铀和钍的衰变产物。</p>\n<p>超铀元素的人工制备</p>\n<p>5. 锕系元素的来源</p>\n<p>知识问答</p>\n</div></div>"
