<title>复习系统 - 课程导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #2c3e50;
    line-height: 1.6;
  }
  .header {
    background: linear-gradient(135deg, #1a3a5c, #2d7fc1);
    color: #fff;
    padding: 50px 20px;
    text-align: center;
  }
  .header h1 { font-size: 2.2em; margin-bottom: 8px; }
  .header p { opacity: 0.85; font-size: 1.1em; }
  .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 20px;
    text-decoration: none;
    color: #2c3e50;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .card .icon {
    font-size: 2.4em;
    width: 60px;
    text-align: center;
    flex-shrink: 0;
  }
  .card .info h3 { font-size: 1.2em; margin-bottom: 4px; }
  .card .info p { color: #7f8c8d; font-size: 0.9em; }
  .footer {
    text-align: center;
    padding: 30px;
    color: #95a5a6;
    font-size: 0.85em;
  }
  @media (max-width: 640px) {
    .header h1 { font-size: 1.6em; }
    .card { padding: 16px; gap: 12px; }
    .card .icon { font-size: 1.8em; width: 44px; }
  }
</style>
</head>
<body>
