, {"topic": "同位素稀释法", "ch": "ch8", "kw": ["稀释法", "同位素稀释", "分析"]}], "ovHTML": "<div class=\"ob\"><h2>放射化学 考试概览</h2><div class=\"date\">2026年6月18日</div><div class=\"og\">\n<div class=\"oi\"><div class=\"nm\">填空题</div><div class=\"sc\">16分</div><div class=\"dt\">8题×2分</div></div>\n<div class=\"oi\"><div class=\"nm\">选择题</div><div class=\"sc\">14分</div><div class=\"dt\">7题含多选</div></div>\n<div class=\"oi\"><div class=\"nm\">名词解释</div><div class=\"sc\">16分</div><div class=\"dt\">4个×4分</div></div>\n<div class=\"oi\"><div class=\"nm\">问答题</div><div class=\"sc\">24分</div><div class=\"dt\">4个×6分</div></div>\n<div class=\"oi\"><div class=\"nm\">计算题</div><div class=\"sc\">30分</div><div class=\"dt\">3题×10分</div></div>\n</div></div>\n<div class=\"tc\"><h3>重点知识</h3><ul>\n<li>考试题型与分值：</li>\n<li>填空题：8 道题共 16 分，一题 2 分，一空分值不定。</li>\n<li>选择题：7 道题共 14 分，有单选和多选，选对部分答案可得分。</li>\n<li>名词解释：4 个共 16 分，每个 4 分。</li>\n<li>问答题：4 个共 24 分，每个 6 分。</li>\n<li>计算题：3 道题共 30 分，一道题 10 分，答案保留小数点后两位。</li>\n<li>学科特点：放射化学有 4 个特点，常考填空题。</li>\n<li>公式概念：牢记衰变公式、半衰期与衰变常数关系、贝克和居里定义、比活度计算、平衡公式等。</li>\n<li>衰变类型：了解阿尔法、贝塔、伽马衰变本质。</li>\n<li>胶体判定：掌握分散体系相关概念，会判断放射性真、假胶体。</li>\n<li>吸附相关：了解吸附剂、吸附类型，会计算吸附率和吸附系数。</li>\n<li>共沉淀：区分结晶共沉淀和吸附共沉淀，记住同二晶特殊例子。</li>\n<li>电化学：能斯特方程，理解电化学置换法和电沉积法原理。</li>\n<li>载体相关：区分载体、反载体等，简答题会分析萃取、吸附和沉淀作用。</li>\n<li>萃取：记萃取率公式，了解萃取剂和沉淀剂选择标准，区分盐析剂、掩蔽剂。</li>\n<li>离子交换：理解离子交换相关概念，解释稀释液性能，记住分离三阶段。</li>\n<li>天然放射性：识别天然放射性元素，记住天然放射性系母体及关键元素，了解来源。</li>\n<li>核反应式：会写铀钚、钍铀转化等核反应式，掌握镭氡计算。</li>\n<li>核素制备：记住核素产生方式、反应特点，会写同位素制备方法。</li>\n<li>分析方法：记住同位素稀释法等分析方法，了解活化分析步骤。</li>\n</ul></div>\n<div class=\"tc\"><h3>注意事项</h3><ul>\n<li>本次课堂围绕放射化学考试展开，介绍题型分值、重点知识及考试注意事项。</li>\n<li>考试注意事项：6 月 18 日晚九十节考试，带 2B 铅笔、计算器，计算题掌握公式，别依赖原题。</li>\n</ul></div>", "tpH": {"学科特点": "<div class=\"th\"><div class=\"th-top\"><h2>学科特点</h2><span class=\"tt\" style=\"background:#4361ee\">填空</span></div><div class=\"src\">来源：第一章 绪论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>先进核化工研究中心</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>放射化学</p>\n<p>何为放射化学？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>是近代化学的一个分支学科，</p>\n<p>是研究有关放射性现象的一门科学。</p>\n<p>放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>放射化学</p>\n<p>放射化学指研究放射性物质及其辐射效应的一门化学分支学科（二级学科）</p>\n<p>有关原子核反应、放射性核素和放射性物质的化学及其应用研究的一门科学。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>放射化学</p>\n<p>放射化学</p>\n<p>计算放射化学，干法电化学</p>\n<p>环境放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>基本内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>放射化学</p>\n<p>核工专业为什么要学习放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>铀水冶中的放射化学知识</p>\n<p>铀纯化与转化中的放射化学知识</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>放射化学在铀浓缩中三废处理应用。</p>\n<p>铀浓缩中的放射化学知识</p>\n<p>燃料制备与转化中的放射化学知识</p>\n<p>UO<sub>2</sub>回收中的放射化学；</p>\n<p>碱渣铀回收过程中的放射化学。</p>\n<p>乏燃料后处理中的放射化学知识</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>核化工&amp;放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>确定放射化学的基本概念和研究内容；</p>\n<p>掌握放射化学的特点；</p>\n<p>了解放射化学的发展简史和在我国的概况。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>1.1  放射化学发展简史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>放射化学的产生</p>\n<p>1895年末德国物理学家伦琴用Crookes管研究高压放电现象时注意到, 当用阴极电子束流轰击玻璃管壁时, 产生了荧光以及X射线。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>放射化学的产生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>放射性规律的一系列研究和探索</p>\n<p>1912 年 赫维西等利用同位素之间的化学性质相同，难以分开的特点。以铅-210为示踪剂，成功地测定了铬酸铅的溶解度。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>放射性规律的一系列研究和探索</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>放射性规律的一系列研究和探索</p>\n<p>开启了锕系元素研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>现代放射化学的发展阶段</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>中国放射化学发展史</p>\n<p>1932年秋建立国立北平研究院镭学研究所</p>\n<p>——我国最早的放射化学研究机构</p>\n<p>1948年国立北平研究院成立了原子学研究所</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>中国科学院近代物理研究所</p>\n<p>镭学研究所</p>\n<p>原子学研究所</p>\n<p>中国科学院原子能研究所（1958）</p>\n<p>1955年起，清华、北大等先后设立放射化学或放射化工专业。</p>\n<p>1958年到60年代初，又成立了两个新的原子能研究基地：上海原子核研究所，兰州近代物理研究所。</p>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>中国放射化学发展史</p>\n<p>1956年，从国外引进研究用的重水堆和回旋加速器。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>中国放射化学发展史</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>中国放射化学发展史</p>\n<p>上世纪五六十年代处于黄金时期，成果辉煌，全民大办原子能、各重点高校均开设放射化学专业。</p>\n<p>八十年代后半期，由于切尔诺贝利核电站的灾难，和“冷战”结束等原因，我国的核科学和核技术以及放射化学和全世界一样走到低谷。</p>\n<p>进入新世纪后，放射化学开始复兴，主要推动力是能源供应、环境保护、人民健康、气候变化和国家安全等重大需求。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>中国放射化学发展史</p>\n<p>放射化学奠基人——杨承宗https://www.bilibili.com/video/BV<sub>1</sub>d64y1z7jV?from=search&amp;seid=9204014589400916153&amp;spm_id_from=333.337.0.0</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>1.2 放射化学主要研究内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>放射化学内容</p>\n<p>放射化学</p>\n<p>基础放射化学</p>\n<p>应用放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>放射化学内容</p>\n<p>研究放射性物质的分离、纯化方法及其原理。</p>\n<p>1.基础放射化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>研究天然放射性元素(U、Th、Ra、Po)的化学性质，以及有关它们的提炼精制的化学工艺，重点是铀和钍；</p>\n<p>主要研究人工放射性元素的化学性质和核性质, 以及它们的分离、纯化和精制的化学过程, 重点是钚等超铀元素和主要的裂片元素。</p>\n<p>放射化学内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>放射化学内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>放射化学内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 59 页</div>\n<p>放射化学内容</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>放射化学内容</p>\n<p>研究放射性物质的分离分析方法以及核技术在分析中的应用。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>放射化学内容</p>\n<p>5. 应用放射化学</p>\n<p>为核医学对各种脏器多种疾病的诊断和治疗, 以及为研究人体的体内动态生理活动提供药物。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>1. 核化工&amp;放射化学</p>\n<p>放射化学</p>\n<p>研究天然和人工放射性元素及其化合物的化学性质、制备方法。</p>\n<p>(1) 基础放射化学</p>\n<p>研究放射性物质的物理化学的规律，低浓度行为和状态及分离原理。</p>\n<p>研究各种原子核转变过程所引起的化学变化及生成的产物。</p>\n<p>研究放射性核素及其制剂的分析、测量和纯度鉴定方法。</p>\n<p>(5) 应用放射化学</p>\n<p>研究放射性核素在工业、农业、国防、医学等各个领域中的应用。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>1.3 放射化学特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>1.放射性  放射化学最根本的特点</p>\n<p>优点：使研究方法的灵敏度大大提高；通过对放射性的原子跟踪，可对整个化学过程及其每个阶段进行研究和观察。</p>\n<p>弊端：射线可能对工作人员产生辐射损伤；放射性物质还会对所研究的体系产生一系列的物理化学效应—辐射化学效应。</p>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>1.3 放射化学的特点</p>\n</div>\n<div class=\"ts\"><div class=\" \"><div class=\"th-top\"><h2>衰变公式与半衰期</h2><span class=\"tt\" style=\"background:#e63946\">计算</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>放射性衰变规律</p>\n<p>放射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>掌握反射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>放射性衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>放射性衰变的时间规律</p>\n<p>放射性衰变平衡的建立</p>\n<p>放射性衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>放射性衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>放射性衰变的时间规律</p>\n<p><sup>238</sup>U的衰变</p>\n<p>1. 放射性衰变是一个统计过程，原子核放射彼此独立的变化，每一种核素均有其特征的衰变概率。</p>\n<p>2. 衰变概率是特定核素的一种固有性质，它与放射性核素的化学及物理性质无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>放射性衰变的时间规律</p>\n<p>衰变常数：原子核的放射性衰变或同质异能跃迁的概率</p>\n<p>表示放射性衰变的快慢</p>\n<p>在一般情况下，衰变常数与外界条件（诸如温度、压力、外部电磁场等）无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>放射性衰变的时间规律</p>\n<p>0 | N<sub>0</sub></p>\n<p>N(t=T<sub>1</sub>/2）=N<sub>0</sub>/2</p>\n<p>半衰期</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>放射性衰变的时间规律</p>\n<p>注意：半衰期是每种放射性核素的特征参数，仅由原子核的内部特性决定，几乎与核素所处的化学和物理状态、外界条件（温度、压力和外加磁场等）无关。</p>\n<p>半衰期是一种不稳定的核素原子发生衰变的概率为50%。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>放射性衰变的时间规律</p>\n<p>衰变常数（λ）</p>\n<p>原子核的放射性衰变或同质异能跃迁的概率。</p>\n<p><sup>1</sup>Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有<sup>1</sup>Bq的活度。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>放射性衰变的时间规律</p>\n<p>τ等于衰变常数的倒数。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>放射性衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>放射性衰变的时间规律</p>\n<p>对应半衰期单位是秒（s）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>放射性衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>放射性衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>放射性衰变的时间规律</p>\n</div>\n<di &lt; T<sub>1</sub>/2,2，λ1 ＞ λ2</p>\n<p>母体衰变比子体生长快，不能满足平衡条件。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>大多数裂变产物的第一代或前几代均是半衰期较短的情况，而子体是长寿命的，所以均为不平衡情况。</p>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体均服从指数衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>从1t含有 40％U<sub>3</sub>O<sub>8</sub>的沥青铀矿中能分离多少克<sup>226</sup>Ra？ <sup>238</sup>U 的半衰期为4.15×109 a , <sup>226</sup>Ra 的半衰期为1602 a。</p>\n<p>可为此题添加文本、图片、公式等解析，且需将内容全部放在本区域内。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>例1：从1t含有 40％U<sub>3</sub>O<sub>8</sub>的沥青铀矿中能分离多少克<sup>226</sup>Ra？ <sup>238</sup>U 的半衰期为4.15×109 a , <sup>226</sup>Ra 的半衰期为1602 a。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>例2：<sup>95</sup>Zr(T<sub>1</sub>/2=65.5d)经衰变到 <sup>95</sup>Nb（T<sub>1</sub>/2=35d），后者衰变为稳定的<sup>95</sup>Mo。从t=0时分离纯算起，什么时候<sup>95</sup>Nb的放射性活度达到最大？总放射性活度是多大？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>放射衰变存在几种类型？</p>\n<p>α  衰变</p>\n<p>β  衰变</p>\n<p>γ  衰变</p>\n<p>质子衰变</p>\n<p>核衰变：不稳定原子核自发地放出粒子或电磁辐射变成另一种原子核的过程。</p>\n<p>放射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</p>\n<p>内韧致辐射：电子俘获放出韧致辐射，在慢化生成的衰变核本身附近。</p>\n</div>", "放射性的单位与比活度": "<div class=\"th\"><div class=\"th-top\"><h2>放射性的单位与比活度</h2><span class=\"tt\" style=\"background:#e63946\">计算</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>约里奥-居里夫妇</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p><sup>1</sup>Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有<sup>1</sup>Bq的活度。</p>\n<p>1 Ci(相当于1g <sup>226</sup>Ra的放射性活度)=3.7×1010 Bq</p>\n<p>放射性活度（简称活度，符号为A，单位：Bq）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>平均寿命τ：在τ时间里，放射性活度下降到1/e。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>比放射活度（简称比活度，符号S ，单位：Bq /g）：</p>\n<p>单位质量的某种放射性物质的放射性活度。</p>\n</div>\n<div class=\"ts\"><di \n<p>掌握反射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>放射性衰变类型</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>α粒子通过物质时，主要是与电子碰撞。 α粒子不仅带有电荷，且其能量和质量比电子大得多，因此每次碰撞损失的能量很小，经过很多次碰撞才能失去全部能量而被吸收。</p>\n<p>与电子碰撞时，重的α粒子（质量比电子大得多）的运动方向实际上不受影响，而且α粒子是做“直线飞行”的，被原子核散射的几率小，其路径长度与射程几乎相等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>α粒子与物质的作用强，测量α放射性时必须制成很薄的源，其厚度应该在μg/cm2范围，同时要在真空中进行。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</p>\n</div>", "放射性平衡": "<div class=\"th\"><div class=\"th-top\"><h2>放射性平衡</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span></div><div class=\"src\">来源：第二章 放射性</div></div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>第二代子体</p>\n<p>第三代子体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>（1）T<sub>1</sub>/2,1 &gt;&gt; T<sub>1</sub>/2,2         长期平衡 Secular Radioactive Equilibrium</p>\n<p>（2）T<sub>1</sub>/2,1  &gt; T<sub>1</sub>/2,2           暂时平衡 Transient Radioactive Equilibrium</p>\n<p>（3）T<sub>1</sub>/2,1 &lt;T<sub>1</sub>/2,2             不成平衡 Non-equilibrium</p>\n<p>放射性平衡：母子体放射性活度之比恒定的状态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>母体核素的半衰期比子体核素的半衰期长很多</p>\n<p>放射性平衡的建立只取决于子体核素的半衰期</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>平衡时，A<sub>1</sub>=A<sub>2</sub>，那么A是多少呢？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>这一关系对母体核素半衰期非常长的放射性衰变链来说是相当重要的。一旦平衡建立，就存在如下关系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>2. 暂时平衡</p>\n<p>母体核素的半衰期不太长，但仍比子体核素的半衰期长</p>\n<p>平衡条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>2. 暂时平衡</p>\n<p>与长期平衡不同</p>\n<p>暂时平衡时中A和A<sub>2</sub>均有最大值，</p>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体核素的半衰期比子体半衰期的半衰期短，没有放射性平衡可以达到。</p>\n<p>母体衰变比子体生长快，不能满足平衡条件。</p>\n<p>3. 不成平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>大多数裂变产物的第一代或前几代均是半衰期较短的情况，而子体是长寿命的，所以均为不平衡情况。</p>\n<p>放射性衰变平衡的建立</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>放射性衰变平衡的建立</p>\n<p>母体均服从指数衰变规律</p>\n<p>暂时平衡与长期平衡无明显界限（5~<sup>7</sup>T<sub>1</sub>/2,2）</p>\n<p>平衡体系受到破坏，平衡重新建立</p>\n</div>", "同位素效应与交换": "<div class=\"th\"><div class=\"th-top\"><h2>同位素效应与交换</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>熟识同位素交换反应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>3.1 同位素交换</p>\n<p>3.1 1 同位素效应</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>3.1.3 同位素交换的基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>3.1 同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>3.1 同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>3.1 同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>3.1 同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>利用同位素交换研究核素的存在状态；</p>\n<p>3.1 同位素交换</p>\n<p>同位素交换的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>由于同位素质量不同而引起的同位素在物理和化学性质上的差别称为同位素效应。</p>\n<p>对于许多同位素交换反应，其效应的理论预测已被实验证实。</p>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>3.1.1 同位素效应</p>\n<p>同位素交换有关因素：</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>3.1.1 同位素效应</p>\n<p>K交换是衡量同位素效应的大小</p>\n<p>K交换远离1，说明体系中各种同位素分布很不均匀，同位素效应大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>表   若干同位素交换反应的平衡常数  (25℃）</p>\n<p>3.1.1 同位素效应</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>同位素交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>3.1.2 同位素交换反应特征</p>\n<p>由于同位素彼此间化学性质相同，所以，除氢以外，所有的同位素交换反应的热效应几乎等于零，即Q=0。</p>\n<p>除氢之外，同位素交换反应的平衡常数K交换极近似等于1，且与温度无关。所以，一般情况下，同位素效应可忽略，即K≈1。K近似不变的，当然与温度也无关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>3.1.2 同位素交换反应特征</p>\n<p>同位素交换反应是可逆反应，而可逆反应的热效应等于正反应与逆反应的活化能之差。</p>\n<p>所以，同位素交换反应的正反应与逆反应的活化能是相等的。</p>\n<p>3. 同位素交换反应的E逆＝E正。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>因为平衡常数K交换＝1，所以同位素交换反应的正反应和逆反应的速度常数相等，即k正＝k逆。</p>\n<p>3.1.2 同位素交换反应特征</p>\n<p>5. 同位素交换反应的进行，不伴随有普通元素浓度的变化。  熵值</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>表示同位素交换反应达到平衡时，AX*的浓度；</p>\n<p>表示同位素交换反应达到平衡时，BX*的浓度。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>如果原子在两相中的扩散速度远大于交换速度，则同位素交换是过程的限制阶段</p>\n<p>在非均相条件下，同位素交换服从指数关系。</p>\n<p>3.1.3 同位素交换反应基本规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>以下是几种物质的K交换值，哪种物质的同位素交换效应最大？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>在共结晶、吸附、离子交换、萃取和同位素交换能力方面也有反常行为。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 135 页</div>\n<p>同位素交换</p>\n</div>", "放射性胶体": "<div class=\"th\"><div class=\"th-top\"><h2>放射性胶体</h2><span class=\"tt\" style=\"background:#4361ee\">填空/选择</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>在自然界中以及人类生产活动中，常常遇到一种或几种物质分散在另一种物质中的分散体系。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>分散体系按分散相颗粒大小的不同，可以分为三类：</p>\n<p>粗分散体系 | ＞10-7 | 矿石，乳状液，悬浮液（如油漆）</p>\n<p>胶体分散体系 | 10-7~10-9 | 氢氧化铝溶液，明胶液</p>\n<p>分子与离子分散体系 | ＜10-9 | 气体混合物，一般溶液（如盐水）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>胶体分类</p>\n<p>分散相物态 | 分散介质物态 | 胶体名称 | 实例</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>物质处于胶体分散状态时，表现出许多特殊的性质：</p>\n<p>胶体体系的分散相颗粒（胶粒）具有特殊的可滤性胶体的粒径介于分子、原子直径与颗粒物直径之间，这样在过滤中可利用这一特点。</p>\n<p>分散相物质的高度分散，因此分散相物质有着巨大的表面积(㎡/g)；处于界面上分子的状况和物质内部的不同，因此，具有广大界面的胶体分散相物质有着突出的表面性质；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>物质处于胶体分散状态时，表现出许多特殊的性质：</p>\n<p>胶体体系具有聚结不稳定性特点</p>\n<p>处于高度分散状态的微小胶粒具有布朗运动性质，加上胶体颗粒具有强烈的电特性，胶粒带有同种电荷，互相排斥，不利聚结。特殊的光学性质。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>胶体体系的分散相颗粒（胶粒）具有特殊的可滤性</p>\n<p>放射性胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>放射性胶体及其特性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性物质作分散相形成的胶体体系，即为放射性胶体。</p>\n<p>放射性胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>放射性真胶体</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体</p>\n<p>放射性假胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>一种是在放射性核素的原子、离子或分子直接聚合在一起，构成胶粒大小的聚集体，分散在介质中，形成放射性胶体分散体系，这称为放射性真胶体。</p>\n<p>真胶体的胶粒很小，比如在液溶胶体系中，这些胶粒聚集体的直径只为10-9 m数量级。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性真胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>放射性核素（离子或分子）被吸附在存在于介质中的其它非放射性悬浮粒子（杂质）上，这种吸附了放射性核素的杂质胶粒为分散相的胶体体系，称为放射性假胶体。此种体系的胶粒直径比真胶体的胶粒要大。</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性假胶体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>放射性胶体特性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>放射性胶体的形成</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>液体分散体系</p>\n<p>3.2.1  放射性胶体及其特性</p>\n<p>气体分散体系（气溶胶）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>放射性核素在溶液中生成难溶水解产物或其他难溶化合物的趋势越大，越有利于放射性胶体（真胶体）的形成。相反，若在溶液中有能与放射性核素形成可溶性络合物的物质（络合物中的配位体）存在，则不利于放射性胶体的形成。</p>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>在强酸介质中，放射性核素一般不形成胶体，当溶液酸度降低时，在一定的pH值条件下，各种放射性核素都能生成胶体粒子，但 碱金属和碱土金属例外，不过在一定条件下能形成假胶体，碱土金属生成假胶体的趋势一般随原子序数的增加而加大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>杂质粒子对<sup>212</sup>Pb和<sup>212</sup>Bi胶体的影响 |  |  |</p>\n<p>放射性核素 | 用水稀释后反射性胶体的量/% |  |</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质--液体分散体系</p>\n<p>研究放射性胶体的形成主要是以水为分散介质而进行的，其它分散介质研究得尚少，介质性质不同，对胶体形成有重大影响。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n<p>在放射性物质的研磨、粉碎、过筛以及放射性溶液的鼓泡、蒸发和转移过程中，放射性物质会扩散到空气中，与空气中的尘埃或雾滴结合在一起形成放射性气溶胶（假胶体）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>3.2.2  放射性胶体的形成</p>\n<p>放射性物质—气体分散体系（气溶胶）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>强酸介质中，放射性核素形成真溶液，溶液酸度降低时，每种核素在一定的条件下，都可能生成胶体粒子。</p>\n<p>液相内放射性核素所处的两种可能的极端状态（即呈普通离子状态和呈胶体状态）之间，随着pH值的增加，多价元素可生成水解离子、中性分子和聚合结构。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 75 页</div>\n<p>② 易发生水解而形成胶体的元素，它们在玻璃上的吸附量随溶液pH值的增加而具有一个极大值。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>滤纸吸附放射性核素的机理：放射性核素是以离子状态或以胶体状态而被滤纸吸附的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 131 页</div>\n<p>在高度稀释的溶液中，有许多因素会改变放射性核素的存在状态，如放射性核素在容器壁和杂质上的吸附、放射性胶体的生成、络合物的生成等，使放射性核素出现反常的电化学行为。</p>\n</div>", "吸附作用": "<div class=\"th\"><div class=\"th-top\"><h2>吸附作用</h2><span class=\"tt\" style=\"background:#4361ee\">填空/计算</span></div><div class=\"src\">来源：第三章 放射性核素的物理化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>放射性核素吸附现象</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>掌握放射性核素的吸附、共沉淀及电化学相关知识</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>放射性核素（离子或分子）被吸附在存在于介质中的其它非放射性悬浮粒子（杂质）上，这种吸附了放射性核素的杂质胶粒为分散相的胶体体系，称为放射性假胶体。此种体系的胶粒直径比真胶体的胶粒要大。</p>\n<p>例：氢氧化铝吸附放射性核素。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>在共结晶、吸附、离子交换、萃取和同位素交换能力方面也有反常行为。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>放射性核素吸附在气相中的杂质微粒上而形成的气溶胶微粒。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>放射性核素的吸附状态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>吸附放射性核素的固体物质。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>放射性核素的吸附现象</p>\n<p>吸附剂</p>\n<p>吸附类型</p>\n<p>物理吸附</p>\n<p>化学吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>吸附质和吸附剂分子间作用力所引起，此力也称作范德华力。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n<p>由于固体表面分子（或原子、离子）存在剩余吸引力而引起的，当吸附剂表面被吸附的一层粒子尚未完全抵消固体表面的力场（即剩余引力）时，可再吸附一层粒子，直到完全抵消固体表面的力场为止，因此，物理吸附是多层吸附。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>吸附剂表面的分子由于作用力没有平衡而保留有自由的力场来吸引吸附质，它是由分子间的吸力所引起的吸附，因此结合力较弱，吸附热较小，吸附和解吸速度也都较快。被吸附物质也较容易解吸出来，所以物理吸附在一定程度上是可逆的。</p>\n<p>如：活性炭对许多气体的吸附，被吸附的气体很容易解脱出来而不发生性质上的变化。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附（范德华吸附）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>3.3 放射性核素的吸附现象</p>\n<p>物理吸附的特点</p>\n<p>吸附热小</p>\n<p>吸附速率慢</p>\n<p>多层吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>吸附剂与被吸附的原子、离子或分子发生化学反应，靠化学键力而引起的。</p>\n<p>化学吸附中，吸附剂只能吸附一定结构的物质，所以化学吸附的选择性高。由于固体表面存在不均匀力场，表面上的原子往往还有剩余的成键能力，当气体分子碰撞到固体表面上时便与表面原子间发生电子的交换、转移或共有，形成吸附化学键的吸附作用。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>化学吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>仅发生单分子层吸附；</p>\n<p>吸附热与化学反应热相当；</p>\n<p>大多为不可逆吸附；</p>\n<p>吸附层能在较高温度下保持稳定等。</p>\n<p>3.3 放射性核素的吸附现象</p>\n<p>化学吸附的特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>玻璃上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 71 页</div>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 72 页</div>\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素在一定条件下可被玻璃表面吸附，改变条件，已被吸附的放射性核素可部分或全部地从玻璃表面上解吸下来。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素的吸附能力与玻璃表面的不同处理过程、玻璃种类以及放射性核素所处的介质条件有关。</p>\n<p>为衡量吸附能力，定义Kα吸附系数</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 74 页</div>\n<p>放射性核素在玻璃表面上的吸附规律</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>吸附具有可逆性。</p>\n<p>放射性核素的吸附能力与玻璃表面的不同处理过程、玻璃种类以及放射性核素所处的介质条件有关。</p>\n<p>吸附能力与放射性核素本身的性质有关。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 75 页</div>\n<p>放射性核素在玻璃上的吸附类型</p>\n<p>② 易发生水解而形成胶体的元素，它们在玻璃上的吸附量随溶液pH值的增加而具有一个极大值。</p>\n<p>③ 阴离子状态存在的元素，只受范得华力作用，因此它在玻璃上的吸附量很低。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>① 不易发生水解的元素，玻璃对它的吸附量随溶液pH值的增加而有规律地增加。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 76 页</div>\n<p>加入与放射性核素化学性质相同或相似的稳定核素，可大大降低玻璃对放射性核素的吸附量，或者用这类稳定核素的溶液预先对玻璃器皿表面进行处理，使其达到吸附平衡，从而减少玻璃表面对放射性核素的吸附。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 77 页</div>\n<p>较高的酸度下保存放射性溶液或进行操作，可大大减少玻璃的吸附。</p>\n<p>提高溶液的酸度，还可使已被玻璃表面吸附的放射性核素解吸下来。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 78 页</div>\n<p>用硅烷或其他憎水剂对玻璃表面进行预处理，使玻璃表面形成一层疏水薄膜，从而较少对放射性核素的吸附。这个过程称为玻璃表面的硅烷化处理。</p>\n<p>3.3.1 放射性核素在玻璃上的吸附</p>\n<p>减少和避免玻璃表面对放射性核素的吸附措施</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 79 页</div>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>滤纸是一种能强烈吸附某些放射性核素的吸附剂。</p>\n<p>滤纸吸附放射性核素的机理：放射性核素是以离子状态或以胶体状态而被滤纸吸附的。</p>\n<p>以离子状态被滤纸吸附时，可能是以离子交换形式进行的，</p>\n<p>胶态吸附几乎是不可逆的。</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 81 页</div>\n<p>滤纸对放射性核素存在强烈的吸附作用，因此在放射分离操作时，不宜用滤纸来去除放射性溶液中不溶的滤弃物等杂质，而一般适合用来过滤获得放射性沉淀物，弃去滤液。在放射性测量中，常将待测的放射性核素以沉淀物的形式在滤纸上直接制成放射源而测量。</p>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 82 页</div>\n<p>放射性核素在滤纸上或在活性炭上的吸附</p>\n<p>放射性核素在活性炭上的吸附是分子吸附、离子交换吸附和因静电引力产生的吸附。</p>\n<p>活性炭本身的组成对放射性核素的吸附影响很大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 83 页</div>\n<p>放射性气体在固体物质上的吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 84 页</div>\n<p>放射性气体氡在固体物质上的吸附为例，通过研究氡在活性炭上的吸附，表明它符合享利（Henry）定律：在一定温度下，其吸附量与其分压成正比。</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>X--单位重量活性炭所吸附的氡量，</p>\n<p>对于一定的吸附体系，它们与气体组分的性质及吸附温度有关，其值可由实验确定（n≥1）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>一般说来，经过表面活化处理的多孔性吸附剂具有较大的比表面和活性，其吸附能力就较大。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 86 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>由于吸附剂吸附气体是放热过程，所以，体系温度愈高，气体愈不易被吸附，已被吸附的气体愈易从吸附剂表面解吸下来。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>⑴吸附剂的种类和性能</p>\n<p>⑶被吸附气体的性质及压力</p>\n<p>3.3.3 放射性气体在固体物质上的吸附</p>\n<p>放射性气体在固体吸附剂上的吸附有关因素</p>\n<p>被吸附气体的沸点愈高，即较容易凝结为液态的气体，愈容易被吸附。被吸附气体的分压（p）升高（浓度增大），吸附量当然也增加。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 90 页</div>\n<p>吸附共沉淀</p>\n<p>微量物质分布在常 量物质晶体的表面而一起沉淀出来，这种沉淀称为吸附共沉淀（或表面分配）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 104 页</div>\n<p>吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 105 页</div>\n<p>微量物质被吸附在常量物质晶体表面而一起共沉淀。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>吸附共沉淀</p>\n<p>分子吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 106 页</div>\n<p>被吸附离子进入吸附剂表面的晶格里。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级交换吸附：溶液中离子、晶体表面的离子，并非处于静止状态，它们和溶液中相同种类的离子不断地进行交换。如果溶液中有同种离子（包括同位素离子）或同晶离子存在，则这些离子也能参与交换，而转移到晶体表面，这个过程称为一级交换吸附。同晶离子的交换吸附又称为同晶交换吸附。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 107 页</div>\n<p>3.4.2 吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 108 页</div>\n<p>3.4.2 吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 109 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 110 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>一级吸附</p>\n<p>一级吸附特点</p>\n<p>只有与常量晶体同晶或同二晶的离子才能被吸附。</p>\n<p>被吸附化合物溶解度越小，吸附量越大。</p>\n<p>对于一定的常量物质体系，吸附系数与结晶常数D成正比，D取决于常量物质的溶解度与被吸附离子化合物的溶解度的比值。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 111 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>二级吸附</p>\n<p>二级吸附：液膜层中离子与溶液中相同符号的离子不断地进行交换。这个过程称为二级交换吸附。</p>\n<p>二级交换吸附中，被吸附离子只是停留在紧靠晶体表面的液膜层中并不进入晶体的晶格中。</p>\n<p>二级交换吸附依赖于静电引力。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 112 页</div>\n<p>3.4.2 吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 113 页</div>\n<p>3.4.2 吸附共沉淀</p>\n<p>离子晶体上的吸附共沉淀</p>\n<p>二级吸附</p>\n<p>二级吸附规律</p>\n<p>被吸附离子的价态数越高，越容易被吸附；</p>\n<p>竞争离子的浓度越高，放射性核素的吸附系数下降。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 114 页</div>\n<p>新生成的无定形沉淀具有大的发达表面，吸附能力强，随着放置时间延长，表面积缩小，吸附能力下降。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 115 页</div>\n<p>无定型沉淀的离子交换吸附可以是一级交换吸附，也可以是二级交换吸附，但后者居多。</p>\n<p>例如，氢氧化锌无定型沉淀表面的液膜层中发生的离子交换吸附，随溶液介质不同，既可与阳离子发生交换，也可与阴离子发生交换。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>离子交换吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>放射性核素在氢氧化物或氧化物上的吸附是由于它们在沉淀表面上形成了表面化合物造成的,这就是化学吸附。</p>\n<p>例如，MnO<sub>2</sub>吸附二价金属离子（如Zn<sub>2</sub>+），是在MnO<sub>2</sub>表面上，二价金属离子与锰形成了六环螯合结构而被吸附的。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>化学吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 117 页</div>\n<p>3.4.2 吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 118 页</div>\n<p>放射性核素在无定形沉淀上的吸附是属于分子吸附。即放射性物质以分子形式被吸附。如有些银盐（AgNO<sub>3</sub>，Ag<sub>2</sub>SO<sub>4</sub>等）是以分子形式被Fe<sub>2</sub>O<sub>3</sub>、Al<sub>2</sub>O<sub>3</sub>或SiO<sub>2</sub>表面吸附的。</p>\n<p>3.4.2 吸附共沉淀</p>\n<p>放射性核素在无定形沉淀上的吸附共沉淀</p>\n<p>分子吸附</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 131 页</div>\n<p>在高度稀释的溶液中，有许多因素会改变放射性核素的存在状态，如放射性核素在容器壁和杂质上的吸附、放射性胶体的生成、络合物的生成等，使放射性核素出现反常的电化学行为。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 135 页</div>\n<p>吸附共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 137 页</div>\n<p>吸附共沉淀</p>\n<p>一级吸附</p>\n<p>二级吸附</p>\n<p>离子交换吸附</p>\n<p>化学吸附</p>\n<p>物理吸附</p>\n</div>", "共沉淀与同晶": "<div class=\"th\"><div class=\"th-top\"><h2>共沉淀与同晶</h2><span class=\"tt\" style=\"background:#4361ee\">填空/选择</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>共结晶共沉淀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>2. 类质同晶能形成真正的混晶，某些化学组成类似但晶体结构不同的物质，在一定条件下  [填空1]  形成真正的混晶。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>3. 两种物质形成同晶的条件 [填空1] 。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>共沉淀法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>共沉淀法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>共沉淀法是利用微量物质随常量物质一起生成沉淀现象来进行分离、浓集和纯化微量物质的一种方法。</p>\n<p>早期研究共沉淀规律的有哈恩、赫洛宾等，其中亨德森和克雷克西提出了一个公式。</p>\n<p>影响共沉淀的因素有：温度、液相组成、固相组成及溶剂等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>共沉淀有以下两种：</p>\n<p>1）无机共沉淀法</p>\n<p>无机化合物做载体。共结晶共沉淀法和吸附共沉淀法。</p>\n<p>2）有机共沉淀法</p>\n<p>有机化合物作载体。难溶的离子缔合物、难溶的金属螯合物、有机胶体的吸附作用而生成的共沉淀。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>4.2.2 共沉淀法分离过程</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>4.2.2 共沉淀法分离过程</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>沉淀剂与载体生成的共沉淀化合物溶解度要小；</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n<p>（2）共沉淀产物纯度的提高</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>共沉淀法的应用</p>\n<p>4.2.4 共沉淀法分离应用</p>\n</div>", "电化学(能斯特方程)": "<div class=\"th\"><div class=\"th-top\"><h2>电化学(能斯特方程)</h2><span class=\"tt\" style=\"background:#e63946\">计算/选择</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>电化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>电化学分离法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>在螯合萃取剂中至少要有两个参加反应的官能团，其中一个为-OH或-SH基团，另一个为具有给电子性质的碱性官能团。金属置换-OH或-SH基团上的氢，并与碱性官能团配位，形成稳定的五元或六元环（从键角考虑，五元或六元环最稳定）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 139 页</div>\n<p>“不使用外加电压时放射性物质的电化学析出法”（称电化学置换法）</p>\n<p>“使用外加电压时放射性物质的电化学沉积法”（称电解沉积法）</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 140 页</div>\n<p>1. 电化学置换法</p>\n<p>4.5  电化学分离方法</p>\n<p>电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 141 页</div>\n<p>1. 电化学置换法基本原理</p>\n<p>4.5  电化学分离方法</p>\n<p>基于每种金属元素都有一定的标准电极电势值（   ），在溶液中电极电势值（E）大的金属离子，可以将浸在溶液中其电极电势值（E）较小的金属原子置换下来，而自身沉积于金属的表面。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 142 页</div>\n<p>例如：欲分离母－子体核素<sup>210</sup>Bi－<sup>210</sup>Po，可将铜片（电极材料）插入含有上述母－子体核素的溶液中，由于铜的标准电极电势大于铋而小于钋，导致Po在铜表面析出，或称Po自镀在铜片上。而铋仍留在溶液中。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 143 页</div>\n<p>（1）降低溶液中作为电极材料的金属的离子浓度，使金属电极的实际电极电势（E）值小于欲分离核素离子的电极电势（E）值。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 144 页</div>\n<p>⑵用氢电极法来改变电极电势。此法是用标准电极电势值大的铂金属作电极，浸入含有欲分离放射性核素的溶液中，然后将纯氢气通入溶液，铂金属就会吸附氢，并被氢所饱和，成为氢电极。</p>\n<p>4.5  电化学分离方法</p>\n<p>解决电极电势小的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 145 页</div>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 146 页</div>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 147 页</div>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 149 页</div>\n<p>| 沉淀法 | 萃取法 | 色谱法 | 电化学法</p>\n</div>", "载体与反载体": "<div class=\"th\"><div class=\"th-top\"><h2>载体与反载体</h2><span class=\"tt\" style=\"background:#f77f00\">问答</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>对以微量或低浓度状态存在的放射性物质的分离，为避免被容器表面吸附或被沉淀载带损失，常需要载体；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>载体Carrier</p>\n<p>载体是以适当的数量载带某种微量物质共同参与某化学或物理过程的另一种物质。</p>\n<p>载体与被载带物具有相同的化学行为，最终能与放射性物质一起被分离出来。</p>\n<p>同位素载体</p>\n<p>非同位素载体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>稳定同位素或长寿命同位素的可溶性盐类作载体</p>\n<p>同位素载体</p>\n<p>非同位素载体</p>\n<p>没有稳定同位素的放射性核素，应用化学性质相似的稳定元素的盐类作载体。</p>\n<p>载体溶液的浓度一般10mg元素/ml，加入10~20mg。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>载体的作用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>反载体Anti-carrier</p>\n<p>为了减少分离过程对杂质核素的载带，在加入被分离核素和载体之外，还必须加入这些杂质核素的稳定同位素或化学类似物，以减少它们对被分离核素和器皿的污染，即起反载带作用，这类稳定同们素或化学类似物就称为反载体或抑制体。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>放射性核素纯度(Radionuclide purity)</p>\n<p>放射性核素纯度也称放射性纯度，指在含有某种特定放射性核素的物质中，该核素的放射性活度对物质中总放射性活度的比值。（该物质中可能有多种放射性核素，放射性核素纯度只与其中放射性杂质的量有关，而与非放射性杂质的量无关）。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>回收率可以通过加入载体或者加入放射性示踪剂的方法来测定。</p>\n<p>当载体的化学状态与被分离的放射性核素的化学状态完全相同时，化学收率可用载体的化学收率来表示。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>无机化合物做载体。共结晶共沉淀法和吸附共沉淀法。</p>\n<p>有机化合物作载体。难溶的离子缔合物、难溶的金属螯合物、有机胶体的吸附作用而生成的共沉淀。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>向溶液中加入各种可能存在的价态的载体，然后用某种氧化-还原反应使价态变成一致</p>\n<p>加入一种价态的载体，然后进行一次氧化-还原反应循环，把各种可能的价态变成一种价态。</p>\n<p>例如：为了从裂变产物中分离碘，可加入碘化钾作载体，在碱性溶液中用次氯酸钠将低价态的碘全部氧化成7价，再用亚硝酸钠将七价碘还原为单质碘。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>载体：尽量选用同位素载体，也可选用非同位素载体。</p>\n<p>为了减少 分离过程中放射性杂质对欲分离核素的污染，必须加入反载体。</p>\n<p>一般情况下，载体量在5~20mg，反载体量10mg为宜。</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>净化载体：可将多种杂志离子从溶液中除去，让所需的放射性核素留在溶液中。又称清扫载体或净化载体。</p>\n<p>常用的净化载体：氢氧化铁、氢氧化钍、硫酸钡、碳酸钡、二氧化锰、三硫化二铋等。净化操作要经过多次才能达到净化程度。</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n<p>实际分离过程中是载体、反载体、净化载体共同使用。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>净化载体</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>沉淀剂与载体生成的共沉淀化合物溶解度要小；</p>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>（1）载体的选择和沉淀剂的选择</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>加反载体或络合剂；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>方法简便，分离速度快，适用于短寿命放射性核素的分离；选择性好，回收率高，可用于制备无载体的源； 设备简单，操作方便，易于连续化和自动化；可供选择的萃取剂多，对微量物质的分离合工业生产规模的分离均可使用等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 74 页</div>\n<p>向溶液中加入各种可能存在的价态的载体，然后用某种氧化-还原反应使价态变成一致</p>\n<p>加入一种价态的载体，然后进行一次氧化-还原反应循环，把各种可能的价态变成一种价态。</p>\n</div>", "溶剂萃取": "<div class=\"th\"><div class=\"th-top\"><h2>溶剂萃取</h2><span class=\"tt\" style=\"background:#f77f00\">问答/填空</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>常用的分离方法有：沉淀法、溶剂萃取法、色谱法等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>在Purex流程中，加入TBP-煤油，将           、     萃取放有机相中，使U、Pu与其它杂质分离；加入U(Ⅳ)将Pu(Ⅳ)还原成Pu(Ⅲ)，钚反萃入水中，使铀、钚分离。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>溶剂萃取法又叫液-液萃取法。</p>\n<p>4.3 溶剂萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>4.1.1 萃取法基本概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>4.1.1 萃取法基本概念</p>\n<p>利用不同的物质在溶剂中溶解度不同，在一种混合物中加入适当的溶剂，使混合物中的组分得到部分或完成分离的过程叫做溶剂萃取。</p>\n<p>“固-液” 萃取</p>\n<p>“液-液” 萃取</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>4.1.1 萃取法基本概念</p>\n<p>TBP-煤油提取U、Pu（溶剂萃取）</p>\n<p>萃取之前</p>\n<p>萃取之后</p>\n<p>有机相（萃取液）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>方法简便，分离速度快，适用于短寿命放射性核素的分离；选择性好，回收率高，可用于制备无载体的源； 设备简单，操作方便，易于连续化和自动化；可供选择的萃取剂多，对微量物质的分离合工业生产规模的分离均可使用等。</p>\n<p>4.3 溶剂萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>萃取净化过程包括三个主要步骤：</p>\n<p>萃取、洗涤和反萃</p>\n<p>铀钚共萃取共去污</p>\n<p>4.1.1 萃取法基本概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>4.1.1 萃取法基本概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>4.1.1 萃取法基本概念</p>\n<p>萃取平衡是一种动态平衡，当条件发生变化时，原理的平衡被破坏，又会建立新的平衡。建立萃取平衡是需要较长时间的，因此，在实际应用上，只能设法接近于平衡，以便提高生产效率。</p>\n<p>萃取平衡</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>4.1.1 萃取法基本概念</p>\n<p>萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的 →疏水的</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>4.1.1 萃取法基本概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>萃取方法</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>1）萃取剂和稀释剂</p>\n<p>通常把有机相中能将处于水相中的欲萃取物质转移到有机相的有机试剂叫做萃取剂。</p>\n<p>为了改善萃取剂的某些物理性能而加入的有机溶剂叫稀释剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>2)反萃取剂</p>\n<p>能使被萃取物质从有机相返回到水相溶液的试剂。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n<p>例：在铀浸出液-30%TBP(TBP+煤油)萃取铀，有机相用水清洗，洗出铀。TBP为萃取剂、煤油为稀释剂、水为反萃取剂</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>3）萃取率E</p>\n<p>经萃取而进入有机相的欲萃取物的量占其在两相中总量的百分数。</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>3）萃取率E</p>\n<p>萃取率E与分配系数D萃的关系：</p>\n<p>4.3.1 溶剂萃取法概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 57 页</div>\n<p>4.3 溶剂萃取法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>1）萃取机理</p>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n<p>如用TBP萃取U(Ⅵ)，亲水的         →疏水的</p>\n<p>4.3.2 萃取机理和萃取剂的种类</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 59 页</div>\n<p>2）萃取剂的种类</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>惰性萃取剂（CCl<sub>4</sub> 、CHCl<sub>3</sub>、 C<sub>6</sub>H<sub>14</sub>等），萃取剂与萃取物不发生化学反应，欲萃取物在两相之间按溶解度大小进行分配；</p>\n<p>中性含氧萃取剂（酮类、醚类、醇类等）具有一定极性的含氧有机化合物，在酸的作用下萃取剂先与水生成烊离子，再与欲萃取物发生离子缔合反应，也称盐萃取；</p>\n<p>4.3.2 萃取机理和条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>中性含氧萃取剂形成烊盐的能力与其所含氧原子的配位能力有关，大致有如下的关系：</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 62 页</div>\n<p>中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)<sup>3</sup>PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 63 页</div>\n<p>这类萃取剂的萃取能力取决于P=O键的极性，其大小顺序：</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>酸性磷类萃取剂</p>\n<p>这类萃取剂是指磷酸分子（HO)<sup>3</sup>PO中的一个或二个羟基被烷基酯化或取代所生成的化合物；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>胺类萃取剂</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>能与水相中的金属阳离子结合成疏水的电中性环状螯合物而被萃取；</p>\n<p>这类萃取剂在萃取过程中生成具有螯合环的萃合物，即：螯合物。</p>\n<p>在螯合萃取剂中至少要有两个参加反应的官能团，其中一个为-OH或-SH基团，另一个为具有给电子性质的碱性官能团。金属置换-OH或-SH基团上的氢，并与碱性官能团配位，形成稳定的五元或六元环（从键角考虑，五元或六元环最稳定）。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>为了满足萃取剂亲有机相的基本要求，还必须在萃取剂分子中引入适当的取代基，并且在萃取剂分子中不应有亲水性基团。</p>\n<p>协同萃取剂 和冠状化合物类萃取剂</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>协同萃取剂，当萃取剂中含有两种或两种以上的萃取剂，使被萃取物的分配系数显著大于每一种萃取剂在相同条件下单独使用时的分配系数之和；TTA-TBP协同萃取水中的U(Ⅵ) →</p>\n<p>冠状化合物类萃取剂，主要包括冠醚和穴醚。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>(I)对萃取剂的要求</p>\n<p>对欲萃取物的分配系数大，萃取容量大，选择性好，易于反萃取；</p>\n<p>萃取反应速度快；粘度小，与水的比重差别大，相分离和流动性能好，不易形成第三相或发生乳化；</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>影响萃取率的因素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>i)酸度和酸类，在保证萃取率足够高和不发生水解反应的前提下，应尽可能在较低酸度下进行萃取，水相中的酸类也会影响萃取剂的能力，在放射化学分离中，常用的是硝酸和盐酸体系。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 71 页</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 72 页</div>\n<p>ii)掩蔽剂，加入一种适宜的掩蔽剂（通常是络合剂），使之与不希望被萃取的元素发生络合作用，对干扰物质进行掩蔽，以阻止它们进入有机相，从而提高欲萃取物的纯度。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>用TBP萃取含有杂质Zr离子的U(VI)时，加入EDTA，使之与Zr等杂质离子络合。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>iii)盐析剂，在萃取体中，如果加入一种易溶于水相的盐类，它既不被萃取，又不与欲萃取物发生反应，但可提高欲萃取物的萃取率，这种盐称为盐析剂。它能提高被萃取物的萃取率，是由于它具有水合作用和同离子效应；如萃取          ，用          。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 74 页</div>\n<p>iv)欲萃取物的价态，欲萃取物的价态不同，其分配系数也就不同，因此，可借助于控制水相中各种物质的不同价态来实现分离。U(Ⅵ)， U(Ⅳ)。</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 75 页</div>\n<p>进行一次萃取  萃取率E<sub>1</sub>为：</p>\n<p>残留欲萃取物的百分数r1为：</p>\n<p>进行x次萃取</p>\n<p>萃取率Ex,总为：</p>\n<p>残留欲萃取物的百分数rx为：</p>\n<p>(III) 萃取次数（相比固定）</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 76 页</div>\n<p>用HDEHP萃取放射性废水中的<sup>90</sup>Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求<sup>90</sup>Sr的总萃取率达到99.9%，试计算萃取次数？</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 77 页</div>\n<p>用HDEHP萃取放射性废水中的<sup>90</sup>Sr时，已知相比R=0.2，D萃为74.8，试求一次萃取的萃取率？如果要求<sup>90</sup>Sr的总萃取率达到99.9%，试计算萃取次数？</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 78 页</div>\n<p>4.3.2 萃取机理和萃取条件</p>\n<p>(III) 萃取次数（有机相用量固定）</p>\n<p>进行一次萃取  萃取率E<sub>1</sub>（/100%）为：</p>\n<p>进行x次萃取，萃取率Ex,总（/100%）为：</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 79 页</div>\n<p>洗涤液条件的选择原则是杂质的分配系数要小，欲萃取物的分配系数要大。洗涤次数的选择必须兼顾净化效果和回收率。</p>\n<p>(V) 反萃取剂的选择、萃取设备的选择</p>\n<p>4.3.2 萃取机理和萃取条件</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>4.3.3 溶剂萃取法的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>1）萃取的原理</p>\n<p>2）萃取机理</p>\n<p>3）影响萃取结果的因素有哪些？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 86 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>早期的Purex流程有共去污、分离以及净化三个循环，铀和钚都经过三次萃取和反萃</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 88 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 89 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 90 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 91 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 92 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 93 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>在HDEHP萃取时，锕系留在水相，镧系进入有机相，从而使二者分离</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 94 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 95 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>从硫酸浸出液中萃取铀</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 96 页</div>\n<p>4.3.3 溶剂萃取法在工业上的应用</p>\n<p>美国一水冶厂用Alamine-336从硫酸浸出液中萃取铀流程</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 97 页</div>\n<p>萃取率E与分配系数D萃的关系？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 100 页</div>\n<p>吸附色谱法、离子交换色谱法、萃取色谱法和凝胶色谱</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 133 页</div>\n<p>萃取柱色谱法</p>\n<p>萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。</p>\n<p>正相萃取柱色谱法中水溶液被吸附在吸附剂上作为固定相，有机萃取剂为流动相。</p>\n<p>反相萃取柱色谱法是使有机萃取剂吸附在吸附剂上作为固定相，水溶液为流动。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 134 页</div>\n<p>萃取柱色谱法基本原理</p>\n<p>利用不同物质在固定相（萃取剂）和流动相之间萃取分配系数的不同来达到彼此分离的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 137 页</div>\n<p>用色谱纸或以萃取剂、液体离子交换剂吸附在色谱纸上作固定相，用有机溶剂或水溶液作流动相来分离不同物质的一种色谱分离方法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 149 页</div>\n<p>| 沉淀法 | 萃取法 | 色谱法 | 电化学法</p>\n</div>", "离子交换分离": "<div class=\"th\"><div class=\"th-top\"><h2>离子交换分离</h2><span class=\"tt\" style=\"background:#f77f00\">问答/填空</span></div><div class=\"src\">来源：第四章 物质的分离</div></div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>放射化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>离子交换法</p>\n<p>电化学分离法</p>\n<p>其他分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>了解分离方法的原理和过程</p>\n<p>掌握分离效率指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>放射性核素通常与其母体、其它子体以及其它放射性核素共存，要得到某种放射性核素就必须进行一些分离。</p>\n<p>常用的分离方法有：沉淀法、溶剂萃取法、色谱法等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>对以微量或低浓度状态存在的放射性物质的分离，为避免被容器表面吸附或被沉淀载带损失，常需要载体；</p>\n<p>对极短寿命放射性物质需进行快速分离。如Zr-101（2.0 s）、Mo-107 （3.5 s）和Ru-112 （3.6 s）</p>\n<p>放射化学分离特点</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>放射分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>载体与被载带物具有相同的化学行为，最终能与放射性物质一起被分离出来。</p>\n<p>例如：分离<sup>226</sup>Ra加入Ba，<sup>127</sup>I对<sup>131</sup>I，<sup>1</sup>H对<sup>3</sup>H等。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>提高被分离物质的量；</p>\n<p>克服微量放射性物质易被吸附而丢失和不易分离的问题;</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>为了减少分离过程对杂质核素的载带，在加入被分离核素和载体之外，还必须加入这些杂质核素的稳定同位素或化学类似物，以减少它们对被分离核素和器皿的污染，即起反载带作用，这类稳定同们素或化学类似物就称为反载体或抑制体。</p>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>2) 分离系数α</p>\n<p>物料中两种物质经过某一分离过程后分别在不相溶的两相中相对含量之比,它表示两物质经过分离操作之后所达到的相互分离的程度。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n<p>α越大于1或越少于1，两种物质越容易分离，若等于1，则两种物质无法分离。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>在Purex流程中，加入TBP-煤油，将           、     萃取放有机相中，使U、Pu与其它杂质分离；加入U(Ⅳ)将Pu(Ⅳ)还原成Pu(Ⅲ)，钚反萃入水中，使铀、钚分离。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n<p>2) 分离系数β</p>\n<p>物料中两种物质在分离前，原始样品中含量的比值与分离后产品中含量的比值之比 。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>当载体的化学状态与被分离的放射性核素的化学状态完全相同时，化学收率可用载体的化学收率来表示。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>净化系数又称去污系数或去污因子，它是衡量分离过程对某种放射性杂质去除程度的一种指标。</p>\n<p>当欲分离核素在分离过程中的化学回收率接近100%，</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>对各种干扰测定的入放射性杂质的去污系数愈高，则测定的欲分离核素放射性活度愈可靠。一般要求DF高于103以上。</p>\n<p>4.1.2 放射化学分离中常用的指标</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>共沉淀法是利用微量物质随常量物质一起生成沉淀现象来进行分离、浓集和纯化微量物质的一种方法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>4.2.2 共沉淀法分离过程</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>4.2.2 共沉淀法分离过程</p>\n<p>例如：为了从裂变产物中分离碘，可加入碘化钾作载体，在碱性溶液中用次氯酸钠将低价态的碘全部氧化成7价，再用亚硝酸钠将七价碘还原为单质碘。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>为了减少 分离过程中放射性杂质对欲分离核素的污染，必须加入反载体。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>实际分离过程中是载体、反载体、净化载体共同使用。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>4.1.1 放射化学分离中的概念</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>沉淀性能好，易于固液分离；</p>\n<p>有利于分离操作和制源测量。</p>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>4.2.3 共沉淀法分离的条件控制</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>4.2.4 共沉淀法分离应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>利用不同的物质在溶剂中溶解度不同，在一种混合物中加入适当的溶剂，使混合物中的组分得到部分或完成分离的过程叫做溶剂萃取。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>方法简便，分离速度快，适用于短寿命放射性核素的分离；选择性好，回收率高，可用于制备无载体的源； 设备简单，操作方便，易于连续化和自动化；可供选择的萃取剂多，对微量物质的分离合工业生产规模的分离均可使用等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>铀钚共去污-分离循环</p>\n<p>铀钚分离</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>利用各种不同物质在互不相溶的两种液体中具有各种不同的分配比例，选择特殊的有机试剂，将待分离的微量核素从原溶液中转移到另一种液体中，进而达到分离、提纯或浓缩等目的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 58 页</div>\n<p>萃取过程中萃取剂与欲萃取物间相互作用的机制以及萃取过程的规律。萃取过程的本质有的是根据物质在两相中溶解度的不同进行分离的物理分配过程，但大多数则是将萃取物由亲水性转为疏水性可萃取物的化学分配过程。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>萃取反应速度快；粘度小，与水的比重差别大，相分离和流动性能好，不易形成第三相或发生乳化；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>i)酸度和酸类，在保证萃取率足够高和不发生水解反应的前提下，应尽可能在较低酸度下进行萃取，水相中的酸类也会影响萃取剂的能力，在放射化学分离中，常用的是硝酸和盐酸体系。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 74 页</div>\n<p>iv)欲萃取物的价态，欲萃取物的价态不同，其分配系数也就不同，因此，可借助于控制水相中各种物质的不同价态来实现分离。U(Ⅵ)， U(Ⅳ)。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 80 页</div>\n<p>放射性核素分离</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 86 页</div>\n<p>早期的Purex流程有共去污、分离以及净化三个循环，铀和钚都经过三次萃取和反萃</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 87 页</div>\n<p>U(VI)和Pu(IV)萃入有机相，与大部分裂变产物分离</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 88 页</div>\n<p>第 二循环：铀钚分离循环</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 93 页</div>\n<p>在HDEHP萃取时，锕系留在水相，镧系进入有机相，从而使二者分离</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 94 页</div>\n<p>Talspeak流程典型分离条件</p>\n<p>3价镧系可从镅到镄的三价锕系分离；</p>\n<p>铈和镅的分离因子为约130；</p>\n<p>分离因子最小的是钕和镧，约为10</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 97 页</div>\n<p>A 、K交换= 6.26；       B、 K交换=1.45 ；</p>\n<p>C、 K交换=1.034；      D、K交换= 1.004。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 99 页</div>\n<p>色谱法又叫色层法或层析法，色谱法是利用混合物中各组分在固定相和流动相中亲和力的差异使各组分在两相之间分配不同来实现彼此分离的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 100 页</div>\n<p>分离过程机理</p>\n<p>吸附色谱法、离子交换色谱法、萃取色谱法和凝胶色谱</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 101 页</div>\n<p>基本原理：吸附柱色谱法是利用溶液在通过装有吸附剂的柱子时，各组分因吸附能力的不同，在吸附剂上滞留程度不同，从而实现各组分的分离。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 102 页</div>\n<p>分离操作：在进行分离操作过程时，流速控制在1ml/min左右。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 103 页</div>\n<p>柱色谱法分离过程示意图</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 104 页</div>\n<p>离子交换柱色谱法</p>\n<p>基本原理：是利用固体物质中的可交换离子与溶液中的不同离子之间能发生交换反应来进行分离的一种方法。</p>\n<p>具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 105 页</div>\n<p>从阳离子Mn+与氢型阳离子交换树脂RH之间可发生下列反应：</p>\n<p>、      表示Mn+在离子交换剂和溶液中的平衡浓度；</p>\n<p>、     表示H+在离子交换剂和溶液中的平衡浓度。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 106 页</div>\n<p>表示在一定条件下，离子交换剂对Mn+、 H+的选择能力的大小。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 107 页</div>\n<p>影响离子交换亲和力的因素很多，主要是离子的电荷数Z和离子的水化离子半径r水。</p>\n<p>交换亲和力影响因素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 108 页</div>\n<p>离子交换剂的选择和预处理；</p>\n<p>分离操作：有吸附、洗涤、淋洗及树脂再生</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 109 页</div>\n<p>完成一个离子交换过程需要经过五个步骤：</p>\n<p>（1）外部溶液中的可交换离子穿过树脂颗粒表面的液膜，到达树脂表面，这个过程称为：膜扩散。</p>\n<p>（2）可交换离子在树脂颗粒内部扩散，到达树脂交换基团附近的交换位置，这个过程称为：内扩散。</p>\n<p>（3）可交换离子与树脂交换基团的反离子发生离子交换反应，可交换离子与树脂官能团结合，反离子则脱离树脂官能团。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 110 页</div>\n<p>离子交换过程示意图</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 111 页</div>\n<p>交联剂：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂性能</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 112 页</div>\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 113 页</div>\n<p>离子交换树脂的交换容量</p>\n<p>1）理论交换容量（又称“总交换容量” ）</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>树脂的单位量用1 mL表示，则称为：体积理论交换容量。</p>\n<p>树脂的单位量用1 g表示，则称为：质量理论交换容量。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 114 页</div>\n<p>2）工作交换容量</p>\n<p>工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。</p>\n<p>工作交换容量分类：穿透交换容量、饱和交换容量和再生交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 115 页</div>\n<p>3）穿透交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度达到规定的穿透浓度时，树脂所达到的交换容量。</p>\n<p>穿透交换容量不仅与具体的操作条件和离子交换反应速度有关，而且与穿透浓度的规定值有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>4）饱和交换容量</p>\n<p>在柱式操作中，被吸附离子在流出液中的浓度与流入液中的浓度相等时，树脂所达到的交换容量。饱和交换容量是动力学意义上的工作交换容量，它与具体的操作条件和离子交换反应速度有关。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 117 页</div>\n<p>5）再生交换容量</p>\n<p>在指定的再生剂（或解吸剂）用量相同条件下测定的树脂交换容量。再生交换容量与再生剂的用量有关，在实际使用时，从经济原因考虑一般不要求树脂达到完全再生（或解吸），所以树脂的再生交换容量一般小于新树脂的饱和交换容量。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 118 页</div>\n<p>离子交换树脂的交换容量用单位量树脂所吸附离子的量表示。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 119 页</div>\n<p>离子交换树脂的溶胀</p>\n<p>由于离子交换树脂是由亲油性的大分子骨架和亲水性的交换基团组成的，干燥的离子交换树脂接触水或有机溶剂时，在树脂结构的不同部分会分别发生溶剂化作用，都会引起树脂体积的膨胀（溶胀）。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 120 页</div>\n<p>离子交换树脂的粒度</p>\n<p>树脂粒度对其工作的交换容量、离子交换速度等有很大的影响。</p>\n<p>4.3.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 122 页</div>\n<p>通过化学反应，在树脂的共聚体骨架上引入交换基团以后，就成为离子交换树脂。</p>\n<p>离子交换树脂结构</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 123 页</div>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n<p>离子交换树脂</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>特种离子交换树脂</p>\n<p>强酸型阳离子交换树脂（R-SO<sub>3</sub>H型）</p>\n<p>弱酸型阳离子交换树脂（R-COOH型）</p>\n<p>强碱性阴离子交换树脂（R-CH<sub>2</sub>NR<sub>3</sub>Cl型）</p>\n<p>弱碱性阴离子交换树脂（R-CH<sub>2</sub>NH<sub>3</sub>OH型）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 124 页</div>\n<p>离子交换树脂按照官能团的电荷性质分为：</p>\n<p>阳离子交换树脂</p>\n<p>阴离子交换树脂</p>\n<p>离子交换树脂按照树脂交换基团在水中的电离常数分为：</p>\n<p>4.3.2 离子交换柱色谱法</p>\n<p>离子交换树脂分类</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 125 页</div>\n<p>阳离子交换树脂</p>\n<p>阳离子交换树脂的官能团带负电荷，反离子为带正电荷的氢离子或金属阳离子，可以与外部溶液中的阳离子进行交换反应；</p>\n<p>阴离子交换树脂</p>\n<p>阴离子交换树脂的官能团带正电荷，反离子为带负电荷的阴  离子（氢氧根离子或其它酸根离子），可以与外部溶液中的阴离子进行交换反应。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 126 页</div>\n<p>用阳离子交换树脂吸附铀</p>\n<p>用阴离子交换树脂吸附铀</p>\n<p>式中：X－ 是树脂交换基团的反离子，例如：Cl－ 或NO<sub>3</sub>－；</p>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 127 页</div>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 128 页</div>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 129 页</div>\n<p>4.2.2 离子交换柱色谱法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 130 页</div>\n<p>（1）离子交换树脂必须不溶于水，也不会因为被水溶剂化而分解。</p>\n<p>（2）离子交换树脂的高聚物骨架上应有足够数量的交换基团。在树脂被水溶剂化的条件下，交换基团能电离，生成能自由移动的反离子。</p>\n<p>（3）在溶剂化的条件下，树脂内部应当有足够的空间，反离子与外部溶液中相同电荷的离子可以不受阻碍地自由扩散，进行交换。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 131 页</div>\n<p>（4）离子交换树脂必须具有化学稳定性。离子交换树脂应当不溶于无机酸、碱、盐的水溶液，也不溶于各种有机溶剂。</p>\n<p>（5）离子交换树脂必须具有物理稳定性。离子交换树脂应当有足够的机械强度和使用寿命，能够耐热和耐辐照。</p>\n<p>4.2.2 离子交换柱色谱法</p>\n<p>离子交换树脂基本要求</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 132 页</div>\n<p>离子交换分离方法</p>\n<p>离子交换</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 134 页</div>\n<p>利用不同物质在固定相（萃取剂）和流动相之间萃取分配系数的不同来达到彼此分离的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 137 页</div>\n<p>用色谱纸或以萃取剂、液体离子交换剂吸附在色谱纸上作固定相，用有机溶剂或水溶液作流动相来分离不同物质的一种色谱分离方法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 138 页</div>\n<p>将固定相均匀地涂覆在一块玻璃板或塑料板上，开成薄层，将试样滴在它的一端，用适宜的展开剂作流动相，借助毛细作用流经薄层，使不同组分随流动相展开，从而得到分离目的的一种方法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 139 页</div>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 140 页</div>\n<p>4.5  电化学分离方法</p>\n<p>电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 141 页</div>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 142 页</div>\n<p>例如：欲分离母－子体核素<sup>210</sup>Bi－<sup>210</sup>Po，可将铜片（电极材料）插入含有上述母－子体核素的溶液中，由于铜的标准电极电势大于铋而小于钋，导致Po在铜表面析出，或称Po自镀在铜片上。而铋仍留在溶液中。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 143 页</div>\n<p>（1）降低溶液中作为电极材料的金属的离子浓度，使金属电极的实际电极电势（E）值小于欲分离核素离子的电极电势（E）值。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 144 页</div>\n<p>⑵用氢电极法来改变电极电势。此法是用标准电极电势值大的铂金属作电极，浸入含有欲分离放射性核素的溶液中，然后将纯氢气通入溶液，铂金属就会吸附氢，并被氢所饱和，成为氢电极。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 145 页</div>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 146 页</div>\n<p>电解沉积法简称电沉积法，它是利用欲分离核素离子在外加电压的作用下，在电极上发生氧化还原反应即电解来实现分离的电化学分离法。</p>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 147 页</div>\n<p>4.5  电化学分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 148 页</div>\n<p>同位素交换法</p>\n<p>快化学分离法</p>\n<p>膜分离技术</p>\n<p>4.6  其它分离方法</p>\n<p>其他分离方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 149 页</div>\n<p>微量放射性物质的分离 |  |  |  |</p>\n<p>分离效率指标 |  |  |  |</p>\n</div>", "天然放射性系": "<div class=\"th\"><div class=\"th-top\"><h2>天然放射性系</h2><span class=\"tt\" style=\"background:#06d6a0\">选择/填空</span></div><div class=\"src\">来源：第六章 天然放射性元素化学</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>天然放射性元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>掌握天然放射性核素化合物的性质</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>天然放射性元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>自然界还存在一些不属于天然放射系而半衰期很长的放射性核素：<sup>40</sup>K、<sup>87</sup>Rb；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>人工放射系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>（4n+2铀系）</p>\n<p>母体：<sup>238</sup>U，</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>母体：<sup>235</sup>U</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>自然界中存三个天然放射系</p>\n<p>母体：<sup>232</sup>Th</p>\n<p>（4n）钍系</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>人工放射系</p>\n<p>母体：<sup>237</sup>Np</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>放射系名称 | 起始核素 | 终止核素 | 衰变次数</p>\n<p>放射系衰变规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>放射系衰变的时间规律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>由母体衰变生成的子体核素常常也是放射性的</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>1.天然放射性元素有        种。</p>\n<p>放射系名称 | 又称 | 起始核素 | 终止核素</p>\n<p>放射系名称 | 又称 | 起始核素 | 终止核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>母体核素的半衰期不太长,但比子体核素的半衰期长</p>\n<p>母体核素的半衰期比子体核素的半衰期短</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>暂时平衡：母体长半衰期保障供应稳定性，子体短半衰期降低患者辐射风险。子体核素积累量与母体衰变速率相关，需定期洗脱以维持最佳活性。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>利用母体<sup>99</sup>Mo的化学物能被发生器中的吸附剂吸附，而其子体99mTc的化学物不被吸附的原理，在使用时选用适当的淋洗剂（如生理盐水）就可将子体核素淋洗出来，供直接使用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>天然放射性元素化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>铀共有15种放射性同位素和一种同质异能素，其中<sup>238</sup>U、<sup>235</sup>U和<sup>234</sup>U三种天然放射性同位素，它们组成了天然铀。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>表 铀的天然放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 102 页</div>\n<p>1.铀的天然放射性核素有几种？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 103 页</div>\n<p>1.铀的天然放射性核素有几种？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 108 页</div>\n<p>1898年居里夫人发现了镭。天然镭是铀系、钍系和锕系三个天然放射系的成员，与铀、钍矿共存。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 110 页</div>\n<p>表 镭的天然放射性同位素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 118 页</div>\n<p>其中射气法是基于封存一定时间的含镭样品溶液中新累积的短寿命子体氡积累一定时间后的活度与母体镭达到平衡：<sup>226</sup>Ra→<sup>222</sup>Rn → <sup>218</sup>Po。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 125 页</div>\n<p>铀系：<sup>226</sup>Ra→<sup>222</sup>Rn → <sup>218</sup>Po(RaA)→<sup>214</sup>Pb(RaB) →<sup>214</sup>Bi (RaC)→<sup>214</sup>Po (RaCʹ)→</p>\n<p>钍系：<sup>224</sup>Ra→<sup>220</sup>Rn → <sup>216</sup>Po(ThA)→<sup>212</sup>Pb(ThB) →<sup>212</sup>Bi (ThC)→<sup>212</sup>Po (ThCʹ)→</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 126 页</div>\n<p>在氡的放射性同位素中最重要的是三个天然放射系的成员<sup>222</sup>Rn、 <sup>220</sup>Rn和<sup>219</sup>Rn。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 145 页</div>\n<p>新制备好的<sup>222</sup>Rn源母体<sup>226</sup>Ra活度的测定</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 148 页</div>\n<p>钋是1898年被玛丽．居里夫人发现的，这了纪念她的祖国波兰，而命名为Polonium，尽管铀系和钍系的衰变均可产生钋，但它含量很低，地壳中钋的分布量2×10-14%。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 156 页</div>\n<p>铀系成员234mPa、<sup>234</sup>Pa。是β放射体，半衰期分别为1.17 min和6.75 h，</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 169 页</div>\n<p>自然界存在的最重要的Fr的同位素是<sup>223</sup>Fr，存在于铀矿石中，大约7.7×1014个<sup>235</sup>U原子或3×1018个天然铀原子中有一个钫原子。另一个天然存在的核素是<sup>224</sup>Fr，它存在于钍系里，是<sup>228</sup>Ac的α分支衰变子体。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 178 页</div>\n<p><sup>3</sup>H和<sup>14</sup>C是两种广泛存在于自然界的重要天然放射性核素， <sup>3</sup>H是一种重要的聚变核素，用于制造核武器。环境中的<sup>3</sup>H和<sup>14</sup>C和重要来源于大气层核爆炸，H和C是构成生物体的基本元素，所以对它们进行研究意义是十分重要的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 194 页</div>\n<p>其它天然放射性核素化学</p>\n</div>", "锕系元素与核反应": "<div class=\"th\"><div class=\"th-top\"><h2>锕系元素与核反应</h2><span class=\"tt\" style=\"background:#f77f00\">问答/计算</span></div><div class=\"src\">来源：第七章 锕系理论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>锕系（4n+3）</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 2 页</div>\n<p>锕系元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>7.1 锕系概论</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 4 页</div>\n<p>锕系理论</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 6 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 7 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>7.1 锕系通论——元素周期律</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>7.1 锕系通论——电子结构</p>\n<p>锕系元素（actinides，简写An）</p>\n<p>主锕系元素</p>\n<p>次锕系元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>锕系元素中的Ac、Pa、Np、Pu也存在于自然界中，但含量极微，而Th和U则是锕系元素中发现最早和地壳中含量较多的放射性元素。</p>\n<p>7.1 锕系通论——电子结构</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>7.1 锕系通论——原子半径</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>7.1 锕系通论——原子半径</p>\n<p>表  锕系元素离子半径</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>锕系元素的离子半径随原子序数的增加而减小，这种收缩是连续的但不均匀，前面几个元素的离子半径随5f电子的充填收缩较大，后面元素的半径收缩趋势就愈来愈小，其结果就使锕系元素的化学行为的差别随原子序数的增加而逐渐变小，以致分离超铀元素变得越来越困难。</p>\n<p>7.1 锕系通论——半径</p>\n<p>锕系收缩现象</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>锕系元素的化学性质与镧系元素相似，但比镧系复杂。由于锕系元素5f层电子的结合能，比镧系元素4f电子的结合能小，而且锕系元素的前几个元素有6d电子，故锕系元素有一系列氧化态（化合价）。</p>\n<p>7.1 锕系通论——价态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>表  锕系元素的价态</p>\n<p>7.1 锕系通论——价态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>核反应中达到所需裂变物质的最小反应物的质量，也就是刚好可以产生连锁反应的组合，所需最小系统质量，超过此质量就会发生核反应。</p>\n<p>7.1 锕系通论——临界质量</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>表   可裂变部分锕系的最小临界质量</p>\n<p>7.1 锕系通论——临界质量</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>新制备的锕系金属呈银白色或银灰色，有很高的密度；</p>\n<p>由于金属态锕系元素的电正性很大，可与大多数非金属直接化合，在空气中很快变暗；</p>\n<p>7.1 锕系通论——金属性质</p>\n<p>锕系元素金属的性质</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>锕系元素从锕到锫的金属态均己制得。</p>\n<p><sup>235</sup>U、<sup>239</sup>Pu等锕系元素都是裂变物质，当它们堆聚到一定量时，在一定的反射条件和分布形状下，就要发生链式反应，引起爆炸。例如，<sup>235</sup>U金属球状金属有水全反射时，临界质量为23kg，<sup>235</sup>U水溶液的最小临界质量只有800g。</p>\n<p>7.1 锕系通论——金属性质</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>7.1 锕系通论——化合物</p>\n<p>锕系元素金属与氢加热至200-300℃，固体金属即变成粉末状氢化物。氢化物遇热不稳定，在减压下或真空中加热至300℃则分解成粉末状金属。氢化物的化学性质很活泼，在空气中能自燃，它能与许多物质起反应，可以作为合成某些化合物的起始物质。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>锕系元素能形成MH<sub>2</sub>和MH<sub>3</sub>两种氢化物</p>\n<p>7.1 锕系通论——化合物</p>\n<p>表  锕系元素的氢化物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p>表 锕系元素的氧化物</p>\n<p>7.1 锕系通论——化合物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 30 页</div>\n<p>7.1 锕系通论——化合物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 31 页</div>\n<p>锕系元素的碳化物类型有MC、M<sub>2</sub>C<sub>3</sub>和MC<sub>2</sub>，Pu还可形成Pu<sub>3</sub>C<sub>2</sub>。锕系元素中除U和Th外，其余的元素仅能形成一氮化物MN。</p>\n<p>7.1 锕系通论——化合物</p>\n<p>锕系元素的氮化物和碳化物</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>7.1 锕系通论——化合物</p>\n<p>卤化物尤其是氟化物是制备锕系化合物的中间体</p>\n<p>含氧酸盐常用于锕系元素的水溶液化学的研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 33 页</div>\n<p>表  锕系部分离子状态</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系元素离子状态</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 34 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 35 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 36 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>锕系离子在水溶液中的稳定性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 37 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>如何评价锕系离子在水溶液中的稳定性？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 39 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 40 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 41 页</div>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>表 锕系元素歧化势</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>锕系元素离子的半径较小和电荷较高，在水溶液中大都要发生水解，形成 M(OH)(n-1)+等物。</p>\n<p>7.1 锕系通论——水溶液化学</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 43 页</div>\n<p>溶液中锕系元素络合物的稳定性按下列顺序降低</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>在较低浓度时，某些锕系离子还易形成胶体溶液</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 44 页</div>\n<p>溶液中，同种锕系元素络合物的稳定性</p>\n<p>7.1 锕系通论——水溶液化学</p>\n<p>溶液中，四价锕系元素络合物的稳定性</p>\n<p>溶液中，六价锕系元素络合物的稳定性</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 45 页</div>\n<p>7.1 锕系通论——萃取化学</p>\n<p>研究较多的是锕系元素离子与中性磷类萃取剂配合，形成萃取配合物。</p>\n<p>TBP萃取锕系离子</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 46 页</div>\n<p>7.1 锕系通论——来源</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 47 页</div>\n<p>① 在核反应堆中用中子照射铀或其他锕系元素。在这种情况下，元素的核连续俘获一些中子，得到的核又继续进行β衰变，生成重锕系元素。</p>\n<p>② 在热核爆炸中脉冲中子流照射铀和其他锕系元素。在这种情况下，核同样多次俘获中子，接着进行β衰变，生成重锕系元素。</p>\n<p>7.1 锕系通论——来源</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>锕系元素（<sup>235</sup>U、<sup>233</sup>U、<sup>239</sup>Pu）能做核燃料；</p>\n<p>锕系元素<sup>245</sup>Cm、<sup>249</sup>Cf和<sup>242</sup>Am可用做小型反应堆的核燃料，因为这些核素在热中子裂变时有非常小的临界质量，其质量用克计算。</p>\n<p>锕系元素（<sup>242</sup>Cm、<sup>244</sup>Cm、<sup>238</sup>Pu），能做同位素能量发生器，</p>\n<p>7.1 锕系通论——应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 50 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>2.锕系元素释放到环境中与环境介质的相互作用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>3.锕系的理论计算</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>7.1 锕系通论——研究前沿</p>\n<p>4. 超锕系元素的研究</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>2. 主锕系元素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>2）歧化反应  当不存在络合剂时，各种价态的镎都不发生歧化反应，Np(V)也不发生歧化，这与其它+5价锕系离子（如U等）是不一样的。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>核反应产额计算在中子活化分析中的应用</p>\n<p>核反应：A+x→y+B</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 85 页</div>\n<p>如Pu(OH)3·xH<sub>2</sub>O 、 Pu(OH)4·xH<sub>2</sub>O 、PuO<sub>2</sub>OH、PuO<sub>2</sub>(OH)2等，都是胶体物质， 是兰色沉淀，在空气中很快被氧化成 绿色凝胶物Pu(OH)4·xH<sub>2</sub>O 。Pu(OH)4·xH<sub>2</sub>O是最常见的，它可溶于稀酸，在高温下加热可转化为PuO<sub>2</sub>。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 88 页</div>\n<p>钚能形成一系列难溶性盐类，如PuF<sub>4</sub>、草酸钚［Pu(C<sub>2</sub>O<sub>4</sub>)2］和碘酸钚［Pu(IO<sub>3</sub>)4］。难溶性的钚盐是沉淀法分离、浓集和纯化钚的重要化合物。比如Pu(C<sub>2</sub>O<sub>4</sub>)2是将Pu(NO<sub>3</sub>)4转化为金属钚的中间产物，Pu(C<sub>2</sub>O<sub>4</sub>)2加热分解为PuO<sub>2</sub>。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 109 页</div>\n<p>命名为锫是为了纪念曾合成多种锕系元素泊城市伯克利。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 114 页</div>\n<p>除锫的锎以外，到目前为止，已发现的超锔元素还有14种，即99-112号元素，其中99-103号元素属于锕系元素。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 115 页</div>\n<p>锕系元素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>3.  锕系（        ）物可以制作核材料？</p>\n<p>2. 中子活化分析法计算核反应产额？</p>\n<p>4.  锕系（        ）物可以制备锕系化合物的中间体？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 117 页</div>\n<p>5. 锕系元素的来源</p>\n</div>", "镭氡计算": "<div class=\"th\"><div class=\"th-top\"><h2>镭氡计算</h2><span class=\"tt\" style=\"background:#e63946\">计算</span></div><div class=\"src\">来源：第七章 锕系理论</div></div>\n<div class=\"ts\"><div class=\"sn\">第 48 页</div>\n<p>锕系元素<sup>245</sup>Cm、<sup>249</sup>Cf和<sup>242</sup>Am可用做小型反应堆的核燃料，因为这些核素在热中子裂变时有非常小的临界质量，其质量用克计算。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>3.锕系的理论计算</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>核反应产额计算在中子活化分析中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 73 页</div>\n<p>通过测定短寿命的<sup>238</sup>Np来计算<sup>237</sup>Np。如中子注量率为1×1013 cm-2 s-1， <sup>237</sup>Np的反应截面为169b，照射质量为1×10－12 g <sup>237</sup>Np<sub>24</sub>h，得到的<sup>238</sup>Np活度为多少Bq？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 116 页</div>\n<p>2. 中子活化分析法计算核反应产额？</p>\n</div>", "核素制备方法": "<div class=\"th\"><div class=\"th-top\"><h2>核素制备方法</h2><span class=\"tt\" style=\"background:#4361ee\">填空/问答</span></div><div class=\"src\">来源：第九章 放射性核素的制备</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>放射性核素的制备及放射性分析技术</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 3 页</div>\n<p>为什么制备放射性同位素？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 5 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>通过反应堆、加速器进行核反应，乏燃料后处理等，<sup>239</sup>Pu、<sup>239</sup>Np、<sup>131</sup>I等。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 8 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产</p>\n<p>加速器生产</p>\n<p>制备放射性核素的方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 9 页</div>\n<p>反应堆（核裂变反应堆）</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 10 页</div>\n<p>反应堆发展历程</p>\n<p>1942.12 费米建成第一座原子核裂变反应堆；</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 11 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆“燃烧”（加工）对象？</p>\n<p>反应堆燃料元件按其物理状态可分为固态、液态和气态三大类，其中最广泛应用的是固态燃料元件。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 12 页</div>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 13 页</div>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 14 页</div>\n<p>反应堆是一种强大的中子源，其中子通量一般为1010~1013cm-2·s-1，可通过反应堆的(n,α)、(n,p)、(n,f)及(n,γ)反应和次级核反应来生产放射性核素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 15 页</div>\n<p>(n,α)、(n,p)反应所需中子的能量较高，在热中子反应堆中，反应的截面都很小，仅少数几种轻元素（<sup>6</sup>Li、<sup>14</sup>N、<sup>32</sup>S、<sup>35</sup>Cl）可发生这类反应。由于这两种反应的产核与靶核分属不同的元素，故可用化学分离方法制得无载体的放射性核素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 16 页</div>\n<p>(n,γ)反应。生产放射性核素具有产额高成本低等优点而被广泛采用。产核和靶核是同位素而难以用化学方法分离，因而产品的比活度受到限制。</p>\n<p>9.2  放射性核素的制备</p>\n<p>反应堆生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 17 页</div>\n<p>目前全球有445座商用核动力反应堆在31个国家运行，总装机容量达  <sup>387</sup>GW，另有64座在建。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 18 页</div>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 19 页</div>\n<p>放入反应堆中照射， <sup>59</sup>Co(n,γ) <sup>60</sup>Co反应制得<sup>60</sup>Co。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 20 页</div>\n<p>粒子加速器（带电粒子加速器）</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 21 页</div>\n<p>加速器：回旋加速器、静电加速器、高压加速器、直线加速器等。</p>\n<p>用回旋加速器由于能量适中，流量足够而被常用，可加速p，d，α，<sup>15</sup>N和<sup>18</sup>O等粒子，加速的粒子轰击靶可引起(p,n)、(p,α)、(d,n)、(d,2n)、(d,α)、(α,n)、(α,2n)等核反应。</p>\n<p>9.2  放射性核素的制备</p>\n<p>加速器生产放射性核素</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 22 页</div>\n<p>粒子加速器发展历程</p>\n<p>1924~1928  建成直线加速器</p>\n<p>1932  回旋加速器</p>\n<p>1933  静电加速器</p>\n<p>1945  自动稳相原理（同步回旋加速器、同步加速器）</p>\n<p>1952   强聚焦同步加速器</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 23 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>加速器分类</p>\n<p>按加速粒子的种类不同：电子加速器，质子和重离子加速器，微物质粒子（粉末、灰尘等）加速器</p>\n<p>按加速粒子能量：低能加速器（100 MeV以下），中能加速器（100 MeV~1 GeV），高能加速器（1~100 GeV），超高能加速器（ 100 GeV以上 ）</p>\n<p>按束流强度：强流加速器（1 mA以上）、中流加速器（10 μm~1 mA），弱流加速器（10 μm以下）等</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>9.2  放射性核素的制备</p>\n<p>加速器基本构成</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 25 页</div>\n<p>加速器生产放射性核素特点</p>\n<p>可生产反应堆不能生产的缺中子放射性核素，其衰变多为EC或发射正电子，用于医疗诊断；</p>\n<p>由于(n,γ)反应截面低，反应堆无法生产碳、氮、氧等轻元素，即使能生产，其半衰期不是太长（<sup>14</sup>C：5730a），就是太短（<sup>19</sup>O：26.9s），不适合于医用。而加速器能方便产生<sup>11</sup>C、<sup>13</sup>N等核素。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 26 页</div>\n<p>与反应堆相比,加速器的投资少，运行和管理方便，但生量低，成本高，制靶过程复杂，一般在下列情况用于弥补反应堆的不足：</p>\n<p>当用反应堆不能产生出比活度高的放射性核；</p>\n<p>当反应堆不能产生出符合使用要求的某种放射性核素；</p>\n<p>当远离反应堆的地方需要短半衰期放射性核素；</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 27 页</div>\n<p>用回旋加速器产生的<sup>26</sup>MeV、流强为50μA的质子流轰靶，<sup>68</sup>Zn(p,2n) <sup>67</sup>Ga;</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 28 页</div>\n<p>反应堆乏燃料是提取放射性核素的重要原料。这些放射性核素都集中在后处理厂的高放废液和废气中。</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 29 页</div>\n<p><sup>1</sup>GWe PWR核反应堆年卸料33吨</p>\n<p>9.2  放射性核素的制备</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 32 页</div>\n<p>⑵用放射性同位素中子源照射来获得微量的放射性核素；</p>\n<p>⑶用热核中子闪曝合成超铀元素。</p>\n<p>9.2  放射性核素的制备</p>\n<p>制备放射性核素的其他方法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 38 页</div>\n<p>根据放射性核素与其稳定同位素除了同位素效应外在化学和生物学性质上完全相同的前提下，利用放射性标记化合物对同类化合物进行示踪。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 49 页</div>\n<p>在化学研究中，通过追踪同位素标记原子在化学过程中的运动、分配和转移情况来辨别物质运动、分配和转变的规律。</p>\n<p>放射性同位素在化学研究中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 51 页</div>\n<p>放射性同位素在工业中有着广泛的应用，它已应用于化工、冶金、石油等领域。</p>\n<p>化工：放射性同位素可用作辐射加工、示踪剂；</p>\n<p>石油；中子测井技术等；</p>\n<p>利用放射性同位素还可制成各种检测和控制仪表。</p>\n<p>放射性同位素在工业中的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 52 页</div>\n<p>中子测井技术：有中子-γ测井、中子-中子测井等。</p>\n<p>中子-γ测井：中子源产生中子，易被轻核慢化，如氢核(水、石油中氢量多)；</p>\n<p>快中子被慢化成热中子；</p>\n<p>热中子被岩石中的其它原子核俘获，(n,γ)反应,产生γ射线,含氢多， γ射线离中子源近，反之离中子源远；</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 53 页</div>\n<p>同位素稀释分析法是将待测元素与放射性同位素示踪剂充分混合，然后分离出一部分纯净待测样品，测其比活度，由比活度的变化来算出待测元素的含量。</p>\n<p>同位素稀释法</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 54 页</div>\n<p>也称直接稀释法。它是将一种比活度和质量已知的放射性核素或其标记化合物作为标准物加到含该放射性核素的稳定同位素或其化合物的待测物中，混合均匀后分离提出其中的一部分，然后测其比活度。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 55 页</div>\n<p>将一种质量为M<sub>0</sub>的稳定同位素加到含有其放射性同位素（比活度为s0 ）的待测样品之中，混合均匀后分离提纯一部分化合物，再测其比活度sd，并由此计算出待测样品中原有的放射性同位素的质量mx：</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 56 页</div>\n<p>例  用反稀释法稀释含<sup>137</sup>Cs的待测样品，已知<sup>137</sup>Cs的T<sub>1</sub>/2为30.17a，K值为1.32×1016，将质量为10mg铯稳定同位素加到待测样品中，混合均匀后分离提纯一部分混合物，测其比活度sd=1.19×109   Bq/mg，则待测样品中的<sup>137</sup>Cs的质量为多少mg？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 60 页</div>\n<p>对于放射分析来说，亚化学计量稀释法即用少于化学计算量的两份相等的分离试剂，分别从放射性标准物溶液和从经过同位素稀释后样品溶液中分离出质量相等的化合物，这样它们的比活度之比A<sub>0</sub>/Ad就等于其活度之比S<sub>0</sub>/Sd，则正稀法中的表达式就可改为：</p>\n<p>同位素稀释法的最大优点是不需定量分离被测物，这可避免在分离提纯过程中由于化合物的回收率低而造成的误差。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 61 页</div>\n<p>例题：用亚化学计量进行测定时，已知引入标准物的质量为30.0mg，从放射性标准溶液中和从经同位素稀释后的样品中分离提纯的化合物的放射性计数分别为1200和60cpm，求待测物的质量为多少？</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>测量中子与样品中待测核素发生核反应所产生的放射性核素来测定该核素含量的一种方法。</p>\n<p>常用的有热中子活化分析（以反应堆为中子源，利用(n,γ)反应对核素进行活化）</p>\n<p>快中子活化分析(以同位素中子源、中子发生器和加速器为活化源，利用(n,p)、(n,α)、(n,2n)等核反应进行活化)。</p>\n<p>中子活化分析</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>1012中子/(cm2·s)通量密度下辐照5 h，辐照结束5h后，测得<sup>38</sup>Cl的活度为2.33×<sup>104</sup>Bq，则LiCl中氯含量为多少g？已知其核反应式为：                            ，<sup>38</sup>Cl的半衰期T<sub>1</sub>/2为37.2min，<sup>37</sup>Cl的丰度H为24.23%，氯的平均分子量    为35.453，阿佛加德罗常数L=6.02×1023/ mol , ln2=0.693，反应截面为0.43b，1 b=10-24 cm2。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>解：已知φ=1012中子/（cm2·s），σ=0.43b，辐照时间t=5h，冷却时间t`=5h，阿佛加德罗常数L=6.02×1023/ mol，丰度H=24.23%，半衰期T<sub>1</sub>/2=37.2min，     =35.453。</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>例：某环境样品在中子注量率为1×1013 cm-2•s-1，辐照24h，测得<sup>238</sup>Np的活度为1.<sup>2</sup>Bq，该环境样品中<sup>237</sup>Np质量为多少g? <sup>238</sup>Np的半衰期为2.117d，H=1，L=6.02×1023/mol，<sup>237</sup>Np的反应截面为169b ，1b=10-24cm2</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>例：某环境样品在中子注量率为1×1013 cm-2•s-1，辐照24h，测得<sup>238</sup>Np的活度为1.<sup>2</sup>Bq，该环境样品中<sup>237</sup>Np质量为多少g?</p>\n</div>", "同位素稀释法": "<div class=\"th\"><div class=\"th-top\"><h2>同位素稀释法</h2><span class=\"tt\" style=\"background:#4361ee\">填空/计算</span></div><div class=\"src\">来源：第九章 放射性核素的制备</div></div>\n<div class=\"ts\"><div class=\"sn\">第 1 页</div>\n<p>放射性核素的制备及放射性分析技术</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 24 页</div>\n<p>注入分析运输系统</p>\n<p>分析系统</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 42 页</div>\n<p>放射免疫分析法(RIA)</p>\n</div>\n<div class=\"ts\">
