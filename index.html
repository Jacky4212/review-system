 class=\"ts\"><div class=\"sn\">第 64 页</div>\n<p>分析：常采用相对法来测定样品中微量核素的含量，即将标准样品和待测样品在相同条件下进行照射，化学处理和放射性测量，然后按下式进行计算：</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 65 页</div>\n<p>常用的有热中子活化分析（以反应堆为中子源，利用(n,γ)反应对核素进行活化）</p>\n<p>快中子活化分析(以同位素中子源、中子发生器和加速器为活化源，利用(n,p)、(n,α)、(n,2n)等核反应进行活化)。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>中子活化分析</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 66 页</div>\n<p>活化分析已成功地应用于生命科学。用于测量微量元素等。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>带电粒子活化分析</p>\n<p>活化分析的应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 67 页</div>\n<p>例  活化分析中，含微量氯的物质在</p>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 68 页</div>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 69 页</div>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 70 页</div>\n<p>9.6 放射分析技术及其应用</p>\n</div>\n<div class=\"ts\"><div class=\"sn\">第 71 页</div>\n<p>能量色散X射线荧光分析法是利用一定能量的粒子使样品中待测元素的原子激发，并发出特征X射线荧光，然后根据不同元素发出特征X射线的能量不同，且元素的含量与X射线强度在一定条件下成正比的原理，通过X射线谱仪测量其能谱和强度，可确定待测元素的种类和含量。</p>\n<p>9.6 放射分析技术及其应用</p>\n<p>X射线荧光分析法</p>\n</div>"}, "fH": "<div class=\"ss\"><h3>必背公式</h3>\n<div class=\"fg\"><div class=\"fg-title\">放射性衰变</div>\n<div class=\"fi\"><div class=\"fn\">衰变定律</div><div class=\"math\">`N = N_0 e^{-\\lambda t}`</div></div>\n<div class=\"fi\"><div class=\"fn\">衰变定律(另一形式)</div><div class=\"math\">`N = N_0 \\left(\\frac{1}{2}\\right)^{t/T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">时间计算</div><div class=\"math\">`t = \\frac{1}{\\lambda} \\ln \\frac{N_0}{N}`</div></div>\n<div class=\"fi\"><div class=\"fn\">衰变常数</div><div class=\"math\">`\\lambda = \\frac{\\ln 2}{T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">半衰期</div><div class=\"math\">`T_{1/2} = \\frac{\\ln 2}{\\lambda}`</div></div>\n<div class=\"fi\"><div class=\"fn\">活度定义</div><div class=\"math\">`A = \\lambda N = -\\frac{dN}{dt}`</div></div>\n<div class=\"fi\"><div class=\"fn\">初始活度</div><div class=\"math\">`A_0 = \\lambda N_0`</div></div>\n<div class=\"fi\"><div class=\"fn\">活度衰变</div><div class=\"math\">`A = A_0 e^{-\\lambda t}`</div></div>\n<div class=\"fi\"><div class=\"fn\">长期平衡</div><div class=\"math\">`\\lambda_1 N_1 = \\lambda_2 N_2`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">放射性单位</div>\n<div class=\"fi\"><div class=\"fn\">比活度</div><div class=\"math\">`S = \\frac{A}{m}`</div></div>\n<div class=\"fi\"><div class=\"fn\">比活度与核素参数</div><div class=\"math\">`S = \\frac{N_A \\ln 2}{M \\cdot T_{1/2}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">居里->贝克换算</div><div class=\"math\">`1\\;\\text{Ci} = 3.7 \\times 10^{10}\\;\\text{Bq}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">吸附</div>\n<div class=\"fi\"><div class=\"fn\">吸附率</div><div class=\"math\">`R = \\frac{C_0 - C}{C_0} \\times 100\\%`</div></div>\n<div class=\"fi\"><div class=\"fn\">吸附量</div><div class=\"math\">`q = \\frac{V(C_0 - C)}{m}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分配系数</div><div class=\"math\">`K_d = \\frac{\\text{固相浓度}}{\\text{液相浓度}}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">溶剂萃取</div>\n<div class=\"fi\"><div class=\"fn\">分配比</div><div class=\"math\">`D = \\frac{C_{\\text{有}}}{C_{\\text{水}}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分离系数</div><div class=\"math\">`\\alpha = \\frac{D_A}{D_B}`</div></div>\n<div class=\"fi\"><div class=\"fn\">萃取率(一次)</div><div class=\"math\">`E = \\frac{D}{D + V_{\\text{水}}/V_{\\text{有}}}}`</div></div>\n<div class=\"fi\"><div class=\"fn\">萃取率(多次)</div><div class=\"math\">`E_n = 1 - \\left(\\frac{1}{D+1}\\right)^n`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">电化学</div>\n<div class=\"fi\"><div class=\"fn\">能斯特方程</div><div class=\"math\">`E = E^0 + \\frac{RT}{nF} \\ln \\frac{a_{\\text{ox}}}{a_{\\text{red}}}`</div></div>\n</div>\n<div class=\"fg\"><div class=\"fg-title\">共沉淀</div>\n<div class=\"fi\"><div class=\"fn\">同晶定义</div><div class=\"math\">`\\text{类质同晶：晶体结构相同，化学组成类似}`</div></div>\n<div class=\"fi\"><div class=\"fn\">分配系数</div><div class=\"math\">`D = \\frac{[A]_{\\text{晶}}}{[A]_{\\text{液}}} / \\frac{[B]_{\\text{晶}}}{[B]_{\\text{液}}}`</div></div>\n</div>\n</div>", "tH": "<div class=\"ss\"><h3>名词解释（按考点分类）</h3>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">学科特点</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">核燃料循环</span><span class=\"ti-ref\">第16页</span><span class=\"ti-def\">核燃料循环是核燃料进入反应堆前的制备和在反应堆中反应及处理的过程，包括有矿冶、铀转化、铀浓缩、燃料元件制造、燃料元件的堆内燃烧释放能量、乏燃料的贮存和后处理。开式核燃料循环闭式核燃料循环</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性(radioactivity)</span><span class=\"ti-ref\">第29页</span><span class=\"ti-def\">她在发现了钋和镭元素后才将这一现象称为放射性(radioactivity)。放射化学的产生</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">衰变公式与半衰期</span><span class=\"tg-badge\" style=\"background:#e63946\">计算</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性浓度c</span><span class=\"ti-ref\">第17页</span><span class=\"ti-def\">放射性浓度c是指单位体积某放射性活度。cA=A/V单位：Bq/mL 或Bq/L。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">β射线</span><span class=\"ti-ref\">第55页</span><span class=\"ti-def\">β射线是快速电子流，其质量小，速度快。在电离能量损失率小，穿透力强，在核库伦场中能产生韧致辐射，易被核和电子散射而形成多次散射，它在物质中的路程十分弯曲，呈锯齿形。韧致辐射：高能量电子在原子核电厂内慢化时放出一种连续的X射线。      强度正比于吸收物原子序数及电子能量。外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">同位素效应与交换</span><span class=\"tg-badge\" style=\"background:#06d6a0\">选择/填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性气溶胶</span><span class=\"ti-ref\">第59页</span><span class=\"ti-def\">放射性气溶胶是放射性核素以极小微粒（1～100 nm）形式分散在空气中而形成的，它是放射性核素在气相中一种非常重要的存在形式。放射性气溶胶</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">共沉淀与同晶</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空/选择</span></div>\n<div class=\"ti\"><span class=\"ti-term\">共沉淀法</span><span class=\"ti-ref\">第26页</span><span class=\"ti-def\">共沉淀法是利用微量物质随常量物质一起生成沉淀现象来进行分离、浓集和纯化微量物质的一种方法。早期研究共沉淀规律的有哈恩、赫洛宾等，其中亨德森和克雷克西提出了一个公式。影响共沉淀的因素有：温度、液相组成、固相组成及溶剂等。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">萃取平衡</span><span class=\"ti-ref\">第46页</span><span class=\"ti-def\">萃取平衡是一种动态平衡，当条件发生变化时，原理的平衡被破坏，又会建立新的平衡。建立萃取平衡是需要较长时间的，因此，在实际应用上，只能设法接近于平衡，以便提高生产效率。萃取平衡</span></div>\n<div class=\"ti\"><span class=\"ti-term\">中性磷类萃取剂，这类萃取剂</span><span class=\"ti-ref\">第62页</span><span class=\"ti-def\">中性磷类萃取剂，这类萃取剂是指磷酸分子[(HO)<sup>3</sup>PO]中的三个羟基全被烷基酯化或取代所生成的化合物。这类萃取剂的萃取能力取决于P=O键的极性；</span></div>\n<div class=\"ti\"><span class=\"ti-term\">这类萃取剂</span><span class=\"ti-ref\">第64页</span><span class=\"ti-def\">这类萃取剂是指磷酸分子（HO)<sup>3</sup>PO中的一个或二个羟基被烷基酯化或取代所生成的化合物；</span></div>\n<div class=\"ti\"><span class=\"ti-term\">冠醚</span><span class=\"ti-ref\">第68页</span><span class=\"ti-def\">冠醚是由三个以上[-CH<sub>2</sub>-O-CH<sub>2</sub>-]单元组成的单环聚醚；穴醚是在醚环上有两个氧原子被氮原子取代并联结起来的二环聚醚。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">洗涤液条件的选择原则</span><span class=\"ti-ref\">第79页</span><span class=\"ti-def\">洗涤液条件的选择原则是杂质的分配系数要小，欲萃取物的分配系数要大。洗涤次数的选择必须兼顾净化效果和回收率。(V) 反萃取剂的选择、萃取设备的选择</span></div>\n<div class=\"ti\"><span class=\"ti-term\">离子交换剂</span><span class=\"ti-ref\">第104页</span><span class=\"ti-def\">具有这种交换能力的固体称为离子交换剂。这种交换反应为离子交换反应。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">交联度：</span><span class=\"ti-ref\">第111页</span><span class=\"ti-def\">交联度：是指树脂中所含交联剂的质量百分数。交联剂：能将有机分子单体连接起来的，形成离子交换树脂聚合物的物质。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">理论交换容量</span><span class=\"ti-ref\">第112页</span><span class=\"ti-def\">理论交换容量是指单位量（质量或体积）的Cl－ 型或H+型离子交换树脂中能进行离子交换反应的交换基团的总数（mmol），它实际是树脂交换容量的理论值或最大值。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">体积理论交换容量</span><span class=\"ti-ref\">第113页</span><span class=\"ti-def\">树脂的单位量用1 mL表示，则称为：体积理论交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">质量理论交换容量</span><span class=\"ti-ref\">第113页</span><span class=\"ti-def\">树脂的单位量用1 g表示，则称为：质量理论交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">工作交换容量</span><span class=\"ti-ref\">第114页</span><span class=\"ti-def\">工作交换容量是指在一定的工作条件下，离子交换树脂对离子的交换吸附能力。工作交换容量分类：穿透交换容量、饱和交换容量和再生交换容量。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">分配色谱法</span><span class=\"ti-ref\">第133页</span><span class=\"ti-def\">萃取柱色谱法以称为分配色谱法，它可分为正相萃取色谱法和反相萃取色谱法两种。正相萃取柱色谱法中水溶液被吸附在吸附剂上作为固定相，有机萃取剂为流动相。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">电化学置换法</span><span class=\"ti-ref\">第140页</span><span class=\"ti-def\">电化学置换法是利用欲分离核素的离子在电极上自发发生氧化还原反应而实现分离的一种电化学分离法。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">天然放射性系</span><span class=\"tg-badge\" style=\"background:#06d6a0\">选择/填空</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性元素</span><span class=\"ti-ref\">第4页</span><span class=\"ti-def\">全部由放射性核素核素所组成的元素称为放射性元素。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">UF<sub>6</sub></span><span class=\"ti-ref\">第55页</span><span class=\"ti-def\">UF<sub>6</sub>是一种白晶体，易升华，常压下其升华点为56.5℃，此特性被用于气体扩散法富集天然铀中的<sup>235</sup>U，UF<sub>6</sub>是极毒气体，有强烈腐蚀性，对金属腐蚀性强，对诸如聚四氟乙烯等有机没有腐蚀。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">最重要的</span><span class=\"ti-ref\">第109页</span><span class=\"ti-def\">最重要的是<sup>226</sup>Ra，它是自然界中丰度最高的一种同位素， <sup>226</sup>Ra的比活度很高；习惯上说的镭是<sup>226</sup>Ra。氡的核素</span></div>\n<div class=\"ti\"><span class=\"ti-term\">卤化物：PaCl<sub>4</sub></span><span class=\"ti-ref\">第161页</span><span class=\"ti-def\">卤化物：PaCl<sub>4</sub>是挥发性化合物，PaF<sub>4</sub>•nH<sub>2</sub>O易溶于水。在溶液中，Pa可以十4和+5两种价态存在。Pa<sub>4</sub>+在稀盐酸和高氯酸介质中以Pa<sub>4</sub>+的水合离子存在，在其他酸中则形成络离子。Pa<sub>4</sub>+与TTA、乙酰丙酮可形成溶于有机溶剂的鳌合物。Pa<sub>4</sub>+可形成一系列难溶化合物，PaF<sub>4</sub>•H<sub>2</sub>O、磷</span></div>\n<div class=\"ti\"><span class=\"ti-term\">大多数砹的核素</span><span class=\"ti-ref\">第174页</span><span class=\"ti-def\">大多数砹的核素是用不同能量的α粒子轰击铋靶或针靶得到的。<sup>209</sup>Bi(α，2n)<sup>211</sup>At核反应，其半衰期为9.2 h，具有α衰变性质（40%）和K电子俘获性质（60%）。这是砹的同位素中半衰期最长的核素之一，另一个半衰期最长的核素是<sup>210</sup>At，半衰期是8.3h。砹有-1、0、+1、+5和+7价。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">锕系元素与核反应</span><span class=\"tg-badge\" style=\"background:#f77f00\">问答/计算</span></div>\n<div class=\"ti\"><span class=\"ti-term\">NpO<sub>2</sub></span><span class=\"ti-ref\">第60页</span><span class=\"ti-def\">NpO<sub>2</sub>是最稳定的氧化物，是镎工厂的半成品，由煅烧所制得的NpO<sub>2</sub>在大多数酸中很难溶解，只在氧化剂（如溴酸钾）存在下才被溶解。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">钚同铀和镎一样，</span><span class=\"ti-ref\">第80页</span><span class=\"ti-def\">钚同铀和镎一样，是活泼金属。在空气中易被氧化，其氧化速度与空气的相对湿度有关，相对湿度越大，氧化速度越快。粉末状的钚在空气中能自燃，而生成PuO<sub>2</sub>。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">PuO<sub>2</sub></span><span class=\"ti-ref\">第83页</span><span class=\"ti-def\">PuO<sub>2</sub>是十分难溶的物质，在下列溶剂可以溶解它200℃的85~100%H<sub>3</sub>PO<sub>4</sub>、10mol/LHNO<sub>3</sub>-0.05mol/LHF溶液、 5mol/LHF溶液；也常用熔融技术来溶解PuO<sub>2</sub>，熔剂有NaHSO<sub>4</sub>、KHSO<sub>4</sub>、NH<sub>4</sub>HF<sub>2</sub>。</span></div>\n</div>\n<div class=\"tg\"><div class=\"tg-h\"><span class=\"tg-title\">核素制备方法</span><span class=\"tg-badge\" style=\"background:#4361ee\">填空/问答</span></div>\n<div class=\"ti\"><span class=\"ti-term\">反应堆</span><span class=\"ti-ref\">第14页</span><span class=\"ti-def\">反应堆是一种强大的中子源，其中子通量一般为1010~1013cm-2·s-1，可通过反应堆的(n,α)、(n,p)、(n,f)及(n,γ)反应和次级核反应来生产放射性核素。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">反应堆乏燃料</span><span class=\"ti-ref\">第28页</span><span class=\"ti-def\">反应堆乏燃料是提取放射性核素的重要原料。这些放射性核素都集中在后处理厂的高放废液和废气中。裂片元素；超铀元素。一个<sup>1000</sup>MW的核电站产生：</span></div>\n<div class=\"ti\"><span class=\"ti-term\">放射性药物</span><span class=\"ti-ref\">第40页</span><span class=\"ti-def\">放射性药物是指在医学上使用的含有放射性核素的化合物或生物物质的统称。根据其临床应用的目的不同可分为两类：⑴治疗用放射性药物；⑵诊断用放射性药物。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">自放射显影技术</span><span class=\"ti-ref\">第48页</span><span class=\"ti-def\">自放射显影技术是从本上个世纪20年代初开始发展起来的一种测定放射性示踪核素的方法，它利用放射性物质产生的射线使核乳胶感光，根据其感光的部位及强度来记录、检查和测量样品中放射性物质。我国科学家钱三强、何泽慧等人就是利用核乳胶技术发现了重原子核的三分裂与四分裂现象。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">同位素稀释分析法</span><span class=\"ti-ref\">第53页</span><span class=\"ti-def\">同位素稀释分析法是将待测元素与放射性同位素示踪剂充分混合，然后分离出一部分纯净待测样品，测其比活度，由比活度的变化来算出待测元素的含量。这种方法常用来测定不易分离的组份的含量。有正稀释法、反稀释法及亚化学计量稀释法。</span></div>\n<div class=\"ti\"><span class=\"ti-term\">也称直接稀释法。它</span><span class=\"ti-ref\">第54页</span><span class=\"ti-def\">也称直接稀释法。它是将一种比活度和质量已知的放射性核素或其标记化合物作为标准物加到含该放射性核素的稳定同位素或其化合物的待测物中，混合均匀后分离提出其中的一部分，然后测其比活度。mx=m<sub>0</sub>(s0/sd-1)M<sub>0</sub>、mx分别为引入的标准物和待测物的质量；</span></div>\n<div class=\"ti\"><span class=\"ti-term\">同位素稀释法的最大优点</span><span class=\"ti-ref\">第60页</span><span class=\"ti-def\">同位素稀释法的最大优点是不需定量分离被测物，这可避免在分离提纯过程中由于化合物的回收率低而造成的误差。</span></div>\n</div>\n</div>"}};
const TC = {"学科特点": "填空", "衰变公式与半衰期": "计算", "放射性的单位与比活度": "计算", "衰变类型(α/β/γ)": "选择", "放射性平衡": "选择/填空", "同位素效应与交换": "选择/填空", "放射性胶体": "填空/选择", "吸附作用": "填空/计算", "共沉淀与同晶": "填空/选择", "电化学(能斯特方程)": "计算/选择", "载体与反载体": "问答", "溶剂萃取": "问答/填空", "离子交换分离": "问答/填空", "天然放射性系": "选择/填空", "锕系元素与核反应": "问答/计算", "镭氡计算": "计算", "核素制备方法": "填空/问答", "同位素稀释法": "填空/计算"};
let C = null;

function back(){document.getElementById('sel').classList.add('act');document.getElementById('rev').classList.remove('act');document.title='复习系统';}

function enter(id){
  C=D[id];
  document.getElementById('sel').classList.remove('act');
  document.getElementById('rev').classList.add('act');
  document.getElementById('st').textContent=C.name;
  document.getElementById('se').textContent=C.nameEn;
  document.getElementById('sb').textContent=C.examDateLabel;
  ud(); rs(); rm();
  setTimeout(function(){document.querySelectorAll('.math').forEach(function(el){try{katex.render(el.textContent.slice(1,-1),el,{displayMode:false})}catch(e){}})},100);
  nav('overview');
}

function rs(){
  var s=document.getElementById('sidebar');
  var h='<div class="st">概览</div><a class="it act" data-t="overview" onclick="nav(\'overview\')">考试概览</a>';
  h+='<div class="st">考点复习</div>';
  C.examTopics.forEach(function(t,i){
    var tp=TC[t.topic]||'';
    var col={'填空':'#4361ee','选择':'#06d6a0','计算':'#e63946','问答':'#f77f00','填空/选择':'#4361ee','选择/填空':'#06d6a0','填空/计算':'#4361ee','计算/选择':'#e63946','问答/填空':'#f77f00','问答/计算':'#f77f00','填空/问答':'#4361ee'}[tp]||'#888';
    h+='<a class="it tp" data-t="topic-'+i+'" onclick="nav(\'topic-'+i+'\')">'+t.topic+(tp?'<span class="tag" style="background:'+col+'">'+tp+'</span>':'')+'</a>';
  });
  h+='<div class="st">专题</div><a class="it" data-t="formulas" onclick="nav(\'formulas\')">公式</a><a class="it" data-t="terms" onclick="nav(\'terms\')">名词解释</a>';
  s.innerHTML=h;
}

function rm(){
  var m=document.getElementById('main');
  var h='<div id="s-overview" class="bl act">'+C.ovHTML+'</div>';
  C.examTopics.forEach(function(t,i){h+='<div id="s-topic-'+i+'" class="bl">'+(C.tpH[t.topic]||'')+'</div>';});
  h+='<div id="s-formulas" class="bl">'+C.fH+'</div>';
  h+='<div id="s-terms" class="bl">'+C.tH+'</div>';
  m.innerHTML=h;
}

function nav(t){
  document.querySelectorAll('.sb .it').forEach(function(e){e.classList.remove('act');});
  var si=document.querySelector('.sb .it[data-t="'+t+'"]');if(si)si.classList.add('act');
  document.querySelectorAll('.ma .bl').forEach(function(e){e.classList.remove('act');});
  var sec=document.getElementById('s-'+t);if(sec){sec.classList.add('act');sec.scrollIntoView({behavior:'smooth',block:'start'});}
}

function ts(){document.getElementById('sidebar').classList.toggle('ms');document.getElementById('so').classList.toggle('s');}

function td(){document.body.classList.toggle('dark-mode');var b=document.getElementById('dtBtn');b.textContent=document.body.classList.contains('dark-mode')?'☀️':'🌙';localStorage.setItem('rd',document.body.classList.contains('dark-mode')?'1':'0');}
if(localStorage.getItem('rd')==='1'){document.body.classList.add('dark-mode');document.getElementById('dtBtn').textContent='☀️';}

function ud(){var e=document.getElementById('sc');if(!e||!C)return;var d=new Date(C.examDate).getTime()-Date.now();if(d<=0){e.textContent='考试已开始';return;}e.textContent=Math.floor(d/86400000)+'天'+Math.floor((d%86400000)/3600000)+'小时';}
setInterval(ud,60000);
window.addEventListener('scroll',function(){var b=document.getElementById('progressBar');if(!b)return;var s=window.scrollY,d=document.documentElement.scrollHeight-window.innerHeight;if(d>0)b.style.width=(s/d*100)+'%';});
(function(){var c=document.getElementById('cards');var h='';for(var[id,sub]of Object.entries(D)){h+='<div class="scd" onclick="enter(\''+id+'\')"><h3>'+sub.name+'</h3><div style="font-size:.78em;color:var(--text2)">'+sub.nameEn+'</div><div style="margin-top:4px;font-size:.75em;color:var(--text2)">'+sub.examTopics.length+' 考点</div></div>';}c.innerHTML=h;var k=Object.keys(D);if(k.length===1)enter(k[0]);})();
</script>
</body>
</html>
