<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习系统 | Review</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #555;
    --primary: #4361ee;
    --primary-light: #eef0ff;
    --accent: #f72585;
    --border: #dee2e6;
    --success: #06d6a0;
    --warning: #ffd166;
    --sidebar-width: 280px;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --font-mono: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 15px;
  }

  /* ─── 科目选择页（首页） ─── */
  .subject-selector {
    display: none;
    max-width: 800px;
    margin: 60px auto;
    padding: 0 24px;
  }
  .subject-selector.active { display: block; }
  .subject-selector h1 {
    font-size: 2.2em;
    text-align: center;
    margin-bottom: 8px;
    color: var(--primary);
  }
  .subject-selector .subtitle {
    text-align: center;
    color: var(--text-secondary);
    margin-bottom: 40px;
    font-size: 1em;
  }
  .subject-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .subject-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: var(--shadow);
  }
  .subject-card:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(67, 97, 238, 0.15);
  }
  .subject-card h3 { font-size: 1.2em; margin-bottom: 4px; }
  .subject-card .en { font-size: 0.85em; color: var(--text-secondary); }
  .subject-card .meta { margin-top: 12px; font-size: 0.85em; color: var(--text-secondary); }
  .subject-card .badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.8em;
    margin-top: 8px;
  }
  .add-subject-card {
    border: 2px dashed var(--border);
    background: transparent;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 1em;
    min-height: 140px;
    cursor: default;
  }
  .add-subject-card:hover { transform: none; border-color: var(--border); }

  /* ─── 复习页面 ─── */
  .review-page { display: none; }
  .review-page.active { display: block; }

  /* 顶部导航 */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .top-bar .back-btn {
    background: none;
    border: none;
    font-size: 1.3em;
    cursor: pointer;
    color: var(--primary);
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .top-bar .back-btn:hover { background: var(--primary-light); }
  .top-bar .title-area { font-size: 1em; font-weight: 600; }
  .top-bar .title-area .en { font-weight: 400; color: var(--text-secondary); font-size: 0.85em; }
  .top-bar .exam-badge {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 500;
  }

  /* 主体布局 */
  .layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 56px);
  }

  /* 侧边栏 */
  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-section { margin-bottom: 8px; }
  .sidebar-section-title {
    padding: 8px 20px 4px;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .sidebar-item {
    display: block;
    padding: 7px 20px 7px 24px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.92em;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    cursor: pointer;
    position: relative;
  }
  .sidebar-item:hover { background: var(--primary-light); color: var(--primary); }
  .sidebar-item.active {
    background: var(--primary-light);
    color: var(--primary);
    border-left-color: var(--primary);
    font-weight: 600;
  }
  .sidebar-item .exam-tag {
    display: inline-block;
    font-size: 0.65em;
    background: var(--accent);
    color: #fff;
    padding: 0 6px;
    border-radius: 8px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .sidebar-item .ch-num {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 50%;
    background: var(--bg);
    font-size: 0.75em;
    font-weight: 600;
    margin-right: 6px;
    color: var(--text-secondary);
  }
  .sidebar-item.active .ch-num { background: var(--primary); color: #fff; }

  /* 主内容区 */
  .main-content {
    flex: 1;
    padding: 32px 40px 60px;
    min-width: 0;
  }

  /* 考试概览 */
  .exam-overview {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 32px 36px;
    margin-bottom: 32px;
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
  }
  .exam-overview h2 { font-size: 1.5em; margin-bottom: 6px; }
  .exam-overview .exam-date { opacity: 0.85; font-size: 0.9em; margin-bottom: 20px; }
  .exam-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .exam-type {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .exam-type .name { font-size: 0.85em; opacity: 0.9; }
  .exam-type .score { font-size: 1.6em; font-weight: 700; }
  .exam-type .detail { font-size: 0.75em; opacity: 0.75; }

  .exam-tips {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }
  .exam-tips h3 { color: var(--primary); margin-bottom: 8px; font-size: 1em; }
  .exam-tips ul { padding-left: 20px; }
  .exam-tips li { margin-bottom: 4px; color: var(--text-secondary); font-size: 0.92em; }

  /* 章节内容块 */
  .chapter-block {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .chapter-block.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .chapter-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--primary);
  }
  .chapter-header h2 { font-size: 1.5em; color: var(--primary); }
  .chapter-header .exam-topics {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chapter-header .exam-topic-tag {
    background: var(--accent);
    color: #fff;
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 0.78em;
  }
  .chapter-header .no-exam {
    font-size: 0.85em;
    color: var(--text-secondary);
  }

  /* 幻灯片内容卡片 */
  .slide-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
  }
  .slide-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

  .slide-header {
    padding: 10px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 0.82em;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slide-header:hover { background: var(--primary-light); }
  .slide-header .toggle-icon { transition: transform 0.2s; font-size: 0.8em; }
  .slide-header.collapsed .toggle-icon { transform: rotate(-90deg); }

  .slide-body {
    padding: 14px 18px;
    line-height: 1.9;
    font-size: 0.95em;
  }
  .slide-body.collapsed { display: none; }

  .slide-body p { margin-bottom: 6px; }
  .slide-body .formula-line {
    font-family: var(--font-mono);
    background: var(--primary-light);
    padding: 6px 12px;
    border-radius: 6px;
    margin: 6px 0;
    font-size: 0.95em;
    border-left: 3px solid var(--primary);
  }
  .slide-body .highlight {
    background: #fff3cd;
    padding: 0 3px;
    border-radius: 3px;
  }
  .slide-body .key-term {
    color: var(--accent);
    font-weight: 600;
  }

  .slide-body .img-placeholder {
    display: inline-block;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.82em;
    color: var(--text-secondary);
    margin: 4px 0;
  }

  /* 专题区块（公式、名词） */
  .special-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .special-section h3 {
    font-size: 1.15em;
    color: var(--primary);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .special-section .item {
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .special-section .item:last-child { border-bottom: none; }

  /* 无内容提示 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 3em; margin-bottom: 12px; }
  .empty-state p { font-size: 1em; }

  /* 公式专题 */
  .formula-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .formula-item {
    background: var(--primary-light);
    border-left: 3px solid var(--primary);
    padding: 10px 14px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.9em;
    line-height: 1.6;
  }

  /* 名词专题 */
  .term-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .term-item:last-child { border-bottom: none; }
  .term-item .term-name {
    font-weight: 600;
    color: var(--accent);
  }

  /* 响应式 */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main-content { padding: 20px; }
    .exam-grid { grid-template-columns: repeat(2, 1fr); }
    .formula-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 500px) {
    .exam-grid { grid-template-columns: 1fr; }
    .exam-overview { padding: 20px; }
  }

  /* 考点-章节映射表 */
  .exam-mapping { margin-bottom: 24px; }
  .mapping-table { display: flex; flex-direction: column; gap: 4px; }
  .mapping-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-radius: 8px;
    text-decoration: none; color: var(--text);
    transition: background 0.15s; cursor: pointer;
  }
  .mapping-row:hover { background: var(--primary-light); }
  .mapping-ch {
    background: var(--primary); color: #fff;
    padding: 2px 10px; border-radius: 12px;
    font-size: 0.8em; font-weight: 600; white-space: nowrap;
  }
  .mapping-topic { flex: 1; font-size: 0.95em; }
  .mapping-arrow {
    font-size: 0.8em; color: var(--primary);
    opacity: 0; transition: opacity 0.2s;
  }
  .mapping-row:hover .mapping-arrow { opacity: 1; }

  /* 打印样式 */
  @media print {
    .top-bar, .sidebar, .mobile-menu-btn, .sidebar-overlay { display: none !important; }
    .layout { display: block; max-width: 100%; }
    .main-content { padding: 0; }
    .chapter-block { display: block !important; page-break-after: always; }
    .chapter-block.active { display: block !important; }
    .slide-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .slide-body { display: block !important; }
    .slide-header { background: #f5f5f5; }
    .slide-header .toggle-icon { display: none; }
    .exam-overview { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .mapping-row:hover .mapping-arrow { opacity: 1; }
  }

  /* 移动端侧栏切换 */
  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 1.2em;
    cursor: pointer;
    color: var(--primary);
    padding: 4px 8px;
  }
  @media (max-width: 900px) {
    .mobile-menu-btn { display: block; }
  }
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 200;
  }
  .sidebar-overlay.show { display: block; }
  .sidebar.mobile-show {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 300;
    height: 100vh;
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<!-- ═══ 科目选择页 ═══ -->
<div id="subjectSelector" class="subject-selector active">
  <h1>📚 复习系统</h1>
  <p class="subtitle">选择科目开始复习</p>
  <div class="subject-cards">
    <!-- 由 JS 动态生成 -->
  </div>
</div>

<!-- ═══ 复习页面 ═══ -->
<div id="reviewPage" class="review-page">

  <!-- 顶栏 -->
  <div class="top-bar">
    <button class="back-btn" onclick="showSubjectSelector()" title="返回科目选择">←</button>
    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
    <div class="title-area">

    <span class="exam-badge" id="examBadge">
	    📅 6月18日考试</span><input type="text" id="searchBox" placeholder="搜索关键词..." oninput="searchContent(this.value)" style="display:none;padding:4px 12px;border:1px solid var(--border);border-radius:16px;font-size:0.85em;font-family:var(--font);outline:none;width:160px;background:var(--bg);"></span>
  </div>

  <!-- 遮罩 -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

  <div class="layout">
    <!-- 侧边栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">概览</div>

      <div class="sidebar-section" id="chapterNav">

      </div>
      <div class="sidebar-section" id="specialNav">

        <a class="sidebar-item" data-target="terms" onclick="navigateTo('terms')">📖 名词解释</a>
      </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent">
      <!-- 由 JS 动态渲染 -->
    </main>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  科目数据（由 Python 生成）
// ═══════════════════════════════════════════════════════

const SUBJECTS = {
  "radiochemistry": {

        "id": "ch1",

        ],
        "html": "<div class=\"chapter-header\">\n<h2>第一章 绪论</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 学科特点</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n<p>王 季</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>个人简介</p>\n<p>姓名：王季</p>\n<p>乏燃料后处理</p>\n<p>E-mail：wangji9073@163.com</p>\n<p>忘记所有的不开心</p>\n<p>得到人生中最美的旺季</p>\n<p>Tel：18845594060</p>\n<p>镧锕分离</p>\n<p>电化学</p>\n<p>先进核化工研究中心</p>\n<p>材料科学与化学工程</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>基本要求</p>\n<p>三个“不”：不交头接耳，不随意走动，不接打电话；</p>\n<p>三个“一”：一个本；一个笔；一个计算器；</p>\n<p>尊重、理解、共勉</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>评分标准</p>\n<p>平时成绩（100 分）</p>\n<p>课堂表现（20）</p>\n<p>平时作业（20）</p>\n<p>实验成绩（35）</p>\n<p>期中考试（35）</p>\n<p>期末考试成绩（100 分）</p>\n<p>平时成绩50%，考试成绩50%</p>\n<p>学习通</p>\n<p>雨课堂</p>\n<p>课程资料</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>作为这门科学的新手，我必定会急切地关心这样的问题：</p>\n<p>我现在所现身的这门科学将要达到而且能够达到什么样的目的？</p>\n<p>它的一般结果究竟在多大程度上是“真的”？</p>\n<p>哪些是本质性的东西？</p>\n<p>哪些则只是发展中的偶然的东西？</p>\n<p>放射化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n<p>何为放射化学？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Radiochemistry is the branch of chemistry</p>\n<p>dealing with radioactive phenomena.</p>\n<p>(From Webster’s New World Dictionary, Third College Edition, p1108)</p>\n<p>1910年由卡麦隆（Cameron）提出，</p>\n<p>是近代化学的一个分支学科，</p>\n<p>是研究有关放射性现象的一门科学。</p>\n<p>放射化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n<p>放射化学指研究放射性物质及其辐射效应的一门化学分支学科（二级学科）</p>\n<p>有关原子核反应、放射性核素和放射性物质的化学及其应用研究的一门科学。</p>\n<p>放射性核素和核转变产物的行为和化学性质</p>\n<p>它们的制备、分离、纯化及鉴定的方法</p>\n<p>放射性核素在化学和其他某些方面的应用</p>\n<p>?</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n<p>化学</p>\n<p>+  放射性</p>\n<p>放射化学</p>\n<p>放射性元素化学（锕系元素）</p>\n<p>放射分析化学</p>\n<p>放射性药物化学</p>\n<p>计算放射化学，干法电化学</p>\n<p>放射化工</p>\n<p>环境放射化学</p>\n<p>辐射化学</p>\n<p>无机化学</p>\n<p>分析化学</p>\n<p>有机化学</p>\n<p>物理化学</p>\n<p>化工</p>\n<p>环境化学</p>\n<p>高分子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>基本内容</p>\n<p>绪论</p>\n<p>放射性</p>\n<p>放射性核素的物理化学</p>\n<p>微量放射性物质的分离</p>\n<p>核化学</p>\n<p>天然放射性元素化学</p>\n<p>锕系元素</p>\n<p>裂片元素及活化产物化学</p>\n<p>放射性核素的制备及放射分析技术</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>参考书籍</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n<p>核工专业为什么要学习放射化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>能源危机</p>\n<p>环境问题</p>\n<p>新型清洁能源</p>\n<p>核能：安全、清洁、高效能源</p>\n<p>核  能</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核能的利用</p>\n<p>核动力</p>\n<p>核武器</p>\n<p>辐射能源</p>\n<p>发电</p>\n<p>推进动力</p>\n<p>工业用热</p>\n<div class=\"formula-line\">1.燃料的能量密度高。1kg235U=2500t无烟煤</div>\n<p>2.发电成本低；3.环境污染轻；4.建站优越性</p>\n<p>核动力航空母舰、核动力破冰船</p>\n<p>已完成低温供热</p>\n<p>原子弹</p>\n<p>氢弹</p>\n<p>235U、239Pu或233U的裂变反应</p>\n<p>D、T聚变反应</p>\n<p>放射性核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀水冶；</p>\n<p>铀纯化；</p>\n<p>铀转化；</p>\n<p>铀浓缩；</p>\n<p>燃料元件制造；</p>\n<p>乏燃料后处理;</p>\n<p>三废处理。</p>\n<p>核工业</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核燃料循环</p>\n<p>核燃料循环是核燃料进入反应堆前的制备和在反应堆中反应及处理的过程，包括有矿冶、铀转化、铀浓缩、燃料元件制造、燃料元件的堆内燃烧释放能量、乏燃料的贮存和后处理。</p>\n<p>开式核燃料循环</p>\n<p>闭式核燃料循环</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀浸出；</p>\n<p>从高浓度浸出液中提取铀—溶剂萃取法；</p>\n<p>从较低浓度浸出液中提取铀—离子交换法；</p>\n<p>尾液处理--离子交换法、共沉淀法等。</p>\n<p>核工业</p>\n<p>铀水冶中的放射化学知识</p>\n<p>铀纯化与转化中的放射化学知识</p>\n<p>①铀纯化—溶剂萃取法；</p>\n<p>②铀转化过程中的化学知识；</p>\n<p>③废液处理—共沉淀、离子交换等。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核工业</p>\n<p>铀矿浓缩物</p>\n<p>溶解</p>\n<p>萃取</p>\n<p>硝酸</p>\n<p>TBP-煤油</p>\n<p>碳酸铵</p>\n<p>结晶反萃取</p>\n<p>三碳酸铀酰铵</p>\n<p>分解还原</p>\n<p>UO2</p>\n<p>氢氟化</p>\n<p>无水HF</p>\n<p>氟化</p>\n<p>UF4</p>\n<p>UF6</p>\n<p>F2</p>\n<p>冷凝液化</p>\n<p>产品UF6</p>\n<p>铀纯化转化</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>从UF6到UO2的化学过程；</p>\n<p>放射化学在铀浓缩中三废处理应用。</p>\n<p>核工业</p>\n<p>铀浓缩中的放射化学知识</p>\n<p>燃料制备与转化中的放射化学知识</p>\n<p>UO2回收中的放射化学；</p>\n<p>碱渣铀回收过程中的放射化学。</p>\n<p>乏燃料后处理中的放射化学知识</p>\n<p>现在的主要工艺-PUREX工艺，溶剂萃取；</p>\n<p>三废处理中用到的技术-共沉淀、离子交换等。</p>\n<p>U-235</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>核+化工</p>\n<p>目前主要核化工是以裂变堆为基础的核动力工业，如铀、钍、锆及重水等生产；</p>\n<p>用到的主要工艺：（共）沉淀、溶剂萃取、色谱、电化学、同位素交换等；</p>\n<p>核化工&amp;放射化学</p>\n<p>核化工</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>第一章   绪论</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>确定放射化学的基本概念和研究内容；</p>\n<p>掌握放射化学的特点；</p>\n<p>了解放射化学的发展简史和在我国的概况。</p>\n<p>课程要求</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.1  放射化学发展简史</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学的产生</p>\n<p>1895年末德国物理学家伦琴用Crookes管研究高压放电现象时注意到, 当用阴极电子束流轰击玻璃管壁时, 产生了荧光以及X射线。</p>\n<p>W. Roentgen</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1895年末德国物理学家W. Roentgen发现X射线。</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1895年，法国科学家贝克勒将几十种矿物样本在阳光下曝晒后用黑纸包上，发现只有一种铀矿物硫酸铀酰钾 [K2UO2(SO4)22H2O]。</p>\n<p>放射化学的产生</p>\n<p>Becquerel</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1896年2月，他无意中将一块未经太阳曝晒的铀矿物放在照相底版上，也发现了底片感光现象。</p>\n<p>发现其它的铀化合物也能发出这种射线；提出了放射性这种现象。</p>\n<p>到1896年5月Becquerel又证明了纯金属铀的放射性大于铀化合物的放射性。</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1900年，P.villard 和H.Becqueral 发现γ射线具有电磁辐射性质，同年β被鉴定为电子。</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>M. Curie</p>\n<p>发现除了铀和铀的化合物外，钍和钍的化合物也有类似的放射现象。</p>\n<p>铀和钍发出射线与其化合物的组成无关，放射现象是一种特有的原子现象；</p>\n<p>她在发现了钋和镭元素后才将这一现象称为放射性(radioactivity)。</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1898年6月，Curie夫妇得到了很少量的放射性比铀强150倍的黑色粉末, 再经过一番提炼又得到了放射性比铀强400倍的新放射性元素钋。</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Curie夫妇在G. Bemont的协助下, 在铅的沉淀中又发现了放射性更强的另一种元素镭。1902年提炼出了120 mg 在光谱中见不到钡的纯氯化镭,</p>\n<p>放射化学的产生</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>诺贝尔奖</p>\n<p>Marie Curie, née Sklodowska</p>\n<p>1/4 of the prize</p>\n<p>b.1867(in Warsaw, Poland)d.1934</p>\n<p>Antoine Henri Becquerel</p>\n<p>1/2 of the prize</p>\n<p>b.1852 d.1908</p>\n<p>His discovery of spontaneous radioactivity</p>\n<p>Pierre Curie</p>\n<p>1/4 of the prize</p>\n<p>b.1859 d.1906</p>\n<p>Their joint researches on the radiation phenomena</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性规律的一系列研究和探索</p>\n<p>放射性衰变规律</p>\n<p>放射性衰变位移规律</p>\n<p>天然放射系的发现</p>\n<p>核转变过程化学的建立和发展</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性规律的一系列研究和探索</p>\n<p>放射性衰变的定律：</p>\n<p>上式也可以导出下式</p>\n<p>（t＝0时，N＝N0）</p>\n<p>半衰期：</p>\n<p>1.卢瑟福、索迪发现放射性核素的放射性衰变规律</p>\n<p>原子有核 click=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.核转变过程化学的建立和发展</p>\n<p>放射性规律的一系列研究和探索</p>\n<p>1934年，小居里夫妇用钋的α粒子轰击铝，即27Al（α，n）30P反应，并利用化学原理及方法活得放射性P-30，发明了人工放射性。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.核转变过程化学的建立和发展</p>\n<p>放射性规律的一系列研究和探索</p>\n<p>齐拉和却尔曼斯发现原子核在俘获中子生成放射性新核素后，新核的反冲效应将导致一系列化学变化，发展成热原子化学。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性规律的一系列研究和探索</p>\n<p>1938年，哈恩等</p>\n<p>发现原子核裂现象</p>\n<p>1940年，西博格等</p>\n<p>发现超铀元素</p>\n<p>镎和钚</p>\n<p>1942年，</p>\n<p>费米等建立第一座核反应堆</p>\n<p>放射性核素在工业、农业、医药、国防等领域的应用</p>\n<p>106 Sg</p>\n<p>标志人类进入利用核能的时代</p>\n<p>奠定了核能的基础</p>\n<p>开启了锕系元素研究</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性的发现；天然放射性元素的发现及分离；衰变规律及衰变位移规律的发现；放射性元素分离规律的发现等</p>\n<p>现代放射化学的发展阶段</p>\n<p>应用于实验</p>\n<p>核能的大规模应用；超铀元素的发现等</p>\n<p>1932~1942年</p>\n<p>1943~至今</p>\n<p>1896~1931年</p>\n<p>蓬勃发展阶段</p>\n<p>中子、人工放射性和裂变现象的发现等</p>\n<p>初期阶段</p>\n<p>发展阶段</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n<p>1932年秋建立国立北平研究院镭学研究所</p>\n<p>——我国最早的放射化学研究机构</p>\n<p>镤化学；</p>\n<p>测定铀镭系与铀锕系的分支比；</p>\n<p>测定温泉水中氡的浓度以寻找铀矿；</p>\n<p>铀盐中UX的分离；</p>\n<p>测定放射源中β-射线的吸收系数,并发现了背散射效应；</p>\n<p>1948年国立北平研究院成立了原子学研究所</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1950年</p>\n<p>中国科学院近代物理研究所</p>\n<p>镭学研究所</p>\n<p>原子学研究所</p>\n<p>中国科学院原子能研究所（1958）</p>\n<p>1955年起，清华、北大等先后设立放射化学或放射化工专业。</p>\n<p>1958年到60年代初，又成立了两个新的原子能研究基地：上海原子核研究所，兰州近代物理研究所。</p>\n<p>中国放射化学发展史</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n<p>1956年，从国外引进研究用的重水堆和回旋加速器。</p>\n<p>反应堆于1958年运行后生产出33种放射性核素。</p>\n<p>1959年，我国召开了全国第一次和平利用原子能会议。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氢弹爆炸</p>\n<p>原子弹爆炸</p>\n<p>中国放射化学发展史</p>\n<p>1964.10.16，第一颗原子弹被成功引爆</p>\n<p>1967.6.17，第一颗氢弹成功爆炸。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1971年9月，我国第一艘核动力潜艇下水。“两弹一艇”伟业标志着我国进入了核大国的行列，我国在一些原属空白的重要科技领域缩短了与世界发达国家的差距，进入世界科技前沿。</p>\n<p>中国放射化学发展史</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n<p>“如果60年代以来中国没有原子弹、氢弹，没有发射卫星，中国就不能叫有重要影响的大国，就没有现在这样的国际地位。这些东西反应一个民族的能力，也是一个民族、一个国家兴旺发达的标志。”</p>\n<p>1988年，邓小平</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n<p>第一阶段</p>\n<p>第二阶段</p>\n<p>第三阶段</p>\n<p>上世纪五六十年代处于黄金时期，成果辉煌，全民大办原子能、各重点高校均开设放射化学专业。</p>\n<p>八十年代后半期，由于切尔诺贝利核电站的灾难，和“冷战”结束等原因，我国的核科学和核技术以及放射化学和全世界一样走到低谷。</p>\n<p>进入新世纪后，放射化学开始复兴，主要推动力是能源供应、环境保护、人民健康、气候变化和国家安全等重大需求。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>中国放射化学发展史</p>\n<p>放射化学奠基人——杨承宗https://www.bilibili.com/video/BV1d64y1z7jV?from=search&amp;seid=9204014589400916153&amp;spm_id_from=333.337.0.0</p>\n<p>网络视频</p>\n<p>https://www.bilibili.com/video/BV1d64y1z7jV?from=search&amp;seid=9204014589400916153&amp;spm_id_from=333.337.0.0</p>\n<p>温馨提示：此视频框在点击“上传手机课件”时会进行转换，用手机进行观看时则会变为可点击的视频。此视频框可被拖动移位和修改大小</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.2 放射化学主要研究内容</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>放射化学</p>\n<p>基础放射化学</p>\n<p>放射性元素化学</p>\n<p>核化学</p>\n<p>应用放射化学</p>\n<p>放射分析化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>低浓度时放射性物质的物理化学行为和状态；</p>\n<p>吸附、共沉淀、胶体</p>\n<p>研究放射性物质的分离、纯化方法及其原理。</p>\n<p>共沉淀法、溶剂萃取法、离子交换法、色谱法等。</p>\n<p>1.基础放射化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>天然放射元素化学</p>\n<p>研究天然放射性元素(U、Th、Ra、Po)的化学性质，以及有关它们的提炼精制的化学工艺，重点是铀和钍；</p>\n<p>人工放射元素化学</p>\n<p>主要研究人工放射性元素的化学性质和核性质, 以及它们的分离、纯化和精制的化学过程, 重点是钚等超铀元素和主要的裂片元素。</p>\n<p>放射化学内容</p>\n<p>2.放射性元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>3.核化学</p>\n<p>用各种能量的轻重粒子引发核反应, 实现原子核的转变；</p>\n<p>分离、纯化、鉴定核反应的产物，并由此探讨其反应机理。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>核反应</p>\n<p>原子核与基本粒子或其他原子核相互作用时发生的变化过程。（p84）</p>\n<p>放射性衰变是自发性的</p>\n<p>核反应式</p>\n<p>起始核或靶核</p>\n<p>轰击</p>\n<p>粒子</p>\n<p>最终产物</p>\n<p>出射粒子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>核反应通式</p>\n<p>（1）化学反应涉及可称量的物质的变化，而核反应涉及的是单个原子；</p>\n<p>（2）化学反应元素保持不变，只是原子间的化学间发生了变化。</p>\n<p>（3）化学反应放出的能量通常远低于核反应放出的，在核反应中有显著的物质转变为能量。</p>\n<p>与化学反应区别</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>4.放射分析化学</p>\n<p>研究放射性物质的分离分析方法以及核技术在分析中的应用。</p>\n<p>突出成功的分析方法是中子活化分析；</p>\n<p>带电粒子激发X荧光分析及其微区扫描；</p>\n<p>同位素稀释法；</p>\n<p>加速器质谱分析等。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学内容</p>\n<p>5. 应用放射化学</p>\n<p>合成用于诊断各种疾病的新药物，诸如心肌显像药物、脑显像药物；</p>\n<p>为核医学对各种脏器多种疾病的诊断和治疗, 以及为研究人体的体内动态生理活动提供药物。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性+化学</p>\n<p>1. 核化工&amp;放射化学</p>\n<p>放射化学</p>\n<p>(3) 放射性元素化学</p>\n<p>研究天然和人工放射性元素及其化合物的化学性质、制备方法。</p>\n<p>(1) 基础放射化学</p>\n<p>研究放射性物质的物理化学的规律，低浓度行为和状态及分离原理。</p>\n<p>(2) 核化学</p>\n<p>研究各种原子核转变过程所引起的化学变化及生成的产物。</p>\n<p>(4) 放射分析化学</p>\n<p>研究放射性核素及其制剂的分析、测量和纯度鉴定方法。</p>\n<p>(5) 应用放射化学</p>\n<p>研究放射性核素在工业、农业、国防、医学等各个领域中的应用。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.放射性  放射化学最根本的特点</p>\n<p>优点：使研究方法的灵敏度大大提高；通过对放射性的原子跟踪，可对整个化学过程及其每个阶段进行研究和观察。</p>\n<p>弊端：射线可能对工作人员产生辐射损伤；放射性物质还会对所研究的体系产生一系列的物理化学效应—辐射化学效应。</p>\n<p>1.3 放射化学的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>2.不稳定性     发生衰变</p>\n<p>化学位移规律</p>\n<p>α衰变</p>\n<p>β衰变（β-衰变、β+衰变电子俘获EC）</p>\n<p>γ衰变以及发射转换电子或俄歇电子</p>\n<p>自发裂变</p>\n<p>质子裂变</p>\n<p>发射过重量粒子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>原子结构</p>\n<p>质量数=核内质子+中子</p>\n<p>质子数=原子序数</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>核素</p>\n<p>具有相同的质子数Z、相同的中子数N、处于相同的能态且寿命可测的一类原子称为核素。</p>\n<p>核子数</p>\n<p>(质量数）</p>\n<p>原子序数</p>\n<p>若不是表示核反应式中的核素时，可省略</p>\n<p>中子数，可省略</p>\n<p>表示能态</p>\n<p>元素符号</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>同位素</p>\n<p>p2</p>\n<p>具有相同的原子序数但质量数不同的原子</p>\n<p>具有同一原子序数的某化学元素的放射性原子。</p>\n<p>放射性同位素</p>\n<p>放射性元素</p>\n<p>元素周期表中，某一原子序数的位置内，所有同位素都具有放射性。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>同中子异位素：中子数相同、质子数不同的核素。</p>\n<p>同质异位素：质量数相同、质子数不同的核素</p>\n<p>同质异能素：处于不同的能量状态且其寿命可以用仪器测量的同一种原子核。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2.不稳定性     发生衰变(P13)</p>\n<p>按照发射粒子的不同，放射性衰变的种类主要有：</p>\n<p>1) α衰变：</p>\n<p>母体其核子数减少4;</p>\n<p>核电荷数减少2。</p>\n<p>1.3 放射化学的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>1. α衰变：本质是释放高速运动的氦原子流</p>\n<p>放出42He2+(简称α粒子），</p>\n<p>其核子数减少4;核电荷数减少2。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>－衰变</p>\n<p>﹢衰变和电子俘获</p>\n<p>电子俘获</p>\n<p>﹢衰变</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span oggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>内转换电子（e-）：发射的单能电子</p>\n<p>内转换系数（转换数，α）：两个能态之间的同一跃迁的内电子的概率We与发射γ量子的概率Wγ的商值。</p>\n<p>局部内转换系数：与原子壳层K、L……上的电子相互作用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>K俘获过程的另一种伴随粒子是俄歇电子：当一个L层电子跳到K层来填充空位时，可以不发射X射线，而把能量交给另一个L电子，于是这个L电子就会克服结合能而飞出。这种电子叫俄歇电子。</p>\n<p>俄歇电子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>+IC electrons + X rays or Auger electrons</p>\n<p>原子核从激发态到较低的能态或基态的跃迁，除发射光子外，还可以通过发射电子来完成。这种电子通常不是来自原子核，而是来自原子的电子壳层。</p>\n<p>X射线和俄歇电子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 81 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>放射性衰变中原子核分裂成两个大小相近的碎片的过程</p>\n<p>只有少量的核素的主要衰变形式是自发裂变，例：Cm、Cf、Fm。</p>\n<p>4. 自发裂变</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 82 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>放射性衰变中原子核分裂成两个大小相近的碎片的过程</p>\n<p>只有少量的核素的主要衰变形式是自发裂变，例：Cm、Cf、Fm。</p>\n<p>大部分为诱发裂变</p>\n<p>4. 自发裂变</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 83 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n<p>5.质子衰变</p>\n<p>6. 发射中等重量粒子如14C、24Ne的衰变</p>\n<p>发射质子，质子数较少1</p>\n<p>226Ra、224Ra、222Ra发射14C</p>\n<p>234U发射24Ne和发射28Mg</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 84 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.3 放射化学的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>诱发裂变</p>\n<p>1.3 放射化学的特点</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3.低浓度和微量</p>\n<p>放射性胶体溶液、放射性气体溶胶；</p>\n<p>易被器皿或其它固体物质沉淀所载带和吸附。</p>\n<p>吸附能力如下：</p>\n<p>玻璃＞石英＞聚乙烯 ＞聚丙烯＞聚四乙烯。</p>\n<p>1.3 放射化学的特点</p>\n<p>1）加载体；</p>\n<p>2）提高溶液的酸度；</p>\n<p>3）硅烷化。</p>\n<p>减少?</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>4.伴随辐射化学效应</p>\n<p>特别是放射性活度比较高的α放射体， α射线与其相作用的物质产生一些活性物质等。需要注意辐射防护问题</p>\n<p>放射性物质发射的核辐射         "html": "<div class=\"chapter-header\">\n<h2>第二章 放射性</h2>\n<div class=\"exam-topics\"><span class=\"exam-topic-tag\">★ 衰变公式</span><span class=\"exam-topic-tag\">★ 半衰期与衰变常数</span><span class=\"exam-topic-tag\">★ 衰变类型</span><span class=\"exam-topic-tag\">★ 贝克和居里</span><span class=\"exam-topic-tag\">★ 比活度</span><span class=\"exam-topic-tag\">★ 平衡公式</span></div>\n</div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 1 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 2 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识点回顾</p>\n<p>（        ）建立了第一座核反应堆；</p>\n<p>（             ）发现了超铀元素镎和钚；</p>\n<p>（           ）发现原子核裂现象；</p>\n<p>（                              ）在研究α粒子对轻核作用时，发现了人工放射性。</p>\n<p>放射化学的特点？</p>\n<p>放射性</p>\n<p>不稳定性</p>\n<p>低浓度和微量</p>\n<p>伴随辐射化学效应</p>\n<p>防止放射性核素在容器表面上损失的方法？</p>\n<p>加载体（放射性核素的化学性质相同或相近的稳定核素）</p>\n<p>提高溶液酸度</p>\n<p>玻璃容器用硅烷溶液进行处理</p>\n<p>约里奥-居里夫妇</p>\n<p>哈恩</p>\n<p>西博格</p>\n<p>费米</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 3 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放</p>\n<p>射</p>\n<p>性</p>\n<p>第二章</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 4 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>目录</p>\n<p>Contents</p>\n<p>壹</p>\n<p>放射性衰变规律</p>\n<p>贰</p>\n<p>放射性衰变类型</p>\n<p>叁</p>\n<p>射线与物质的相互作用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 5 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>壹</p>\n<p>贰</p>\n<p>叁</p>\n<p>放射性计算的应用</p>\n<p>了解射线与物质的相互作用</p>\n<p>掌握反射性衰变类型</p>\n<p>课程要求</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 6 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>壹</p>\n<p>放射性衰变规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 7 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>壹</p>\n<p>放射性衰变的时间规律</p>\n<p>贰</p>\n<p>放射性衰变平衡的建立</p>\n<p>叁</p>\n<p>放射性计算</p>\n<p>放射性衰变规律</p>\n<p>容</p>\n<p>内</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 8 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性：原子核自发地放射出各种射线的现象。</p>\n<p>原子核自发地放射出各种粒子的现象。</p>\n<p>各种离子： α、β、p、14C</p>\n<p>电磁辐射、俘获核外电子，自发裂变。</p>\n<p>放射性现象是由原子核的变化引起的</p>\n<p>放射性核素（不稳定核素）：能自发地放射各种射线的核素。</p>\n<p>放射性衰变规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 9 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>238U的衰变</p>\n<p>母体</p>\n<p>子体</p>\n<p>母体</p>\n<p>子体</p>\n<p>第二代子体</p>\n<p>第三代子体</p>\n<p>注意</p>\n<p>1. 放射性衰变是一个统计过程，原子核放射彼此独立的变化，每一种核素均有其特征的衰变概率。</p>\n<p>2. 衰变概率是特定核素的一种固有性质，它与放射性核素的化学及物理性质无关。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 10 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>符合</p>\n<p>衰变常数：原子核的放射性衰变或同质异能跃迁的概率</p>\n<p>表示放射性衰变的快慢</p>\n<p>在一般情况下，衰变常数与外界条件（诸如温度、压力、外部电磁场等）无关。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 11 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>0~t时间对上式积分</p>\n<p>Time (t) | number of atoms of a certain radionuclide</p>\n<p>0 | N0</p>\n<p>t | N</p>\n<div class=\"formula-line\">N(t=T1/2）=N0/2</div>\n<p>半衰期</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 12 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>注意：半衰期是每种放射性核素的特征参数，仅由原子核的内部特性决定，几乎与核素所处的化学和物理状态、外界条件（温度、压力和外加磁场等）无关。</p>\n<p>半衰期是一种不稳定的核素原子发生衰变的概率为50%。</p>\n<p>只适用于原子数量“巨大”的时候！</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 13 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>符合</p>\n<p>衰变常数（λ）</p>\n<p>原子核的放射性衰变或同质异能跃迁的概率。</p>\n<p>1Bq相当于每秒1个衰变数，即现有一定量的放射性核素每秒衰变1个原子核则具有1Bq的活度。</p>\n<div class=\"formula-line\">1 Ci(相当于1g 226Ra的放射性活度)=3.7×1010 Bq</div>\n<p>放射性活度（简称活度，符号为A，单位：Bq）</p>\n<p>某一时刻</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 14 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>平均寿命τ：在τ时间里，放射性活度下降到1/e。</p>\n<p>τ等于衰变常数的倒数。</p>\n<div class=\"formula-line\">A(t=τ）=A0/e</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 15 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>比放射活度（简称比活度，符号S ，单位：Bq /g）：</p>\n<p>单位质量的某种放射性物质的放射性活度。</p>\n<p>放射性        稳定</p>\n<p>通常情况下：m  》mA</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 16 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<div class=\"formula-line\">对于无载体的纯放射性核素（m=0）</div>\n<p>S0该放射性核素的一个特征常数，比活度的单位为Bq/g。</p>\n<div class=\"formula-line\">1 g任何放射性核素：S0=K/MT1/2（Bq/g）</div>\n<div class=\"formula-line\">K为4.17×1023</div>\n<p>对应半衰期单位是秒（s）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 17 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>放射性浓度(Radioactive concentration)</p>\n<p>放射性浓度c是指单位体积某放射性活度。</p>\n<p>cA=A/V</p>\n<p>单位：Bq/mL 或Bq/L。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 18 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例题：</p>\n<p>配1000 mL浓度为10 Bq/mL标准铀溶液，需分析纯U3O8多少克?</p>\n<p>(已知：238U、235U、234U的丰度分别为：99.275 %，0.720 %，0.0054 %；比活度S0分别为：12.4 Bq/mg，79.4 Bq/mg，2.3×105 Bq/mg；U的平均匀原子量为237.98，O的平均匀原子量为16)</p>\n<p>放射性衰变的时间规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 19 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：设需要m g U3O8</p>\n<p>放射性衰变的时间规律</p>\n<p>1、根据平均原子量及丰度计算U的量；</p>\n<p>2、如以g为单位，则要注意与Bq/mg对应</p>\n<div class=\"formula-line\">解得 m = 0.479 g</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 20 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例题：</p>\n<p>氚单位TU：表示每1018个氢原子中有一个氚原子。</p>\n<p>某环境水样，经分析其浓度为5 TU/L，用Bq/L表示为多少？（3H的半衰期为12.33 a）</p>\n<p>放射性衰变的时间规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 21 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>解：1 L水样重为1000 g，水样中的3H活度为：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 22 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>一般溶液的浓度</p>\n<p>重量百分比浓度：100 g溶液中所含溶质的克数（W/W）。</p>\n<p>重量体积百分比：100 mL溶液中所含溶质的克数（W/V）。</p>\n<p>体积百分浓度：100 mL溶液中所含原装液体试剂的毫升数。</p>\n<p>放射性衰变的时间规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 23 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>标准溶液的浓度</p>\n<p>当量浓度（N）：表示1升溶液中所含溶质的克当量数。</p>\n<p>摩尔浓度（M）：表示1升溶液中所含溶质的摩尔数。</p>\n<p>滴定度（T）表示1 mL标准溶液相当于待测物质的毫克数。(mg·mL-1 )</p>\n<p>放射性衰变的时间规律</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 24 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>f（计数效率）</p>\n<p>放射性衰变被测的部分，f＜1。</p>\n<p>脉冲率：每秒（s-1或cps）,每分（min-1或cpm）</p>\n<p>I（脉冲数或计数率）</p>\n<p>放射性活度与探测器的探测效率的乘积。</p>\n<p>I=fA</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 25 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>取对数</p>\n<p>A与 I成正比</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 26 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>T1/2</p>\n<p>单一核素</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 27 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变的时间规律</p>\n<p>多种核素</p>\n<p>相互独立</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 28 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>N1</p>\n<p>N2</p>\n<p>N3</p>\n<p>求解</p>\n<p>当初始时不存在核素2</p>\n<p>A2 ?</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 29 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 30 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">例1：在1g天然钾中每分钟衰变多少个40K的原子？已知40K的丰度为：1.18×10－2 %，钾的平均原子量为39.1， 40K 的半衰期为1.28×109a。</div>\n<p>放射性计算</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 31 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例2：1Bq的不同的放射性核素各有多重？多大质量的放射性核素的放射性活度为1Bq？</p>\n<p>放射性计算</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 32 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>A1,N1</p>\n<p>A2,N2</p>\n<p>A3,N3</p>\n<p>（1）T1/2,1 &gt;&gt; T1/2,2         长期平衡 Secular Radioactive Equilibrium</p>\n<p>（2）T1/2,1  &gt; T1/2,2           暂时平衡 Transient Radioactive Equilibrium</p>\n<p>（3）T1/2,1 &lt;T1/2,2             不成平衡 Non-equilibrium</p>\n<p>放射性平衡：母子体放射性活度之比恒定的状态</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 33 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>母体核素的半衰期比子体核素的半衰期长很多</p>\n<div class=\"formula-line\">T1/2,1 &gt;&gt; T1/2,2，λ1 &lt;&lt; λ2</div>\n<div class=\"formula-line\">λ2- λ1≈ λ2，</div>\n<p>放射性平衡的建立只取决于子体核素的半衰期</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>一般情况下，当t＞5~7 T1/2,2时（一般为7T1/2,2），</p>\n<div class=\"formula-line\">平衡时，A1=A2，那么A是多少呢？</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>1. 长期平衡</p>\n<p>这一关系对母体核素半衰期非常长的放射性衰变链来说是相当重要的。一旦平衡建立，就存在如下关系</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>2. 暂时平衡</p>\n<p>母体核素的半衰期不太长，但仍比子体核素的半衰期长</p>\n<div class=\"formula-line\">T1/2,1 &gt;T1/2,2，λ1 &lt; λ2</div>\n<p>平衡条件</p>\n<p>实际时间满足</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2. 暂时平衡</p>\n<p>与长期平衡不同</p>\n<p>暂时平衡时中A和A2均有最大值，</p>\n<p>A2在最大值之后大于A1</p>\n<p>放射性衰变平衡的建立</p>\n<p>拓展：我们可以求出最大值时刻的时间么？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>母体核素的半衰期比子体半衰期的半衰期短，没有放射性平衡可以达到。</p>\n<div class=\"formula-line\">T1/2,1 &lt; T1/2,2，λ1 ＞ λ2</div>\n<p>母体衰变比子体生长快，不能满足平衡条件。</p>\n<p>实际时间足够长时</p>\n<p>3. 不成平衡</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>大多数裂变产物的第一代或前几代均是半衰期较短的情况，而子体是长寿命的，所以均为不平衡情况。</p>\n<p>放射性衰变平衡的建立</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性衰变平衡的建立</p>\n<p>母体均服从指数衰变规律</p>\n<p>暂时平衡与长期平衡无明显界限（5~7T1/2,2）</p>\n<p>平衡体系受到破坏，平衡重新建立</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">从1t含有 40％U3O8的沥青铀矿中能分离多少克226Ra？ 238U 的半衰期为4.15×109 a , 226Ra 的半衰期为1602 a。</div>\n<p>作答</p>\n<p>可为此题添加文本、图片、公式等解析，且需将内容全部放在本区域内。</p>\n<div class=\"formula-line\">m=29.59</div>\n<p>答案解析</p>\n<p>主观题</p>\n<p>10分</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">例1：从1t含有 40％U3O8的沥青铀矿中能分离多少克226Ra？ 238U 的半衰期为4.15×109 a , 226Ra 的半衰期为1602 a。</div>\n<p>放射性计算</p>\n<div class=\"formula-line\">m=29.59</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">例2：95Zr(T1/2=65.5d)经衰变到 95Nb（T1/2=35d），后者衰变为稳定的95Mo。从t=0时分离纯算起，什么时候95Nb的放射性活度达到最大？总放射性活度是多大？</div>\n<p>放射性计算</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>当t＝67.97d时总活度为95Zr、 95Nb的活度之和</p>\n<p>95Zr活度为：</p>\n<p>放射性计算</p>\n<p>95Nb 的活度为：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>叁</p>\n<p>射线与物质的相互作用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射衰变存在几种类型？</p>\n<p>衰变</p>\n<p>α  衰变</p>\n<p>β  衰变</p>\n<p>γ  衰变</p>\n<p>自发裂变</p>\n<p>质子衰变</p>\n<p>中等重量粒子的发射</p>\n<p>核衰变：不稳定原子核自发地放出粒子或电磁辐射变成另一种原子核的过程。</p>\n<p>放射性衰变类型</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>210Po()         ；        ()234Th；         ()231Th</p>\n<p>210Po()206Pb；238U()234Th；235U()231Th</p>\n<p>知识回顾</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>210Po()         ；        ()234Th；         ()231Th</p>\n<p>知识回顾</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>1. 射线逐步损失能量，被吸收或被散射</p>\n<p>2. 物质在射线的作用下产生电离、激发等物理效应，进而引起化学效应</p>\n<p>射线通过物质发生相互作用的表现</p>\n<p>目的：了解射线的性质，提供核结构信息，研制核辐射探测器，防护辐射危害以及开拓各种辐射应用的需要。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>核辐射与物质相互作用时，与原子壳层电子直接或间接地发生作用，引起电子激发或电离。通常占主导地位。</p>\n<p>射程：直接引起电离的辐射能量的特征量度。</p>\n<p>半厚度：间接引起引起电离的辐射能量的特征量度。</p>\n<p>常用单位：g/cm2或mg/cm2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α射线与物质有强相互作用，因而很容易被完全吸收。</p>\n<div class=\"formula-line\">表   214Po(能量Ea=7.69MeV)的α射线在不同材料中的射程</div>\n<p>物质 | 外推射程/cm | 射程/（mg/cm2）</p>\n<p>空气 | 6.95 | 8.5</p>\n<div class=\"formula-line\">云母 | 3.60×10-3 | 10.1</div>\n<div class=\"formula-line\">铝 | 4.06×10-3 | 11.0</div>\n<div class=\"formula-line\">铜 | 1.83×10-3 | 16.8</div>\n<div class=\"formula-line\">金 | 1.40×10-3 | 27.0</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α粒子通过物质时，主要是与电子碰撞。 α粒子不仅带有电荷，且其能量和质量比电子大得多，因此每次碰撞损失的能量很小，经过很多次碰撞才能失去全部能量而被吸收。</p>\n<p>与电子碰撞时，重的α粒子（质量比电子大得多）的运动方向实际上不受影响，而且α粒子是做“直线飞行”的，被原子核散射的几率小，其路径长度与射程几乎相等。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>α射线与物质相互作用</p>\n<p>α粒子与物质的作用强，测量α放射性时必须制成很薄的源，其厚度应该在μg/cm2范围，同时要在真空中进行。</p>\n<p>源太厚或者在空气中测量会因α辐射的自吸收或被空气中吸收而造成能量分辨率的严重降低。</p>\n<p>质子、氚核和重离子与物质的相互作用和α辐射的作用相似。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>β射线与物质相互作用</p>\n<p>β射线是快速电子流，其质量小，速度快。在电离能量损失率小，穿透力强，在核库伦场中能产生韧致辐射，易被核和电子散射而形成多次散射，它在物质中的路程十分弯曲，呈锯齿形。</p>\n<p>韧致辐射：高能量电子在原子核电厂内慢化时放出一种连续的X射线。      强度正比于吸收物原子序数及电子能量。</p>\n<p>外韧致辐射：β衰变电子慢化放出韧致辐射发生在吸收物的原子核附近。</p>\n<p>内韧致辐射：电子俘获放出韧致辐射，在慢化生成的衰变核本身附近。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>β射线与物质相互作用</p>\n<p>常用铝做β辐射的吸收剂</p>\n<div class=\"formula-line\">I=I0e-μd</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>γ射线与物质相互作用</p>\n<p>γ辐射的作用很弱，穿透能力比带点粒子大得多。严格遵循：</p>\n<div class=\"formula-line\">I=I0e-μd</div>\n<p>半厚度：使辐射强度降低一半的吸收厚度。表征γ辐射的穿透能力。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>射线与物质的相互作用</p>\n<p>γ辐射吸收三种效应：光电效应、康普顿效应、电子对形成效应。</p>\n<p>光电效应：γ光子在一次碰撞中把全部能量给予一个壳层电子，放出的光电子能量等于γ光子能量减去电子的结合能。</p>\n<p>康普顿效应：γ光子把部分能量给予一个壳层电子， γ量子本身发生散射。</p>\n<p>电子对形成效应：一个γ光子在原子核电场内成负电子—正电子对。</p>\n</div></div>"
