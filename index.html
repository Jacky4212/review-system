p>6.1 放射性核素概况</p>\n<p>放射性同位素发生器/核子发生器，俗称“母牛”</p>\n<p>暂时平衡：母体长半衰期保障供应稳定性，子体短半衰期降低患者辐射风险。子体核素积累量与母体衰变速率相关，需定期洗脱以维持最佳活性。</p>\n<p>‌Mo–Tc发生器‌：临床最常用，⁹⁹Mo衰变生成⁹⁹mTc，用于SPECT显像。</p>\n<p>‌Sn–In发生器‌：适合交通不便地区，¹¹³Sn衰变生成¹¹³mIn，用于器官显像。</p>\n<p>‌W–Re、Sr–Rb发生器‌：用于PET显像，如⁸²Rb心肌代谢检查。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 34 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.1 放射性核素概况</p>\n<p>放射性同位素发生器/核子发生器，俗称“母牛”</p>\n<p>特点：</p>\n<p>1)从核子发生器中得到的子体核素，大多数是短寿命的，且无载体，放出能量适宜（几十到几百keV）的纯γ射线，使用安全，还可在较短时间内重复使用。废物处理简单，环境污染轻微。</p>\n<p>2）化学分离简便、快速。</p>\n<p>3）得到的子体核素均为高纯度的无载体产品，避免了有害化学杂质的掺杂。</p>\n<p>4）可提供反应堆和加速器难以生产的重要核素，如医用的放射性核素99mTc、113mIn等。并可从核子发生器中反复多次提取子体核素。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 35 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.1 放射性核素概况</p>\n<p>放射性同位素发生器/核子发生器，俗称“母牛”</p>\n<p>类型：</p>\n<p>升华发生器（升华温度）</p>\n<p>溶剂萃取发生器（分配系数）</p>\n<p>柱色层发生器（吸附能力）</p>\n<p>最常用</p>\n<p>利用母体99Mo的化学物能被发生器中的吸附剂吸附，而其子体99mTc的化学物不被吸附的原理，在使用时选用适当的淋洗剂（如生理盐水）就可将子体核素淋洗出来，供直接使用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 36 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>天然放射性元素化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 37 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 38 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1789年克拉普罗特从沥青中发现了铀铀在地壳在的平均含量为0.0004%（4 ppm），</p>\n<p>铀在海水中的含量约为3~4 μg/L。</p>\n<div class=\"formula-line\">海中铀量约为4.5×109 t。</div>\n<p>6.2.1 铀的概述</p>\n<p>铀的发现</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 39 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.1 铀的概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 40 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀共有15种放射性同位素和一种同质异能素，其中238U、235U和234U三种天然放射性同位素，它们组成了天然铀。</p>\n<p>提高铀中235U丰度的过程称铀的浓缩，其产品称为浓缩铀。</p>\n<p>铀的同位素</p>\n<p>6.2.1 铀的概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 41 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>6.2.1 铀的概述</p>\n<p>表 铀的天然放射性核素</p>\n<p>核素 | 丰度/% | 衰变方式/% | 粒子主要能量/MeV | 放射性比活度/(Bq/mg) | 半衰期/a</p>\n<p>234U | 0.0055 | α（100）, SF（10-9） | 4.773(72.5%)</p>\n<div class=\"formula-line\">4.723(27.5%) | 2.3×105 | 2.44×105</div>\n<p>235U | 0.714 | α（100） | 4.401(56%)</p>\n<div class=\"formula-line\">4.365(12%) | 79.4 | 7.1×108</div>\n<div class=\"formula-line\">238U | 99.27 | α（＞99），SF（4.55×10-5） | 4.196(77%)</div>\n<div class=\"formula-line\">4.149(23%) | 12.4 | 4.51×109</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 42 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀矿石</p>\n<p>6.2.1 铀的概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 43 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>早期，铀仅用作玻璃、陶瓷和珐琅的着色剂。现在用于制造核燃料。 235U、 233U为易裂变的核燃料核素， 238U可以转换成239Pu，后者为易裂变核燃料核素/可转换核素，反应式为：</p>\n<p>铀的主要用途及危害</p>\n<p>6.2.1 铀的概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 44 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀既是放射性毒物，又是化学毒物。天然铀在放射性物质毒性分类中属中毒性元素，它作用于人体的危害主要是化学毒性。各种铀化合物中毒后的主要损伤器官是肾脏，随后出现神经系统和肝脏的病变等。</p>\n<p>6.2.1 铀的概述</p>\n<p>铀的主要用途及危害</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 45 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>我国规定：</p>\n<p>天然铀在露天水源中的限制浓度为0.05mg/L，</p>\n<p>在放射性工作场所中的最大容许浓度为0.02mg/L，</p>\n<p>在人尿中铀的控制指标为20μg/L。</p>\n<p>6.2.1 铀的概述</p>\n<p>铀的主要用途及危害</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 46 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>块状铀在空气中氧化变为黄色，最后变为黑色。</p>\n<p>铀块与沸腾的水（或水蒸气）作用。</p>\n<p>7U+6H2O→3UO2+4UH3</p>\n<p>铀在水溶液中有+3、+4、+5和+6价四种价态。</p>\n<p>铀溶于硝酸、盐酸。</p>\n<p>与碱不发生作用，但能与含有H2O2或Na2O2的碱溶液作用。</p>\n<p>6.2.2 金属铀</p>\n<p>金属铀的化学性质</p>\n<p>使铀块破裂，加快水对铀浸蚀</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 47 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>金属铀主要是用金属钙或镁热还原铀的卤化物和氧化物来制备的。</p>\n<p>UX4＋2Mg→U＋2MgX2</p>\n<p>铀是一种有银白色光泽的金属，质软，比重19.02 g/cm3，熔点为1132.3 ℃，沸点为3818 ℃有一定的延展性，具有多晶性。</p>\n<p>6.2.2 金属铀</p>\n<p>金属铀的物理性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 48 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>块状铀在空气中氧化变为黄色，最后变为黑色。</p>\n<p>铀块与沸腾的水（或水蒸气）作用。</p>\n<p>7U+6H2O→3UO2+4UH3</p>\n<p>铀在水溶液中有+3、+4、+5和+6价四种价态。</p>\n<p>铀溶于硝酸、盐酸。</p>\n<p>6.2.2 金属铀</p>\n<p>金属铀的化学性质</p>\n<p>不能阻止氧化</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 49 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀在不同情况下可以形成从+3~+6价的各种铀化合物，主要有以下几类：</p>\n<p>1）铀的氧化物</p>\n<p>UO2、U4O9、U3O8、UO3和UO4。</p>\n<p>最稳定的是U3O8，可作为重量法测铀的基准化合物；</p>\n<p>UO2可作为动力堆的核燃元件；</p>\n<p>UO3为两性铀氧化物，它是铀酸酐。</p>\n<p>6.2.3  铀的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 50 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的化合物</p>\n<p>二氧化铀（UO2）</p>\n<p>UO2是一种暗红色粉末，比重10.87 g/cm3，熔点2865 ℃。</p>\n<p>氧气中：着火，生成U3O8.</p>\n<p>强酸中：生成四价铀盐（绿色）</p>\n<p>含有H2O2或碳酸盐溶液中，生成过氧铀酸盐（UO8)4-。</p>\n<p>反应堆制备元件。制备UF4的原材料</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 51 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的化合物</p>\n<p>三氧化铀（UO3）</p>\n<p>UO3制备方法不同，可从红色到橙色。溶解度很小，易潮解成水合物。</p>\n<p>高温失氧，生成U3O8</p>\n<p>与酸反应生成铀酰盐</p>\n<p>与碱反应生成铀酸盐重铀酸盐(U2O7)2-</p>\n<p>高温情况，还原为UO2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 52 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的化合物</p>\n<p>八氧化三铀（U3O8）</p>\n<p>最稳定的氧化物，唯一一个可以稳定在500 ℃</p>\n<p>有重量分析法的基准物质</p>\n<p>UO3制备方法不同，成橄榄绿、墨绿色或黑色。</p>\n<p>不容于水和稀酸，能溶于浓酸，形成U4+和铀酰离子</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 53 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的化合物</p>\n<p>过氧化铀（UO4）</p>\n<p>白色沉淀</p>\n<p>难溶于水</p>\n<p>可与无机酸转换为铀酰盐。</p>\n<p>常用于与其他元素的分离。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 54 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>U4+的酸性溶液中加入HF，可得UF4的水合物。在高温下可制备无水的UF4。</p>\n<p>UF4为绿色晶状物质，俗称“绿盐”。</p>\n<p>2）铀的卤化物</p>\n<p>铀能与所有的的卤族元素生成从+3~+6价的各种铀卤化合物。</p>\n<p>6.2.3  铀的化合物</p>\n<p>四氟化铀（UF4）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 55 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>UF6是一种白晶体，易升华，常压下其升华点为56.5℃，此特性被用于气体扩散法富集天然铀中的235U，UF6是极毒气体，有强烈腐蚀性，对金属腐蚀性强，对诸如聚四氟乙烯等有机没有腐蚀。</p>\n<p>6.2.3  铀的化合物</p>\n<p>六氟化铀（UF6）</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 56 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）铀的盐类</p>\n<p>四价铀盐</p>\n<p>多数四价铀盐不溶于水，少数四价铀盐能溶于水，四价铀盐在中性或弱碱性介质中易水解生成难溶的U(OH)4 胶体；</p>\n<p>六价铀盐</p>\n<p>稳定的。主要以绿黄色并具有荧光的铀酰基存在，也可以生成黄色的重铀酸根。</p>\n<p>6.2.4  铀的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 57 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀酰盐  由        与酸根结合而成的，其水溶液呈黄绿色，铀酰盐具有两性，</p>\n<p>在酸性介质中以        存在，而在pH＞5 的介质中，则以难溶性的重铀酸盐沉淀形式存在（硝酸铀酰用于铀的溶剂萃取分离，硫酸铀酰可作均相反应堆燃料，重铀酸盐在铀的水冶中用于分离各浓集铀）</p>\n<p>6.2.4  铀的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 58 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>硝酸铀酰：</p>\n<p>硫酸铀酰：</p>\n<p>三碳酸铀酰铵</p>\n<p>重铀酸盐：</p>\n<p>6.2.3  铀的化合物</p>\n<p>反萃</p>\n<p>酸：铀酰；</p>\n<p>碱：重铀酸盐</p>\n<p>黄饼</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 59 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀在水溶液中有+3、+4、+5和+6价四种价态，而以+6价的        最稳定。 而U4+仅能在酸性溶液中稳定存在，U3+和        不稳定，在酸性溶液中， U3+是一种还原性很强的离子，能将水分子中的氢还原成氢气，而         在酸性溶液中能发生歧化反应。</p>\n<p>铀在水溶液中的价态</p>\n<p>6.2.4  铀的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 60 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在25℃的1.0mol/L HClO4溶液中，各种价态铀离子的标准还原电势值是：</p>\n<p>铀在水溶液中的价态</p>\n<p>6.2.4  铀的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 61 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀在水溶液中的价态（酸性）</p>\n<p>6.2.4  铀的水溶液化学</p>\n<p>铀在水溶液中有+3、+4、+5和+6价四种价态</p>\n<p>在酸性溶液中， U3+是一种还原性很强的离子，能将水分子中的氢还原成氢气</p>\n<p>2U3++2H2O→2U4++H2+2OH-</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 62 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>各种铀离子的水解能力取决于离子电荷z与离子裸半径r0的比值的大小，即离子势z/r0的大小。</p>\n<p>铀离子的水解能力如下：</p>\n<p>6.2.4  铀的水溶液化学</p>\n<p>铀的水解行为</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 63 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀离子的络合能力如下：</p>\n<p>6.2.4  铀的水溶液化学</p>\n<p>铀的络合反应</p>\n<p>实际应用</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 64 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀的络合物</p>\n<p>1）铀的无机络合物</p>\n<p>U4+和       能与许多无机酸根F- 、Cl- 、      等形成无机络合物，前者比后者络合能力强，但后者更有实用价值。</p>\n<p>2）有机络合物</p>\n<p>U4+和       能与柠檬酸等生成有机络合物，这些络合物常用于铀的化学分离和测定中。</p>\n<p>6.2.4  铀的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 65 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>水溶液中不同价态铀离子的形式和颜色</p>\n<p>价态 | 离子形式 | 溶液颜色</p>\n<p>U(Ⅲ) | U3+ | 玫瑰红</p>\n<p>U(Ⅳ) | U4+ | 深绿</p>\n<p>U(Ⅴ) | UO2+ | --</p>\n<p>U(Ⅵ) | UO22+ | 黄绿</p>\n<p>6.2.3  铀的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 66 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的水溶液化学</p>\n<p>U(IV)发生强烈的逐级水解，可产生聚合物</p>\n<p>U(IV)的水解行为</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 67 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的水溶液化学</p>\n<p>U(VI)的水解能力比U(IV)低。</p>\n<p>当pH&lt;2.5时不水解</p>\n<p>当pH&gt;2.5时水解，水解伴随聚合，生成复杂的氢氧化物沉淀。</p>\n<p>U(VI)的水解行为</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 68 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.2.3  铀的水溶液化学</p>\n<p>U(V)只在pH在2~4范围内稳定。</p>\n<p>当pH&gt;8时水解，生成</p>\n<p>U(V)的水解行为</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 69 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀的定量分析方法</p>\n<p>常量分析测定有：重量法和容量法；</p>\n<p>微量铀的测定主要有：分光光度法、荧光法、活化分析法等。</p>\n<p>6.2.5 铀的分析测定</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 70 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀矿开采；</p>\n<p>铀初级产品生产；</p>\n<p>初级产品纯化、转化；</p>\n<p>铀浓缩：气体扩散法、离心法、喷嘴法等；</p>\n<p>铀燃料制备；</p>\n<p>核电厂发电；</p>\n<p>后处理。</p>\n<p>6.2.6 铀循环的生产</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 71 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀矿开采</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 72 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>堆浸提铀场</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 73 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>离心机原理示意图</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 74 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>实验</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 75 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（1）可以形成挥发性氟化物或氟氧化物的金属，例如：钼、钨、钒、铬。</p>\n<p>它们会夹杂在挥发性的UF6中，影响铀同位素的分离效率。南非的核纯铀化合物中可以形成挥发性氟化物或氟氧化物的金属杂质的典型含量。</p>\n<p>影响UF6气体扩散过程的杂质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 76 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>（2）可以形成不挥发性氟化物的金属</p>\n<p>它们会在UF6扩散分离铀同位素的过程中沉积在设备和管道内，造成气体流动不均匀和设备系统的阻塞。南非的核纯铀化合物中可以形成不挥发性氟化物的金属杂质的典型含量。</p>\n<p>影响UF6气体扩散过程的杂质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 77 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>二氧化铀陶瓷芯块</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 78 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>复习</p>\n<p>U238</p>\n<p>U233</p>\n<p>U235</p>\n<p>再生核燃料</p>\n<p>易裂变核素</p>\n<p>易裂变核素</p>\n<p>用作原子反应堆和核武器的核燃料</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 79 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>复习</p>\n<p>空气</p>\n<p>沸水</p>\n<p>酸碱</p>\n<p>空气中易被氧化</p>\n<p>金属粉末在空气中可以自燃</p>\n<p>与沸水反应生成UO2和H2</p>\n<p>与沸水反应生成UO2和UH3</p>\n<p>溶于HNO3，HCl</p>\n<p>没有氧化剂存在时，H2SO4和HClO4不与铀反应</p>\n<p>有H2O2和HNO3时，反应才能进行，H3PO4对铀的作用与HClO4类似。</p>\n<p>与碱不发生直接作用，但在碱中加入H2O2可溶解U，形成过铀酸盐</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 80 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>复习</p>\n<p>UO2</p>\n<p>UO3</p>\n<p>UO4</p>\n<p>赭色</p>\n<p>不溶于水和碱，易溶于硝酸</p>\n<p>动力反应堆核燃料</p>\n<p>制取UF4原料</p>\n<p>两性氧化物</p>\n<p>橙红色</p>\n<p>制取UO2和金属U的原料</p>\n<p>暗绿色到黑色</p>\n<p>重量分析法的基准物质</p>\n<p>不能溶于水和稀酸，能溶于浓酸，形成U4+和UO22+</p>\n<p>U3O8</p>\n<p>白色沉淀</p>\n<p>微酸性溶液中用H2O2作用于UO22+得到</p>\n<p>常用于铀与其他元素的分离及纯化</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 81 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>复习</p>\n<p>UF4</p>\n<p>UF6</p>\n<p>制备UF6和金属U的原料</p>\n<p>易升华</p>\n<p>大规模分离U-235和U-238</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 82 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2020年4月16日星期四</p>\n<p>复习</p>\n<p>铀的盐类</p>\n<p>碳酸铀酰</p>\n<p>硫酸铀酰</p>\n<p>反萃</p>\n<p>硝酸铀酰</p>\n<p>卤化铀酰</p>\n<p>重铀 酸盐</p>\n<p>水冶浓缩物</p>\n<p>矿山浸取</p>\n<p>矿石加工和后处理</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 83 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>复习</p>\n<p>价态 | 离子形式 | 溶液颜色 | 反应</p>\n<p>U(Ⅲ) | U3+ | 玫瑰红 | 氧化还原</p>\n<p>水解</p>\n<p>络合</p>\n<p>U(Ⅳ) | U4+ | 深绿 | </p>\n<p>U(Ⅴ) | UO2+ | -- | </p>\n<p>U(Ⅵ) | UO22+ | 黄绿 | </p>\n<p>水溶液中形式</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 84 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钍化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 85 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）钍的发现</p>\n<p>1826年伯齐利厄斯在矿物中首发现了钍，钍广泛分布于自然界中，在地壳中的含量约为8ppm。</p>\n<p>6.3.1 钍化学概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 86 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1）钍的发现</p>\n<p>钍的矿物种类却比较少，主要矿物是独居石，其主要成分是钍和稀土元素的混合磷酸盐；</p>\n<p>其次是ThO2和UO2共生的方钍石和及以硅酸钍为主要成分的钍石。</p>\n<p>6.3.1 钍化学概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 87 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>2）钍的同位素</p>\n<p>钍共有23种放射性同位素，</p>\n<p>其中只有6种是天然存在的：227Th、 228Th、 230Th、 231Th、 232Th和234Th；</p>\n<p>在天然钍中， 232Th最重要，可产生233U是裂变核素，可用于钍堆的核材料。</p>\n<p>6.3.1 钍化学概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 88 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3）钍的主要用途及危害</p>\n<p>232Th可转变成核燃料，其反应式为：</p>\n<p>钍及其化合物还可以作电极材料、催化剂及电焊条等的添加剂。</p>\n<p>天然钍属中毒性元素，进入体内后主要集中于肝、骨髓和淋巴结中，钍的化学毒性不高。</p>\n<p>6.3.1 钍化学概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 89 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钍的物理性质</p>\n<p>钍是银白色的金属，</p>\n<p>相对密度为11.7，</p>\n<p>熔点为1780℃，</p>\n<p>较软，易进行机械加工，</p>\n<p>钍具有多晶型性质，主要有面心立方体和体心立方体晶格两种。</p>\n<p>6.3.2 金属钍</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 90 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钍的化学性质</p>\n<p>室温下不被空气或氧所氧化。</p>\n<p>钍的化学性质与锆、铪相似，钍的电子结构为：6s26p66d27s2，最高氧化态是正四价。</p>\n<p>金属钍主要是用金属钙热还原钍的氧化物和氟化物熔盐的方法来制备，反应式为：</p>\n<p>ThO2+2Ca→Th+2CaO</p>\n<p>ThF4熔盐    电解      Th</p>\n<p>6.3.2 金属钍</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 91 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>金属钍在600℃时易溶于金属Ga中，在1000℃时可溶于Bi和Pb中；</p>\n<p>600℃时，与Li、Na、K无作用</p>\n<p>6.3.2 金属钍</p>\n<p>建造液体金属为冷却剂的金属钍反应堆</p>\n<p>金属钍</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 92 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>金属钍易溶于HCl，但总残留一些不溶残渣</p>\n<p>稀HF、HNO3、H2SO4或浓H3PO4与金属钍作用很慢</p>\n<p>浓HNO3能使金属钍钝化，加入少量氟化物后，可完全溶解。</p>\n<p>6.3.2 金属钍</p>\n<p>金属钍</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 93 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>通常情况下，钍只能形成稳定的四价化合物。</p>\n<p>氧化物ThO2、ThO</p>\n<p>ThO2有组成固定，稳定的氧化物，不溶于水，也不溶于碱溶液可做为基准化合物；</p>\n<p>卤化物有ThF4、ThCl4、ThBr4、ThI4、ThI3等；</p>\n<p>此外还有N、C、B和P化合物；</p>\n<p>6.3.3 钍的化合物</p>\n<p>钍的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 94 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钍能与许多无机酸作用生成相应的盐，易溶盐有Th(NO3)4、Th(SO4)2和ThCl4，它们既溶于水也溶于醇、酮等有机溶剂中，此性质在钍的萃取分离中有重要意义。</p>\n<p>6.3.3 钍的化合物</p>\n<p>钍的盐类</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 95 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>难溶盐有</p>\n<p>ThF4、Th(C2O4)2、Th(IO3)4、Th3(PO4)4等，它们常用于钍与稀土元素的分离和微量钍的浓集、纯化；</p>\n<p>钍的络合物</p>\n<p>水溶液中的Th4+具有很强的络合能力，它能与无机酸根离子（F-、Cl、     、      、         ）形成易溶于水的无机络阳离子，与偶氮类、萘酚类等形成有色络合物。</p>\n<p>6.3.3 钍的化合物</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 96 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Th4+能与许多有机试剂形成水溶性络合物。这些有机络合剂常作为钍的掩蔽剂（络合离子）。</p>\n<p>Th4+的电荷多，半径小，具有很强的络合和水解倾向。</p>\n<p>钍还能与丙酮、TBP等有机试剂生成疏水性的中性络合物。</p>\n<p>6.3.4 钍的水溶液化学</p>\n<p>钍的水溶液化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 97 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.3.4 钍的水溶液化学</p>\n<p>钍的水溶液化学</p>\n<p>在水溶液中，钍水解和pH有关</p>\n<p>pH&gt;3时，钍发生显著水解</p>\n<p>PH&gt;3.5时，析出胶状的Th(OH)4沉淀</p>\n<p>难溶性钍盐可以转化为可溶性络合物</p>\n<p>Th3(PO4)4+9(NH4)2[Th(CO3)3]+4(NH4)3PO4</p>\n<p>不溶</p>\n<p>可溶</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 98 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.3.4 钍的水溶液化学</p>\n<p>如何从钍精矿中获得纯的Th(NO3)4?</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 99 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.钍精矿用NaOH溶液加热分解，使钍和稀土的磷酸盐转为氢氧化物Th(OH)4和RE(OH)3;</p>\n<p>2.所得氢氧化物用HNO3溶解</p>\n<p>3. 先用20~30%TBP+煤油，萃取分离，使UO22+和Th4+进入有机相而与稀土硝酸盐分离；</p>\n<p>4. 0.5mol/LHNO3反萃取；反萃取液再用5~8%TBP萃取，使铀进入有机相，钍仍留在水相。</p>\n<p>5. 将Th(NO3)4溶液蒸发浓缩、结晶，得到Th(NO3)4·6H2O</p>\n<p>6.3.4 钍的制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 100 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钍的应用</p>\n<p>煤气灯灯芯</p>\n<p>电子管的阳极和耐火材料</p>\n<p>示踪剂。</p>\n<p>钍的分析测定</p>\n<p>重量法（ThO2)、容量法、分光光度法和中子活法化等。</p>\n<p>6.3.4 钍的应用与监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 101 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>管制材料</p>\n<p>天然界并不存在</p>\n<p>需要专门的核反应堆，产量不高</p>\n<p>212Pb-212Bi发生器用母核</p>\n<p>TAT核素</p>\n<p>6.3.4 钍的应用与监测</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 102 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.铀的天然放射性核素有几种？</p>\n<p>2. 可作为动力堆的核燃元件？</p>\n<p>3. 可作为重量法测铀的基准化合物</p>\n<p>4. 两性铀氧化物？</p>\n<p>5.制备UF4的原材料？</p>\n<p>知识问答</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 103 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1.铀的天然放射性核素有几种？</p>\n<p>2. 可作为动力堆的核燃元件？</p>\n<p>3. 可作为重量法测铀的基准化合物</p>\n<p>4. 两性铀氧化物？</p>\n<p>5.制备UF4的原材料？</p>\n<p>知识问答</p>\n<p>238U、235U和234U</p>\n<p>UO2</p>\n<p>U3O8</p>\n<p>UO3</p>\n<p>UO2</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 104 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>最稳定的钍的氧化物分别是什么？</p>\n<p>232Th可转变成核燃料，其反应式为?</p>\n<p>用核反应式表示238U制备239Pu的过程？</p>\n<p>习惯上说的镭的质量数是多少？</p>\n<p>测量222Rn来测算226Ra的含量的公式？</p>\n<p>知识问答</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 105 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>最稳定的钍的氧化物分别是什么？</p>\n<p>232Th可转变成核燃料，其反应式为?</p>\n<p>用核反应式表示238U制备239Pu的过程？</p>\n<p>习惯上说的镭的质量数是多少？</p>\n<p>测量222Rn来测算226Ra的含量的公式？</p>\n<p>知识问答</p>\n<p>ThO2</p>\n<p>Ra-226</p>\n<div class=\"formula-line\">ARa=ARn/(1-e-λt)</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 106 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镭、氡、钋的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 107 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 108 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1898年居里夫人发现了镭。天然镭是铀系、钍系和锕系三个天然放射系的成员，与铀、钍矿共存。</p>\n<p>238U → 226Ra；</p>\n<p>232Th → 224Ra；</p>\n<p>235U → 223Ra。</p>\n<p>由于镭在衰变过程中的反冲作用以及镭的物理化学和结晶化学性质，它在矿石受地下水浸蚀时易被浸出，其流失量可达85%。</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 109 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镭共有25种放射性同位素， 206Ra~ 230Ra 。</p>\n<p>只有223Ra、 224Ra 、 226Ra和228Ra是天然存在的。</p>\n<p>最重要的是226Ra，它是自然界中丰度最高的一种同位素， 226Ra的比活度很高；</p>\n<p>习惯上说的镭是226Ra。</p>\n<p>氡的核素</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 110 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>表 镭的天然放射性同位素</p>\n<p>同位素 | 衰变方式（%） | 半衰期</p>\n<p>223Ra | α（100） | 11.4d</p>\n<p>224Ra | α（100） | 3.64d</p>\n<p>226Ra | α（100） | 1602a</p>\n<p>228Ra | α（100） | 5.75a</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 111 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>223Ra在海洋学的研究中的应用。</p>\n<p>锕系衰变图</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 112 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>浸出液</p>\n<p>浸出液</p>\n<p>阴离子交换树脂</p>\n<p>除钍后溶液</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 113 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>除钍后溶液</p>\n<p>阴离子交换树脂</p>\n<p>除U/Pa后溶液</p>\n<p>锕溶液</p>\n<p>阳离子交换树脂</p>\n<p>219Rn源产品</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 114 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镭的性质</p>\n<p>镭是白色、发光、化学性质活泼的金属</p>\n<p>镭的毒性很大</p>\n<p>典型的碱土金属，与水发生强烈的反应</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 115 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>Ra(OH)2与酸作用：</p>\n<p>Ra(OH)2+2HCl→RaCl2+2H2O</p>\n<p>Ra的主要可溶性有：</p>\n<p>RaCl2、RaBr2、Ra(NO3)2、和RaS等；</p>\n<p>Ra的主要难溶性有：</p>\n<p>RaSO4、RaCO3、RaCrO4、Ra3(PO4)2等，其中RaSO4、RaCO3、RaCrO4和相应的钡盐所形成的共结晶沉淀常用于镭的分离测定中。</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 116 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>在一般情况下，环境和生物样品中镭的含量很低，我国各类主要食品中，224Ra、226Ra和228Ra的含量一般在3.7×10-3～0.37Bq/kg范围内。因此，对环境和生物样品进行测量时要先对样品进行浓集和分离纯化，然后再进行镭子体的活度测定，通常镭的放射性测量是以测定226Ra为主要对象。</p>\n<p>镭的分析测定</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 117 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>所用载体</p>\n<p>BaSO4、BaCO3、BaCrO4、PbSO4、PbCrO4、CaCO3等，通常以BaSO4- PbSO4共沉淀法用得最广，生成BaSO4- PbSO4- RaSO4共沉淀；</p>\n<p>6.4.1 镭化学</p>\n<p>镭的分离方法：目前镭的化学分离和浓集主要采用共沉淀法。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 118 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镭的测定方法</p>\n<p>射气法、α计数法、其它镭子体放射性测量法、 α能谱法、γ能谱法。</p>\n<p>其中射气法是基于封存一定时间的含镭样品溶液中新累积的短寿命子体氡积累一定时间后的活度与母体镭达到平衡：226Ra→222Rn → 218Po。</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 119 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>226Ra的半衰期为1602a，而222Rn的半衰期为3.82d ，它们很易建立长期平衡。</p>\n<p>6.4.1 镭化学</p>\n<div class=\"formula-line\">ARa=ARn/(1-e-λt)</div>\n<p>通过测量222Rn来测算226Ra的含量。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 120 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">解：ARn=100Bq，TRn= 3.82d</div>\n<p>例题 一</p>\n<p>射气法测226Ra，未知镭源封存24h，测得222Rn的活度为100Bq，已知氡的半衰期为3.82d，求镭的活度。</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 121 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例题二</p>\n<p>用标准液体镭源刻度闪烁室。已知标准镭源的活度为200Bq，封存24h，将222Rn从鼓泡器中转移到闪烁室后，3h后测量，闪烁室的体积为500ml，闪烁室的本底为5cpm，测量计数为4505cpm，求闪烁室的刻度系数k。</p>\n<p>222Rn的半衰期为3.82d</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 122 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：    设该闪烁室的刻度系数为k</p>\n<p>测量时氡的活度ARn</p>\n<p>6.4.1 镭化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 123 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>知识回顾</p>\n<p>为什么在闪烁室中保留3 h？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 124 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 125 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1899年欧文和卢瑟夫在研究钍的放射性时，发现了氡，当时称为钍射气（220Rn）。次年，道恩又发现了222Rn，它们是铀和钍的放射性子体，主要存在于铀、钍矿石、矿井水和矿泉水中，一般所指的氡是226Ra的衰变产物222Rn。即：</p>\n<p>铀系：226Ra→222Rn → 218Po(RaA)→214Pb(RaB) →214Bi (RaC)→214Po (RaCʹ)→</p>\n<p>钍系：224Ra→220Rn → 216Po(ThA)→212Pb(ThB) →212Bi (ThC)→212Po (ThCʹ)→</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 126 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氡有27 种同位素和３种同质异能素。</p>\n<p>在氡的放射性同位素中最重要的是三个天然放射系的成员222Rn、 220Rn和219Rn。</p>\n<p>它们分别被称为镭、钍和锕射气。</p>\n<p>氡的核素</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 127 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.4.2 氡化学</p>\n<p>选择适合Rn-219的放射源？</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 128 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕系（4n+3）</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 129 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>大地释放</p>\n<div class=\"formula-line\">238U在土壤和岩石中的含量不近相同，平均含量为2.8×10-4 %，地面氡平均析出率为16mBq•m-2•s-1，陆地表面每年向大气中释放7.6×1019Bq的氡</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 130 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>海洋释放</p>\n<div class=\"formula-line\">海水中含有一定量的226Ra，平均浓度为1 Bq•m-3，海底比海面要高出一个数量级，海面氡平均析出率为7×10-5 Bq•m-2•s-1，海洋每年向大气释放8×1017 Bq的氡</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 131 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>植物和地下水的载带</p>\n<div class=\"formula-line\">植物的生长将增加地表氡的释放。实测结果表明，种五谷的土地氡的释放率是那些不毛之地的3~5倍。由于植物和地下水的作用，每年向大气中释放约1×1019 Bq的氡</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 132 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>核工业释放</p>\n<div class=\"formula-line\">核燃料生产过程中每一个环节都有氡的析出，估计全世界的铀矿山和水冶厂每年向大气中释放1×1019 Bq的氡；</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 133 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>煤的燃烧</p>\n<div class=\"formula-line\">煤中的铀含量平均为1.0×10-4%，煤灰成为一种人工氡气源，每年由于煤的燃烧产生的氡为1×1013Bq的氡；</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 134 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>磷酸盐工业</p>\n<div class=\"formula-line\">磷酸盐矿石中的铀含量高，估计在全世界由于磷酸盐工业每年释放到大气中1×1018 Bq的氡</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 135 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>环境大气中氡的来源</p>\n<p>天然气</p>\n<div class=\"formula-line\">天然气中含有放射性物质，向大气中释放出1×1014Bq的氡</div>\n<p>建筑物的释放</p>\n<div class=\"formula-line\">由于建筑材料中都含有一定量的226Ra，每年向大气中释放1×1016Bq的氡 。</div>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 136 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氡的用途及危害</p>\n<p>氡可用来制用实验室用的氡－铍中子源，氡还可用作示踪剂，此外，监测深井水中氡含量的变化可能用来预报地震等；</p>\n<p>氡被吸进体内，氡及子体可能会诱发癌变。</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 137 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 138 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>我国地表年均氡析出率的数字化填图</p>\n<p>空间分辨率：</p>\n<p>25×25 km2</p>\n<p>全国年平均：</p>\n<p>29 mBq m-2 s-1</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 139 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>春</p>\n<p>夏</p>\n<p>秋</p>\n<p>冬</p>\n<p>我国地表氡析出率的季节性变化</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 140 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氡是单原子气体，无色，液化后成无色的发光液体，沸点为-61.8℃，要-71℃时固化成橙黄色的固体。氡易被炭、硅胶等吸附，此性质可用于分离氡，在350℃可从炭上解析氡。</p>\n<p>物理性质</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 141 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>电子结构为：5s25p65d106s26p6，外层电子有八个电子，呈惰性，一般情况下不与其它物质发生化学反应，在一定条件下水、苯芬、甲苯形成化合物。</p>\n<p>化学性质</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 142 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>测量氡及子体的方法很多，常用的有双滤膜α放射性测量法、液体闪烁计数法、 α能谱法、快速三段法等。</p>\n<p>氡及其子体的分析测定</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 143 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>例  流气式氡源的活度为1200Bq（226Ra活度为1200 Bq ），空气流过该源，流量为1L/min，则流出的气体氡的浓度为多少Bq/m3？</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 144 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">1、解  ARa=1200Bq，</div>\n<p>则每秒有1200个222Rn原子产生，</p>\n<p>1秒流过的体积为</p>\n<p>2、解   1秒内累积氡量：</p>\n<p>流出气体的氡浓度：</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 145 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>新制备好的222Rn源母体226Ra活度的测定</p>\n<p>将新制备好的222Rn源放入体积为3500 ml的干燥器内封存28 h后，从干燥器内取5 ml该放射性气体注入体积为500 ml的闪烁室内，放置3 h后，测得的计数为2280 cpm，已知闪烁室的k值为13.2 Bq /(m3 cpm)，本底为50 cpm，T为3.82d求222Rn源（226Ra）的活度？</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 146 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>解：闪烁室测定222Rn的浓度：</p>\n<p>3h前氡的浓度：</p>\n<p>进入闪烁室的氡的活度：</p>\n<p>总的氡活度：</p>\n<p>源的活度：</p>\n<p>6.4.2 氡化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 147 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 148 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">钋是1898年被玛丽．居里夫人发现的，这了纪念她的祖国波兰，而命名为Polonium，尽管铀系和钍系的衰变均可产生钋，但它含量很低，地壳中钋的分布量2×10-14%。</div>\n<p>6.4.3 钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 149 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钋的制备通常用老镭来制得，1g镭中可分离出0. 2mg钋；</p>\n<p>ARa=APo</p>\n<div class=\"formula-line\">1g铀中能分离出7.2×10-11g钋；</div>\n<p>AU=APo</p>\n<p>从反应堆中也能制得钋，反应式为：   209Bi(n,γ)210Bi(β) →210Po (α) →206Pb</p>\n<p>6.4.3 钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 150 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钋的物理性质</p>\n<div class=\"formula-line\">钋有26种同位素和8种同质异能素，其中210Po是最重要能α放射性同位素，其比活度为1.67×1011Bq/mg，主要用作α放射源和宇航仪器的热源等。</div>\n<p>钋是银白略带黄色的软金属，在黑暗中发光，熔点为254℃，沸点为949℃，相对密度为9.6； 210Po 属极毒性核素，通过核反冲作用形成放射性气溶胶，污染环境。</p>\n<p>6.4.3 钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 151 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钋的化学性质</p>\n<p>钋原子的壳层电子结构为5s25p65d106s26p4，可有化合价为-2、+2、+4和+6价。</p>\n<p>钋的氧化物有：PoO、PoO2、PoO3。</p>\n<p>钋（Ⅳ）的盐类：有PoCl4、Po(NO3)4和Po(SO4)2等。</p>\n<p>钋在溶液中可生成         、Po4+、Po2+离子。</p>\n<p>此外还有钋的卤化物、氢化物和氮化物等。</p>\n<p>6.4.3 钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 152 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>钋的化学性质</p>\n<p>Po2-：H2Po;</p>\n<p>Po2+：单质溶于稀盐酸，用SO2还原得到Po4+；</p>\n<p>Po3+：共沉淀；</p>\n<p>Po4+：酸性存在</p>\n<p>中性或碱性：PoO(OH)2胶粒</p>\n<p>碱性：亚钋酸</p>\n<p>络合物</p>\n<p>6.4.3 钋化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 153 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.4.3 钋化学</p>\n<p>钋的测定</p>\n<p>共沉淀法</p>\n<p>萃取法</p>\n<p>电化学法</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 154 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镤、锕、钫、砹的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 155 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>镤化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 156 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>已知镤的核素共有17种，即216Pa、224 Pa-238 Pa和一种同质异能素。</p>\n<p>1. 核性质及来源</p>\n<p>自然界存在3种Pa的核素。</p>\n<p>铀系成员234mPa、234Pa。是β放射体，半衰期分别为1.17 min和6.75 h，</p>\n<div class=\"formula-line\">锕系成员231Pa。α放射体，半衰期为3.25×10 a。</div>\n<p>天然铀矿约3 d后就只含有231Pa了。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 157 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>人工合成Pa的核素</p>\n<p>最重要的是233Pa，属β放射体，半衰期为27 d</p>\n<p>在1 t沥青富铀矿中，约含有200 mg，其中主要是231Pa。在地壳中的含量，估计10-1%（质量分数）。231Pa也可从反应堆中照射而制得：</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 158 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>Pa是有光泽的灰色金属，具有延展性，硬度与U相近，计算密度为15.37 g/cm，沸点和熔点分别为4280℃和1560℃，在空气中稳定。</p>\n<p>Pa在空气中加热时能缓慢氧化，Pa溶于盐酸而不溶于氢氟酸。</p>\n<p>233Pa是研究性质的良好示踪剂。Pa的化学性质与钽（Ta)和铌（Nb）相似，Ta常作为Pa的载带体。</p>\n<p>2. 镤的性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 159 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>2. 镤的化学性质</p>\n<p>氧化物：金属Pa随条件不同，可氧化为组成在PaO2-Pa2O5间的氧化物。</p>\n<p>Pa2O5是一个稳定的化合物，可作重要分析的基准化合物。</p>\n<p>加热到1700℃生成PaO2。灼烧后的Pa2O5既不溶于H2SO4、HCI，也不溶于HNO3，但能溶于HF(40%）中，形成PaF5溶液。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 160 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>氢氧化物：</p>\n<p>Pa（V）的溶液碱化后，生成氢氧化物Pa2O5•nH2O。</p>\n<p>氢氧化溶于强酸，并生成相应的盐。可溶性的盐有氯化镤、硫酸镤和硝酸镤等。</p>\n<p>硫酸溶液中的Pa（V），在过氧化氢作用下，形成不溶性过氧化物Pa2O9•3H2O。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 161 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>卤化物：PaCl4是挥发性化合物，PaF4•nH2O易溶于水。在溶液中，Pa可以十4和+5两种价态存在。</p>\n<p>Pa4+在稀盐酸和高氯酸介质中以Pa4+的水合离子存在，在其他酸中则形成络离子。Pa4+与TTA、乙酰丙酮可形成溶于有机溶剂的鳌合物。</p>\n<p>Pa4+可形成一系列难溶化合物，PaF4•H2O、磷</p>\n<p>酸盐、碳酸盐和碘酸盐。碳酸盐不仅难溶于水，在5 mol/L H2SO4中也不溶。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 162 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.1 镤化学</p>\n<p>卤化物：Pa5+有强烈的水解聚合倾向，在不含络合剂的酸性溶液中，以PaO(OH)+2和PaO(OH)+的形式存在；只有在大于3 mol/L的硝酸或盐酸溶液中才以Pa5+离子状态存在，pH增大即发生水解形成胶体溶液。</p>\n<p>Pa(V)在溶液中与草酸根、磷酸根、碘酸根、碳酸根等形成难溶盐，组成尚不清楚。在酸性溶液中，Pa(V)能形成含OH-的混合络离子，在含高浓度阴离子的溶液中，Pa(V)形成含单一配位体的络离子，Pa(V)与 TBP、EDTA、TTA等形成可溶于有机溶剂的络合物。</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 163 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>锕化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 164 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.2 锕化学</p>\n<p>已知锕有24种核素，质量数从209~232。自然界存在的Ac有227Ac和228Ac，都是β放射体。</p>\n<p>227Ac半衰期为21.8a，228Ac的半衰期为6.13 h。</p>\n<p>人工合成的核素中，225Ac的半衰期最长为10 d。</p>\n<p>1. 概述</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 165 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.2 锕化学</p>\n<p>227Ac存在于矿山岩石中，在每吨富沥青铀矿中约含有0.15mg，即相当于每克235U中含227Ac为2×10-10 g。227Ac经常与由铀矿提取出来的稀土元素混在一起，所以提取稀土元素的方法就是锕的分离方法。</p>\n<div class=\"formula-line\">228Ac存在于针矿石中，1g钍中大约有5×10-14 g228Ac。提取228Ac的方法，通常是在“陈钍”中先用Ba载带法将226Ra共沉淀析出,由228Ra通过β衰变生成228Ac。</div>\n<p>1. 来源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 166 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.2 锕化学</p>\n<p>锕是银白色的金属，熔点为1050℃，沸点为3200℃左右。化学性质活泼的元素，能在潮湿的空气中迅速氧化，但生成的氧化物薄层能阻止Ac的进一步氧化。</p>\n<p>Ac(OH)3白色沉淀。与卤化剂作用形成Ac的卤素化合物。</p>\n<p>Ac的硝酸盐、氯化物、溴化物均易溶于水，硝酸锕还能溶于乙醇和异丙醇。磷酸锕、草酸锕、碳酸铜、氟化锕以及与硫酸钾形成的复盐都是难溶盐。</p>\n<p>低浓的Ac能与Y、Al、Fe的氢氧化物共沉淀。</p>\n<p>2. 性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 167 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.2 锕化学</p>\n<p>怎样提纯Ac-225</p>\n<div class=\"formula-line\">225Ac（T1/2=9.92 d）、227Ac（T1/2=21.77 a）</div>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 168 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性元素钫</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 169 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素钫</p>\n<p>钫是放射性元素。已知钫有27种同位素和2种同质异能素，质量数为203~229。</p>\n<p>自然界存在的最重要的Fr的同位素是223Fr，存在于铀矿石中，大约7.7×1014个235U原子或3×1018个天然铀原子中有一个钫原子。另一个天然存在的核素是224Fr，它存在于钍系里，是228Ac的α分支衰变子体。</p>\n<div class=\"formula-line\">人工合成寿命最长的钫同位素是212Fr(T1/2=19.3 min)和222Fr(T1/2=15 mim），它们是通过下述核反应制得：</div>\n<p>228U(p,6p,11n)212Fr；232Th(p,4p,17n)212Fr；232Th(p,4p,7n)222Fr</p>\n<p>1. 来源</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 170 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素钫</p>\n<p>钫具有典型的碱金属性质。熔点为283 ℃，沸点为669℃，20 ℃时密度为2.48g/cm3</p>\n<p>钫的大多数化合物，如氢氧化物、碳酸盐、硫酸盐、氟化物、硫化物等等都是水溶性的。</p>\n<p>这既有利于净化载体使同其他族金属元素的分离，但又造成难以找到钫的合适载体。</p>\n<p>钫能与铯的高氯酸盐、碘酸盐、氯铂酸盐、钴亚硝酸盐、硅钨酸盐形成同晶共沉淀</p>\n<p>2. 性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 171 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素钫</p>\n<p>227Ac的α衰变产物是223 Fr。但227 Ac主要衰变方式（98.6%）是227Ac→227Th→223 Ra；因此，与Ac同时共存的放射性核素有223Fr、227Th、223 Ra以及 Po、Bi、Pb的放射性核素。</p>\n<p>3. 制备</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 172 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>放射性元素砹</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 173 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素砹</p>\n<p>砹的核素共有28种，质量数从196到219的24种和4种同质异能素。</p>\n<p>砹作为238U、235U和232Th衰变的子体产物，存在于铀和针的所有矿石中。还是237Np的衰变产物，237Np是在铀矿中由于铀自发裂变中子的作用而生成的。</p>\n<p>据估计，1.6 km厚的地壳层中砹的含量为69mg。</p>\n<p>1. 砹的来源和核性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 174 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素砹</p>\n<p>大多数砹的核素是用不同能量的α粒子轰击铋靶或针靶得到的。209Bi(α，2n)211At核反应，其半衰期为9.2 h，具有α衰变性质（40%）和K电子俘获性质（60%）。这是砹的同位素中半衰期最长的核素之一，另一个半衰期最长的核素是210At，半衰期是8.3h。</p>\n<p>砹有-1、0、+1、+5和+7价。</p>\n<p>1. 砹的来源和核性质</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 175 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素砹</p>\n<p>大多数砹的核素是来自靶物质，因此必须从大量辐照过的靶产物中分离出砹。用共沉淀、萃取及蒸馏等方法可以实现。</p>\n<p>对砹只能采用放射性测量法测定其α放射性。例如，在液体闪烁计数器，4π闪烁计数器或α谱仪上测量。</p>\n<p>砹在机体中与碘一样聚集在甲状腺内。</p>\n<p>1. 砹的分离与测定</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 176 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>6.5.3 放射性元素砹</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 177 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚和放射性碳的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 178 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>3H和14C是两种广泛存在于自然界的重要天然放射性核素， 3H是一种重要的聚变核素，用于制造核武器。环境中的3H和14C和重要来源于大气层核爆炸，H和C是构成生物体的基本元素，所以对它们进行研究意义是十分重要的。</p>\n<p>6.7 氚和放射性碳的化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 179 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氢有三种同位素，1H（H）、2H（D）、3H（T），氚是其唯一的一种具有放射性的同位素。</p>\n<div class=\"formula-line\">放出纯的β射线：                            ，其半衰期为12.33 a，比活度为3.62×108 Bq/μg，它的平均能量为5.72 keV；</div>\n<p>在空气中的最大射程为5 mm，在铝中的最大射程为0.6 mg/cm2，在水中的射程为6 μm。</p>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 180 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚的来源有天然和人工两种</p>\n<p>天然来源：主要来源为宇宙线中的中子轰击氮气及太阳耀斑爆，14N +1n →3T+12C；</p>\n<p>人工氚来源主要是核爆炸等。</p>\n<div class=\"formula-line\">6Li(n，α)T   σ=940bar是在量生产3T唯一可能的方法。</div>\n<div class=\"formula-line\">国际原子能机构（IAEA）曾预言到上世纪末，每年排放氚的总量高达 1.85×1019Bq，比地球上曾有的氚总量高几十倍。</div>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 181 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚的用途及危害</p>\n<p>制造热核武器，可控反应堆它将成为一种主要的新能源，利用氚的低能β射线制备低能辐射源用于超薄材料厚度的测定，利用氚的辐射能制作原子电池，荧光物质以及放射示踪等，此外，还有用于化学、医学、农业及水文地质等方面。</p>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 182 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<div class=\"formula-line\">氚属于低毒性核素，在机体外面对人体危害不大，但进入人体内，会直接产生辐射照作用，可诱发染色体畸变，我国对氚的豁免水平为1.0×106Bq/g。</div>\n<p>氚的化合物及其性质，氚与氢的相对原子质量差别较大，因而同位素效应十分明显，根据氚水与普通水的沸点不同来分离、浓集氚。</p>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 183 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚与氢在化学性质非常相似，表现在与氧、碳、卤素元素及金属元素等的反应上。由于氚的放射性，氚与氢以有一些差异，氚的β射线对氚的许多化学反应起着催化作用。</p>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 184 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚气在大气中易转化为氚水。</p>\n<p>氚浓度高时，可与氧气发生氧化反应，可与水发生同位素交换反应，在外环境中能发生生物转换反应及光学反应；</p>\n<p>氚浓度极低时，可发生由氚衰变成THe+，其反应过程如下：T2（ β ）→THe+ →T+He+</p>\n<p>6.7.1 氚化学</p>\n<p>氚的一个重要核性质是能与氘发生核聚变反应：</p>\n<p>+        →          +       +18MeV</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 185 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>氚的分析测定</p>\n<p>一般测定氚的方法有两种，</p>\n<p>一种是将氚分离浓集后的气态氚化合物直接充入计数管内进行测量，</p>\n<p>另一种测定氚的有效方法是液体闪烁计数法。</p>\n<p>主要样品有水中氚样测定、空气中氚样的测定、尿中氚的测定及生物样品中氚的测定。</p>\n<p>6.7.1 氚化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 186 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>碳共有11种同位素，除12C和13C为稳定性同位素外，其余均为放射性同位素，其中最重要的放射性核素是14C，其次为11C。</p>\n<div class=\"formula-line\">14C是天然碳的组分之一，是一种能量较低的纯β-放射性核素，半衰期为5730年，比活度为1.65×105Bq/μg，β射线的平均能量为45keV，最大能量为0.155MeV 。</div>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 187 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>11C是天然β+衰变放射性核素，半衰期为20.38分，衰变时放出能量为0.9608 MeV的β+粒子。</p>\n<p>放射性碳的来源，14C的来源有天然和人工两种，天然14C重要来源于宇宙射线中的     轰击大气中的氮气，其反应式为：</p>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 188 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>14C的人工来源是大气层核爆炸，其次是核燃料循环（核动力堆和乏燃料后处理厂），其中核聚变反应产生的14C量是核裂变反应的13倍，如17O（n，α）14C。</p>\n<p>放射性碳的用途及危害 14C的最大用途是制备标记化合物，用于农业、医学和生物学等领域中。</p>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 189 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>14C在考古上推究年代：</p>\n<p>碳的化学性质  放射性碳的物理和化学性质与普通碳相似，但质量数大的碳进行光合作用及从空气到水表面的吸收等反应中的速度均比12C慢。</p>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 190 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>一古生物样品碳中14C的比活度为现代同一种生物样品碳14C的标准比活度的1/3，则该生物样品距今多少年?</p>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 191 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>研究样品的年代与所采用放射性核素的半衰期不要相差太大。</p>\n<p>地质样品年代的确定：</p>\n<div class=\"formula-line\">87Rb-87Sr法：                   半衰期为4.8×1010a。</div>\n<p>测定样品中87Rb的含量，测定稳定87Sr的含量，一般情况下测定87Sr盈余（天然87Sr 含量在天然锶中占7.00%）。</p>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 192 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>1、87Sr盈余为0.004%,则有0.004%87Rb衰变；</p>\n<div class=\"formula-line\">2、总的87Rb：0.096%+0.004%=0.1%,即在矿石形成时总87Rb为0.1%;</div>\n<div class=\"formula-line\">N=N0e-λt</div>\n<div class=\"formula-line\">t=2.8×109a</div>\n<p>6.7.2 放射性碳化学</p>\n<p>现有0.096%87Rb的一个矿物,经测定 87Sr盈余为0.004%,求该矿石距今有多久?</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 193 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>铀-铅法</p>\n<p>测定矿石中              原子比率</p>\n<p>同理得:</p>\n<div class=\"formula-line\">当今238U:235U=137.7。</div>\n<p>6.7.2 放射性碳化学</p>\n</div></div>\n<div class=\"slide-card\">\n<div class=\"slide-header\" onclick=\"this.classList.toggle('collapsed'); this.nextElementSibling.classList.toggle('collapsed')\">\n<span>📄 第 194 页</span>\n<span class=\"toggle-icon\">▼</span>\n</div>\n<div class=\"slide-body\">\n<p>其它天然放射性核素化学</p>\n<p>第一类是地球起源时就已存在的长寿命放射性核素，如40K、50V等；第二类是由天然核反应产生的放射性核素，3H、14C、22Na(2.6a)，少量超铀元素等。</p>\n<p>6.7.3 其他放射性核素</p>\n</div></div>"
